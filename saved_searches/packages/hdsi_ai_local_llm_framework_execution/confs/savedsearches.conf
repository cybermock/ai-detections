search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) as firstTime max(_time) as lastTime values(Processes.process) as process values(Processes.process_path) as process_path values(Processes.parent_process_name) as parent_process_name from datamodel=Endpoint.Processes where (Processes.process_name IN ("ollama","ollama.exe","ollama app.exe","ollama_llama_server","ollama_llama_server.exe","lmstudio","lmstudio.exe","lm studio","lm studio.exe","lm-studio","lms","lms.exe","llamafile","llamafile.exe","jan","jan.exe","gpt4all","gpt4all.exe","chat.exe","llama-server","llama-server.exe","llama-run","llama-run.exe","llama-cli","llama-cli.exe","koboldcpp*","localai","local-ai","text-generation-launcher","vllm","mlx_lm.server","mlx_lm.generate","open-webui","open-webui.exe") OR Processes.process IN ("*vllm serve*","*vllm.entrypoints*","*mlx_lm.server*","*mlx_lm.generate*","*open-webui serve*","*llama_cpp.server*")) `hdsi_ai_local_llm_framework_execution_filter` by Processes.user Processes.dest Processes.process_name \
	| rename Processes.* as * \
	| eval src=if(lower(dest) IN ("unknown","-",""), null(), dest), process=mvfilter(lower(process)!="unknown"), process_path=mvfilter(lower(process_path)!="unknown"), cmd_lc=lower(mvjoin(process," ")), path_lc=lower(mvjoin(process_path," ")), pn_lc=lower(process_name), ctx_lc=coalesce(path_lc,"")." ".coalesce(cmd_lc,""), cmd_host=if(match(pn_lc,"^(python[0-9.]*w?|py|uvicorn|gunicorn|vllm|mlx_lm\\.\\w+|open-webui|llama_cpp\\.server)(\\.exe)?$"),1,0) \
	| eval process_name_lc=case(match(pn_lc,"^ollama( app)?(\\.exe)?$|^ollama_llama_server(\\.exe)?$"),"ollama", match(pn_lc,"^lm[ -]?studio(\\.exe)?$"),"lmstudio", match(pn_lc,"^koboldcpp"),"koboldcpp", cmd_host=1 AND match(cmd_lc,"vllm\\s+serve|vllm\\.entrypoints"),"vllm", cmd_host=1 AND match(cmd_lc,"mlx_lm[.\\s]server"),"mlx_lm.server", cmd_host=1 AND match(cmd_lc,"mlx_lm[.\\s]generate"),"mlx_lm.generate", cmd_host=1 AND match(cmd_lc,"open-webui\\s+serve"),"open-webui", cmd_host=1 AND match(cmd_lc,"llama_cpp\\.server"),"llama-server", true(),pn_lc) \
	| `hdsi_ai_local_llm_framework_execution_ambiguous_name_check` \
	| `ai_process_filter` \
	| where usage_type="local_llm" AND isnotnull(src) \
	| eval provider=coalesce(provider,"Local LLM"), tool=case(tool="lms","lmstudio (lms cli)", tool="chat","gpt4all (chat.exe)", isnull(tool),process_name_lc, true(),tool) \
	| `hdsi_ai_local_llm_framework_execution_nonhuman_accounts` \
	| eval llm_mode=if(match(process_name_lc,"^(ollama|llama-server|text-generation-launcher|vllm|localai|local-ai|open-webui|mlx_lm\\.server)") OR match(cmd_lc,"\\sserver?(\\s|$)|--host|--listen|--port"),"server","interactive") \
	| stats sum(count) as count min(firstTime) as firstTime max(lastTime) as lastTime values(tool) as tool values(process_name) as process_name values(process_path) as process_path values(process) as process values(parent_process_name) as parent_process_name values(llm_mode) as llm_mode values(provider) as provider by user src \
	| eval user=if(user="unknown", null(), user), llm_mode=if(isnotnull(mvfind(llm_mode,"^server$")),"server","interactive"), tools=mvjoin(tool,", "), process_names=mvjoin(process_name,", "), process=mvindex(process,0,4), process_path=mvindex(process_path,0,4), user_display=coalesce(user,"an unattributed account") \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| `ai_risk_multiplier` \
	| eval risk_multiplier=coalesce(risk_multiplier,1.0), risk_score=min(60, round(if(llm_mode="server",30,20)*risk_multiplier)) \
	| eval ai_activity="local_llm_execution", detection_id="hdsi_ai_local_llm_framework_execution", mitre_attack="T1588.007", ai_kill_chain_phase="staging" \
	| convert ctime(firstTime) ctime(lastTime) \
	| table firstTime, lastTime, user, user_display, src, tools, tool, llm_mode, process_names, process_name, process_path, process, parent_process_name, count, provider, sensitivity_level, risk_multiplier, risk_score, ai_activity, detection_id, mitre_attack, ai_kill_chain_phase \
	| `hdsi_ai_local_llm_framework_execution_customizations` \
	| `hdsi_ai_local_llm_framework_execution_risk_score`

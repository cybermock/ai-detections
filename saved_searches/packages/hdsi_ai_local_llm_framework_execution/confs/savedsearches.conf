action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$risk_object$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View local LLM process activity on $src$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count min(_time) as firstTime max(_time) as lastTime values(Processes.process) as process values(Processes.process_path) as process_path values(Processes.parent_process_name) as parent_process_name from datamodel=Endpoint.Processes where Processes.dest=\"$src$\" (Processes.process_name IN (\"ollama*\",\"lmstudio*\",\"lm studio*\",\"lm-studio*\",\"lms\",\"lms.exe\",\"llamafile*\",\"jan\",\"jan.exe\",\"gpt4all*\",\"chat.exe\",\"llama-*\",\"koboldcpp*\",\"localai\",\"local-ai\",\"text-generation-launcher\",\"vllm\",\"open-webui*\",\"mlx_lm.*\") OR Processes.process IN (\"*vllm serve*\",\"*vllm.entrypoints*\",\"*mlx_lm*\",\"*open-webui serve*\",\"*llama_cpp.server*\")) by Processes.dest Processes.user Processes.process_name | rename Processes.* as * | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, dest, user, process_name, process_path, process, parent_process_name, count | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]

description = v1.1.0 Detects execution of local LLM runtimes (Ollama, LM Studio, llama.cpp, llamafile, Jan, GPT4All, KoboldCpp, LocalAI, vLLM, Hugging Face TGI, Apple MLX LM, Open WebUI) from Endpoint.Processes. Ambiguous executable names (lms.exe, chat.exe, jan) need path or command-line corroboration. Risk on the user (when attributable) and the system, no notable.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m

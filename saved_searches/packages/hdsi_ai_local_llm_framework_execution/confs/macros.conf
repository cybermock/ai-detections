[hdsi_ai_local_llm_framework_execution_filter]
definition = ()
description = v1.1 Tenant exclusion hook inside the tstats where clause (Endpoint.Processes field names), applied before aggregation. Example: NOT Processes.dest IN ("ml-lab-*") for an approved GPU lab. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_local_llm_framework_execution_ambiguous_name_check]
definition = where NOT ((process_name_lc IN ("lms","lms.exe") AND NOT match(ctx_lc, "\\.lmstudio|lm[- _]?studio")) OR (process_name_lc IN ("chat","chat.exe") AND NOT match(ctx_lc, "gpt4all|nomic\\.ai")) OR (process_name_lc IN ("jan","jan.exe") AND NOT match(ctx_lc, "(programs|program files|appdata[\\\\/]local)[\\\\/]jan[\\\\/]|jan\\.app[\\\\/]|[\\\\/]opt[\\\\/]jan[\\\\/]|[\\\\/]jan[^\\\\/ ]*\\.appimage|[\\\\/]usr[\\\\/](local[\\\\/])?bin[\\\\/]jan(\\s|$)")))
description = v1.1 Drops generic executable names unless the process path OR the command line (ctx_lc, either one is enough) proves that specific tool. lms.exe is also the Intel Management Engine Local Manageability Service (hundreds of hosts in validation), and chat.exe and jan are generic. lms needs .lmstudio or an LM Studio / lm-studio folder; chat.exe needs a gpt4all or nomic.ai folder; jan needs the Jan install folder (Programs\Jan, AppData\Local\Jan, Jan.app, /opt/Jan, Jan AppImage, /usr/bin/jan), not merely a folder named jan. Extend a pattern if your build installs these tools elsewhere.
disabled = False
iseval = 0

[hdsi_ai_local_llm_framework_execution_nonhuman_accounts]
definition = eval user_base=lower(replace(user,"^.*\\\\","")), user=if(isnull(user) OR match(user_base,"^(unknown|-|n/a|null|none|system|localsystem|local service|network service|root|nobody|daemon|admin|administrator|ollama|vllm|localai|docker|www-data|ec2-user|ubuntu|centos|azureuser|svc[-_.].*|.*[-_.]svc)?$") OR match(user,"\\$$"), "unknown", user)
description = v1.1 Turns accounts that are not one attributable person into the sentinel unknown, which the rule later nulls so only the system risk object is written. Covers unknown/blank, Windows service accounts (SYSTEM, LOCAL SERVICE, NETWORK SERVICE, any DOMAIN\ prefix is stripped first), machine accounts (HOST$), shared Linux/cloud accounts (root, nobody, daemon, ec2-user, ubuntu, azureuser, administrator) and runtime service users (the Ollama Linux installer runs ollama serve as the user ollama). Without this a shared account would collect risk from every host. Add your service-account naming convention to the regex.
disabled = False
iseval = 0

[hdsi_ai_local_llm_framework_execution_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation per user and src (fields: user, src, tools, llm_mode, process_names, process_path, process, count, risk_multiplier, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_local_llm_framework_execution_risk_score]
definition = search *
description = v1.1 Risk score hook, last pipe. risk_score ships as 20 (interactive) or 30 (server mode) x risk_multiplier, capped at 60, and applies to both the user and the system risk object. Override here, e.g. eval risk_score=10 for a lab where local LLMs are tolerated. Ships as search *.
disabled = False
iseval = 0

version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Local LLM Framework Execution
description: "Detects execution of local LLM runtimes (Ollama, LM Studio, llama.cpp, llamafile, Jan, GPT4All, KoboldCpp, LocalAI, vLLM, Hugging Face TGI, Apple MLX LM, Open WebUI) from Endpoint.Processes, including Python-hosted servers identified by command line. Generic executable names (lms.exe, chat.exe, jan) require path or command-line corroboration. Scores server mode higher than interactive use. Risk on the user (when attributable) and the system, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_process_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - process
  - endpoint
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Endpoint.Processes"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

[Network - HDSI AI First Seen Provider For User - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI First Seen Provider For User
action.correlationsearch.annotations = {"mitre_attack": ["T1588.007"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object IN ($user_terms$) source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI web activity for $user$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count min(_time) as firstTime max(_time) as lastTime values(Web.src) as src values(Web.action) as action from datamodel=Web where Web.user IN ($user_terms$) (Web.url_domain=* OR Web.site=*) by Web.user Web.url_domain Web.site | rename Web.* as * | eval ai_input_type=if(url_domain=\"unknown\",\"app\",\"host\"), url_domain=coalesce(nullif(url_domain,\"unknown\"),site), ai_domain=lower(url_domain) | `ai_domains_filter` | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, provider, url_domain, site, action, count | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI App-ID traffic for $user$","search":"| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime values(All_Traffic.src) as src values(All_Traffic.dest) as dest values(All_Traffic.action) as action from datamodel=Network_Traffic where All_Traffic.user IN ($user_terms$) `hdsi_ai_first_seen_provider_for_user_nt_scope` by All_Traffic.user All_Traffic.app | rename All_Traffic.* as * | eval ai_domain=app, ai_input_type=\"app\" | `ai_domains_filter` | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, dest, app, provider, action, count | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = First use of AI provider $provider$ ($usage_type$) by $user$ with no earlier use in up to $baseline_days$ days of accelerated history: $window_events$ events ($access_outcome$) to $ai_domain_list$ via $data_source_list$, on a day when only $provider_users$ user(s) in the organisation used this provider.
action.notable.param.rule_title = HDSI AI First Seen Provider For User ($user$, $provider$)
action.notable.param.security_domain = network
action.notable.param.severity = low
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":20}]
action.risk.param._risk_message = First use of AI provider $provider$ ($usage_type$) by $user$ with no earlier use in up to $baseline_days$ days of accelerated history: $window_events$ events ($access_outcome$) to $ai_domain_list$ via $data_source_list$, on a day when only $provider_users$ user(s) in the organisation used this provider.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user,provider
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 17 2 * * *
description = v1.1.0 Daily. Risk on a user who uses a rarely used AI provider (used by at most 10 users that day) with no use of that provider in the previous 30 days of accelerated history, from Web proxy/SSE data and NGFW App-ID traffic. Attempts that were all blocked score at half weight. Risk only, no notable.
disabled = 0
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) as firstTime max(_time) as lastTime values(Web.src) as src values(Web.action) as action from datamodel=Web where Web.user=* `hdsi_ai_first_seen_provider_for_user_web_scope` `hdsi_ai_first_seen_provider_for_user_filter` by Web.user Web.url_domain Web.site \
	| rename Web.* as * \
	| eval data_source="web" \
	| append maxtime=900 maxout=500000 [| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime values(All_Traffic.src) as src values(All_Traffic.action) as action from datamodel=Network_Traffic where All_Traffic.user=* `hdsi_ai_first_seen_provider_for_user_nt_scope` `hdsi_ai_first_seen_provider_for_user_nt_filter` by All_Traffic.user All_Traffic.app | rename All_Traffic.* as * | eval uk=if(match(lower(user),"^(unknown|-|)$"),null(),lower(replace(replace(user,"^[^\\\\]+\\\\",""),"@.*$",""))) | eventstats dc(uk) as app_users by app | eval user=if(app_users<=`hdsi_ai_first_seen_provider_for_user_max_org_users`,user,"__aggregate__"), src=if(user="__aggregate__",null(),src) | stats sum(count) as count min(firstTime) as firstTime max(lastTime) as lastTime values(src) as src values(action) as action max(app_users) as app_users by user app | eval data_source="network_traffic"] \
	| `hdsi_ai_first_seen_provider_for_user_resolve` \
	| eval in_window=1 \
	| appendpipe [| `hdsi_ai_first_seen_provider_for_user_candidate_terms` | map maxsearches=1 search="| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count min(_time) as firstTime max(_time) as lastTime from datamodel=Web where earliest=$bl$ latest=$ws$ Web.user=* [| makeresults | eval search=$wt$ | table search] by Web.user Web.url_domain Web.site | rename Web.* as * | eval data_source=\"web\" | append maxtime=900 maxout=500000 [| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Traffic where earliest=$bl$ latest=$ws$ All_Traffic.user=* [| makeresults | eval search=$nt$ | table search] by All_Traffic.user All_Traffic.app | rename All_Traffic.* as * | eval data_source=\"network_traffic\"]" | `hdsi_ai_first_seen_provider_for_user_resolve` | eval in_window=0] \
	| eval hk=if(in_window=0,user_keys,null()) \
	| eventstats values(hk) as hist_keys by provider \
	| where in_window=1 \
	| eval has_hist=if(isnotnull(hist_keys) AND mvcount(mvdedup(mvappend(user_keys,hist_keys)))<mvcount(user_keys)+mvcount(hist_keys),1,0), severity_weight=tonumber(severity_weight), allowed=if(isnull(action) OR coalesce(mvcount(mvfilter(NOT match(lower(action),`hdsi_ai_first_seen_provider_for_user_blocked_actions`))),0)>0,count,0), substantive=if(ai_match!="subdomain" OR NOT match(ai_domain,`hdsi_ai_first_seen_provider_for_user_incidental_hosts`),count,0) \
	| stats min(firstTime) as first_seen max(lastTime) as last_seen sum(count) as window_events sum(allowed) as allowed_events sum(substantive) as substantive_events max(has_hist) as has_hist values(ai_domain) as ai_domains values(data_source) as data_sources values(src) as src_values values(ai_match) as ai_match values(usage_type) as usage_type values(user_raw) as user_values values(user) as user_norm values(user_canon) as user_canon max(severity_weight) as severity_weight max(app_users) as agg_users by user_key provider \
	| eval w_ukey=if(user_key!="__aggregate__",user_key,null()) \
	| eventstats dc(w_ukey) as provider_users max(agg_users) as agg_users by provider \
	| eval provider_users=max(provider_users,coalesce(agg_users,0)) \
	| where user_key!="__aggregate__" AND has_hist=0 AND provider_users<=`hdsi_ai_first_seen_provider_for_user_max_org_users` AND substantive_events>=`hdsi_ai_first_seen_provider_for_user_min_events` \
	| eval access_outcome=if(allowed_events>0,"allowed","all blocked"), outcome_weight=if(allowed_events>0,1,`hdsi_ai_first_seen_provider_for_user_blocked_weight`) \
	| where outcome_weight>0 \
	| addinfo \
	| eval user=coalesce(mvindex(mvfilter(match(user_norm,"@")),0),mvindex(user_canon,0),mvindex(user_norm,0)), ut=mvdedup(mvappend(user_values,user)), user_terms=mvjoin(mvmap(ut,"\"".replace(ut,"\\\\","\\\\\\\\")."\""),","), src=mvindex(src_values,0), usage_type=mvindex(usage_type,0), baseline_days=round((info_min_time-relative_time(now(),"`hdsi_ai_first_seen_provider_for_user_baseline`"))/86400,0) \
	| lookup identity_lookup_expanded identity as user OUTPUT bunit as user_bunit \
	| eval bunit=lower(mvindex(user_bunit,0)) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| `ai_risk_multiplier` \
	| eval severity_weight=coalesce(severity_weight,1.0), risk_multiplier=coalesce(tonumber(risk_multiplier),1.0), risk_score=min(40,max(5,round(20*severity_weight*risk_multiplier*outcome_weight))), ai_domain_list=mvjoin(mvindex(ai_domains,0,4),", "), data_source_list=mvjoin(data_sources,", "), ai_match=mvjoin(ai_match,","), first_seen=strftime(first_seen,"%Y-%m-%d %H:%M:%S %z"), last_seen=strftime(last_seen,"%Y-%m-%d %H:%M:%S %z") \
	| eval ai_activity="first_seen_provider", detection_id="hdsi_ai_first_seen_provider_for_user", mitre_attack="T1588.007", ai_kill_chain_phase="recon" \
	| fields - _allow_* user_values user_norm user_canon ut user_bunit src_values ai_domains data_sources has_hist w_ukey agg_users outcome_weight info_* \
	| `hdsi_ai_first_seen_provider_for_user_customizations` \
	| `hdsi_ai_first_seen_provider_for_user_risk_score`

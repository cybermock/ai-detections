[hdsi_ai_first_seen_provider_for_user_apps]
definition = "adobe firefly","adobe sensei","adobe spark","amazon q","anthropic","baidu-yiyan","casetext","chatgpt","claude","cursor","deepgram","deepseek","deepseek-chat","dify-ai","elevenlabs","gamma","github copilot","github-copilot","github-copilot-business","github-copilot-chat","github-copilot-chat-business","google bard","google gemini","google-gemini","grammarly","grok","groq-chat","hugging face","huggingface","huggingface-upload","ideogram","leonardo-ai","lovable","meta ai","microsoft 365 copilot","microsoft copilot studio","microsoft copilot","midjourney","mistral ai","mistral-ai","ms-office365-copilot","ms-office65-copilot-upload","murf","openai","openai-api","openai-chatgpt","perplexity ai","perplexity","perplexity-ai-base","phind","poe","replicate","runway-app","sourcegraph-cody","suno","venice-ai","vercel-v0-upload","wellsaid labs","windsurf","z-ai"
description = v1.1 Quoted lowercase app names from ai_provider_apps (enabled or not): SSE/CASB app names matched against Web.site and Palo Alto App-IDs matched against All_Traffic.app. Regenerate when the lookup gains app names (README has the SPL).
disabled = False
iseval = 0

[hdsi_ai_first_seen_provider_for_user_resolve]
definition = eval user_raw=trim(mvindex(user,0)), user=trim(mvindex(split(user_raw,","),0)), user=if(match(lower(user),"^(unknown|-|n/a|null|none|anonymous|system|)$") OR match(user,"^\d{1,3}(\.\d{1,3}){3}$") OR match(user,"\$$"),null(),user) | where isnotnull(user) | lookup identity_lookup_expanded identity as user OUTPUT identity as user_aliases | eval user_aliases=mvfilter(NOT match(user_aliases,"[\s\"*]")), user_canon=lower(mvindex(mvsort(mvfilter(match(user_aliases,"@"))),0)), user_key=lower(replace(replace(coalesce(user_canon,user),"^[^\\\\]+\\\\",""),"@.*$","")), uk_src=mvappend(user,user_aliases), user_keys=mvdedup(mvmap(uk_src,lower(replace(replace(uk_src,"^[^\\\\]+\\\\",""),"@.*$","")))), ai_domain=if(data_source="network_traffic",app,lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown")))), ai_input_type=case(data_source="network_traffic","app",isnull(nullif(url_domain,"unknown")),"app",true(),"host") | `ai_domains_filter` | search NOT provider IN (`hdsi_ai_first_seen_provider_for_user_sanctioned_providers`)
description = v1.1 Shared row normalisation for window, candidate and history rows. Keeps the raw value as user_raw (used for history terms and drilldowns) and the first element of a comma list as user (some proxies log "account,location"). Drops unattributed users (unknown, -, IP addresses, machine accounts ending in $). Looks the user up in identity_lookup_expanded: user_canon is the identity record's first UPN and user_key is the lowercase canonical (or raw) account without DOMAIN\ prefix or @suffix, so DOMAIN\sam, sam and first.last@corp of one person count as one user even when the UPN local part differs from the account name. user_keys holds the same normalisation of every identity alias; history matches on any overlap of user_keys, so earlier use under another linked format is found. Then resolves the AI provider with ai_domains_filter (hostnames from Web, app names from SSE/CASB Web.site and NGFW App-IDs) and drops org-wide sanctioned providers.
disabled = False
iseval = 0

[hdsi_ai_first_seen_provider_for_user_candidate_terms]
definition = eval zn=mvappend(user_raw,user_aliases) | stats dc(user_key) as window_users max(app_users) as agg_users values(url_domain) as zu values(site) as zs values(app) as za values(zn) as zn by provider | where max(window_users,coalesce(agg_users,0))<=`hdsi_ai_first_seen_provider_for_user_max_org_users` | eval pkey=lower(provider), cand=1 | append [| inputlookup ai_provider_domains | where enabled=1 | eval pkey=lower(provider), zu=if(match_subdomains=1,mvappend(lower(domain)."*","*.".lower(domain)."*"),lower(domain)."*"), zs=zu | fields pkey zu zs] | append [| inputlookup ai_provider_apps | where enabled=1 | eval pkey=lower(provider), zs=lower(app_name), za=lower(app_name) | fields pkey zs za] | append [| makeresults | eval x=split("aws bedrock=bedrock*.amazonaws.com*;gcp vertex ai=*aiplatform.googleapis.com*;azure openai=*.openai.azure.com*;azure ai foundry=*.services.ai.azure.com*;azure ai services=*.cognitiveservices.azure.com*;aws sagemaker=*sagemaker.*amazonaws.com*",";") | mvexpand x | eval pkey=mvindex(split(x,"="),0), zu=mvindex(split(x,"="),1), zs=zu | fields pkey zu zs] | stats max(cand) as cand values(zu) as zu values(zs) as zs values(za) as za values(zn) as zn by pkey | where cand=1 | stats values(zu) as zu values(zs) as zs values(za) as za values(zn) as zn | eval zu=mvfilter(zu!="unknown" AND NOT match(zu,"[\"\s]")), zs=mvfilter(zs!="unknown" AND NOT match(zs,"\"")), za=mvfilter(NOT match(za,"\"")), zn=mvfilter(zn!="__aggregate__" AND NOT match(zn,"[\"*]")) | where isnotnull(zn) AND (isnotnull(zu) OR isnotnull(zs) OR isnotnull(za)) | eval zn=mvmap(zn,replace(zn,"\\\\","\\\\\\\\")), wu="(".mvjoin(mvmap(zn,"Web.user=\"".zn."\"")," OR ").")", nu="(".mvjoin(mvmap(zn,"All_Traffic.user=\"".zn."\"")," OR ").")", wt=mvappend(mvmap(zu,"Web.url_domain=\"".zu."\""),mvmap(zs,"Web.site=\"".zs."\"")), nt=mvmap(za,"All_Traffic.app=\"".za."\""), wt=if(isnull(wt),"Web.user=\"__hdsi_no_candidate__\"",wu." (".mvjoin(wt," OR ").")"), nt=if(isnull(nt),"All_Traffic.user=\"__hdsi_no_candidate__\"",nu." (".mvjoin(nt," OR ").")") | addinfo | eval bl=round(relative_time(now(),"`hdsi_ai_first_seen_provider_for_user_baseline`")), ws=round(info_min_time) | where bl<ws | fields bl ws wt nt
description = v1.1 Turns the resolved window rows into ONE row for the history map: keeps providers used by at most max_org_users distinct users in the window, then builds the history filters wt (Web) and nt (Network_Traffic) = those providers' users AND those providers' enabled lookup domains (with subdomain wildcards), app names/App-IDs, cloud endpoint patterns and the raw values seen in the window, plus bl/ws (history start and window start, epoch). The user terms are the raw user values seen in the window plus every identity alias of those users from identity_lookup_expanded, so earlier use under another account format is found. The history scan therefore reads only a few users and providers instead of every AI domain for every user. A DOMAIN\\user backslash is doubled so the history term matches the raw value exactly. Returns no row when there is no candidate, so the map does not run.
disabled = False
iseval = 0

[hdsi_ai_first_seen_provider_for_user_baseline]
definition = -31d@d
description = v1.1 Start of the history window (relative time): the 30 days before the daily detection window (-1d@d to @d) in which the user must not have used the provider. Keep it within the Web and Network_Traffic acceleration range: summariesonly=t silently shortens the baseline to the summarised range (one validation tenant summarises only 7 days).
disabled = False
iseval = 0

[hdsi_ai_first_seen_provider_for_user_max_org_users]
definition = 10
description = v1.1 Rarity gate: the provider must have been used by at most this many distinct users (user_key) in the daily detection window, the new user included. Mainstream providers (hundreds or thousands of users) are first-seen for someone every day and are not a useful risk signal. Derive per tenant (README).
disabled = False
iseval = 0

[hdsi_ai_first_seen_provider_for_user_min_events]
definition = 3
description = v1.1 Minimum window events for the new user and provider, for every match type (hostname, SSE/CASB app name, NGFW App-ID), not counting subdomain hits on incidental_hosts. Drops single incidental hits (embedded player, link preview, SSO redirect, one CASB page event). App-name matches are not exempt: SSE/CASB tools log page-level events, and in validation single-event app-name matches were incidental.
disabled = False
iseval = 0

[hdsi_ai_first_seen_provider_for_user_incidental_hosts]
definition = "^(share|cdn|files|try|static|assets|media|embed|player|status|docs|help|support|blog|community|careers|events|email|mail|links?|click|go|track|tracking|news|newsletter|ads?|lp|info|marketing)[0-9-]*\."
description = v1.1 Regex for provider subdomains that show content consumption, not tool use (shared videos and recordings, CDNs, e-mail link tracking, ad and marketing hosts, help sites). A subdomain match on these hosts does not count towards min_events, so a user who only opened a shared avatar video or a meeting-recording link is not reported. Exact-domain, cloud-pattern and app-name matches always count.
disabled = False
iseval = 0

[hdsi_ai_first_seen_provider_for_user_blocked_actions]
definition = "^(block(ed)?|den(y|ied)|drop(ped)?|reset.*|sinkhole|reject(ed)?|prevent(ed)?|quarantine(d)?)$"
description = v1.1 Regex (matched against lowercase Web.action / All_Traffic.action) for events the proxy, SSE or NGFW stopped. A finding whose window events all match is labelled access_outcome="all blocked" and scored with blocked_weight. Events with no action, or any other action (allowed, isolate, alert, teardown, unknown), count as allowed. Add vendor values here if your proxy logs other block verbs.
disabled = False
iseval = 0

[hdsi_ai_first_seen_provider_for_user_blocked_weight]
definition = 0.5
description = v1.1 Score weight for a first use where every window event was blocked (an attempt that policy stopped, not adoption). 0.5 halves the score; 1 treats blocked attempts like real use; 0 drops them. In validation 26% of findings in the largest tenant were blocked-only.
disabled = False
iseval = 0

[hdsi_ai_first_seen_provider_for_user_sanctioned_providers]
definition = "__none__"
description = v1.1 Providers sanctioned for the whole organisation, as quoted provider names exactly as in the AI lookups (case-insensitive), e.g. "OpenAI","Microsoft Copilot". They are dropped before the rarity gate. Ships with a placeholder that matches nothing. Use ai_sanctioned_entities for per-user, per-system or per-bunit approvals.
disabled = False
iseval = 0

[hdsi_ai_first_seen_provider_for_user_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after scoring (fields: user, user_key, user_terms, src, provider, usage_type, ai_match, ai_domain_list, data_source_list, window_events, allowed_events, substantive_events, access_outcome, provider_users, first_seen, last_seen, baseline_days, severity_weight, risk_multiplier, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_first_seen_provider_for_user_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust or override risk_score (computed 5-40, half weight when every window event was blocked; user risk object only). Ships as search *.
disabled = False
iseval = 0

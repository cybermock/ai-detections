[hdsi_ai_first_seen_provider_for_user_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Web leg, inline in the daily window Web tstats where clause. An excluded user never becomes a candidate, so the history scan needs no exclusion. Use Web datamodel field names, e.g. NOT Web.user IN ("svc_*") or NOT sourcetype IN ("aws:elb:accesslogs","aws:waf"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_first_seen_provider_for_user_nt_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Network_Traffic (NGFW App-ID) leg, inline in the daily window Network_Traffic tstats where clause. Use Network_Traffic field names, e.g. NOT All_Traffic.user IN ("svc_*") or NOT All_Traffic.src IN ("10.1.2.0/24"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_first_seen_provider_for_user_web_scope]
definition = (Web.url_domain IN (`hdsi_ai_first_seen_provider_for_user_domains`) OR Web.site IN (`hdsi_ai_first_seen_provider_for_user_domains`,`hdsi_ai_first_seen_provider_for_user_apps`))
description = v1.1 Pre-filter inline in the window Web tstats: AI hosts (and subdomains, cloud AI endpoint patterns) in Web.url_domain or Web.site, plus SSE/CASB app names in Web.site. Without it the daily window groups every web domain. ai_domains_filter still decides provider, enabled flag and subdomain rules.
disabled = False
iseval = 0

[hdsi_ai_first_seen_provider_for_user_nt_scope]
definition = All_Traffic.app IN (`hdsi_ai_first_seen_provider_for_user_apps`)
description = v1.1 Pre-filter inline in the window Network_Traffic tstats: NGFW App-IDs (Palo Alto) listed in ai_provider_apps. App-IDs with more than max_org_users users in the day are collapsed to one __aggregate__ row per App-ID (keeps the subsearch under 50k rows and still counts their users for the rarity gate). App-IDs missing from the lookup are not seen; add them to ai_provider_apps and regenerate the apps macro.
disabled = False
iseval = 0


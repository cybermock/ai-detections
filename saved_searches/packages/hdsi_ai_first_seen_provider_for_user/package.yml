version: 1.1.0
creation_date: '2026-03-04'
package_title: AI First Seen Provider For User
description: "Daily risk on a user who uses a rarely used AI provider (used by at most 10 users that day) with no use of that provider in the previous 30 days. Reads Web proxy/SSE data and NGFW App-ID traffic that carries a user. Risk only, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - web
  - proxy
  - network
  - pan
data_prereqs:
  datamodels:
    op: OR
    items:
    - "Web"
    - "Network_Traffic"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

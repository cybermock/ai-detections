action.notable.param.severity = medium
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 0
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":35}]
action.risk.param._risk_message = AI user risk threshold exceeded: $user$ accumulated $total_risk$ AI risk points from $distinct_detections$ HDSI AI detections in the last 24 hours.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user_key
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 0-59/15 * * * *
description = v1.1.0 Creates a medium notable when one person (UPN, DOMAIN\user and bare account forms merged) accumulates AI risk from at least two distinct HDSI AI detections within 24 hours and the total is in the medium band: at or above medium_risk_threshold and below high_risk_threshold. Totals at or above the high threshold, and users who already have a critical notable in the last 24 hours, are left to the critical rule, so the two never alert on the same total.
disabled = 0
dispatch.earliest_time = -24h@m
dispatch.latest_time = now
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = `hdsi_rba_ai_user_risk_threshold_exceeded_risk_index` risk_object_type="user" (source="* - HDSI AI * - Rule" OR detection_id="hdsi_ai_*") NOT source="* - HDSI AI Health * - Rule" NOT detection_id="hdsi_ai_health_*" risk_object=* NOT risk_object IN ("unknown","-","*$") `hdsi_rba_ai_user_risk_threshold_exceeded_filter` \
	| `hdsi_rba_ai_user_risk_threshold_exceeded_user_key` \
	| where len(user_key)>0 AND NOT (`hdsi_rba_ai_user_risk_threshold_exceeded_excluded_accounts`) AND isnotnull(tonumber(risk_score)) \
	| eval score=tonumber(risk_score), detection_key=coalesce(nullif(mvindex(detection_id, 0), ""), source), detection_label=replace(replace(source, "^[^-]+ - HDSI AI ", ""), " - Rule$", ""), mitre_ids=coalesce('annotations.mitre_attack.mitre_technique_id', 'annotations.mitre_attack', mitre_attack), ai_phase=lower(mvindex(ai_kill_chain_phase, 0)) \
	| eventstats sum(score) as object_risk by user_key risk_object \
	| eventstats max(object_risk) as top_object_risk by user_key \
	| eval top_object=if(object_risk==top_object_risk, risk_object, null()) \
	| stats sum(score) as detection_risk count as detection_events values(source) as sources values(detection_label) as detection_label values(risk_object) as risk_object_values values(top_object) as top_object values(mitre_ids) as mitre_ids values(ai_phase) as ai_phases min(_time) as firstTime max(_time) as lastTime by user_key detection_key \
	| sort 0 user_key - detection_risk \
	| eval detection_label=mvindex(detection_label, 0), detection_summary=detection_label." (".round(detection_risk).")" \
	| stats sum(detection_risk) as total_risk sum(detection_events) as risk_event_count dc(detection_key) as distinct_detections max(detection_risk) as top_detection_risk first(detection_label) as top_detection list(detection_summary) as detection_breakdown values(sources) as detections values(risk_object_values) as risk_object_values values(top_object) as top_object values(mitre_ids) as contributing_mitre_attack values(ai_phases) as kill_chain_phases min(firstTime) as firstTime max(lastTime) as lastTime by user_key \
	| eval control_name="medium_risk_threshold" \
	| lookup ai_detection_config control_name OUTPUTNEW value as medium_risk_threshold \
	| eval control_name="high_risk_threshold" \
	| lookup ai_detection_config control_name OUTPUTNEW value as high_risk_threshold \
	| eval medium_risk_threshold=coalesce(tonumber(medium_risk_threshold), 60), high_risk_threshold=coalesce(tonumber(high_risk_threshold), 90), min_detections=`hdsi_rba_ai_user_risk_threshold_exceeded_min_detections` \
	| where total_risk>=medium_risk_threshold AND total_risk<high_risk_threshold AND distinct_detections>=min_detections \
	| join type=left max=1 user_key [search index=notable source=`hdsi_rba_ai_user_risk_threshold_exceeded_critical_rule` user_key=* earliest=-24h@m latest=now | stats max(_time) as critical_notable_time by user_key] \
	| where isnull(critical_notable_time) \
	| eval user=mvindex(top_object, 0), risk_object=user, account=replace(replace(user_key, "@.*$", ""), "^.*/", ""), risk_object_type="user", risk_band="medium", total_risk=round(total_risk), top_detection_share=round(100*top_detection_risk/total_risk, 0), contributing_mitre_attack=mvfilter(match(contributing_mitre_attack, "^T\d{4}")), detection_list=mvjoin(mvindex(detection_breakdown, 0, 7), "; "), kill_chain_list=coalesce(mvjoin(kill_chain_phases, ", "), "n/a") \
	| convert ctime(firstTime) ctime(lastTime) \
	| fields user user_key account risk_object risk_object_type risk_object_values risk_band total_risk distinct_detections risk_event_count detections detection_breakdown detection_list top_detection top_detection_share kill_chain_phases kill_chain_list contributing_mitre_attack medium_risk_threshold high_risk_threshold min_detections firstTime lastTime \
	| `hdsi_rba_ai_user_risk_threshold_exceeded_customizations`

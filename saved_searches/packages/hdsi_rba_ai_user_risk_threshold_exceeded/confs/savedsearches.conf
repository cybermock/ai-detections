action.notable.param.drilldown_searches = [{"name":"View contributing AI risk events for $user_key$","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object_type=\"user\" risk_object=\"*$account$*\" (source=\"* - HDSI AI * - Rule\" OR detection_id=\"hdsi_ai_*\") NOT source=\"* - HDSI AI Health * - Rule\" | eval user_key=lower(trim(risk_object)) | eval user_key=if(match(user_key, \"^([^\\x5c@]+\\x5c)?(administrator|admin|guest|defaultaccount|wdagutilityaccount)(@.+)?$\"), replace(user_key, \"\\x5c\", \"/\"), replace(replace(user_key, \"@.*$\", \"\"), \"^.*\\x5c\", \"\")) | search user_key=\"$user_key$\" | eval score=coalesce(calculated_risk_score, risk_score) | table _time, source, risk_object, score, ai_kill_chain_phase, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"Summarize AI risk by detection for $user_key$","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object_type=\"user\" risk_object=\"*$account$*\" (source=\"* - HDSI AI * - Rule\" OR detection_id=\"hdsi_ai_*\") NOT source=\"* - HDSI AI Health * - Rule\" | eval user_key=lower(trim(risk_object)) | eval user_key=if(match(user_key, \"^([^\\x5c@]+\\x5c)?(administrator|admin|guest|defaultaccount|wdagutilityaccount)(@.+)?$\"), replace(user_key, \"\\x5c\", \"/\"), replace(replace(user_key, \"@.*$\", \"\"), \"^.*\\x5c\", \"\")) | search user_key=\"$user_key$\" | eval score=coalesce(calculated_risk_score, risk_score) | stats count as risk_events sum(score) as total_risk min(_time) as firstTime max(_time) as lastTime values(risk_object) as risk_objects values(ai_kill_chain_phase) as ai_kill_chain_phase latest(risk_message) as latest_message by source | sort - total_risk | convert ctime(firstTime) ctime(lastTime)","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View all risk (any content) for $user_key$","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object_type=\"user\" risk_object=\"*$account$*\" | eval user_key=lower(trim(risk_object)) | eval user_key=if(match(user_key, \"^([^\\x5c@]+\\x5c)?(administrator|admin|guest|defaultaccount|wdagutilityaccount)(@.+)?$\"), replace(user_key, \"\\x5c\", \"/\"), replace(replace(user_key, \"@.*$\", \"\"), \"^.*\\x5c\", \"\")) | search user_key=\"$user_key$\" | eval score=coalesce(calculated_risk_score, risk_score) | stats count as risk_events sum(score) as total_risk values(risk_object) as risk_objects values(annotations.mitre_attack.mitre_technique_id) as mitre_technique_id latest(risk_message) as latest_message by source | sort - total_risk","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = User $user_key$ ($user$) accumulated $total_risk$ AI risk points from $distinct_detections$ distinct HDSI AI detections ($risk_event_count$ risk events) in the last 24 hours, inside the medium band ($medium_risk_threshold$ to below $high_risk_threshold$). Contributors: $detection_list$. The top contributor ($top_detection$) is $top_detection_share$% of the total. AI kill-chain phases: $kill_chain_list$.
action.notable.param.rule_title = HDSI AI User Risk Threshold Exceeded - Medium ($user_key$, $total_risk$ points)

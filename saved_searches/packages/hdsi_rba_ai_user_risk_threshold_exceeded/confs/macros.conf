[hdsi_rba_ai_user_risk_threshold_exceeded_risk_index]
definition = index=risk
description = v1.1 Where ES writes risk events. Keep it identical to hdsi_rba_ai_user_critical_risk_threshold_exceeded_risk_index so both band rules total the same events, e.g. (index=risk OR index=risk_archive) if risk is written to an additional index.
disabled = False
iseval = 0

[hdsi_rba_ai_user_risk_threshold_exceeded_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inline in the risk index base search before aggregation. Use risk event field names, e.g. NOT risk_object IN ("svc_*") or NOT source="Network - HDSI AI Unsanctioned Web Access - Rule". Apply the same exclusion to hdsi_rba_ai_user_critical_risk_threshold_exceeded_filter, otherwise the two rules total different events and their bands can overlap. Ships empty.
disabled = False
iseval = 0

[hdsi_rba_ai_user_risk_threshold_exceeded_user_key]
definition = eval user_key=lower(trim(risk_object)), user_key=if(match(user_key, "^([^\x5c@]+\x5c)?(administrator|admin|guest|defaultaccount|wdagutilityaccount)(@.+)?$"), replace(user_key, "\x5c", "/"), replace(replace(user_key, "@.*$", ""), "^.*\x5c", ""))
description = v1.1 Per-person aggregation key built from risk_object: UPN (jdoe@corp.com), DOMAIN\jdoe and jdoe add up as one key. Built-in local accounts (administrator, admin, guest, defaultaccount, wdagutilityaccount) keep their HOST or domain qualifier, written HOST/administrator, so they are never merged fleet-wide. Must stay identical to hdsi_rba_ai_user_critical_risk_threshold_exceeded_user_key: the medium and critical bands only stay disjoint when both rules total the same key.
disabled = False
iseval = 0

[hdsi_rba_ai_user_risk_threshold_exceeded_excluded_accounts]
definition = match(user_key, "^(unknown|-|none|null|n/a|\(null\)|undefined|system|localsystem|local system|local service|network service|anonymous logon|root|nobody|daemon|krbtgt|dwm-\d+|umfd-\d+|administrator|admin|guest|defaultaccount|wdagutilityaccount)$") OR match(user_key, "^\*+$|\$$") OR match(lower(trim(risk_object)), "^(nt authority|nt service|window manager|font driver host|iis apppool)\x5c")
description = v1.1 Boolean expression (fields user_key, risk_object) for risk objects that are never one person and are not totalled: placeholders (unknown, -, none, null, n/a, (null), masks), $-suffixed computer accounts, OS service identities (SYSTEM, LOCAL/NETWORK SERVICE, NT AUTHORITY\*, NT SERVICE\*, IIS APPPOOL\*, DWM-n, UMFD-n), shared Unix accounts (root, nobody, daemon) and built-in accounts with no HOST or domain qualifier (a bare administrator, admin or guest cannot be tied to one machine). Keep identical to hdsi_rba_ai_user_critical_risk_threshold_exceeded_excluded_accounts.
disabled = False
iseval = 0

[hdsi_rba_ai_user_risk_threshold_exceeded_min_detections]
definition = 2
description = v1.1 Minimum number of distinct HDSI AI detections behind a user's 24-hour total. The default of 2 stops one detection firing repeatedly, or one high-scoring event, from raising the medium notable on its own; that risk is already on the user, and totals that reach the high threshold still go to the critical rule (which ships with 1). Set to 1 to alert on the medium total alone.
disabled = False
iseval = 0

[hdsi_rba_ai_user_risk_threshold_exceeded_critical_rule]
definition = "Threat - HDSI RBA AI User Critical Risk Threshold Exceeded - Rule"
description = v1.1 Stanza name of the critical band rule. A user_key that already has a notable from it in the last 24 hours gets no medium notable, so a total that decays from the critical band back into the medium band does not alert twice. Change it only if the critical rule is renamed.
disabled = False
iseval = 0

[hdsi_rba_ai_user_risk_threshold_exceeded_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation and banding (fields: user_key, user, risk_object, risk_object_values, total_risk, distinct_detections, risk_event_count, detections, detection_breakdown, top_detection, top_detection_share, kill_chain_phases, contributing_mitre_attack, medium_risk_threshold, high_risk_threshold). Ships as search *.
disabled = False
iseval = 0

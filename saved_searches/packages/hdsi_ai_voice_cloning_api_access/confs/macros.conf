[hdsi_ai_voice_cloning_api_access_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the Web tstats where clause before aggregation. Use Web.* field names, e.g. NOT Web.user IN ("svc_*") or NOT Web.src="10.20.30.0/24" for an approved media team or lab. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_dns_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside both Network_Resolution tstats where clauses (evidence and shared-source guard). Use DNS.* field names, e.g. NOT DNS.src IN ("10.1.1.10","10.1.1.11") for resolvers or forwarders that resolve fewer names than the shared-source guard. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_providers]
definition = "ElevenLabs","PlayHT","Resemble AI","WellSaid Labs","Murf AI","LOVO AI","Coqui","FakeYou","Uberduck","Voicemod","HeyGen","Fish Audio","Cartesia"
description = v1.1 Provider names from ai_provider_domains / ai_provider_apps (quoted, comma separated) that this rule scores: hosted services that can clone or convert a real person's voice (HeyGen also clones likeness). Fish Audio and Cartesia were added once the common registry carried them. Deepgram (speech-to-text embedded in dictation and meeting tools), Speechify (text-to-speech reader, an accessibility tool), Synthesia (enterprise training video) and Descript (general audio/video editor with an Overdub feature) are deliberately absent: in validation they produced most of the volume and almost none of it was voice cloning. Add them here only if the organisation wants them scored. Keep ..._web_scope and ..._dns_scope in step with this list.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_web_scope]
definition = (Web.url_domain IN ("*elevenlabs.io*","*play.ht*","*resemble.ai*","*wellsaidlabs.com*","*wellsaid.io*","*murf.ai*","*lovo.ai*","*coqui.ai*","*fakeyou.com*","*uberduck.ai*","*voicemod.net*","*heygen.com*","*fish.audio*","*cartesia.ai*") OR Web.site IN ("*elevenlabs.io*","*play.ht*","*resemble.ai*","*wellsaidlabs.com*","*wellsaid.io*","*murf.ai*","*lovo.ai*","*coqui.ai*","*fakeyou.com*","*uberduck.ai*","*voicemod.net*","*heygen.com*","*fish.audio*","*cartesia.ai*","elevenlabs","wellsaid labs","murf","murf ai","playht","play.ht","resemble ai","lovo","lovo ai","fakeyou","uberduck","voicemod","heygen","fish audio","cartesia"))
description = v1.1 Inline Web tstats pre-filter: the registrable domains of the providers in ..._providers (wildcarded on both sides so subdomains, :port and trailing dots still match) plus their SSE/CASB application names in Web.site. ai_domains_filter makes the exact decision afterwards. Add the domain and app name of any provider added to ..._providers.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_dns_scope]
definition = (DNS.query IN ("*elevenlabs.io*","*play.ht*","*resemble.ai*","*wellsaidlabs.com*","*wellsaid.io*","*murf.ai*","*lovo.ai*","*coqui.ai*","*fakeyou.com*","*uberduck.ai*","*voicemod.net*","*heygen.com*","*fish.audio*","*cartesia.ai*"))
description = v1.1 Inline Network_Resolution tstats pre-filter on DNS.query for the providers in ..._providers. Wildcards on both sides keep trailing-dot answers (elevenlabs.io.) and subdomains; ai_domains_filter rejects search-suffix junk such as api.elevenlabs.io.corp.example. One day on the largest validation tenant (about 1.1 billion DNS events) took about 21 to 37 s.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_background]
definition = (ai_traffic_class="background" OR match(class_host,"(^|\\.)rtc\\.elevenlabs\\.io$|^(try|join|start|help|docs|status|community|email|hs-clicks|growthbook|mixpanel|sentry|webcdn|a|media|static)\\.|(^|[.-])(cdn|static|assets|segment|telemetry|analytics)[0-9]*[.-]") OR match(url_path,"^/(player|docs|hc|help|blog|pricing|share|embed|embeds|affiliates?|careers|legal|privacy|terms)(/|$)|^/v1/convai/|\\.(js|css|map|png|jpe?g|gif|svg|webp|ico|woff2?)$"))
description = v1.1 Eval condition (fields class_host = the request host, url_path, ai_traffic_class) for requests that never show a person using a voice service. It is evaluated FIRST, before any other class: rows the common registry marks traffic_class=background, voice-agent widgets and audio players that third-party websites embed (ElevenLabs *.rtc and /v1/convai/, /player/, PlayHT a., media., static.), share and embed links (HeyGen /share/), affiliate and marketing links (try., join., start.), help, docs, blog and pricing pages, static assets, CDNs, analytics and error reporting. These were the largest share of user-less ElevenLabs traffic in validation (about 50 hosts a week each for turn.rtc and livekit.rtc). Matching rows are listed in ai_domain_list but never qualify an entity. Use false() to count everything.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_clone_evidence]
definition = (match(url_path,"^/v[0-9]+/(voices/(add|ivc|pvc)|speech-to-speech|voice-changer|cloned-voices)(/|$)|^/api/v[0-9]+/(cloned-voices|voices/clone)") OR (match(url_path,"clon|voice-changer|speech-to-speech|voice-conversion") AND (match(url_path,"^/(app|studio|dashboard|projects|workspace)/") OR match(class_host,"^(app|studio|platform|dashboard|beta|genny)\\."))))
description = v1.1 Eval condition (fields url_path, class_host) for API calls and in-app pages that create or apply a cloned or converted voice, i.e. a real person's voice is the input: ElevenLabs /v1/voices/add (instant clone), /v1/voices/pvc (professional clone) and /v1/speech-to-speech (voice changer), PlayHT /api/v2/cloned-voices, and clone, voice-changer or speech-to-speech pages inside an app path (/app/, /studio/) or on an app host. Voice design from a text prompt (/v1/text-to-voice, /v1/voice-generation) involves no real voice and is in ..._voicelab_evidence instead. Public marketing pages such as elevenlabs.io/voice-cloning, play.ht/voice-cloning or murf.ai/voice-changer are NOT app paths and fall to site browsing. Needs decrypted URL paths; host-only logs never match. One request gives base score 35.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_voicelab_evidence]
definition = match(url_path,"^/(app|studio|dashboard)/(voice-lab|voice-design|my-voices|voices/(new|add|create))(/|$)|^/v[0-9]+/(text-to-voice|voice-generation|voice-design)(/|$)")
description = v1.1 Eval condition on url_path for voice management and voice design: the provider's own pages (ElevenLabs /app/voice-lab, /app/voice-design) and the voice design API (/v1/text-to-voice, /v1/voice-generation), which generates a synthetic voice from a text prompt. Cloned voices are created and managed on these pages, but users also open them to pick or design a stock voice, so this is not proof of cloning. One request gives base score 25 (below the 35 of an actual cloning or conversion request). Voice Lab pages were the only cloning-related paths seen in validation.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_app_evidence]
definition = ((match(class_host,"^(app|studio|genny|platform|dashboard|beta)\\.") OR match(url_path,"^/(app|studio|dashboard|projects|workspace)(/|$)")) AND NOT match(url_path,"^/((app|studio)/)?(sign-?up|sign-?in|log-?in|register|onboarding|welcome|reset-password|forgot-password|verify-email|auth)(/|$)"))
description = v1.1 Eval condition (fields class_host, url_path) for signed-in product use: application and studio hosts (studio.wellsaidlabs.com, app.heygen.com, genny.lovo.ai) and /app/, /studio/ or /dashboard/ paths. Account pages (/app/sign-up, /app/sign-in, /app/onboarding, /auth/) and sign-in hosts (auth., login.) are NOT app use: someone looking at or registering for the product reaches them, so they fall to site browsing, as does the /__/auth/ handler. class_host is the host from Web.url when the log carries one, so an SSE/CASB application name (Netskope site = "WellSaid Labs") is classified by the real host and path, not by the app name: a visit to the marketing homepage stays site browsing. App rows qualify at base 20 only with ..._min_app_events or more requests (DNS: lookup-minutes) to the same provider that day.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_api_evidence]
definition = (usage_type="api" OR match(class_host,"^(api|api[0-9]+|api-[a-z0-9-]+)\\."))
description = v1.1 Eval condition (fields class_host, usage_type) for the providers' API hosts (api.elevenlabs.io, api.us.elevenlabs.io, api.play.ht, api.resemble.ai, api.cartesia.ai, api2.heygen.com). The providers' own web apps, SDKs and scripts call them, but so do audio players and voice agents embedded in third-party websites, and on host-only logs the two cannot be told apart. API evidence therefore scores only base 12: alone at ..._min_api_events or more, or together with site requests at ..._min_browse_events or more in total.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_min_app_events]
definition = 2
description = v1.1 App-class requests (Web) or lookup-minutes (DNS: distinct minutes in which the host looked up an app host) per entity per provider per day before app use alone qualifies. DNS is counted in distinct minutes because clients repeat the same lookup within a minute (on one validation tenant, 70 of 112 src-minutes for a studio host held 2 or more identical A lookups). A single visit to an app host stays below it, even when the same visit also looks up the provider's API, sign-in and site hosts (one validation tenant had a HeyGen visit with 1 app, 1 API and 3 site lookups in the same minute). Lowering it to 1 makes every single visit qualify.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_min_api_events]
definition = 10
description = v1.1 Requests (Web) or lookup-minutes (DNS) to API hosts per entity per provider per day before API traffic alone, with no other request to the provider, qualifies at base 12. On the PAN-OS validation tenant, API-only Web entity-days had a median of 1 request, p90 about 9 to 11 and a maximum of 152; the small counts are embedded players and widgets, and the larger ones are not separable from them on host-only logs, hence the low base score.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_min_browse_events]
definition = 5
description = v1.1 Requests (Web) or lookup-minutes (DNS) to other non-background provider hosts and pages (the marketing site, product pages such as /voice-cloning, sign-up and sign-in pages, fakeyou.com) per entity per provider per day before browsing alone qualifies, at base score 8. Also the minimum for API plus site requests together (base 12). A single visit to an article or product page stays below it.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_upload_mb]
definition = 1
description = v1.1 MB sent to voice-clone routes (..._clone_evidence rows whose http_method includes POST, PUT or PATCH, or is not logged) by one entity in the day that adds 15 to the base score. One minute of speech, enough for an instant voice clone, is about 1 MB as MP3. The client-to-server side is Web.bytes_out, or Web.bytes_in for sourcetypes listed in ..._bytes_reversed. Only clone routes count, so ordinary app and dashboard page loads never reach it. Needs decrypted URL paths and byte fields; PAN-OS URL logs and DNS carry none.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_bytes_reversed]
definition = match(sourcetype,"^netskope:")
description = v1.1 Eval condition on sourcetype for Web sources whose add-on stores server-to-client bytes in Web.bytes_out (reversed direction). For those rows the upload estimate uses Web.bytes_in. Ships with the Netskope sourcetypes, which were reversed in validation (bytes_out/bytes_in about 4.4 across all traffic and about 41 for voice-provider traffic over 7 days). Check every byte-carrying sourcetype with the Byte direction SPL in the README: downloads dominate web traffic, so a ratio well above 1 means reversed. Use false() if no source is reversed.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_shared_src_names]
definition = 10000
description = v1.1 Shared-source guard: a DNS client that resolved at least this many distinct names in the day is treated as a resolver, forwarder, proxy or NAT egress. Its DNS rows are dropped and it is never used as the src risk object (Web rows keep their user). Same derivation as hdsi_ai_dns_queries_to_ai_domains: workstations stayed below about 3,000 a day in validation, resolvers and egress addresses resolved 11,000 to 380,000.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_untrusted_src]
definition = false()
description = v1.1 Eval condition on src for addresses that are not a stable host identity, e.g. a VPN or guest pool: cidrmatch("100.64.0.0/10",src). Matching addresses are never used as the src risk object; user-attributed rows are kept without src. Ships off.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after scoring (fields: risk_entity, user, src, src_list, src_hosts, user_display, src_display, provider, provider_list, evidence_list, request_summary, evidence_source_list, sourcetype_list, clone_events, voicelab_events, app_events, api_events, browse_events, event_count, mb_uploaded, ai_domain_list, evidence_source_list, bunit, base_score, risk_multiplier, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_voice_cloning_api_access_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust or override risk_score (integer 1 to 100; it applies to both the user and the system risk object). Ships as search *.
disabled = False
iseval = 0

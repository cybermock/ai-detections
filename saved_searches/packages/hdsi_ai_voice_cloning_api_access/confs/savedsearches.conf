search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count sum(Web.bytes_out) as bytes_out sum(Web.bytes_in) as bytes_in values(Web.action) as web_actions values(Web.http_method) as http_methods min(_time) as firstTime max(_time) as lastTime from datamodel=Web where `hdsi_ai_voice_cloning_api_access_web_scope` `hdsi_ai_voice_cloning_api_access_filter` by sourcetype Web.user Web.src Web.url_domain Web.site Web.url \
	| rename Web.* as * \
	| eval evidence_source="web", ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))), ai_input_type=if(isnull(nullif(url_domain,"unknown")),"app","host"), url_host=if(url!="unknown" AND match(url,"^([A-Za-z][A-Za-z0-9+.-]*://)?[^/?#]+"),lower(replace(url,"^([A-Za-z][A-Za-z0-9+.-]*://)?([^/?#]+).*$","\2")),""), url_path=if(url="unknown","",lower(replace(replace(url,"^([A-Za-z][A-Za-z0-9+.-]*://)?[^/?#]+",""),"[?#].*$",""))) \
	| append maxtime=600 [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Network_Resolution where `hdsi_ai_voice_cloning_api_access_dns_scope` NOT DNS.src IN ("unknown","-","0.0.0.0","127.0.0.1","::1") `hdsi_ai_voice_cloning_api_access_dns_filter` by _time span=1m sourcetype DNS.src DNS.query | rename DNS.* as * | stats count as count min(_time) as firstTime max(_time) as lastTime by sourcetype src query | eval evidence_source="dns", ai_domain=query, ai_input_type="dns", url_host="", url_path=""] \
	| append maxtime=900 [| tstats summariesonly=t allow_old_summaries=t dc(DNS.query) as src_name_count from datamodel=Network_Resolution where NOT DNS.src IN ("unknown","-","0.0.0.0","127.0.0.1","::1") `hdsi_ai_voice_cloning_api_access_dns_filter` by DNS.src | where src_name_count>=`hdsi_ai_voice_cloning_api_access_shared_src_names` | rename DNS.src as src | eval src=lower(src), shared_src=1 | fields src shared_src] \
	| eval src=if(isnull(src) OR match(lower(src),"^(unknown|-|n/a|null|none|0\.0\.0\.0|)$"),null(),lower(src)) \
	| eventstats max(shared_src) as shared_src by src \
	| where isnotnull(evidence_source) \
	| `ai_domains_filter` \
	| search provider IN (`hdsi_ai_voice_cloning_api_access_providers`) \
	| eval user=if(isnull(user) OR match(lower(user),"^(unknown|-|n/a|null|none|anonymous|)$") OR match(user,"^\d{1,3}(\.\d{1,3}){3}$"),null(),user), src_public=if(isnotnull(src) AND match(src,"^\d{1,3}(\.\d{1,3}){3}$") AND NOT (cidrmatch("10.0.0.0/8",src) OR cidrmatch("172.16.0.0/12",src) OR cidrmatch("192.168.0.0/16",src) OR cidrmatch("100.64.0.0/10",src) OR cidrmatch("169.254.0.0/16",src)),1,0) \
	| eval src=if(isnotnull(src) AND (src_public=1 OR shared_src=1 OR `hdsi_ai_voice_cloning_api_access_untrusted_src`),null(),src) \
	| where isnotnull(user) OR isnotnull(src) \
	| eval class_host=replace(replace(replace(coalesce(nullif(url_host,""),ai_domain),":\d+$",""),"\.+$",""),"^www\d*\.","") \
	| eval evidence_class=case(`hdsi_ai_voice_cloning_api_access_background`,"background", `hdsi_ai_voice_cloning_api_access_clone_evidence`,"clone", `hdsi_ai_voice_cloning_api_access_voicelab_evidence`,"voicelab", `hdsi_ai_voice_cloning_api_access_app_evidence`,"app", `hdsi_ai_voice_cloning_api_access_api_evidence`,"api", true(),"browse") \
	| eval bytes_out=tonumber(bytes_out), bytes_in=tonumber(bytes_in), has_bytes=if(coalesce(bytes_out,0)>0 OR coalesce(bytes_in,0)>0,1,0), upload_method=if(isnull(http_methods) OR isnotnull(mvfind(http_methods,"(?i)^(post|put|patch|unknown)$")),1,0), upload_bytes=if(has_bytes=1 AND evidence_class="clone" AND upload_method=1,coalesce(if(`hdsi_ai_voice_cloning_api_access_bytes_reversed`,bytes_in,bytes_out),0),0), clone_events=if(evidence_class="clone",count,0), voicelab_events=if(evidence_class="voicelab",count,0), app_events=if(evidence_class="app",count,0), api_events=if(evidence_class="api",count,0), browse_events=if(evidence_class="browse",count,0), blocked_events=if(evidence_source="web" AND isnotnull(web_actions) AND isnull(mvfilter(NOT match(web_actions,"(?i)^(block|blocked|deny|denied|drop|dropped|reset.*)$"))),count,0) \
	| eventstats values(user) as src_users by src \
	| eval user=coalesce(user,if(mvcount(src_users)=1,src_users,null())), risk_entity=coalesce(user,src) \
	| stats sum(count) as event_count sum(clone_events) as clone_events sum(voicelab_events) as voicelab_events sum(app_events) as app_events sum(api_events) as api_events sum(browse_events) as browse_events sum(blocked_events) as blocked_events sum(upload_bytes) as upload_bytes max(has_bytes) as has_bytes values(class_host) as ai_domains values(evidence_source) as evidence_sources values(sourcetype) as sourcetypes values(user) as user values(src) as src_list max(severity_weight) as severity_weight min(firstTime) as firstTime max(lastTime) as lastTime by risk_entity provider \
	| eval app_qualifies=if(app_events>=`hdsi_ai_voice_cloning_api_access_min_app_events`,1,0), provider_base=case(clone_events>0,35, voicelab_events>0,25, app_qualifies=1,20, api_events>=`hdsi_ai_voice_cloning_api_access_min_api_events`,12, api_events>0 AND browse_events>0 AND api_events+browse_events>=`hdsi_ai_voice_cloning_api_access_min_browse_events`,12, browse_events>=`hdsi_ai_voice_cloning_api_access_min_browse_events`,8) \
	| where isnotnull(provider_base) \
	| eval user=mvindex(user,0), src=if(mvcount(src_list)=1,src_list,null()) \
	| lookup identity_lookup_expanded identity as user OUTPUT bunit as _user_bunit \
	| lookup asset_lookup_by_str ip as src OUTPUT bunit as _src_bunit \
	| lookup asset_lookup_by_str dns as src OUTPUTNEW bunit as _src_bunit \
	| eval bunit=lower(coalesce(nullif(mvindex(_user_bunit,0),""),nullif(mvindex(_src_bunit,0),""))), bunit=if(bunit="unknown",null(),bunit) \
	| fields - _user_bunit _src_bunit \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| eval severity_weight=coalesce(tonumber(severity_weight),1.0), blocked_only=if(blocked_events>=event_count,1,0), provider_score=round(provider_base*severity_weight*if(blocked_only=1,0.5,1)), provider_evidence=provider.": ".case(clone_events>0,"voice cloning or conversion request", voicelab_events>0,"Voice Lab or voice design use", app_qualifies=1,"signed-in app use", api_events>=`hdsi_ai_voice_cloning_api_access_min_api_events`,"sustained API use", api_events>0 AND browse_events>0 AND api_events+browse_events>=`hdsi_ai_voice_cloning_api_access_min_browse_events`,"site and API use", true(),"repeated site visits").if(blocked_only=1," (blocked)","") \
	| stats sum(event_count) as event_count sum(clone_events) as clone_events sum(voicelab_events) as voicelab_events sum(app_events) as app_events sum(api_events) as api_events sum(browse_events) as browse_events sum(upload_bytes) as upload_bytes max(has_bytes) as has_bytes dc(provider) as provider_count values(provider) as providers values(provider_evidence) as provider_evidence max(provider_score) as max_provider_score values(ai_domains) as ai_domains values(evidence_sources) as evidence_sources values(sourcetypes) as sourcetypes values(user) as user values(src) as src values(src_list) as src_list values(bunit) as bunit min(firstTime) as firstTime max(lastTime) as lastTime by risk_entity \
	| eval user=mvindex(user,0), src=if(mvcount(src)=1,src,null()) \
	| `ai_risk_multiplier` \
	| eval mb_uploaded=if(has_bytes=1,round(upload_bytes/1048576,2),null()), upload_flag=if(has_bytes=1 AND upload_bytes>=`hdsi_ai_voice_cloning_api_access_upload_mb`*1048576,1,0), base_score=max_provider_score+5*(provider_count-1)+if(upload_flag=1,15,0), risk_multiplier=coalesce(risk_multiplier,1), risk_score=min(60,max(3,round(base_score*risk_multiplier))) \
	| eval provider=providers, provider_list=mvjoin(providers,", "), evidence_list=mvjoin(mvappend(provider_evidence,if(upload_flag=1,"about ".mb_uploaded." MB sent to voice-clone routes",null())),"; "), request_summary=mvjoin(mvappend(if(clone_events>0,clone_events." voice-clone",null()),if(voicelab_events>0,voicelab_events." Voice Lab",null()),if(app_events>0,app_events." app",null()),if(api_events>0,api_events." API",null()),if(browse_events>0,browse_events." site",null())),", ")." requests or lookup-minutes", user_display=coalesce(user,"an unattributed user"), src_display=coalesce(src,mvjoin(mvindex(src_list,0,2),", "),"an unidentified host"), src_hosts=coalesce(mvjoin(mvindex(src_list,0,9),","),"none"), ai_domain_list=mvjoin(mvindex(ai_domains,0,5),", "), evidence_source_list=mvjoin(evidence_sources,"+"), sourcetype_list=mvjoin(sourcetypes,", ") \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="voice_clone_service", detection_id="hdsi_ai_voice_cloning_api_access", mitre_attack="T1588.007", ai_kill_chain_phase="staging" \
	| fields - _allow_* _final_multiplier src_users http_methods upload_method providers provider_evidence max_provider_score ai_domains evidence_sources sourcetypes upload_bytes upload_flag has_bytes \
	| `hdsi_ai_voice_cloning_api_access_customizations` \
	| `hdsi_ai_voice_cloning_api_access_risk_score`

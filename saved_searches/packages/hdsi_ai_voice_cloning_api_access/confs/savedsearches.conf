description = v1.1.0 Detects a user or host using hosted voice cloning and voice conversion services (ElevenLabs, PlayHT, Resemble AI, WellSaid Labs, Murf, LOVO, FakeYou, Voicemod, HeyGen, Fish Audio, Cartesia and similar) from Web and DNS evidence. In-app voice cloning or conversion requests score highest, then Voice Lab and voice design use, repeated signed-in app use, and low-scored API or site plus API use. Docs, help, blog and pricing pages, sign-up and sign-in pages, embedded players and voice-agent widgets on decrypted URLs, and single visits do not qualify; repeated marketing or product page visits score lowest. Runs daily. Risk on user and/or system, no notable.
disabled = 0

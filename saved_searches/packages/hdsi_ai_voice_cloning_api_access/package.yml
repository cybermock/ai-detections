version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Voice Cloning API Access
description: "Detects a user or host using hosted voice cloning and voice conversion services (ElevenLabs, PlayHT, Resemble AI, WellSaid Labs, Murf AI, LOVO AI, FakeYou, Uberduck, Voicemod, HeyGen, Fish Audio, Cartesia). Evidence comes from Web (proxy, firewall URL or SSE logs) and DNS (Network_Resolution): in-app voice cloning or conversion requests, Voice Lab and voice design use, repeated signed-in app use, and lower-scored API use, site plus API use and repeated site visits. Docs, help, blog and pricing pages, sign-up and sign-in pages, single visits, and (on decrypted URLs) embedded players and voice-agent widgets do not qualify; on host-only logs an embedded player can still look like low-scored site plus API use. Cloned voices are the raw material for CEO-voice fraud and vishing. Runs daily. Risk on the user and/or host, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - web
  - proxy
  - dns
data_prereqs:
  datamodels:
    op: OR
    items:
    - "Web"
    - "Network_Resolution"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

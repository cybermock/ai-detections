version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Code Assistant Network Connection
description: "Detects hosts and users running AI coding assistants (GitHub Copilot, Cursor, Windsurf, JetBrains AI, Amazon Q, Gemini Code Assist and others) from firewall App-ID (Network_Traffic) or DNS (Network_Resolution) evidence. Org-tier Copilot is treated as sanctioned; personal-tier Copilot scores higher. Risk only, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - network
  - dns
data_prereqs:
  datamodels:
    op: OR
    items:
    - "Network_Traffic"
    - "Network_Resolution"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

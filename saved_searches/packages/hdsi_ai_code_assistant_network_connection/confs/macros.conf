[hdsi_ai_code_assistant_network_connection_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Network_Traffic (App-ID) branch, applied inside its tstats where clause before aggregation. Use datamodel field names, e.g. NOT All_Traffic.src IN ("10.9.9.0/24"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_code_assistant_network_connection_dns_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Network_Resolution (DNS) branch, applied inside its tstats where clause before aggregation. Use datamodel field names, e.g. NOT DNS.src IN ("10.0.0.53","192.0.2.0/24") for internal resolvers or forwarders that appear as the DNS client. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_code_assistant_network_connection_app_ids]
definition = (All_Traffic.app IN ("*github*copilot*","cursor","cursor-*","cursor.ai*","codeium*","*windsurf*","*tabnine*","openai-codex*","*codewhisperer*","amazon-q-developer*","sourcegraph-cody*","jetbrains-ai*","*gemini-code-assist*","*supermaven*"))
description = v1.1 Firewall application-identification values (PAN-OS App-ID style, matched case-insensitively) that name an AI coding assistant. Validated values: github-copilot, github-copilot-chat, github-copilot-business, cursor, codeium, openai-codex, amazon-codewhisperer. Shipped patterns: *github*copilot*, cursor, cursor-*, cursor.ai*, codeium*, *windsurf*, *tabnine*, openai-codex*, *codewhisperer*, amazon-q-developer*, sourcegraph-cody*, jetbrains-ai*, *gemini-code-assist*, *supermaven*. M365/Office Copilot and chat apps (openai-chatgpt, claude-base, google-gemini) are deliberately absent. Add your NGFW's names for the same tools here.
disabled = False
iseval = 0

[hdsi_ai_code_assistant_network_connection_dns_endpoints]
definition = (DNS.query IN ("*.githubcopilot.com","*.githubcopilot.com.","githubcopilot.com","githubcopilot.com.","copilot-proxy.githubusercontent.com","copilot-proxy.githubusercontent.com.","copilot-telemetry.githubusercontent.com","copilot-telemetry.githubusercontent.com.","*.cursor.sh","*.cursor.sh.","*.cursorapi.com","*.cursorapi.com.","*.codeium.com","*.codeium.com.","*.codeiumdata.com","*.codeiumdata.com.","server*.windsurf.com","server*.windsurf.com.","api.tabnine.com","api.tabnine.com.","notify.tabnine.com","notify.tabnine.com.","update.tabnine.com","update.tabnine.com.","cody-gateway.sourcegraph.com","cody-gateway.sourcegraph.com.","codewhisperer.*.amazonaws.com","codewhisperer.*.amazonaws.com.","q.*.amazonaws.com","q.*.amazonaws.com.","*.desktop.kiro.dev","*.desktop.kiro.dev.","management.*.kiro.dev","management.*.kiro.dev.","*.api.jetbrains.ai","*.api.jetbrains.ai.","*.grazie.aws.intellij.net","*.grazie.aws.intellij.net.","cloudcode-pa.googleapis.com","cloudcode-pa.googleapis.com.","api.supermaven.com","api.supermaven.com.","*.api.augmentcode.com","*.api.augmentcode.com.") NOT DNS.query IN ("*download*.kiro.dev","*download*.kiro.dev."))
description = v1.1 DNS names resolved by AI coding-assistant clients (IDE extensions, AI IDEs, coding CLIs; q.* also by the AWS console Amazon Q chat), each listed with and without the trailing root dot some resolvers log. Marketing and download sites (cursor.com, windsurf.com, tabnine.com, the Kiro installer host *download*.kiro.dev) are excluded on purpose: visiting a vendor site is not running the tool. q.<region>.amazonaws.com is shared by the Amazon Q IDE plugins and the Amazon Q chat panel of the AWS console, so it means Amazon Q use, not only IDE use. The bare api.jetbrains.ai is excluded too: every JetBrains IDE with the bundled AI plugin resolves it a few times a day while idle (median 2 queries/host/day in validation); real JetBrains AI use resolves *.grazie.aws.intellij.net or *.api.jetbrains.ai. Every entry needs a matching pattern in hdsi_ai_code_assistant_network_connection_tool_map or its rows are dropped.
disabled = False
iseval = 0

[hdsi_ai_code_assistant_network_connection_tool_map]
definition = eval ai_endpoint=lower(replace(ai_endpoint,"[.]$","")) | eval tool=case(match(ai_endpoint,"(^|[.])individual[.]githubcopilot[.]com$"),"GitHub Copilot (personal)", match(ai_endpoint,"(^|[.])(business|enterprise)[.]githubcopilot[.]com$|github.?copilot.?(chat.?)?(business|enterprise)"),"GitHub Copilot (Business/Enterprise)", match(ai_endpoint,"githubcopilot[.]com$|^copilot-(proxy|telemetry)[.]githubusercontent[.]com$|github.?copilot"),"GitHub Copilot", match(ai_endpoint,"[.]cursor[.]sh$|[.]cursorapi[.]com$|^cursor($|[-.])"),"Cursor", match(ai_endpoint,"[.]codeium(data)?[.]com$|^server[^.]*[.]windsurf[.]com$|codeium|windsurf"),"Windsurf (Codeium)", match(ai_endpoint,"tabnine"),"Tabnine", match(ai_endpoint,"^cody-gateway[.]sourcegraph[.]com$|^sourcegraph-cody"),"Sourcegraph Cody", match(ai_endpoint,"^(codewhisperer|q)[.][a-z0-9-]+[.]amazonaws[.]com$|codewhisperer|^amazon-q-developer"),"Amazon Q Developer", match(ai_endpoint,"[.]kiro[.]dev$"),"Kiro", match(ai_endpoint,"(^|[.])api[.]jetbrains[.]ai$|[.]grazie[.]aws[.]intellij[.]net$|^jetbrains-ai"),"JetBrains AI Assistant", match(ai_endpoint,"^cloudcode-pa[.]googleapis[.]com$|gemini-code-assist"),"Gemini Code Assist", match(ai_endpoint,"^openai-codex"),"OpenAI Codex", match(ai_endpoint,"supermaven"),"Supermaven", match(ai_endpoint,"augmentcode"),"Augment Code") | eval provider=case(match(tool,"^GitHub Copilot"),"GitHub Copilot", tool="Windsurf (Codeium)","Windsurf", tool="Sourcegraph Cody","Sourcegraph", tool="Amazon Q Developer","Amazon Q", tool="JetBrains AI Assistant","JetBrains AI", tool="Gemini Code Assist","Google Gemini", tool="OpenAI Codex","OpenAI", isnotnull(tool),tool), license_tier=case(match(tool,"[(]personal[)]$"),"personal", match(tool,"[(]Business/Enterprise[)]$"),"organisation", isnotnull(tool),"unknown")
description = v1.1 Maps an App-ID value or DNS name (field ai_endpoint) to the coding-assistant tool, its provider and the GitHub Copilot license tier: personal (*.individual.githubcopilot.com), organisation (*.business / *.enterprise, github-copilot-business, github-copilot-chat-business) or unknown. Provider strings are the ones hdsi_ai_rba_common ai_provider_domains / ai_provider_apps use for the same hosts and App-IDs (GitHub Copilot, Cursor, Windsurf, Tabnine, Sourcegraph, Amazon Q, Kiro, JetBrains AI, Google Gemini, OpenAI; Supermaven and Augment Code are not in the registry), so one ai_sanctioned_entities key covers this rule and the DNS/Web/firewall rules. Rows it cannot map get no tool and are dropped.
disabled = False
iseval = 0

[hdsi_ai_code_assistant_network_connection_sanctioned_tools]
definition = "GitHub Copilot (Business/Enterprise)"
description = v1.1 Tool labels (from the tool_map macro) the organisation has licensed for everyone; they are removed before scoring. Ships with org-tier GitHub Copilot, because a business/enterprise endpoint means the seat is governed by a GitHub organisation. Add e.g. "GitHub Copilot","Cursor" when they are licensed company-wide; use ai_sanctioned_entities for per-user, per-host or per-group approvals. Prefer this macro over an organisation-wide *|github copilot key: the key also removes personal-tier Copilot, while adding "GitHub Copilot" here keeps "GitHub Copilot (personal)" reported. Use "__none__" to report every tool.
disabled = False
iseval = 0

[hdsi_ai_code_assistant_network_connection_max_users_per_src]
definition = 3
description = v1.1 A source address seen with more distinct firewall users than this in one run is treated as shared egress (explicit proxy, NAT, VDI or terminal server) and dropped, because the activity cannot be attributed to one host or person. Evaluated over the daily window. Derive it from the copy-paste SPL in the README.
disabled = False
iseval = 0

[hdsi_ai_code_assistant_network_connection_unreliable_src]
definition = false()
description = v1.1 Eval expression marking source addresses that are not a stable host, for example roaming DNS security clients that report home-network or IPv6 addresses shared by different laptops. Rows that match and have no firewall user are dropped, because their only risk object would be a shared address (an RBA hotspot like "unknown"). Ships as false() (keep everything). Roaming-DNS tenants can use e.g. cidrmatch("192.168.0.0/16",src) OR match(src,":"); see the README for the measured effect.
disabled = False
iseval = 0

[hdsi_ai_code_assistant_network_connection_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after normalisation and per-host aggregation (fields: src, user, users, user_display, tools, tool_list, provider, license_tiers, copilot_personal_active, evidence_type, endpoint_sample, event_count, action, allowed, base_score, risk_multiplier, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_code_assistant_network_connection_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. The SPL sets risk_score = base x risk_multiplier (identity bunit sensitivity, privileged x1.25), capped at 50, for both src and user. Base: 25 when personal-tier Copilot completions or chat are seen (api/proxy.individual.githubcopilot.com), 5 when every firewall session was blocked, otherwise 15. Override risk_score here per tenant. Ships as search *.
disabled = False
iseval = 0

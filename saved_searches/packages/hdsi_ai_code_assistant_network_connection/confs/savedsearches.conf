[Network - HDSI AI Code Assistant Network Connection - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Code Assistant Network Connection
action.correlationsearch.annotations = {"mitre_attack": ["T1588.007"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$risk_object$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI code assistant firewall sessions from $src$","search":"| tstats summariesonly=t count min(_time) as firstTime max(_time) as lastTime values(All_Traffic.dest) as dest values(All_Traffic.dest_port) as dest_port values(All_Traffic.action) as action sum(All_Traffic.bytes_out) as bytes_out from datamodel=Network_Traffic where All_Traffic.src=\"$src$\" `hdsi_ai_code_assistant_network_connection_app_ids` by All_Traffic.src All_Traffic.user All_Traffic.app | rename All_Traffic.* as * | eval mb_out=round(bytes_out/1024/1024,2) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, src, user, app, action, dest, dest_port, count, mb_out | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI code assistant DNS queries from $src$","search":"| tstats summariesonly=t count min(_time) as firstTime max(_time) as lastTime values(DNS.answer) as answer from datamodel=Network_Resolution where DNS.src=\"$src$\" `hdsi_ai_code_assistant_network_connection_dns_endpoints` by DNS.src DNS.query | rename DNS.* as * | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, src, query, answer, count | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = $tool_list$ AI coding assistant traffic from $src$ ($user_display$): $event_count$ $evidence_type$ events, license tier $license_tiers$, e.g. $endpoint_sample$.
action.notable.param.rule_title = HDSI AI Code Assistant Network Connection ($src$)
action.notable.param.security_domain = network
action.notable.param.severity = informational
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"src","risk_object_type":"system","risk_score":15},{"risk_object_field":"user","risk_object_type":"user","risk_score":15}]
action.risk.param._risk_message = $tool_list$ AI coding assistant traffic from $src$ ($user_display$): $event_count$ $evidence_type$ events, license tier $license_tiers$, e.g. $endpoint_sample$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = src
alert.suppress.period = 72000s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 20 1 * * *
description = v1.1.0 Daily (one row per host). Detects hosts and users running AI coding assistants (GitHub Copilot, Cursor, Windsurf, JetBrains AI, Amazon Q, Gemini Code Assist and others) from firewall App-ID and DNS evidence, highlighting personal-tier Copilot and tools the organisation has not sanctioned. Risk only, no notable.
disabled = 0
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime values(All_Traffic.action) as action from datamodel=Network_Traffic where `hdsi_ai_code_assistant_network_connection_app_ids` `hdsi_ai_code_assistant_network_connection_filter` by All_Traffic.src All_Traffic.user All_Traffic.app \
	| rename All_Traffic.* as * \
	| eval ai_endpoint=app, evidence_type="firewall App-ID" \
	| append [| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Resolution where `hdsi_ai_code_assistant_network_connection_dns_endpoints` `hdsi_ai_code_assistant_network_connection_dns_filter` by DNS.src DNS.query | rename DNS.* as * | eval ai_endpoint=query, evidence_type="DNS"] \
	| `hdsi_ai_code_assistant_network_connection_tool_map` \
	| eval user=if(isnull(user) OR trim(user)="" OR in(lower(user),"unknown","-","n/a","none","null"), null(), lower(user)) \
	| where isnotnull(tool) AND isnotnull(src) AND src!="" AND lower(src)!="unknown" \
	| eventstats dc(user) as src_fw_user_count values(user) as src_fw_user by src \
	| eval user=coalesce(user, if(src_fw_user_count=1, mvindex(src_fw_user,0), null())) \
	| eval copilot_personal_active=if(match(ai_endpoint,"^(api|proxy)[.]individual[.]githubcopilot[.]com$"), 1, 0) \
	| eventstats max(eval(if(license_tier="organisation",1,0))) as src_has_org_copilot by src \
	| eval tool=if(tool="GitHub Copilot" AND src_has_org_copilot=1, "GitHub Copilot (Business/Enterprise)", tool), license_tier=if(tool="GitHub Copilot (Business/Enterprise)", "organisation", license_tier) \
	| eval copilot_idle_row=case(tool!="GitHub Copilot", null(), evidence_type="DNS" AND match(ai_endpoint,"^(copilot-telemetry(-service)?[.]githubusercontent[.]com|(telemetry|exp-tas)[.]githubcopilot[.]com)$"), 1, true(), 0) \
	| eventstats min(copilot_idle_row) as src_copilot_idle_only by src \
	| where NOT (tool="GitHub Copilot" AND coalesce(src_copilot_idle_only,0)=1) \
	| search NOT tool IN (`hdsi_ai_code_assistant_network_connection_sanctioned_tools`) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| stats sum(count) as event_count values(tool) as tools values(provider) as provider values(license_tier) as license_tiers values(evidence_type) as evidence_type values(ai_endpoint) as ai_endpoints values(action) as action max(copilot_personal_active) as copilot_personal_active values(user) as users dc(user) as user_count min(firstTime) as firstTime max(lastTime) as lastTime by src \
	| where user_count<=`hdsi_ai_code_assistant_network_connection_max_users_per_src` \
	| eval user=if(user_count=1, users, null()), user_display=case(user_count=1, users, user_count>1, user_count." users: ".mvjoin(users,", "), true(), "no user attribution") \
	| where NOT ((`hdsi_ai_code_assistant_network_connection_unreliable_src`) AND isnull(user)) \
	| `ai_risk_multiplier` \
	| eval allowed=if(isnull(action) OR isnotnull(mvfind(action,"(?i)^(allow|allowed|accept|accepted|permit|permitted|pass|success)$")), 1, 0), base_score=case(copilot_personal_active=1, 25, allowed=0, 5, true(), 15), risk_score=min(50, round(base_score*coalesce(risk_multiplier,1), 0)) \
	| eval tool_list=mvjoin(tools,", "), endpoint_sample=mvjoin(mvindex(ai_endpoints,0,4),", "), evidence_type=mvjoin(evidence_type," + "), license_tiers=mvjoin(license_tiers,", ") \
	| fields - ai_endpoints \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="code_assistant_network", detection_id="hdsi_ai_code_assistant_network_connection", mitre_attack="T1588.007", ai_kill_chain_phase="execution" \
	| `hdsi_ai_code_assistant_network_connection_customizations` \
	| `hdsi_ai_code_assistant_network_connection_risk_score`

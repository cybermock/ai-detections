[Network - HDSI AI Unknown High-Volume External API Discovery - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Unknown High-Volume External API Discovery
action.correlationsearch.annotations = {"mitre_attack": ["T1588.007"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View DNS clients resolving $service$","search":"| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Resolution.DNS where (DNS.query=\"$service$\" OR DNS.query=\"$service$.\" OR DNS.query=\"*.$service$\" OR DNS.query=\"*.$service$.\") by DNS.src DNS.query | rename DNS.* as * | convert ctime(firstTime) ctime(lastTime) | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View web activity to $service$","search":"| tstats summariesonly=t allow_old_summaries=t count sum(Web.bytes_out) as bytes_out dc(Web.url) as url_count min(_time) as firstTime max(_time) as lastTime from datamodel=Web where (Web.url_domain=\"$service$\" OR Web.url_domain=\"*.$service$\" OR Web.site=\"$service$\" OR Web.site=\"*.$service$\") by Web.user Web.src Web.url_domain Web.site Web.category sourcetype fillnull_value=\"unknown\" | rename Web.* as * | eval url_domain=coalesce(nullif(url_domain,\"unknown\"),site), mb_out=round(bytes_out/1024/1024,2) | convert ctime(firstTime) ctime(lastTime) | table firstTime lastTime user src url_domain category sourcetype count url_count mb_out | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = Service $service$ ($reason$) is not in the AI provider lookups. It was reached by $src_count$ sources with $event_count$ requests or DNS queries ($signal$). Review it and add it to ai_provider_domains / ai_provider_apps or to the exclusions macro.
action.notable.param.rule_title = HDSI AI Unknown High-Volume External API Discovery ($service$)
action.notable.param.security_domain = network
action.notable.param.severity = informational
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 0
alert.managedBy =
alert.suppress = 0
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 20 1 * * *
description = v1.1.0 Hunting and discovery, no risk and no notable. Once a day, lists AI-looking services (vendor AI URL category, AI product words in the hostname, or the .ai TLD) seen in DNS and Web data that are missing from ai_provider_domains and ai_provider_apps, ranked for review, so the provider lookups that drive the AI detections stay current.
disabled = 0
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t count dc(DNS.src) as src_count min(_time) as firstTime max(_time) as lastTime values(sourcetype) as orig_sourcetype from datamodel=Network_Resolution.DNS where `hdsi_ai_unknown_high_volume_external_api_discovery_dns_scope` `hdsi_ai_unknown_high_volume_external_api_discovery_filter` by DNS.query \
	| rename DNS.query as raw_name \
	| eval signal="dns", name_type="host" \
	| append maxtime=600 maxout=50000 [| tstats summariesonly=t allow_old_summaries=t count dc(Web.src) as src_count dc(Web.user) as user_count min(_time) as firstTime max(_time) as lastTime values(sourcetype) as orig_sourcetype from datamodel=Web where `hdsi_ai_unknown_high_volume_external_api_discovery_web_scope` `hdsi_ai_unknown_high_volume_external_api_discovery_web_filter` by Web.url_domain Web.site Web.category fillnull_value="unknown" | rename Web.* as * | eval raw_name=coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown")), name_type=if(isnull(nullif(url_domain,"unknown")) AND NOT match(lower(trim(site)),"^([a-z][a-z0-9+.-]*://)?([a-z0-9_-]+\\.)+[a-z][a-z0-9-]{1,62}\\.?(:\\d+)?([/?#&;,].*)?$"),"app","host"), vendor_category=nullif(category,"unknown"), signal="web" | fields - url_domain site category] \
	| eval candidate=replace(lower(trim(raw_name)),"^[a-z][a-z0-9+.-]*://",""), candidate=if(name_type="app", replace(candidate,"\\s+"," "), replace(replace(replace(replace(replace(candidate,"[/?#&;, ].*$",""),":\\d+$",""),"\\.+$",""),"^\\*\\.",""),"^www\\d*\\.","")), vendor_ai=if(match(lower(coalesce(vendor_category,"")), `hdsi_ai_unknown_high_volume_external_api_discovery_ai_category_regex`),1,0), name_key=if(name_type="app", replace(candidate,"[^a-z0-9.-]+","."), candidate), name_ai=case(match(name_key, `hdsi_ai_unknown_high_volume_external_api_discovery_ai_name_regex`),2, match(name_key, `hdsi_ai_unknown_high_volume_external_api_discovery_ai_tld_regex`),1, true(),0) \
	| where (vendor_ai=1 OR name_ai>0) AND candidate!="" AND NOT (`hdsi_ai_unknown_high_volume_external_api_discovery_exclusions`) \
	| stats sum(count) as event_count max(src_count) as src_count max(user_count) as user_count min(firstTime) as firstTime max(lastTime) as lastTime values(signal) as signal values(vendor_category) as vendor_category max(vendor_ai) as vendor_ai max(name_ai) as name_ai values(orig_sourcetype) as orig_sourcetype by candidate name_type \
	| where event_count>=`hdsi_ai_unknown_high_volume_external_api_discovery_min_events` OR src_count>=`hdsi_ai_unknown_high_volume_external_api_discovery_min_sources` \
	| appendpipe [| eval ai_domain=candidate, ai_input_type=if(name_type="app","app","host") | `ai_domains_filter` | eval known_provider=provider | fields candidate known_provider] \
	| eventstats values(known_provider) as known_provider by candidate \
	| where isnull(known_provider) AND isnotnull(event_count) \
	| eval parent=if(name_type="host" AND match(candidate,"^[^.]+\\.[^.]+\\.[^.]+"), replace(candidate,"^[^.]+\\.",""), null()), base=if(name_type="host", replace(candidate,"^(?:.*\\.)?([^.]+\\.(?:(?:co|com|net|org|gov|edu|ac|or|ne|go)\\.[a-z]{2}|[^.]+))$","\\1"), null()) \
	| lookup ai_provider_domains domain as candidate OUTPUT provider as listed_exact \
	| lookup ai_provider_domains domain as parent OUTPUT provider as listed_parent enabled as listed_parent_enabled \
	| lookup ai_provider_domains domain as base OUTPUT provider as listed_base enabled as listed_base_enabled \
	| lookup ai_provider_apps app_name as candidate OUTPUT provider as listed_app \
	| eval lookup_status=case(isnotnull(listed_exact) OR isnotnull(listed_app), "listed_disabled", isnotnull(listed_parent) AND tonumber(listed_parent_enabled)!=1, "listed_disabled", isnotnull(listed_base) AND tonumber(listed_base_enabled)!=1, "listed_disabled", isnotnull(listed_parent) OR isnotnull(listed_base), "unlisted_host_of_known_provider", true(), "unlisted"), provider_hint=coalesce(listed_parent, listed_base) \
	| where lookup_status!="listed_disabled" \
	| eventstats min(vendor_ai) as base_all_vendor dc(candidate) as base_hosts by base \
	| eval service=case(isnull(base), candidate, match(base, `hdsi_ai_unknown_high_volume_external_api_discovery_ai_name_regex`) OR match(base, `hdsi_ai_unknown_high_volume_external_api_discovery_ai_tld_regex`), base, base_all_vendor=1 AND base_hosts>=2, base, true(), candidate) \
	| stats sum(event_count) as event_count max(src_count) as src_count max(user_count) as user_count dc(candidate) as hostname_count values(candidate) as hostnames min(firstTime) as firstTime max(lastTime) as lastTime values(signal) as signal values(name_type) as name_type values(vendor_category) as vendor_category max(vendor_ai) as vendor_ai max(name_ai) as name_ai values(lookup_status) as lookup_status values(provider_hint) as provider_hint values(orig_sourcetype) as orig_sourcetype by service \
	| eval hostnames=mvindex(hostnames,0,9), review_tier=case(vendor_ai=1,1,name_ai=2,2,true(),3), reason=trim(if(vendor_ai=1,"vendor_ai_category ","").case(name_ai=2,"ai_name",name_ai=1,"ai_tld",true(),"")), suggested_action=case(lookup_status="unlisted_host_of_known_provider", "Known provider ".mvjoin(provider_hint,"/").": add these hostnames to ai_provider_domains or set match_subdomains=1 on its row", name_type="app", "Review the app; if it is an AI service add it to ai_provider_apps, otherwise add it to the exclusions macro", true(), "Review the service; if it is an AI service add its domain to ai_provider_domains, otherwise add it to the exclusions macro"), detection_id="hdsi_ai_unknown_high_volume_external_api_discovery", ai_activity="unknown_ai_service_discovery", mitre_attack="T1588.007" \
	| `hdsi_ai_unknown_high_volume_external_api_discovery_customizations` \
	| sort 0 review_tier - src_count - event_count \
	| streamstats count as tier_rank by review_tier \
	| eventstats count as total_candidates \
	| eventstats count as tier_candidates by review_tier \
	| sort 0 tier_rank review_tier \
	| head `hdsi_ai_unknown_high_volume_external_api_discovery_max_results` \
	| sort 0 review_tier tier_rank \
	| convert ctime(firstTime) ctime(lastTime) \
	| table review_tier tier_rank service total_candidates tier_candidates hostnames hostname_count name_type signal reason vendor_category lookup_status provider_hint event_count src_count user_count firstTime lastTime orig_sourcetype suggested_action detection_id ai_activity mitre_attack

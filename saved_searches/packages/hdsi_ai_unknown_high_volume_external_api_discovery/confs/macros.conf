[hdsi_ai_unknown_high_volume_external_api_discovery_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the DNS branch, inline in the Network_Resolution tstats where clause. Use DNS.* field names, e.g. NOT DNS.query IN ("*.corp.example.com*") or NOT DNS.src IN ("10.0.0.53"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_unknown_high_volume_external_api_discovery_web_filter]
definition = (NOT sourcetype IN ("aws:elb:accesslogs","aws:alb:accesslogs","aws:waf","aws:cloudfront:accesslogs","azure:waf","ms:iis:auto","ms:iis:default","ms:iis:default:85","iis","access_combined","access_combined_wcookie","apache:access","nginx:plus:kv","f5:bigip:ltm:http:irule"))
description = v1.1 Tenant exclusion hook for the Web branch, inline in the Web tstats where clause (Web.* field names or sourcetype). Ships excluding common INBOUND server/load-balancer/WAF sourcetypes: they log visitors to the tenant's own sites (whose hostnames can contain gpt, ai etc.), not outbound use. Add other inbound sources here; remove one only if it really logs outbound client traffic.
disabled = False
iseval = 0

[hdsi_ai_unknown_high_volume_external_api_discovery_dns_scope]
definition = (DNS.query="*.ai" OR DNS.query="*.ai." OR DNS.query="ai.*" OR DNS.query="*.ai.*" OR DNS.query="*-ai.*" OR DNS.query="ai-*" OR DNS.query="*.ai-*" OR DNS.query="*gpt*" OR DNS.query="*openai*" OR DNS.query="*anthropic*" OR DNS.query="*claude*" OR DNS.query="*llm*" OR DNS.query="*gemini*" OR DNS.query="*copilot*" OR DNS.query="*mistral*" OR DNS.query="*deepseek*" OR DNS.query="*perplexity*" OR DNS.query="*huggingface*" OR DNS.query="*inference*" OR DNS.query="*ollama*" OR DNS.query="*genai*" OR DNS.query="*chatbot*" OR DNS.query="*llama*" OR DNS.query="*qwen*" OR DNS.query="*groq*" OR DNS.query="*cohere*" OR DNS.query="*midjourney*" OR DNS.query="*elevenlabs*")
description = v1.1 AI-name prefilter for the DNS branch, inline in the tstats where clause. Each term is the wildcard form of a pattern in ..._ai_name_regex; keep the two in step. Trailing-dot forms are covered because every term either ends in * or has a .ai. variant.
disabled = False
iseval = 0

[hdsi_ai_unknown_high_volume_external_api_discovery_web_scope]
definition = (Web.category="*artificial*intelligence*" OR Web.category="AI-*" OR Web.category="*generative ai*" OR Web.category="* AI" OR Web.category="* AI *" OR Web.category="AI *" OR Web.category="*machine learning*" OR Web.url_domain="*.ai" OR Web.url_domain="ai.*" OR Web.url_domain="*.ai.*" OR Web.url_domain="*-ai.*" OR Web.url_domain="ai-*" OR Web.url_domain="*.ai-*" OR Web.url_domain="*gpt*" OR Web.url_domain="*openai*" OR Web.url_domain="*anthropic*" OR Web.url_domain="*claude*" OR Web.url_domain="*llm*" OR Web.url_domain="*gemini*" OR Web.url_domain="*copilot*" OR Web.url_domain="*mistral*" OR Web.url_domain="*deepseek*" OR Web.url_domain="*perplexity*" OR Web.url_domain="*huggingface*" OR Web.url_domain="*inference*" OR Web.url_domain="*ollama*" OR Web.url_domain="*genai*" OR Web.url_domain="*chatbot*" OR Web.url_domain="*llama*" OR Web.url_domain="*qwen*" OR Web.url_domain="*groq*" OR Web.url_domain="*cohere*" OR Web.url_domain="*midjourney*" OR Web.url_domain="*elevenlabs*" OR Web.site="*.ai" OR Web.site="ai.*" OR Web.site="*.ai.*" OR Web.site="*-ai.*" OR Web.site="ai-*" OR Web.site="*.ai-*" OR Web.site="*gpt*" OR Web.site="*openai*" OR Web.site="*anthropic*" OR Web.site="*claude*" OR Web.site="*llm*" OR Web.site="*gemini*" OR Web.site="*copilot*" OR Web.site="*mistral*" OR Web.site="*deepseek*" OR Web.site="*perplexity*" OR Web.site="*huggingface*" OR Web.site="*inference*" OR Web.site="*ollama*" OR Web.site="*genai*" OR Web.site="*chatbot*" OR Web.site="*llama*" OR Web.site="*qwen*" OR Web.site="*groq*" OR Web.site="*cohere*" OR Web.site="*midjourney*" OR Web.site="*elevenlabs*")
description = v1.1 Prefilter for the Web branch, inline in the tstats where clause: a vendor URL category that says AI (PAN-DB artificial-intelligence and AI-* categories, Netskope/Umbrella Generative AI, generic AI or machine learning), or a url_domain or site that matches the AI-name terms of ..._dns_scope. The site terms cover proxies that map the hostname to Web.site but leave url_domain empty; SSE app names in site (no dots) are reached mainly through the category terms.
disabled = False
iseval = 0

[hdsi_ai_unknown_high_volume_external_api_discovery_ai_category_regex]
definition = "^ai-|artificial.intelligence|generative.ai|machine.learning|(^|[^a-z])ai([^a-z]|$)"
description = v1.1 Quoted regex (used in match()) that marks a lowercased vendor URL category as AI. Matches PAN-DB artificial-intelligence and AI-* subcategories, Generative AI (Netskope, Umbrella), AI & ML style names. A row with such a category ranks first: the vendor already classifies it as AI.
disabled = False
iseval = 0

[hdsi_ai_unknown_high_volume_external_api_discovery_ai_name_regex]
definition = "gpt|openai([^r]|$)|anthropic|claude|(^|[.-])llms?([.-]|\\d|$)|(^|[.-])gemini|copilot|mistral|deepseek|perplexity|huggingface|inference|ollama|genai|chatbot|llama|qwen|groq|(^|[.-])cohere([.-]|$)|midjourney|elevenlabs|(^|\\.)ai[.-]"
description = v1.1 Quoted regex (used in match()) for a STRONG AI hostname: an AI vendor, model or product word, or an ai label / ai- prefix inside the name (ai.vendor.com, chat.ai.vendor.com, ai-assistant.vendor.com). Words that occur inside common names are label-bounded (llm vs enrollment, gemini vs company names ending in gemini, cohere vs coherent, openai vs openair). Keep in step with ..._dns_scope and ..._web_scope.
disabled = False
iseval = 0

[hdsi_ai_unknown_high_volume_external_api_discovery_ai_tld_regex]
definition = "\\.ai$|-ai\\."
description = v1.1 Quoted regex (used in match()) for a WEAK AI hostname: the .ai TLD or a -ai label suffix. Many .ai domains are ad-tech, analytics or security vendors, so these rows rank below vendor categories and strong names.
disabled = False
iseval = 0

[hdsi_ai_unknown_high_volume_external_api_discovery_exclusions]
definition = match(candidate,"(\\.(local|lan|internal|intranet|corp|home|localdomain|arpa|mshome\\.net)$)|^\\d{1,3}(\\.\\d{1,3}){3}$|^[0-9a-f]*:[0-9a-f:]+$") OR match(candidate,"^(u?sync|rtb\\d*(-[a-z0-9]+)*|ssp(-cookie)?|dsp|pixel(-[a-z0-9-]+)?|tags?|ads|adserver|tracker|track|tracking|cookies?|ortb|prebid|hb|bid|bidder)\\.") OR match(candidate,"\\.(cdn\\.cloudflare\\.net|edgekey\\.net|akamaiedge\\.net|akadns\\.net|trafficmanager\\.net|azurefd\\.net|azureedge\\.net|t-msedge\\.net|elb\\.amazonaws\\.com|rds\\.amazonaws\\.com)$|[.-]frontdoor\\.azure\\.com$|\\.ai\\.(privatelink\\.)?monitor\\.azure\\.com$|^inference\\.location\\.live\\.net$|\\.mail\\.(yahoo\\.net|aol\\.com)$") OR match(candidate,"(^|\\.)(axon|vdo|hybrid|trinitymedia|mgln)\\.ai$")
description = v1.1 Eval condition on the normalised candidate (hostname or app name); matching rows are dropped before ranking. Ships with: internal suffixes (incl. Windows ICS mshome.net), reverse lookups and IP literals; ad-tech and tracking host labels (sync., rtb., ssp., dsp., pixel., tag., ads. ...), which were most of the .ai TLD hits in validation; CDN, Front Door and traffic-manager CNAME targets (they repeat known provider names, e.g. a Front Door alias of the opt-in M365 Copilot host); AWS ELB and RDS endpoint names (a tenant's own infrastructure, never lookup material); Azure Application Insights (*.ai.monitor.azure.com); Windows location inference; Yahoo/AOL mail gpt.* hosts; .ai ad-tech and ad-measurement domains that topped tier 3 on 2-3 tenants (axon.ai, vdo.ai, hybrid.ai, trinitymedia.ai, mgln.ai). Append tenant internal domains and reviewed non-AI names, e.g. OR match(candidate,"(^|\\.)example-corp\\.com$") OR candidate IN ("gemini.com").
disabled = False
iseval = 0

[hdsi_ai_unknown_high_volume_external_api_discovery_min_events]
definition = 50
description = v1.1 Requests or DNS queries in the day for one candidate name. A candidate is kept when it reaches this OR ..._min_sources. 50 keeps single servers that call an unknown API all day and drops one-off lookups.
disabled = False
iseval = 0

[hdsi_ai_unknown_high_volume_external_api_discovery_min_sources]
definition = 3
description = v1.1 Distinct client addresses in the day for one candidate name. A candidate is kept when it reaches this OR ..._min_events.
disabled = False
iseval = 0

[hdsi_ai_unknown_high_volume_external_api_discovery_max_results]
definition = 100
description = v1.1 Rows returned. review_tier 1 = vendor AI URL category, 2 = strong AI name, 3 = .ai TLD only; inside a tier rows rank by distinct sources, then events (tier_rank). The cap is shared round-robin across tiers (tier_rank 1 of every tier, then 2, ...) so a tenant with many vendor-categorised names still sees its top name-only rows. total_candidates and tier_candidates show how many were cut. Lower it for a daily review, raise it for a one-off hunt.
disabled = False
iseval = 0

[hdsi_ai_unknown_high_volume_external_api_discovery_customizations]
definition = search *
description = v1.1 Tenant hook on the per-service rows BEFORE ranking and the ..._max_results cap, so rows it removes free cap slots for others (fields: review_tier, service, hostnames, hostname_count, name_type, signal, reason, vendor_category, lookup_status, provider_hint, event_count, src_count, user_count). E.g. search review_tier>1 to review only name-based tiers, or search NOT service IN ("example.com"). Ships as search *.
disabled = False
iseval = 0

version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Prompt Injection Indicators In Web Uploads
description: "Detects prompt-injection and jailbreak phrasing sent to AI services in web URL query strings, the channel used by one-click AI prompt links (chatgpt.com/?q=, copilot.microsoft.com/?q=, perplexity.ai/search?q=, claude.ai/new?q=). Reads CIM Web URLs for a fixed list of 38 AI chat and app-builder hosts (exact host match in a package macro; the provider is resolved through the common ai_provider_domains lookup), URL-decodes the query string and matches the shared ai_prompt_injection_patterns library plus three package markers (instruction-override variants, markdown-image exfiltration, concealment from the user). Topic keywords that are common in ordinary search queries (jailbreak, developer mode, god/admin mode, bypass content filter) count only alongside a corroborating marker in the same URL; ordinary prompt wording (from now on you will, respond to every prompt with) never counts on its own, and a short definitional question about an injection term (what is a system prompt override) is dropped. The query string is URL-decoded up to twice. Needs a proxy or secure web gateway that logs full URLs with query strings for AI hosts (TLS inspection); POST bodies are not visible in CIM. Emits risk on the user and internal source host only (no notable)."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_prompt_injection_patterns_enabled
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - web
  - proxy
data_prereqs:
  datamodels:
    op: AND
    items:
    - Web
  searches:
    op: AND
    items:
    - '| tstats summariesonly=true allow_old_summaries=true count from datamodel=Web where Web.url="*?*" (Web.url_domain IN ("chatgpt.com","www.chatgpt.com","chat.openai.com","claude.ai","gemini.google.com","aistudio.google.com","notebooklm.google.com","copilot.microsoft.com","copilot.com","www.copilot.com","copilot.cloud.microsoft","perplexity.ai","www.perplexity.ai","chat.deepseek.com","chat.mistral.ai","grok.com","grok.x.com","meta.ai","www.meta.ai","kimi.com","www.kimi.com","chat.qwen.ai","chat.z.ai","chatglm.cn","poe.com","you.com","phind.com","www.phind.com","character.ai","lmarena.ai","manus.im","doubao.com","www.doubao.com","v0.app","v0.dev","bolt.new","lovable.dev","gamma.app") OR Web.site IN ("chatgpt.com","www.chatgpt.com","chat.openai.com","claude.ai","gemini.google.com","aistudio.google.com","notebooklm.google.com","copilot.microsoft.com","copilot.com","www.copilot.com","copilot.cloud.microsoft","perplexity.ai","www.perplexity.ai","chat.deepseek.com","chat.mistral.ai","grok.com","grok.x.com","meta.ai","www.meta.ai","kimi.com","www.kimi.com","chat.qwen.ai","chat.z.ai","chatglm.cn","poe.com","you.com","phind.com","www.phind.com","character.ai","lmarena.ai","manus.im","doubao.com","www.doubao.com","v0.app","v0.dev","bolt.new","lovable.dev","gamma.app")) | where count > 0'
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

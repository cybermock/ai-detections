description = v1.1.0 Detects prompt-injection and jailbreak phrasing sent to AI services in web URL query strings (one-click prompt links such as chatgpt.com/?q=, copilot.microsoft.com/?q=, perplexity.ai/search?q=). Reads CIM Web URLs for a fixed list of 38 AI chat and app-builder hosts (exact host match, provider resolved through ai_provider_domains), URL-decodes the query string and matches the shared ai_prompt_injection_patterns library plus package markers; topic keywords common in ordinary searches (jailbreak, developer mode, god/admin mode) count only with a corroborating marker, ordinary prompt wording (from now on you will, respond to every prompt with) never counts alone, and short "what is ..." questions about an injection term are dropped. Risk on the user and internal source host, no notable.
disabled = 0

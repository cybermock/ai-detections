search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) as firstTime max(_time) as lastTime from datamodel=Web where Web.url="*?*" `hdsi_ai_prompt_injection_indicators_in_web_uploads_prompt_hosts` `hdsi_ai_prompt_injection_indicators_in_web_uploads_filter` by Web.user Web.src Web.url_domain Web.site Web.url Web.action sourcetype \
	| rename Web.* as * \
	| eval query_text=urldecode(replace(replace(url,"^[^?]*\?",""),"\+"," ")), query_text=if(match(query_text,"%[0-9A-Fa-f]{2}"), urldecode(replace(query_text,"\+"," ")), query_text), query_text=lower(replace(query_text,"\s+"," ")) \
	| eval ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))), ai_input_type="host" \
	| `ai_domains_filter` \
	| append [| `ai_prompt_injection_patterns_enabled` | eval zz_pattern_row=1] \
	| eventstats values(eval(if(zz_pattern_row=1, pattern_id."#~#".severity."#~#".pattern, null()))) as pattern_bundle \
	| where isnull(zz_pattern_row) \
	| fields - pattern_id pattern severity zz_pattern_row \
	| eval pattern_bundle=mvappend(pattern_bundle, `hdsi_ai_prompt_injection_indicators_in_web_uploads_extra_patterns`) \
	| eval pattern_hits=mvmap(pattern_bundle, if(match(query_text, replace(pattern_bundle, "^[^#]+#~#[^#]+#~#", "")), replace(pattern_bundle, "#~#[^#]*$", ""), null())) \
	| where isnotnull(pattern_hits) \
	| eval strong_hits=mvfilter(NOT match(pattern_hits, `hdsi_ai_prompt_injection_indicators_in_web_uploads_weak_patterns`) AND NOT match(pattern_hits, `hdsi_ai_prompt_injection_indicators_in_web_uploads_pattern_exclusions`)), weak_hits=mvfilter(match(pattern_hits, `hdsi_ai_prompt_injection_indicators_in_web_uploads_weak_patterns`)), frame_hits=mvfilter(match(pattern_hits, `hdsi_ai_prompt_injection_indicators_in_web_uploads_pattern_exclusions`) AND NOT match(pattern_hits, `hdsi_ai_prompt_injection_indicators_in_web_uploads_weak_patterns`)) \
	| where isnotnull(strong_hits) OR (isnotnull(weak_hits) AND isnotnull(frame_hits)) \
	| eval counted_hits=mvappend(strong_hits, weak_hits) \
	| eval prompt_raw=replace(lower(url), "^[^?]*\?", ""), prompt_raw=if(match(prompt_raw, "(^|&)(q|query|prompt|text|message|input|search)="), replace(prompt_raw, "^(?:[^&]*&)*?(?:q|query|prompt|text|message|input|search)=([^&]*).*$", "\1"), null()), prompt_text=urldecode(replace(prompt_raw, "\+", " ")), prompt_text=if(match(prompt_text, "%[0-9A-Fa-f]{2}"), urldecode(replace(prompt_text, "\+", " ")), prompt_text), prompt_text=coalesce(trim(lower(replace(prompt_text, "\s+", " "))), "") \
	| where NOT `hdsi_ai_prompt_injection_indicators_in_web_uploads_question_guard` \
	| eval user=if(user="unknown" OR match(lower(user),"^(|-|n/a|null|none|system|local service|network service)$") OR match(user,"\$$"), null(), user), src=if(src="unknown" OR NOT `hdsi_ai_prompt_injection_indicators_in_web_uploads_system_src(src)`, null(), src) \
	| where isnotnull(user) OR isnotnull(src) \
	| eval pattern_ids=mvmap(pattern_hits, replace(pattern_hits, "#~#.*$", "")), counted_ids=mvmap(counted_hits, replace(counted_hits, "#~#.*$", "")), hit_sev=lower(mvjoin(counted_hits, ",")), sev_rank=case(match(hit_sev, "#~#critical"), 3, match(hit_sev, "#~#high"), 2, true(), 1), not_blocked=if(match(lower(action), "^(block|blocked|deny|denied|drop|dropped)$"), 0, 1), severity_weight=coalesce(tonumber(severity_weight), 1.0), url_sample=substr(url, 1, 200) \
	| fillnull value="" user src \
	| stats sum(count) as request_count dc(url) as url_count values(url_sample) as url_sample values(provider) as provider values(ai_domain) as ai_domains values(pattern_ids) as patterns_matched values(counted_ids) as counted_patterns max(sev_rank) as sev_rank values(action) as web_action max(not_blocked) as not_blocked max(severity_weight) as severity_weight values(sourcetype) as orig_sourcetype min(firstTime) as firstTime max(lastTime) as lastTime by user src \
	| eval user=nullif(user, ""), src=nullif(src, ""), user_display=coalesce(user, "no attributed user"), src_display=coalesce(src, "no attributed host") \
	| eval pattern_severity=case(sev_rank=3, "critical", sev_rank=2, "high", true(), "medium"), web_outcome=if(not_blocked=1, "allowed", "blocked"), blocked_factor=if(not_blocked=1, 1, `hdsi_ai_prompt_injection_indicators_in_web_uploads_blocked_factor`), src_only_factor=if(isnull(user), `hdsi_ai_prompt_injection_indicators_in_web_uploads_src_only_factor`, 1) \
	| where blocked_factor>0 \
	| eval provider=mvjoin(provider, ", "), ai_domains=mvjoin(mvindex(ai_domains, 0, 4), ", "), patterns_matched=mvjoin(patterns_matched, ", "), counted_patterns=mvjoin(counted_patterns, ", "), web_action=mvjoin(web_action, ", "), orig_sourcetype=mvjoin(orig_sourcetype, ", "), url_sample=mvindex(url_sample, 0, 2) \
	| `ai_risk_multiplier` \
	| eval risk_score=min(70, max(10, round(case(sev_rank=3, 50, sev_rank=2, 40, true(), 25) * coalesce(risk_multiplier, 1) * blocked_factor * src_only_factor))) \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="prompt_injection", detection_id="hdsi_ai_prompt_injection_indicators_in_web_uploads", mitre_attack=mvappend("T1204", "T1204.001"), ai_kill_chain_phase="execution" \
	| fields - sev_rank not_blocked \
	| `hdsi_ai_prompt_injection_indicators_in_web_uploads_customizations` \
	| `hdsi_ai_prompt_injection_indicators_in_web_uploads_risk_score`

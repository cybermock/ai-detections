version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Copy-Paste Correlation To AI Service
description: "Detects a user pasting or dragging content into an AI service page 3 or more times in one hour (default), from enterprise-browser paste telemetry (Island audit events: the paste destination plus the tab or desktop app the content was copied from) or from CIM DLP clipboard incidents that record the destination. Scores higher for bulk pasting and for content copied from business applications or from outside the browser. Risk on user and, when known, the device. No notable. Ad hoc: needs Island browser audit logs or an endpoint/browser DLP product that writes paste events with the destination site to the CIM DLP model."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - data_exfiltration
  - web
data_prereqs:
  searches:
    op: OR
    items:
    - '| tstats count where index=* sourcetype="island-audits" | where count > 0'
    - '| tstats summariesonly=true allow_old_summaries=true count from datamodel=DLP.DLP_Incidents where DLP_Incidents.action IN ("*paste*","*clipboard*") OR DLP_Incidents.signature IN ("*paste*","*clipboard*") | where count > 0'
deployment_type: adhoc
prereq_packages:
  - hdsi_ai_rba_common

[hdsi_ai_copy_paste_correlation_to_ai_service_paste_events]
definition = (index=* sourcetype="island-audits" ("Paste" OR "Drop"))
description = v1.1 Base search for browser content-transfer telemetry: Island Enterprise Browser (or Island browser extension) audit events containing the terms Paste or Drop (the event type itself is checked by the normalise macro, so no search-time field filter runs here); url is the page the content was pasted into. Narrow index=* to the Island index for speed. To use another enterprise browser or browser-DLP product, replace this macro and hdsi_ai_copy_paste_correlation_to_ai_service_normalise together so they emit the same normalised fields.
disabled = False
iseval = 0

[hdsi_ai_copy_paste_correlation_to_ai_service_filter]
definition = ()
description = v1.1 Tenant exclusion hook, inline in the browser base search before any processing. Use raw Island field names, e.g. NOT user IN ("svc_*") or NOT rule_name="Kiosk*". Ships empty.
disabled = False
iseval = 0

[hdsi_ai_copy_paste_correlation_to_ai_service_normalise]
definition = where in(type,"Paste","Drop") | eval paste_type=lower(type), user=coalesce(nullif(mvindex(user,0),""),nullif(mvindex(email,0),"")), src=coalesce(nullif(src_nt_host,""),nullif(machine_name,"")), paste_url=coalesce(nullif(url,""),nullif(top_level_url,"")), copy_source_url=nullif('details.clipboard_details.clipboard_source_url',""), copy_external=if(match(lower(coalesce(verdict_reason,reason,"")),"external source"),1,0), paste_element='details.clipboard_details.browser_element_type', paste_verdict=coalesce(verdict,rule_action,action), paste_product="Island Enterprise Browser", count=1
description = v1.1 Keeps Island events of type Paste or Drop and maps Island audit fields to the normalised fields the rule uses: user (Island user, else email), src (device hostname only; the Island IP fields are home-LAN or public egress addresses and are never used as a risk object), paste_url (page pasted into), copy_source_url (tab the content was copied from, when Island records it), copy_external (1 when Island says the content came from outside the browser, e.g. a desktop app), paste_element (Address Bar / Find Bar pastes are dropped), paste_verdict, paste_product, count.
disabled = False
iseval = 0

[hdsi_ai_copy_paste_correlation_to_ai_service_dlp_paste_events]
definition = (DLP_Incidents.action IN ("*paste*","*clipboard*") OR DLP_Incidents.signature IN ("*paste*","*clipboard*") OR DLP_Incidents.dlp_type IN ("*paste*","*clipboard*") OR DLP_Incidents.object_category IN ("*paste*","*clipboard*"))
description = v1.1 Selects CIM DLP incidents that describe a clipboard paste (endpoint or browser DLP "paste to browser" style events) in the DLP.DLP_Incidents tstats where clause. The rule then keeps only rows whose dest (or object_path) resolves to an AI provider, so the DLP product must record the destination site. Copy-to-USB, network-share and print events are deliberately not matched (the old rule matched any "copy").
disabled = False
iseval = 0

[hdsi_ai_copy_paste_correlation_to_ai_service_dlp_filter]
definition = ()
description = v1.1 Tenant exclusion hook, inline in the DLP.DLP_Incidents tstats where clause. Use DLP field names, e.g. NOT DLP_Incidents.user IN ("svc_*"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_copy_paste_correlation_to_ai_service_min_pastes]
definition = 3
description = v1.1 Minimum paste/drop events into one AI provider by one user (or device) in the one-hour window. Validation tenant (7 days) median was 1 per user-hour and p90 was 5, so 3 keeps repeated pasting and drops one-off prompts. Derive a tenant value with the profile search in the README.
disabled = False
iseval = 0

[hdsi_ai_copy_paste_correlation_to_ai_service_sensitive_copy_sources]
definition = "(^|\\.)(sharepoint\\.com|onedrive\\.live\\.com|office\\.com|office365\\.com|outlook\\.office\\.com|outlook\\.office365\\.com|cloud\\.microsoft|docs\\.google\\.com|drive\\.google\\.com|sheets\\.google\\.com|salesforce\\.com|force\\.com|servicenow\\.com|service-now\\.com|atlassian\\.net|github\\.com|gitlab\\.com|box\\.com|dropbox\\.com|workday\\.com|slack\\.com|zendesk\\.com|hubspot\\.com)$"
description = v1.1 Regex (quoted string) of copy-source domains treated as business applications. A paste whose recorded copy source matches adds 10 to the base score. Add the tenant's own SaaS and internal application domains (EHR, ERP, CRM, wiki). Personal webmail is deliberately absent.
disabled = False
iseval = 0

[hdsi_ai_copy_paste_correlation_to_ai_service_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation and threshold (fields: user, src, user_display, src_display, provider, ai_domain_list, paste_count, blocked_count, copy_source_list, copy_source_class_list, paste_verdict_list, paste_product, min_pastes, base_score, severity_weight, risk_multiplier, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_copy_paste_correlation_to_ai_service_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust risk_score (max 100) per tenant; it applies to every risk object in the row (user and src). Ships as search *.
disabled = False
iseval = 0

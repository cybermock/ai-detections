[Endpoint - HDSI AI Copy-Paste Correlation To AI Service - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Copy-Paste Correlation To AI Service
action.correlationsearch.annotations = {"mitre_attack": ["T1567", "T1115"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$risk_object$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View browser paste events into AI services by $user_display$","search":"`hdsi_ai_copy_paste_correlation_to_ai_service_paste_events` user=\"$user$\" | `hdsi_ai_copy_paste_correlation_to_ai_service_normalise` | eval ai_domain=paste_url, ai_input_type=\"host\" | `ai_domains_filter` | table _time, user, src, paste_type, provider, ai_domain, copy_source_url, copy_external, paste_element, paste_verdict, paste_product | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View DLP clipboard incidents for $user_display$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count min(_time) as firstTime max(_time) as lastTime from datamodel=DLP.DLP_Incidents where `hdsi_ai_copy_paste_correlation_to_ai_service_dlp_paste_events` DLP_Incidents.user=\"$user$\" by DLP_Incidents.user DLP_Incidents.src DLP_Incidents.dest DLP_Incidents.object_path DLP_Incidents.action DLP_Incidents.signature DLP_Incidents.vendor_product | rename DLP_Incidents.* as * | convert ctime(firstTime) ctime(lastTime) | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = $user_display$ on $src_display$ pasted content into $provider$ ($ai_domain_list$) $paste_count$ times in one hour via $paste_product$. Copied from: $copy_source_list$ ($copy_source_class_list$). Verdict: $paste_verdict_list$.
action.notable.param.rule_title = HDSI AI Copy-Paste Correlation To AI Service ($user_display$ to $provider$)
action.notable.param.security_domain = endpoint
action.notable.param.severity = low
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":20},{"risk_object_field":"src","risk_object_type":"system","risk_score":10}]
action.risk.param._risk_message = $user_display$ on $src_display$ pasted content into $provider$ ($ai_domain_list$) $paste_count$ times in one hour via $paste_product$. Copied from: $copy_source_list$ ($copy_source_class_list$). Verdict: $paste_verdict_list$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user,src
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 22 * * * *
description = v1.1.0 Detects a user pasting (or dragging) content into an AI service page, from enterprise-browser paste telemetry (Island audit events) or CIM DLP clipboard incidents that record the destination. Fires at 3 or more pastes into one provider in an hour; scores higher for bulk pasting and for content copied from business applications or from outside the browser. Risk on user and, when known, the device. No notable.
disabled = 0
dispatch.earliest_time = -80m@m
dispatch.latest_time = -20m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = search `hdsi_ai_copy_paste_correlation_to_ai_service_paste_events` `hdsi_ai_copy_paste_correlation_to_ai_service_filter` \
	| `hdsi_ai_copy_paste_correlation_to_ai_service_normalise` \
	| fields _time count user src paste_type paste_url copy_source_url copy_external paste_element paste_verdict paste_product \
	| append [| tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) as firstTime max(_time) as lastTime values(DLP_Incidents.vendor_product) as paste_product from datamodel=DLP.DLP_Incidents where `hdsi_ai_copy_paste_correlation_to_ai_service_dlp_paste_events` `hdsi_ai_copy_paste_correlation_to_ai_service_dlp_filter` by DLP_Incidents.user DLP_Incidents.src DLP_Incidents.dest DLP_Incidents.object_path DLP_Incidents.action \
	| rename DLP_Incidents.* as * \
	| eval _time=firstTime, paste_type="dlp_paste", paste_url=if(dest!="unknown",dest,object_path), paste_verdict=action, copy_external=0 \
	| fields _time lastTime count user src paste_type paste_url copy_external paste_verdict paste_product] \
	| eval ai_domain=paste_url, ai_input_type="host" \
	| `ai_domains_filter` \
	| eval user=if(isnull(user) OR match(lower(user),"^(unknown|-|n/a|null|none|)$"),null(),user), src=if(isnull(src) OR match(lower(src),"^(unknown|-|n/a|null|none|)$") OR match(src,"^\\d{1,3}(\\.\\d{1,3}){3}$"),null(),src) \
	| where isnotnull(user) OR isnotnull(src) \
	| eval copy_source_domain=replace(lower(replace(replace(copy_source_url,"^[a-z][a-z0-9+.-]*://",""),"[/:?#].*$","")),"^www\\d*\\.",""), _cs_d1=if(match(copy_source_domain,"^[^.]+\\.[^.]+\\.[^.]+"),replace(copy_source_domain,"^[^.]+\\.",""),null()), _cs_d3=if(match(copy_source_domain,"^[^.]+\\.[^.]+\\.[^.]+"),replace(copy_source_domain,"^.*?([^.]+\\.[^.]+)$","\\1"),null()) \
	| lookup ai_provider_domains domain as copy_source_domain OUTPUT provider as _cs_p0 \
	| lookup ai_provider_domains domain as _cs_d1 OUTPUT provider as _cs_p1 match_subdomains as _cs_s1 \
	| lookup ai_provider_domains domain as _cs_d3 OUTPUT provider as _cs_p3 match_subdomains as _cs_s3 \
	| eval copy_source_provider=case(isnotnull(_cs_p0),mvindex(_cs_p0,0), tonumber(mvindex(_cs_s1,0))=1,mvindex(_cs_p1,0), tonumber(mvindex(_cs_s3,0))=1,mvindex(_cs_p3,0)), same_site=if(isnotnull(copy_source_domain) AND (copy_source_domain=ai_domain OR like(copy_source_domain,"%.".ai_domain) OR copy_source_provider=provider),1,0) \
	| fields - _cs_* \
	| where same_site=0 AND NOT match(lower(coalesce(paste_element,"")),"address bar|find bar") \
	| eval copy_source_class=case(isnotnull(copy_source_domain) AND match(copy_source_domain,`hdsi_ai_copy_paste_correlation_to_ai_service_sensitive_copy_sources`),"business_app", isnotnull(copy_source_domain),"other_site", copy_external=1,"outside_browser", true(),"not_recorded"), blocked=if(isnotnull(paste_verdict) AND mvcount(paste_verdict)=mvcount(mvfilter(match(lower(paste_verdict),"block|deny|prevent"))),count,0), lastTime=coalesce(lastTime,_time) \
	| fillnull value="-" user src \
	| stats sum(count) as paste_count sum(blocked) as blocked_count values(ai_domain) as ai_domains values(copy_source_domain) as copy_sources values(copy_source_class) as copy_source_classes values(paste_type) as paste_types values(paste_verdict) as paste_verdicts values(paste_product) as paste_products max(severity_weight) as severity_weight values(usage_type) as usage_type min(_time) as firstTime max(lastTime) as lastTime by user src provider \
	| eval user=nullif(user,"-"), src=nullif(src,"-"), min_pastes=`hdsi_ai_copy_paste_correlation_to_ai_service_min_pastes` \
	| where paste_count>=min_pastes \
	| lookup identity_lookup_expanded identity as user OUTPUT bunit as _user_bunit \
	| eval bunit=lower(nullif(mvindex(_user_bunit,0),"")) \
	| fields - _user_bunit \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| eval base_score=if(paste_count>=3*min_pastes,30,20)+if(isnotnull(mvfind(copy_source_classes,"^(business_app|outside_browser)$")),10,0) \
	| `ai_risk_multiplier` \
	| eval risk_score=round(min(60,max(5,base_score*coalesce(tonumber(severity_weight),1)*coalesce(risk_multiplier,1)*if(blocked_count>=paste_count,0.5,1))),0) \
	| eval user_display=coalesce(user,"unattributed user"), src_display=coalesce(src,"an unidentified device"), ai_domain_list=mvjoin(mvindex(ai_domains,0,4),", "), copy_source_list=coalesce(mvjoin(mvindex(copy_sources,0,4),", "),"no browser tab recorded"), copy_source_class_list=mvjoin(copy_source_classes,", "), paste_verdict_list=mvjoin(paste_verdicts,", "), paste_product=mvjoin(paste_products,", ") \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="paste_to_ai_service", detection_id="hdsi_ai_copy_paste_correlation_to_ai_service", mitre_attack=split("T1567,T1115",","), ai_kill_chain_phase="collection" \
	| fields - ai_domains copy_sources copy_source_classes paste_types paste_verdicts paste_products usage_type enabled \
	| `hdsi_ai_copy_paste_correlation_to_ai_service_customizations` \
	| `hdsi_ai_copy_paste_correlation_to_ai_service_risk_score`

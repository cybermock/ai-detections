[hdsi_rba_ai_privilege_escalation_correlation_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the index=risk base search before any aggregation. Use risk index field names, e.g. NOT source IN ("<routine PIM activation rule>") or NOT risk_object IN ("<break-glass account>"). Ships empty.
disabled = False
iseval = 0

[hdsi_rba_ai_privilege_escalation_correlation_object_types]
definition = "user"
description = v1.1 risk_object_type values that are correlated (comma-separated quoted list used in IN ()). Ships as "user" because both the privilege-change rules and the AI-RBA rules reliably score the account. Add "system" only after confirming that the host names written by the privilege rules and by the AI endpoint rules share one format.
disabled = False
iseval = 0

[hdsi_rba_ai_privilege_escalation_correlation_nonhuman_regex]
definition = "^nt (service|authority)|^serviceprincipal_|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$|[$]$"
description = v1.1 Regex on the lower-cased risk_object for non-human objects that are never correlated: Windows service and NT AUTHORITY accounts, Entra service principals, bare GUIDs and machine accounts ending in $. Live data showed privilege-change rules scoring all of these as users. Extend with tenant service-account naming (e.g. ^svc[_-]).
disabled = False
iseval = 0

[hdsi_rba_ai_privilege_escalation_correlation_priv_techniques]
definition = "^(T1068|T1134|T1484|T1548|T1611)([.][0-9]+)?$|^T1098[.]00[237]$"
description = v1.1 Regex of ATT&CK technique IDs that count as a privilege change when found in a non-AI risk event's annotations.mitre_attack or mitre_attack field: T1068, T1134.x, T1484.x, T1548.x, T1611 and the role/group grants T1098.002, T1098.003 and T1098.007. T1078 (Valid Accounts), bare T1098 and the TA0004 tactic are deliberately excluded: in live data they tag tens of thousands of routine login and MFA events per week.
disabled = False
iseval = 0

[hdsi_rba_ai_privilege_escalation_correlation_priv_rule_regex]
definition = "(?i)privilege|escalat|elevat|admin(istrator)?s? (group|role)|role (assign|grant)|added to .*group|group (addition|membership|modification)|sudo|(^|[^a-z])uac([^a-z]|$)|runas"
description = v1.1 Regex on the risk event source (correlation search name) for privilege-change rules that carry no usable MITRE annotation, e.g. "Privileged AD Group Modifications", "User Added to Admin Group or Role", "High Privilege Role Granted". Matched only for non-AI rules.
disabled = False
iseval = 0

[hdsi_rba_ai_privilege_escalation_correlation_ai_phases]
definition = "execution","staging","collection","exfiltration","lateral_movement"
description = v1.1 ai_kill_chain_phase values (written by every AI-RBA detection) that count as AI activity after a privilege change. recon (DNS lookups, first web visits, adoption counts) and initial_access (phishing recipient, unmanaged device, plugin install) are excluded by default. Some collection/exfiltration rules still score general AI use (after-hours use, usage anomalies); see ai_excluded_detections.
disabled = False
iseval = 0

[hdsi_rba_ai_privilege_escalation_correlation_ai_excluded_detections]
definition = "hdsi_ai_privileged_account_service_usage"
description = v1.1 detection_id values never counted as AI activity (quoted list for in()). Ships with hdsi_ai_privileged_account_service_usage: it scores any AI-service visit by an account because that account is privileged, so after a role grant it would turn routine AI use by a new admin into a notable on its own. Add hdsi_ai_after_hours_service_usage or the usage-anomaly rules here if they are noisy for admins.
disabled = False
iseval = 0

[hdsi_rba_ai_privilege_escalation_correlation_min_ai_risk]
definition = 20
description = v1.1 Minimum summed risk_score of the qualifying AI-RBA events after the first privilege change. 20 stops a single routine low-score AI event (e.g. a 10-point agent action) from producing a notable on its own.
disabled = False
iseval = 0

[hdsi_rba_ai_privilege_escalation_correlation_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation and threshold tests (fields: risk_entity, risk_object, user, priv_detections, ai_detections, ai_detection_ids, ai_phases, priv_risk, ai_risk, total_risk, gap_minutes, time_basis). Ships as search *.
disabled = False
iseval = 0

[Threat - HDSI RBA AI Privilege Escalation Correlation - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI RBA AI Privilege Escalation Correlation
action.correlationsearch.annotations = {"mitre_attack": ["T1098", "T1134", "T1548", "T1567"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 1
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View all risk events for $risk_entity$","search":"| from datamodel:\"Risk.All_Risk\" | eval risk_entity=replace(mvindex(split(lower(trim(risk_object)),urldecode(\"%5C\")),-1),\"@.*\",\"\") | search risk_entity=\"$risk_entity$\" | table _time, source, risk_object, risk_object_type, risk_score, ai_kill_chain_phase, detection_id, annotations.mitre_attack, risk_message | sort _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"Summarize risk for $risk_entity$ by rule","search":"| from datamodel:\"Risk.All_Risk\" | eval risk_entity=replace(mvindex(split(lower(trim(risk_object)),urldecode(\"%5C\")),-1),\"@.*\",\"\") | search risk_entity=\"$risk_entity$\" | stats count as risk_events sum(risk_score) as total_risk min(_time) as firstTime max(_time) as lastTime values(ai_kill_chain_phase) as ai_kill_chain_phase values(annotations.mitre_attack) as mitre_attack by source | convert ctime(firstTime) ctime(lastTime) | sort firstTime","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = $risk_object$ received $priv_signals$ privilege-change risk event(s) ($priv_detection_list$; techniques: $priv_technique_list$) and then $ai_signals$ AI-RBA risk event(s) in phase(s) $ai_phase_list$ ($ai_detection_list$), the first $gap_minutes$ minutes after the first privilege change. Privilege risk $priv_risk$, AI risk $ai_risk$. Ordering basis: $time_basis$.
action.notable.param.rule_title = Privilege Escalation Followed By AI Activity ($risk_object$)
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 0
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":50}]
action.risk.param._risk_message = $risk_object$ had $priv_signals$ privilege-change risk event(s) followed by $ai_signals$ AI-RBA risk event(s) in phase(s) $ai_phase_list$ within 24 hours.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = risk_entity
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 20 * * * *
description = v1.1.0 Notable when an account receives risk from a privilege-change rule (role or group grant, elevation, token manipulation, exploitation for privilege escalation; matched by ATT&CK technique or rule name) and, in the same 24-hour risk window, AI-RBA risk in the execution, staging, collection, exfiltration or lateral-movement phase whose activity time is at or after the privilege change. Ordering uses the rules' firstTime/lastTime and the risk events' search window and fails closed when the AI activity time is unknown. Reads index=risk only; AI events are identified by detection_id and ai_kill_chain_phase. Notable only, no risk.
disabled = 0
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = index=risk risk_object_type IN (`hdsi_rba_ai_privilege_escalation_correlation_object_types`) `hdsi_rba_ai_privilege_escalation_correlation_filter` \
	| eval risk_entity=replace(mvindex(split(lower(trim(mvindex(risk_object,0))),urldecode("%5C")),-1),"@.*",""), risk_entity_type=lower(mvindex(risk_object_type,0)), rule_name=coalesce(mvindex(source,0),mvindex(search_name,0)) \
	| where isnotnull(risk_entity) AND risk_entity!="" AND NOT in(risk_entity,"unknown","-","n/a","na","null","none","system","local system","nt authority") AND NOT match(lower(mvindex(risk_object,0)),`hdsi_rba_ai_privilege_escalation_correlation_nonhuman_regex`) \
	| eval detection_id=mvindex(detection_id,0), ai_kill_chain_phase=lower(mvindex(ai_kill_chain_phase,0)), is_rba_ai=if(match(rule_name,"HDSI RBA AI "),1,0), is_ai_rule=if(is_rba_ai=0 AND (match(detection_id,"^hdsi_ai_") OR match(rule_name," - HDSI AI .+ - Rule")),1,0) \
	| eval mitre_list=split(replace(upper(mvjoin(mvappend('annotations.mitre_attack',mitre_attack),",")),"[^A-Z0-9.,]",""),","), priv_tech=mvfilter(match(mitre_list,`hdsi_rba_ai_privilege_escalation_correlation_priv_techniques`)) \
	| eval priv_signal=if(is_ai_rule=0 AND is_rba_ai=0 AND (mvcount(priv_tech)>0 OR match(rule_name,`hdsi_rba_ai_privilege_escalation_correlation_priv_rule_regex`)),1,0), ai_signal=if(is_ai_rule=1 AND in(ai_kill_chain_phase,`hdsi_rba_ai_privilege_escalation_correlation_ai_phases`) AND NOT in(coalesce(detection_id,"-"),`hdsi_rba_ai_privilege_escalation_correlation_ai_excluded_detections`),1,0) \
	| where priv_signal=1 OR ai_signal=1 \
	| eval ev_first=mvindex(firstTime,0), ev_last=mvindex(lastTime,0), win_min=tonumber(mvindex(info_min_time,0)), win_max=tonumber(mvindex(info_max_time,0)), result_time=if(isnotnull(win_max) AND _time<win_max,1,0) \
	| eval first_exact=coalesce(tonumber(ev_first),strptime(ev_first,"%m/%d/%Y %H:%M:%S"),strptime(ev_first,"%Y-%m-%d %H:%M:%S"),strptime(ev_first,"%Y-%m-%dT%H:%M:%S")), last_exact=coalesce(tonumber(ev_last),strptime(ev_last,"%m/%d/%Y %H:%M:%S"),strptime(ev_last,"%Y-%m-%d %H:%M:%S"),strptime(ev_last,"%Y-%m-%dT%H:%M:%S")), last_day=coalesce(strptime(ev_last,"%Y-%m-%d"),strptime(ev_last,"%m/%d/%Y")) \
	| eval priv_time=if(priv_signal=1,round(case(first_exact>0 AND first_exact<=_time,first_exact,result_time=1,_time,isnotnull(win_max),min(_time,win_max),true(),_time),0),null()), priv_time_basis=if(priv_signal=1,case(first_exact>0 AND first_exact<=_time,"firstTime",result_time=1,"result _time",isnotnull(win_max),"search window end",true(),"risk _time"),null()) \
	| eval ai_time=if(ai_signal=1,round(case(last_exact>0,last_exact,result_time=1,_time,last_day>0,last_day,win_min>0,win_min),0),null()), ai_time_basis=if(ai_signal=1,case(last_exact>0,"lastTime",result_time=1,"result _time",last_day>0,"lastTime day start",win_min>0,"search window start"),null()) \
	| eventstats min(priv_time) as first_priv_time by risk_entity risk_entity_type \
	| where isnotnull(first_priv_time) AND (priv_signal=1 OR ai_time>=first_priv_time) \
	| eval priv_score=if(priv_signal=1,tonumber(risk_score),null()), ai_score=if(ai_signal=1,tonumber(risk_score),null()), priv_rule=if(priv_signal=1,rule_name,null()), ai_rule=if(ai_signal=1,rule_name,null()), ai_phase=if(ai_signal=1,ai_kill_chain_phase,null()), ai_detection_id=if(ai_signal=1,detection_id,null()) \
	| stats sum(priv_signal) as priv_signals sum(ai_signal) as ai_signals sum(priv_score) as priv_risk sum(ai_score) as ai_risk min(first_priv_time) as first_priv_time max(priv_time) as last_priv_time min(ai_time) as first_ai_time max(ai_time) as last_ai_time values(priv_rule) as priv_detections values(ai_rule) as ai_detections values(ai_detection_id) as ai_detection_ids values(ai_phase) as ai_phases values(priv_tech) as priv_techniques values(priv_time_basis) as priv_time_basis values(ai_time_basis) as ai_time_basis values(risk_object) as risk_objects by risk_entity risk_entity_type \
	| where priv_signals>=1 AND ai_signals>=1 AND ai_risk>=`hdsi_rba_ai_privilege_escalation_correlation_min_ai_risk` \
	| eval priv_risk=round(priv_risk,0), ai_risk=round(ai_risk,0), total_risk=priv_risk+ai_risk, gap_minutes=round((first_ai_time-first_priv_time)/60,0), risk_object=mvindex(risk_objects,0), risk_object_type=risk_entity_type, user=if(risk_entity_type="user",risk_object,null()), dest=if(risk_entity_type="system",risk_object,null()) \
	| eval priv_detection_list=mvjoin(priv_detections,"; "), ai_detection_list=mvjoin(ai_detections,"; "), ai_phase_list=mvjoin(ai_phases,", "), priv_technique_list=coalesce(mvjoin(priv_techniques,", "),"none (matched by rule name)"), time_basis="privilege: ".mvjoin(priv_time_basis,", ")."; AI: ".mvjoin(ai_time_basis,", "), mitre_attack=split("T1098,T1134,T1548,T1567",","), firstTime=strftime(first_priv_time,"%Y-%m-%d %H:%M:%S %Z"), lastTime=strftime(last_ai_time,"%Y-%m-%d %H:%M:%S %Z") \
	| fields risk_entity risk_object risk_object_type risk_objects user dest priv_signals ai_signals priv_risk ai_risk total_risk gap_minutes first_priv_time last_priv_time first_ai_time last_ai_time firstTime lastTime time_basis priv_detections priv_detection_list priv_techniques priv_technique_list ai_detections ai_detection_list ai_detection_ids ai_phases ai_phase_list mitre_attack \
	| `hdsi_rba_ai_privilege_escalation_correlation_customizations`

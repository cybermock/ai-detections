action.notable.param.drilldown_searches = [{"name": "View associated risk events for $src$", "search": "| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$src$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time", "earliest_offset": "$info_min_time$", "latest_offset": "$info_max_time$"}, {"name": "View AI API, AI app and developer-tooling DNS queries from $src$", "search": "| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Resolution where DNS.src=\"$src$\" (`hdsi_ai_api_access_from_non_dev_endpoint_api_endpoints(DNS.query)` OR `hdsi_ai_api_access_from_non_dev_endpoint_app_endpoints(DNS.query)` OR `hdsi_ai_api_access_from_non_dev_endpoint_dev_endpoints(DNS.query)`) by DNS.src DNS.query | rename DNS.* as * | convert ctime(firstTime) ctime(lastTime) | sort - count", "earliest_offset": "$info_min_time$", "latest_offset": "$info_max_time$"}, {"name": "View firewall App-ID AI and developer sessions from $src$", "search": "| tstats summariesonly=t allow_old_summaries=t count sum(All_Traffic.bytes_out) as bytes_out values(All_Traffic.dest) as dest min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Traffic where All_Traffic.src=\"$src$\" (`hdsi_ai_api_access_from_non_dev_endpoint_app_ids` OR `hdsi_ai_api_access_from_non_dev_endpoint_dev_app_ids`) by All_Traffic.src All_Traffic.user All_Traffic.app All_Traffic.action | rename All_Traffic.* as * | eval mb_out=round(bytes_out/1024/1024,2), dest=mvindex(dest,0,4) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, src, user, app, action, count, mb_out, dest | sort - count", "earliest_offset": "$info_min_time$", "latest_offset": "$info_max_time$"}, {"name": "View related web activity from $src$", "search": "| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count sum(Web.bytes_out) as bytes_out values(Web.http_user_agent) as http_user_agent min(_time) as firstTime max(_time) as lastTime from datamodel=Web where Web.src=\"$src$\" (Web.url_domain=* OR Web.site=*) by Web.user Web.src Web.url_domain Web.site | rename Web.* as * | eval url_domain=coalesce(nullif(url_domain,\"unknown\"),nullif(site,\"unknown\")), mb_out=round(bytes_out/1024/1024,2) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, url_domain, count, mb_out, http_user_agent | sort - count", "earliest_offset": "$info_min_time$", "latest_offset": "$info_max_time$"}]
action.notable.param.rule_description = $provider_list$ API access from non-developer endpoint $src$ ($src_category$, $user_display$): $event_count$ $evidence_type$ events with no developer tooling and no consumer AI app on the host, e.g. $endpoint_sample$.
action.notable.param.rule_title = HDSI AI API Access From Non-Dev Endpoint ($src$)
action.notable.param.security_domain = network
action.notable.param.severity = low
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"src","risk_object_type":"system","risk_score":24},{"risk_object_field":"user","risk_object_type":"user","risk_score":24}]
action.risk.param._risk_message = $provider_list$ API access from non-developer endpoint $src$ ($src_category$, $user_display$): $event_count$ $evidence_type$ events with no developer tooling and no consumer AI app on the host, e.g. $endpoint_sample$.
action.risk.param._risk_score = 0

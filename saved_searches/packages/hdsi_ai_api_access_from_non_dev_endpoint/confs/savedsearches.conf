description = v1.1.0 Detects hosts that call AI provider APIs (OpenAI, Anthropic, Bedrock, Vertex AI, Azure OpenAI, DeepSeek and others) from DNS, firewall App-ID or proxy evidence while showing no developer tooling and not using the same provider's consumer app. Excludes DNS servers, developer and build assets, shared egress and approved endpoints. Risk only, no notable.
disabled = 0
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t prestats=t count min(_time) max(_time) from datamodel=Network_Resolution where (`hdsi_ai_api_access_from_non_dev_endpoint_api_endpoints(DNS.query)` OR `hdsi_ai_api_access_from_non_dev_endpoint_app_endpoints(DNS.query)` OR `hdsi_ai_api_access_from_non_dev_endpoint_dev_endpoints(DNS.query)`) `hdsi_ai_api_access_from_non_dev_endpoint_filter` by DNS.src DNS.query \
	| tstats summariesonly=t allow_old_summaries=t prestats=t append=t fillnull_value="unknown" count min(_time) max(_time) from datamodel=Web where (`hdsi_ai_api_access_from_non_dev_endpoint_api_endpoints(Web.url_domain)` OR `hdsi_ai_api_access_from_non_dev_endpoint_app_endpoints(Web.url_domain)` OR `hdsi_ai_api_access_from_non_dev_endpoint_dev_endpoints(Web.url_domain)` OR `hdsi_ai_api_access_from_non_dev_endpoint_api_endpoints(Web.site)` OR `hdsi_ai_api_access_from_non_dev_endpoint_app_endpoints(Web.site)` OR `hdsi_ai_api_access_from_non_dev_endpoint_dev_endpoints(Web.site)`) `hdsi_ai_api_access_from_non_dev_endpoint_web_filter` by Web.src Web.user Web.url_domain Web.site \
	| tstats summariesonly=t allow_old_summaries=t prestats=t append=t fillnull_value="unknown" count min(_time) max(_time) from datamodel=Network_Traffic where (`hdsi_ai_api_access_from_non_dev_endpoint_app_ids` OR `hdsi_ai_api_access_from_non_dev_endpoint_dev_app_ids`) `hdsi_ai_api_access_from_non_dev_endpoint_app_filter` by All_Traffic.src All_Traffic.user All_Traffic.app All_Traffic.action \
	| eval evidence_type=case(isnotnull('DNS.query'),"DNS", isnotnull('Web.src'),"Web proxy", isnotnull('All_Traffic.src'),"firewall App-ID"), src=coalesce('DNS.src','Web.src','All_Traffic.src'), user=coalesce('Web.user','All_Traffic.user',"unknown"), action=coalesce('All_Traffic.action',"unknown"), ai_domain=lower(coalesce('DNS.query',nullif('Web.url_domain',"unknown"),nullif('Web.site',"unknown"),'All_Traffic.app')) \
	| stats count min(_time) as firstTime max(_time) as lastTime by src user ai_domain action evidence_type \
	| eval app=if(evidence_type="firewall App-ID", ai_domain, null()), ai_input_type=if(evidence_type="DNS","dns","host") \
	| `hdsi_ai_api_access_from_non_dev_endpoint_app_id_map` \
	| eval dev_name=lower(replace(ai_domain,"[.]+$","")), dev_hit=if(isnotnull(app), app_dev_hit, if(`hdsi_ai_api_access_from_non_dev_endpoint_dev_endpoints(dev_name)`,1,0)) \
	| eventstats max(dev_hit) as dev_tooling values(eval(if(dev_hit=1,dev_name,null()))) as dev_tooling_seen by src \
	| `ai_domains_filter` \
	| eventstats values(eval(if(usage_type!="api",provider,null()))) as app_providers by src \
	| where usage_type="api" \
	| search NOT provider IN (`hdsi_ai_api_access_from_non_dev_endpoint_excluded_providers`) NOT ai_domain IN (`hdsi_ai_api_access_from_non_dev_endpoint_sanctioned_endpoints`) \
	| eval consumer_app_match=mvmap(app_providers, if(app_providers==provider,"y","n")), consumer_app_seen=if(isnotnull(mvfind(consumer_app_match,"^y$")),1,0), dev_tooling=coalesce(dev_tooling,0) \
	| where dev_tooling=0 AND consumer_app_seen=0 \
	| eval user=if(isnull(user) OR trim(user)="" OR in(lower(user),"unknown","-","n/a","none","null"), null(), lower(user)) \
	| where isnotnull(src) AND src!="" AND lower(src)!="unknown" \
	| lookup asset_lookup_by_str ip as src OUTPUT asset as src_asset category as src_category \
	| eval src_asset=mvindex(src_asset,0), src_category=lower(replace(mvjoin(src_category,"|"),"\\s*[\\r\\n|]+\\s*","|")), src_category=replace(src_category,"^[|]+|[|]+$",""), src_category=mvjoin(mvdedup(split(src_category,"|")),"|"), src_category=if(src_category="", null(), src_category) \
	| where NOT match(coalesce(src_category,""), `hdsi_ai_api_access_from_non_dev_endpoint_resolver_categories`) AND NOT match(coalesce(src_category,""), `hdsi_ai_api_access_from_non_dev_endpoint_dev_categories`) AND NOT (`hdsi_ai_api_access_from_non_dev_endpoint_dev_sources`) \
	| where isnotnull(src_asset) OR isnotnull(user) OR `hdsi_ai_api_access_from_non_dev_endpoint_require_known_asset`=0 \
	| lookup identity_lookup_expanded identity as user OUTPUTNEW bunit \
	| eval bunit=mvindex(bunit,0) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| eval severity_weight=coalesce(tonumber(severity_weight),1.0), allowed=if(isnull(action) OR action="unknown" OR match(lower(action),"^(allow|allowed|accept|accepted|permit|permitted|pass|success)$"),1,0) \
	| stats sum(count) as event_count values(provider) as providers values(ai_domain) as ai_endpoints values(evidence_type) as evidence_type values(user) as users dc(user) as user_count max(severity_weight) as severity_weight max(allowed) as allowed values(src_asset) as src_asset values(src_category) as src_category min(firstTime) as firstTime max(lastTime) as lastTime by src \
	| where user_count<=`hdsi_ai_api_access_from_non_dev_endpoint_max_users_per_src` \
	| eval user=if(user_count=1, users, null()), user_display=case(user_count=1, users, user_count>1, user_count." users: ".mvjoin(users,", "), true(), "no user attribution") \
	| where NOT ((`hdsi_ai_api_access_from_non_dev_endpoint_unreliable_src`) AND isnull(user)) \
	| `ai_risk_multiplier` \
	| eval base_score=if(allowed=0, 5, 20), risk_score=min(50, round(base_score*severity_weight*coalesce(risk_multiplier,1), 0)) \
	| eval provider_list=mvjoin(providers,", "), endpoint_sample=mvjoin(mvindex(ai_endpoints,0,4),", "), evidence_type=mvjoin(evidence_type," + "), src_asset=mvindex(src_asset,0), src_category=coalesce(substr(mvjoin(src_category,"|"),1,80), if(isnotnull(src_asset),"no asset category","not in asset inventory")) \
	| fields - ai_endpoints users user_count \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="api_usage_non_dev", detection_id="hdsi_ai_api_access_from_non_dev_endpoint", mitre_attack="T1588.007,T1102,T1567", ai_kill_chain_phase="execution" \
	| `hdsi_ai_api_access_from_non_dev_endpoint_customizations` \
	| `hdsi_ai_api_access_from_non_dev_endpoint_risk_score`

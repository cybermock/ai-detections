[hdsi_ai_api_access_from_non_dev_endpoint_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the DNS (Network_Resolution) branch, applied inside its tstats where clause before aggregation. Use DNS.* field names, e.g. NOT DNS.src IN ("10.0.0.53","10.0.0.54") for internal resolvers or forwarders that appear as the DNS client. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_web_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Web (proxy) branch, applied inside its tstats where clause. Use Web.* field names, e.g. NOT Web.src IN ("10.20.0.0/16"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_app_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Network_Traffic (firewall App-ID) branch, applied inside its tstats where clause. Use All_Traffic.* field names, e.g. NOT All_Traffic.src IN ("10.30.0.0/16"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_api_endpoints(1)]
args = field
definition = ($field$ IN ("api.openai.com","api.openai.com.","*.api.openai.com","*.api.openai.com.","api.anthropic.com","api.anthropic.com.","generativelanguage.googleapis.com","generativelanguage.googleapis.com.","aiplatform.googleapis.com","aiplatform.googleapis.com.","api.githubcopilot.com","api.githubcopilot.com.","copilot-proxy.githubusercontent.com","copilot-proxy.githubusercontent.com.","openai.azure.com","openai.azure.com.","*.openai.azure.com","*.openai.azure.com.","api.perplexity.ai","api.perplexity.ai.","api.deepseek.com","api.deepseek.com.","api.mistral.ai","api.mistral.ai.","api.x.ai","api.x.ai.","moonshot.cn","moonshot.cn.","*.moonshot.cn","*.moonshot.cn.","moonshot.ai","moonshot.ai.","*.moonshot.ai","*.moonshot.ai.","dashscope.aliyuncs.com","dashscope.aliyuncs.com.","dashscope-intl.aliyuncs.com","dashscope-intl.aliyuncs.com.","aip.baidubce.com","aip.baidubce.com.","bigmodel.cn","bigmodel.cn.","*.bigmodel.cn","*.bigmodel.cn.","api.lingyiwanwu.com","api.lingyiwanwu.com.","openrouter.ai","openrouter.ai.","*.openrouter.ai","*.openrouter.ai.","api.groq.com","api.groq.com.","api.together.xyz","api.together.xyz.","api.replicate.com","api.replicate.com.","replicate.delivery","replicate.delivery.","*.replicate.delivery","*.replicate.delivery.","api.cohere.ai","api.cohere.ai.","api.fireworks.ai","api.fireworks.ai.","api.cerebras.ai","api.cerebras.ai.","api.ai21.com","api.ai21.com.","api.endpoints.anyscale.com","api.endpoints.anyscale.com.","api.stability.ai","api.stability.ai.","api.cursor.sh","api.cursor.sh.","api.sourcegraph.com","api.sourcegraph.com.","api.writer.com","api.writer.com.","api.elevenlabs.io","api.elevenlabs.io.","api.play.ht","api.play.ht.","api.resemble.ai","api.resemble.ai.","api.deepgram.com","api.deepgram.com.","suno.ai","suno.ai.","*.suno.ai","*.suno.ai.","api.runwayml.com","api.runwayml.com.","studio-api.suno.ai","studio-api.suno.ai.","cloud.leonardo.ai","cloud.leonardo.ai.","api.minimax.chat","api.minimax.chat.","api.moonshot.cn","api.moonshot.cn.","open.bigmodel.cn","open.bigmodel.cn.","bedrock*.amazonaws.com","bedrock*.amazonaws.com.","*aiplatform.googleapis.com","*aiplatform.googleapis.com.","*.services.ai.azure.com","*.services.ai.azure.com.","*.cognitiveservices.azure.com","*.cognitiveservices.azure.com.","*sagemaker.*.amazonaws.com","*sagemaker.*.amazonaws.com."))
description = v1.1 Pre-filter of AI provider API hostnames (every enabled usage_type=api row of ai_provider_domains, *.<domain> where match_subdomains=1, plus the Bedrock, Vertex AI, Azure AI Foundry, Azure AI Services and SageMaker cloud patterns), each with and without the trailing root dot some resolvers log. It only narrows the tstats scan; ai_domains_filter decides provider and usage_type. Add a hostname here when you add an api row to ai_provider_domains.
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_app_endpoints(1)]
args = field
definition = ($field$ IN ("claude.ai","claude.ai.","claude.com","claude.com.","chatgpt.com","chatgpt.com.","chat.openai.com","chat.openai.com.","gemini.google.com","gemini.google.com.","aistudio.google.com","aistudio.google.com.","chat.deepseek.com","chat.deepseek.com.","chat.mistral.ai","chat.mistral.ai.","grok.com","grok.com.","perplexity.ai","perplexity.ai.","www.perplexity.ai","www.perplexity.ai.","kimi.com","kimi.com.","www.kimi.com","www.kimi.com.","chat.qwen.ai","chat.qwen.ai.","chatglm.cn","chatglm.cn.","chat.z.ai","chat.z.ai."))
description = v1.1 Consumer chat front-ends of the same providers (claude.ai, chatgpt.com, gemini.google.com, chat.deepseek.com, ...). A source that reached the provider's own app in the same window is not reported for that provider, because the desktop and web apps call the API hostname themselves (measured: 69% of claude.ai hosts on one tenant also resolved api.anthropic.com, with no developer tooling).
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_dev_endpoints(1)]
args = field
definition = ($field$ IN ("registry.npmjs.org","registry.npmjs.org.","registry.yarnpkg.com","registry.yarnpkg.com.","pypi.org","pypi.org.","files.pythonhosted.org","files.pythonhosted.org.","conda.anaconda.org","conda.anaconda.org.","repo.anaconda.com","repo.anaconda.com.","proxy.golang.org","proxy.golang.org.","sum.golang.org","sum.golang.org.","repo.maven.apache.org","repo.maven.apache.org.","repo1.maven.org","repo1.maven.org.","plugins.gradle.org","plugins.gradle.org.","services.gradle.org","services.gradle.org.","index.crates.io","index.crates.io.","static.crates.io","static.crates.io.","index.rubygems.org","index.rubygems.org.","api.nuget.org","api.nuget.org.","registry-1.docker.io","registry-1.docker.io.","ghcr.io","ghcr.io.","pkg-containers.githubusercontent.com","pkg-containers.githubusercontent.com.","registry.terraform.io","registry.terraform.io.","dl.k8s.io","dl.k8s.io.","api.githubcopilot.com","api.githubcopilot.com.","copilot-proxy.githubusercontent.com","copilot-proxy.githubusercontent.com.","api2.cursor.sh","api2.cursor.sh.","marketplace.visualstudio.com","marketplace.visualstudio.com.","update.code.visualstudio.com","update.code.visualstudio.com.","download.jetbrains.com","download.jetbrains.com."))
description = v1.1 Developer-tooling hostnames (package registries npm, PyPI, Conda, Go, Maven, Gradle, crates.io, RubyGems, NuGet; container registries; Terraform; VS Code and JetBrains update and marketplace; GitHub Copilot and Cursor API). A source that resolves any of them in the window is treated as a developer endpoint. Literal names only (the macro is also evaluated with eval IN, which does not expand wildcards).
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_app_ids]
definition = (All_Traffic.app IN ("anthropic-api*","openai-api*","deepseek-api*","claude-*","anthropic-claude*","openai-chatgpt*","openai-base","deepseek-chat*"))
description = v1.1 Firewall App-ID values (PAN-OS style, matched case-insensitively) for AI provider APIs (anthropic-api-base, anthropic-api-post, openai-api, deepseek-api) and for the same providers' consumer apps (claude-base, openai-chatgpt, openai-base, deepseek-chat), which are needed for the consumer-app check. Every value needs a pattern in the app_id_map macro.
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_dev_app_ids]
definition = (All_Traffic.app IN ("github-base","github-copilot*","github-downloading","gitlab-base","bitbucket-base","git-base","visual-studio*","docker*","jetbrains*"))
description = v1.1 Firewall App-ID values that show developer tooling on the source (GitHub, GitLab, Bitbucket, git, Copilot, Visual Studio, Docker, JetBrains). github-pages and ssh are deliberately absent: they are common on non-developer hosts.
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_app_id_map]
definition = eval app=lower(app), app_dev_hit=if(isnotnull(app) AND match(app,"^(github-(base|copilot.*|downloading)|gitlab-base|bitbucket-base|git-base|visual-studio.*|docker.*|jetbrains.*)$"),1,0), app_provider=case(isnull(app) OR app_dev_hit=1,null(), match(app,"^(anthropic-api|claude-|anthropic-claude)"),"Anthropic", match(app,"^openai-"),"OpenAI", match(app,"^deepseek-"),"DeepSeek"), provider=if(isnotnull(app),app_provider,provider), usage_type=if(isnotnull(app),case(isnull(app_provider),null(), match(app,"^(anthropic|openai|deepseek)-api"),"api", true(),"web"),usage_type), severity_weight=if(isnotnull(app),if(usage_type="api","1.2",null()),severity_weight), enabled=if(isnotnull(app_provider),"1",enabled) | fields - app_provider
description = v1.1 Maps a firewall App-ID (field app, null on DNS and proxy rows, which pass through unchanged) to provider (names match ai_provider_domains so ai_sanctioned_entities approvals work), usage_type (api for *-api App-IDs, web for the consumer apps), severity_weight and enabled=1, and flags developer-tooling App-IDs (app_dev_hit). It runs before ai_domains_filter, which keeps these values because an App-ID is not a hostname. The common ai_provider_apps lookup has no rows for anthropic-api-base, claude-base or deepseek-api, so the mapping lives here.
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_excluded_providers]
definition = "GitHub Copilot","Cursor","Suno"
description = v1.1 Providers whose usage_type=api hostnames are not reported. GitHub Copilot and Cursor are IDE assistants (hdsi_ai_code_assistant_network_connection reports them and they count as developer tooling here). Suno is listed because *.suno.ai includes the music CDNs a browser loads. Use "__none__" to report every provider.
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_sanctioned_endpoints]
definition = "__none__"
description = v1.1 Normalised AI endpoints (ai_domain, wildcards allowed) the organisation runs or approves for everyone, typically its own cloud AI resources, e.g. "contoso-*.openai.azure.com","bedrock-runtime.us-east-1.amazonaws.com". Rows for these endpoints are removed before scoring. Ships with "__none__" (nothing approved).
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_dev_categories]
definition = "dev(?!ice)|engineer|build|jenkins|sandbox|non-?prod"
description = v1.1 Regex (case-insensitive, matched against the lower-cased ES asset category) that marks a developer or build endpoint. dev(?!ice) avoids the common "devices" category. Add your inventory's developer workstation or CI categories here.
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_resolver_categories]
definition = "domain.?controller|dns|resolver|forwarder"
description = v1.1 Regex matched against the lower-cased ES asset category for DNS servers and forwarders. Those hosts resolve names for clients, so they are never the endpoint that used the API (in validation, domain controllers were 18 of 45 sources on one tenant). Add other resolver IPs to the _filter macro.
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_dev_sources]
definition = false()
description = v1.1 Eval expression for developer networks that the asset inventory does not label, e.g. cidrmatch("10.50.0.0/16",src) OR like(src_asset,"dev-%"). Matching sources are treated as developer endpoints. Ships as false().
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_require_known_asset]
definition = 1
description = v1.1 1 = report only sources that are in the ES asset inventory (asset_lookup_by_str by ip) or carry a firewall/proxy user. A source with neither cannot be classified as a non-developer endpoint and is dropped. Set to 0 where the asset inventory does not cover client IPs and DNS gives the only evidence.
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_max_users_per_src]
definition = 3
description = v1.1 A source seen with more distinct firewall or proxy users than this in one run is treated as shared egress (NAT, explicit proxy, VDI or terminal server) and dropped. Derive it from the copy-paste SPL in the README.
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_unreliable_src]
definition = false()
description = v1.1 Eval expression for source addresses that are not a stable host (roaming DNS security clients reporting home-network or IPv6 addresses that different laptops share). Matching rows without a user are dropped. Ships as false(); roaming-DNS tenants can use e.g. cidrmatch("192.168.0.0/16",src) OR match(src,":").
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after per-source aggregation and scoring (fields: src, src_asset, src_category, user, user_display, provider_list, providers, endpoint_sample, evidence_type, event_count, allowed, base_score, severity_weight, risk_multiplier, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_api_access_from_non_dev_endpoint_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. The SPL sets risk_score = min(50, round(base x severity_weight x risk_multiplier)) for src and user: base 20 (5 when every firewall session was blocked), severity_weight from ai_provider_domains (0.8-1.2), risk_multiplier from the identity bunit (1.0 without a user). Override risk_score here per tenant. Ships as search *.
disabled = False
iseval = 0

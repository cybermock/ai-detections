version: 1.1.0
creation_date: '2026-03-04'
package_title: AI API Access From Non-Dev Endpoint
description: "Detects hosts that call AI provider APIs (OpenAI, Anthropic, AWS Bedrock, GCP Vertex AI, Azure OpenAI, DeepSeek and others) from DNS, firewall App-ID or proxy evidence while showing no developer tooling and not using that provider's consumer app. DNS servers, developer and build assets, shared egress and approved endpoints are excluded. Daily, one risk event per host. Risk only, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - dns
  - network
  - web
  - proxy
data_prereqs:
  datamodels:
    op: OR
    items:
    - "Network_Resolution"
    - "Network_Traffic"
    - "Web"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

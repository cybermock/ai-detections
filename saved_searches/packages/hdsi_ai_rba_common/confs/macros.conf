iseval = 0
description = v1.1 Generating search: returns enabled AI provider API-key regexes (pattern_id, provider, regex_pattern, severity) from ai_api_key_patterns. Use at the start of a search or inside a subsearch.
disabled = False

[ai_risk_defaults(1)]
args = control_name
definition = [| inputlookup ai_detection_config | search control_name="$control_name$" | head 1 | return $value]

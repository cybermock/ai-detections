description = v1.1 Removes rows covered by an active entry in ai_sanctioned_entities, then drops its _allow_* working fields. Args: user_field, system_field, provider_field (field names; call sites unchanged). Builds allow_key candidates lower(entity)|lower(provider) and lower(entity)|* for the user, the system and the identity group, plus the organisation-wide key *|lower(provider) (never *|*). Group = first non-empty of user_group, user_category, bunit, the ES identity bunit of the user (looked up by the macro itself: raw value, then the bare name with DOMAIN\ and @suffix stripped), then category (legacy); "unknown" is ignored. An entry applies when enabled=1 and expires is empty or not before today (YYYY-MM-DD).
disabled = False

[ai_process_filter]
definition = lookup ai_tool_processes process_name_lc as process_name_lc OUTPUTNEW tool provider usage_type platform enabled requires_context | where enabled=1
iseval = 0
description = v1.1 Resolves an AI tool from process_name_lc (lowercased process name, caller must create it) via ai_tool_processes. Outputs tool, provider, usage_type, platform, enabled and requires_context (1 = generic or colliding name such as fabric.exe, lms.exe, chat.exe: corroborate with process_path or command line before scoring) and keeps enabled=1 rows only.
disabled = False

[ai_process_enrich]
definition = lookup ai_tool_processes process_name_lc as process_name_lc OUTPUTNEW tool provider usage_type platform enabled requires_context
iseval = 0
description = v1.1 Enrich-only variant of ai_process_filter for rules that match on command line or image path: same lookup and outputs, but keeps every row (tool/provider stay null for names not in ai_tool_processes; enabled shows 0 for disabled rows). Filter on enabled yourself.
disabled = False

[ai_prompt_injection_patterns_enabled]
definition = inputlookup ai_prompt_injection_patterns | where enabled=1 | fields pattern_id pattern severity
iseval = 0
description = v1.1 Generating search: returns enabled prompt-injection phrases (pattern_id, pattern, severity) from ai_prompt_injection_patterns. Use at the start of a search or inside a subsearch.
disabled = False

[ai_api_key_patterns_enabled]

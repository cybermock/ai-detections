t_b _ai_user_cat _ai_user_cat_b _ai_user_pri _ai_user_pri_b _ai_hit _ai_dept _ai_dept_leaf _ai_dept_top _ai_sl0 _ai_sl1 _ai_sl2 _ai_m0 _ai_m1 _ai_m2 _ai_dept_mult _ai_priv_mult
iseval = 0
description = v1.1 Per-user risk multiplier from the ES identity bunit (ai_department_sensitivity) x 1.25 for privileged/critical identities, capped at 2.0. Reads field user. Identity: identity_lookup_expanded on user, falling back to the bare name (DOMAIN\ and @suffix stripped; built-in names such as administrator/root are never bare-matched). bunit: matched as the whole lowercased value, then its last and first path segment (separators / \ > | :). Privileged = an identity category value that is the whole word priv/privileged (or a misspelling ending in -ged, optionally followed by _user/_account); values such as non-privileged or privacy are no longer matched; or priority=critical. Outputs risk_multiplier and sensitivity_level (legacy alias _final_multiplier). ES identities carry no department field; bunit is the supported key.
disabled = False

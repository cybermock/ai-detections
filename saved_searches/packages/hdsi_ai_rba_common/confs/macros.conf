description = v1.1 Resolves ai_domain to an AI provider. Input: ai_domain = hostname, URL, DNS answer or SSE/CASB/App-ID app name (first value only - mvexpand multivalue fields first); optional ai_input_type = host|dns (never treat as app name) or app (always try ai_provider_apps, including dotted App-IDs such as otter.ai-base). Normalises (lowercase, strips scheme/path, leading *., :port, trailing dot, leading www.), then matches ai_provider_domains exactly, then up to two parent domains and the registrable base ONLY where match_subdomains=1, then cloud AI endpoint patterns (Bedrock, Vertex AI, Azure OpenAI, Azure AI Foundry, Azure AI Services, SageMaker), then ai_provider_apps for values that are not hostnames and contain a space or equal the row's site/app field, or for any value with ai_input_type=app. Outputs provider, usage_type, severity_weight, enabled, ai_match (exact|subdomain|cloud_pattern|app_name) and ai_traffic_class (interactive|background|site from the registry traffic_class column; interactive for cloud patterns and app names) and keeps enabled=1 rows only. ai_domain is rewritten to its normalised form.
disabled = False


[hdsi_ai_assisted_lateral_movement_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the tstats where clause before aggregation. Use Endpoint.Processes field names, e.g. NOT Processes.dest IN ("jump-host-*") or NOT Processes.user IN ("svc_ansible"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_assisted_lateral_movement_agent_parents]
definition = (Processes.parent_process_name IN ("claude","claude.exe","codex","codex.exe","codex-command-runner*","codex-x86_64*","codex-aarch64*","gemini","gemini.exe","copilot","copilot.exe","copilot-runtime*","copilot-language-server*","gh-copilot","gh-copilot.exe","aider","aider.exe","sgpt","sgpt.exe","aichat","aichat.exe","tgpt","tgpt.exe","amazon-q","amazon-q.exe","qchat","qchat.exe","kiro-cli","kiro-cli.exe","cline","cline.exe","opencode","opencode.exe","cursor-agent","cursor-agent.exe","goose","goose.exe","crush","crush.exe","qwen","qwen.exe") OR (Processes.parent_process_name IN ("node","node.exe","bun","bun.exe") Processes.parent_process IN ("*claude-code*","*@anthropic-ai*","*/.claude/local/*","*gemini-cli*","*openai*codex*","*github*copilot*","*cursor-agent*","*opencode*","*qwen-code*","*sourcegraph*amp*","*/cline/*","*\\cline\\*","*cline-cli*","*/bin/claude*","*/bin/gemini*","*/bin/codex*","*/bin/copilot*","*/bin/qwen*","*/bin/opencode*","*/bin/cursor-agent*","*/bin/cline*","*/bin/amp","*/bin/amp *")) OR (Processes.parent_process_name IN ("python*","py.exe") Processes.parent_process IN ("*aider*","*shell_gpt*","*sgpt*","*open-interpreter*","*interpreter*--os*")) OR Processes.parent_process IN ("claude","claude *","*/claude/versions/*","*\\claude\\versions\\*","*/.local/bin/claude","*/.local/bin/claude *") OR (Processes.parent_process_name IN ("zsh","bash","sh","zsh.exe","bash.exe","pwsh","pwsh.exe","powershell.exe","cmd.exe") Processes.parent_process IN ("*/.gemini/antigravity/*","*\\.gemini\\antigravity\\*")))
description = v1.1 Endpoint.Processes clause that identifies a process whose PARENT is an AI coding agent able to run shell commands: native agent binaries including the versioned command runners agents use on Windows (codex-command-runner-<ver>.exe, copilot-runtime.exe, copilot-language-server.exe); node/bun/python hosts whose command line names the agent package (Windows npm shims) or its bin shim (Unix shebang installs such as node /usr/local/bin/claude); the Claude Code native installer, matched on the parent command line (claude ..., ~/.local/share/claude/versions/<ver>, ~/.local/bin/claude) because EDRs that report the resolved image log the parent name as the version string; and the agent terminal shells of Google Antigravity (a zsh/bash/pwsh parent whose command line runs from ~/.gemini/antigravity/). Agentic CLIs only: prompt-only tools (fabric, llm, mods, openai) are excluded because they do not execute commands and their names collide with unrelated software. Add new agent binaries here.
disabled = False
iseval = 0

[hdsi_ai_assisted_lateral_movement_remote_regex]
definition = "(?:^|[\\n\\r;&|({\\x60!]|\\b(?:sh|bash|zsh|dash|ksh|fish|ash|powershell|pwsh)(?:\\.exe)?['\"]?\\s+(?:-[-a-z]+(?:\\s+[^\\s'\"-][^\\s'\"]*)?\\s+){0,6}?-[a-z]*c(?:ommand)?\\s|\\s-command\\s|\\s/[ck]\\s|\\b(?:do|then|else|elif)\\s|\\b(?:eval|exec|sudo|doas|nohup|xargs|env|nice|stdbuf|setsid|call|time|start-process|start|timeout|runas)(?:\\.exe)?\\s)\\s*['\"]?(?:(?:-[^\\s;&|'\"]+(?:\\s+[^\\s;&|'\"-][^\\s;&|'\"]*)?|[a-z_][a-z0-9_]*=[^\\s;&|]*|\\d+(?:\\.\\d+)?[smhd]?)\\s+){0,4}?(?:['\"](?:[a-z]:|%[a-z_]+%|\\$env:[a-z_]+)[^'\"]*[/\\\\]|['\"]?[^\\s'\";&|]*[/\\\\]|['\"])?(?:(?:ssh|sftp|sshpass|plink|ssh-copy-id|psexec|psexec64|paexec|paexec64|winrs|xfreerdp|wlfreerdp|xfreerdp3|rdesktop|mstsc|smbclient|nxc)(?:\\.exe)?['\"]?\\s|(?:scp|pscp|rsync)(?:\\.exe)?['\"]?\\s[^;&|\\n]*?\\s['\"]?(?:[\\w.-]+@)?[a-z0-9][\\w.-]+:)|\\b(?:impacket-[a-z]+|(?:psexec|wmiexec|smbexec|atexec|dcomexec)\\.py|crackmapexec|netexec|evil-winrm)\\b|\\bwmic(?:\\.exe)?['\"]?\\s[^;&|\\n]*/node:|\\bnet1?(?:\\.exe)?['\"]?\\s+use\\s+(?:[a-z]:\\s+|\\*\\s+)?['\"]?\\\\\\\\[a-z0-9]|\\b(?:sc|reg)(?:\\.exe)?['\"]?\\s+(?:[a-z]+\\s+)?['\"]?\\\\\\\\[a-z0-9]|\\bschtasks(?:\\.exe)?['\"]?\\s[^;&|\\n]*\\s/s\\s+['\"]?[a-z0-9]|\\\\\\\\[a-z0-9][\\w.-]*\\\\(?:[a-z]|admin|ipc)\\$|\\b(?:enter-pssession|new-pssession|etsn|nsn)\\b(?:\\s+['\"]?[a-z0-9]|[^;|\\n]*?\\s-(?:computer(?:name)?|comp|cn|hostname|connectionuri|uri)\\b)|\\b(?:invoke-command|icm|invoke-wmimethod|iwmi|invoke-cimmethod|get-wmiobject|gwmi|get-ciminstance|gcim|new-cimsession)\\b[^;|\\n]*-(?:computer(?:name)?|comp|cn)(?:\\s+|:)|\\bssm\\s+start-session\\b|\\bcompute\\s+ssh\\b|\\baz\\s+ssh\\b"
description = v1.1 Regex applied to the lowercased child command line AFTER benign fragments are removed. Remote clients (ssh, sftp, plink, PsExec/PAExec, winrs, RDP clients, smbclient, nxc) must be in command position: start of line, a newline, ; & | ( { ! or a backtick, a shell -c / pwsh -Command / cmd /c, the shell keywords do/then/else/elif, or a wrapper (eval, exec, sudo, doas, xargs, env, nohup, nice, timeout, time, start, runas). Up to 4 wrapper options, VAR=value assignments or durations may sit in between (sudo -u deploy ssh, xargs -I{} ssh, env A=b ssh, timeout 10 ssh), and the client may be quoted or path-qualified. So which ssh, command -v ssh, grep -c ssh, man ssh and ls /etc/ssh do not match. scp/pscp/rsync need a host: argument; net use, sc and reg need a \\host argument; schtasks needs /s host (reg /s is a recursive query); any \\host\c$, \\host\admin$ or \\host\ipc$ admin-share path matches (copy, dir, Copy-Item); PowerShell WMI/CIM/remoting cmdlets and their aliases (icm, gwmi, gcim, iwmi) need -ComputerName/-cn; Enter-/New-PSSession (etsn, nsn) need a host or -ComputerName/-HostName; Impacket/NetExec/CrackMapExec/evil-winrm match anywhere; plus wmic /node: and cloud shells (aws ssm start-session, gcloud compute ssh, az ssh).
disabled = False
iseval = 0

[hdsi_ai_assisted_lateral_movement_benign_regex]
definition = "\\bssh(?:\\.exe)?['\"]?\\s+(?:-(?![a-z]*j)[a-z]+\\s+(?:(?!proxy)[^\\s@-]\\S*\\s+)?)*(?:[\\w.-]+@)?(?:github\\.com|gitlab\\.com|bitbucket\\.org|ssh\\.dev\\.azure\\.com|vs-ssh\\.visualstudio\\.com|source\\.developers\\.google\\.com)(?![\\w.-])|\\bssh(?:\\.exe)?['\"]?\\s+(?:-[a-z]+\\s+(?:[^\\s@-]\\S*\\s+)?)*(?:[\\w.-]+@)?[\\w.-]+\\s+['\"]*git-(?:upload|receive|upload-archive)-pack\\b|\\bssh(?:\\.exe)?['\"]?\\s+(?:-[a-z]+\\s+(?:[^\\s@-]\\S*\\s+)?)*(?:[\\w.-]+@)?[\\w.-]+\\s+['\"]*git-lfs-(?:authenticate|transfer)\\b|\\bssh(?:\\.exe)?['\"]?\\s+(?:-[a-z]+\\s+(?:[^\\s@-]\\S*\\s+)?)*(?:[\\w.-]+@)?(?:localhost|127\\.0\\.0\\.1|::1)(?![\\w.-])(?![^;&|\\n]*\\b(?:ssh|scp|rsync|psexec|nxc)\\b)|\\bssh(?:\\.exe)?['\"]?\\s+-v+\\s*['\"]?\\s*(?:$|[;&|)]|2>)|\\bssh(?:\\.exe)?\\s+-q\\s+(?:cipher|cipher-auth|compression|help|kex|kex-gss|key|key-ca-sign|key-cert|key-plain|key-sig|mac|protocol-version|sig)(?![\\w.-])|\\bssh(?:\\.exe)?\\s+-g\\s+(?:[\\w.-]+@)?[\\w.-]+(?=\\s*(?:$|[;&|)'\"\\n]|\\d?>))|\\b(?:ssh|sftp|scp|plink|psexec|psexec64|paexec|paexec64|winrs|mstsc|smbclient|rsync|xfreerdp|rdesktop)(?:\\.exe)?['\"]?\\s+(?:--help|-h|/\\?|-\\?)(?=\\s*(?:$|[;&|)'\"\\n]|\\d?>))|\\b(?:git|gh)(?:\\.exe)?\\s[^\\n;&|]*?\\s(?:-[a-z]*m|--message|--body|--title)(?:=|\\s+)(?:'[^']*'|\"[^\"$\\x60]*\")|\\b(?:cat|tee)\\b[^\\n]*?<<-?\\s*['\"\\\\]*(?<hd>[a-z_][\\w-]*)['\"\\\\]*[^\\n]*\\n(?s:.*?)\\n\\s*\\k<hd>(?=\\s|$|['\")])|-(?:computer(?:name)?|comp|cn)(?:\\s+|:)['\"]?(?:\\.|(?:localhost|127\\.0\\.0\\.1|::1)|\\$env:computername)(?=['\"\\s;)}]|$)|/node:['\"]?(?:\\.|(?:localhost|127\\.0\\.0\\.1|::1))(?=['\"\\s]|$)|\\\\\\\\(?:\\.|(?:localhost|127\\.0\\.0\\.1|::1))(?=[\\\\\\s'\"]|$)"
description = v1.1 Regex of benign FRAGMENTS that are stripped from each lowercased child command line (replaced with a space) before the remote regex runs, so a real hop in the same command line is still caught. Stripped: ssh whose destination is exactly a public code host (not github.com.evil.net, and not when -J/ProxyJump names a jump host); ssh whose remote command is git-upload-pack/git-receive-pack/git-lfs (git transport, any Git server); ssh to localhost unless another remote client follows in the same command; ssh -V/-v version probes (about 370/day from automation in one validation tenant); ssh -G host and ssh -Q <query> (config/query only); --help, -h, /? of remote clients (not of offensive tools); quoted git/gh commit and PR messages (-m, --message, --body, --title; double-quoted text containing $ or a backtick is kept); the body of a cat/tee heredoc (file or commit-message text, not a heredoc fed to a shell); -ComputerName . / localhost / $env:COMPUTERNAME, wmic /node:localhost and \\localhost paths. Extend with sanctioned jump hosts or internal Git hosts, anchored to the ssh destination.
disabled = False
iseval = 0

[hdsi_ai_assisted_lateral_movement_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after normalisation (fields: user, src, bunit, ai_tools, provider, remote_methods, remote_targets, remote_commands, offensive_tooling). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_assisted_lateral_movement_risk_score]
definition = search *
description = v1.1 Risk score hook, last pipe. risk_score is set to 70 only when offensive tooling (Impacket, NetExec/CrackMapExec, evil-winrm) is seen; otherwise the literal _risk scores apply (user 50, system 40). Override per tenant here. Ships as search *.
disabled = False
iseval = 0

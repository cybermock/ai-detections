version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Assisted Lateral Movement
description: "Detects remote-access and remote-execution commands (SSH, PsExec, admin-share paths, WinRM/PowerShell remoting, RDP, WMI /node, net use, Impacket/NetExec) launched as child processes of an AI coding agent: native CLIs (Claude Code including its native installer, Codex, Gemini CLI, Copilot CLI), their versioned command runners (codex-command-runner, copilot-runtime), node/bun/python-hosted agents and Google Antigravity agent shells. Remote clients must be in command position (including loops, multi-line commands and sudo/xargs/env wrappers); benign fragments (git over SSH, localhost, version/help probes, commit messages and heredoc text) are stripped first. Requires Endpoint.Processes with parent_process_name, parent_process and process command lines. Risk on user and source host, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_unsanctioned_filter(3)
tags:
  - rba_only
  - process
  - endpoint
  - lateral_movement
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Endpoint.Processes"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

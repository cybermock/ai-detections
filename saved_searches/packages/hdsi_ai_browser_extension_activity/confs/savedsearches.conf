[Network - HDSI AI Browser Extension Activity - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Browser Extension Activity
action.correlationsearch.annotations = {"mitre_attack": ["T1176.001", "T1588.007"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$risk_object$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI extension DNS lookups from $src$","search":"| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Resolution where DNS.src=\"$src$\" `hdsi_ai_browser_extension_activity_domains(DNS.query)` by DNS.src DNS.query | rename DNS.* as * | convert ctime(firstTime) ctime(lastTime) | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI extension and store web activity from $src$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"-\" count sum(Web.bytes_out) as bytes_out sum(Web.bytes_in) as bytes_in values(Web.url) as url values(Web.http_user_agent) as http_user_agent min(_time) as firstTime max(_time) as lastTime from datamodel=Web where Web.src=\"$src$\" (`hdsi_ai_browser_extension_activity_domains(Web.url_domain)` OR `hdsi_ai_browser_extension_activity_domains(Web.site)` OR Web.url_domain IN (`hdsi_ai_browser_extension_activity_store_domains`)) by Web.user Web.src Web.url_domain Web.site | rename Web.* as * | eval url_domain=if(url_domain=\"-\",site,url_domain) | eval mb_out=round(bytes_out/1024/1024,2), mb_in=round(bytes_in/1024/1024,2) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, url_domain, count, mb_out, mb_in, http_user_agent, url | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = AI extension-first product $ext_product_list$ (browser extension or the vendor web app) used from $src$ (user: $user_display$, tiers: $ext_tier_list$), seen via $evidence_list$ to $ext_domain_list$ ($event_count$ events).
action.notable.param.rule_title = HDSI AI Browser Extension Activity ($src$)
action.notable.param.security_domain = network
action.notable.param.severity = informational
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"src","risk_object_type":"system","risk_score":20},{"risk_object_field":"user","risk_object_type":"user","risk_score":20}]
action.risk.param._risk_message = AI extension-first product $ext_product_list$ (browser extension or the vendor web app) used from $src$ (user: $user_display$, tiers: $ext_tier_list$), seen via $evidence_list$ to $ext_domain_list$ ($event_count$ events).
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = src,user
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 7 * * * *
description = v1.1.0 Detects use of extension-first AI assistants (Monica, Sider, MaxAI, HARPA, Tactiq, Wordtune and others) from DNS and proxy traffic to their extension or web-app backends, plus AI extension store listing views. Risk on src and, when the proxy names one user, on user. No notable.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Resolution where `hdsi_ai_browser_extension_activity_domains(DNS.query)` `hdsi_ai_browser_extension_activity_filter` by DNS.src DNS.query \
	| rename DNS.* as * \
	| eval ext_domain=query, evidence="dns" \
	| append maxtime=240 [| tstats summariesonly=t allow_old_summaries=t fillnull_value="-" count min(_time) as firstTime max(_time) as lastTime values(Web.url) as urls from datamodel=Web where (`hdsi_ai_browser_extension_activity_domains(Web.url_domain)` OR `hdsi_ai_browser_extension_activity_domains(Web.site)` OR Web.url_domain IN (`hdsi_ai_browser_extension_activity_store_domains`)) `hdsi_ai_browser_extension_activity_web_filter` by Web.user Web.src Web.url_domain Web.site | rename Web.* as * | eval user=nullif(user,"-"), src=nullif(src,"-"), url_domain=nullif(url_domain,"-"), site=nullif(site,"-") | eval ext_domain=coalesce(url_domain,site), evidence="web"] \
	| `hdsi_ai_browser_extension_activity_catalog` \
	| eval store_ai_urls=if(isnull(ext_product) AND match(ext_domain,"^(chromewebstore\\.google\\.com|chrome\\.google\\.com|microsoftedge\\.microsoft\\.com|addons\\.mozilla\\.org)$"), mvfilter(match(urls,`hdsi_ai_browser_extension_activity_store_ai_regex`)), null()) \
	| rex field=store_ai_urls max_match=5 "(?i)/(detail|addon)/(?<store_listing>[^/?#]+)" \
	| eval ext_product=coalesce(ext_product,if(isnotnull(store_ai_urls),"AI extension store listing",null())), ext_tier=coalesce(ext_tier,if(isnotnull(store_ai_urls),"store_view",null())), evidence=if(ext_tier="store_view","web_store",evidence) \
	| where isnotnull(ext_product) \
	| eval user=if(isnull(user) OR match(lower(user),"^(unknown|-|n/a|null|none|)$") OR match(user,"^\\d{1,3}(\\.\\d{1,3}){3}$"),null(),user), src=if(isnull(src) OR match(lower(src),"^(unknown|-|n/a|null|none|0\\.0\\.0\\.0|)$"),null(),src), provider=ext_product \
	| where isnotnull(src) \
	| lookup identity_lookup_expanded identity as user OUTPUT bunit as _user_bunit \
	| lookup asset_lookup_by_str asset as src OUTPUT bunit as _src_bunit \
	| lookup asset_lookup_by_cidr ip as src OUTPUTNEW bunit as _src_bunit \
	| eval _user_bunit=mvfilter(NOT match(_user_bunit,"^(?i)\\s*(unknown|n/?a|none|null|-)?\\s*$")), _src_bunit=mvfilter(NOT match(_src_bunit,"^(?i)\\s*(unknown|n/?a|none|null|-)?\\s*$")) \
	| eval _user_bunit=mvdedup(mvmap(_user_bunit,lower(trim(_user_bunit)))), _src_bunit=mvdedup(mvmap(_src_bunit,lower(trim(_src_bunit)))) \
	| eval bunit=coalesce(if(mvcount(_user_bunit)=1,_user_bunit,null()),if(mvcount(_src_bunit)=1,_src_bunit,null())), bunit_note=if(isnull(bunit) AND (mvcount(_user_bunit)>1 OR mvcount(_src_bunit)>1),"ambiguous asset or identity bunit (".mvcount(mvdedup(mvappend(_user_bunit,_src_bunit)))." values), not used for allowlisting",null()) \
	| fields - _user_bunit _src_bunit \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| `hdsi_ai_browser_extension_activity_tier_scores` \
	| stats sum(count) as event_count values(ext_product) as ext_products dc(ext_product) as product_count dc(eval(if(ext_tier="vendor_site" OR ext_tier="store_view",null(),ext_product))) as backend_product_count values(ext_tier) as ext_tiers max(tier_score) as max_tier_score values(ext_domain) as ext_domains values(store_listing) as store_listings values(evidence) as evidence values(user) as users values(bunit) as bunit values(bunit_note) as bunit_note min(firstTime) as firstTime max(lastTime) as lastTime by src \
	| eval user=if(mvcount(users)=1,users,null()), user_display=coalesce(user,if(mvcount(users)>1,mvjoin(mvindex(users,0,4),", "),"not attributed")), ext_product_list=mvjoin(ext_products,", "), ext_tier_list=mvjoin(ext_tiers,", "), ext_domain_list=mvjoin(mvindex(ext_domains,0,9),", "), evidence_list=mvjoin(evidence,", "), provider=ext_product_list \
	| eval base_score=min(60,max_tier_score+5*max(0,backend_product_count-1)) \
	| `ai_risk_multiplier` \
	| eval risk_score=min(60,round(base_score*coalesce(risk_multiplier,1),0)) \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="browser_extension", detection_id="hdsi_ai_browser_extension_activity", mitre_attack=split("T1176.001,T1588.007",","), ai_kill_chain_phase="collection" \
	| fields - users ext_domains urls store_ai_urls \
	| `hdsi_ai_browser_extension_activity_customizations` \
	| `hdsi_ai_browser_extension_activity_risk_score`

[hdsi_ai_browser_extension_activity_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the DNS leg, inline in the Network_Resolution tstats where clause before aggregation. Use DNS datamodel field names, e.g. NOT DNS.src IN ("192.0.2.53"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_browser_extension_activity_web_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Web leg, inline in the Web tstats where clause before aggregation. Use Web datamodel field names, e.g. NOT Web.user IN ("svc_*"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_browser_extension_activity_domains(1)]
args = field
definition = $field$ IN ("tactiq.io*","*.tactiq.io*","harpa.ai*","*.harpa.ai*","bardeen.ai*","*.bardeen.ai*","monica.im*","*.monica.im*","sider.ai*","*.sider.ai*","maxai.me*","*.maxai.me*","maxai.co*","*.maxai.co*","getmerlin.in*","*.getmerlin.in*","getvoila.ai*","*.getvoila.ai*","teamsmart.ai*","*.teamsmart.ai*","wiseone.io*","*.wiseone.io*","chathub.gg*","*.chathub.gg*","getliner.com*","*.getliner.com*","glasp.co*","*.glasp.co*","eightify.app*","*.eightify.app*","aiprm.com*","*.aiprm.com*","briskteaching.com*","*.briskteaching.com*","chatgptwriter.ai*","*.chatgptwriter.ai*","compose.ai*","*.compose.ai*","wordtune.com*","*.wordtune.com*","getmagical.com*","*.getmagical.com*")
description = v1.1 Backend domains of extension-first AI assistants (the vendor's main product is a browser extension, so traffic to these hosts is extension use). Leading and trailing wildcards cover subdomains and the trailing dot some DNS sources log. Grammarly and QuillBot are deliberately absent (high-volume, usually sanctioned). Keep in step with hdsi_ai_browser_extension_activity_catalog.
disabled = False
iseval = 0

[hdsi_ai_browser_extension_activity_catalog]
definition = eval ext_domain=lower(replace(replace(ext_domain,":\\d+$",""),"\\.$","")), _ext=case(match(ext_domain,"(^|\\.)(tactiq\\.io)$"),"Tactiq|capture", match(ext_domain,"(^|\\.)(harpa\\.ai)$"),"HARPA AI|capture", match(ext_domain,"(^|\\.)(bardeen\\.ai)$"),"Bardeen|capture", match(ext_domain,"(^|\\.)(monica\\.im)$"),"Monica|page_reader", match(ext_domain,"(^|\\.)(sider\\.ai)$"),"Sider|page_reader", match(ext_domain,"(^|\\.)(maxai\\.me|maxai\\.co)$"),"MaxAI|page_reader", match(ext_domain,"(^|\\.)(getmerlin\\.in)$"),"Merlin|page_reader", match(ext_domain,"(^|\\.)(getvoila\\.ai)$"),"Voila|page_reader", match(ext_domain,"(^|\\.)(teamsmart\\.ai)$"),"TeamSmart AI|page_reader", match(ext_domain,"(^|\\.)(wiseone\\.io)$"),"Wiseone|page_reader", match(ext_domain,"(^|\\.)(chathub\\.gg)$"),"ChatHub|page_reader", match(ext_domain,"(^|\\.)(getliner\\.com)$"),"Liner|page_reader", match(ext_domain,"(^|\\.)(glasp\\.co)$"),"Glasp|page_reader", match(ext_domain,"(^|\\.)(eightify\\.app)$"),"Eightify|page_reader", match(ext_domain,"(^|\\.)(aiprm\\.com)$"),"AIPRM|page_reader", match(ext_domain,"(^|\\.)(briskteaching\\.com)$"),"Brisk|page_reader", match(ext_domain,"(^|\\.)(chatgptwriter\\.ai)$"),"ChatGPT Writer|writer", match(ext_domain,"(^|\\.)(compose\\.ai)$"),"Compose AI|writer", match(ext_domain,"(^|\\.)(wordtune\\.com)$"),"Wordtune|writer", match(ext_domain,"(^|\\.)(getmagical\\.com)$"),"Magical|writer"), ext_product=mvindex(split(_ext,"|"),0), ext_tier=mvindex(split(_ext,"|"),1), ext_tier=if(isnotnull(ext_product) AND match(ext_domain,"^(www\\.)?[^.]+\\.[^.]+$"),"vendor_site",ext_tier) | fields - _ext
description = v1.1 Maps ext_domain to ext_product and ext_tier (capture = meeting capture or browser automation, page_reader = sidebar assistant that sends page content to its own LLM backend, writer = writing assistant, vendor_site = only the bare or www marketing host was reached, which is weaker evidence than an extension backend host). Unmatched domains get no product and are dropped. Keep in step with hdsi_ai_browser_extension_activity_domains.
disabled = False
iseval = 0

[hdsi_ai_browser_extension_activity_store_domains]
definition = "chromewebstore.google.com","chrome.google.com","microsoftedge.microsoft.com","addons.mozilla.org"
description = v1.1 Browser extension store hosts. Used for the Web leg so store listing views are found by an exact url_domain match instead of a leading-wildcard Web.url scan.
disabled = False
iseval = 0

[hdsi_ai_browser_extension_activity_store_ai_regex]
definition = "(?i)/(detail|addon)/[^/?#]*(chatgpt|gpt|openai|claude|anthropic|copilot|gemini|perplexity|deepseek|grok|llm|[-_]ai[-_/?#]|[-_]ai$|/ai[-_])"
description = v1.1 Regex applied to store URLs. A row counts only when an extension detail page slug names an AI assistant. Needs proxy logs with full URL paths (TLS inspection).
disabled = False
iseval = 0

[hdsi_ai_browser_extension_activity_tier_scores]
definition = eval tier_score=case(ext_tier="capture",30, ext_tier="page_reader",20, ext_tier="writer",10, ext_tier="store_view",5, ext_tier="vendor_site",5, true(),5)
description = v1.1 Base risk per extension tier. capture 30, page_reader 20, writer 10, store listing view or vendor marketing site only 5. Each extra distinct product that reached a backend host (not vendor_site or store_view) on the same src adds 5; the total is capped at 60 before the identity multiplier and at 60 after it.
disabled = False
iseval = 0

[hdsi_ai_browser_extension_activity_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation (fields: src, user, user_display, bunit, bunit_note, ext_products, ext_tiers, ext_domain_list, store_listings, evidence, event_count, product_count, backend_product_count, base_score, risk_multiplier, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_browser_extension_activity_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust risk_score (max 100) per tenant; it applies to every risk object in the row. Ships as search *.
disabled = False
iseval = 0

version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Browser Extension Activity
description: "Detects use of extension-first AI assistants (Monica, Sider, MaxAI, Merlin, HARPA, Bardeen, Tactiq, Wordtune and others) from DNS lookups and proxy traffic to their backend hosts, plus views of AI extension listings in browser extension stores. These extensions read page content or meeting audio and send it to a third-party LLM backend. Risk on src and, when the proxy attributes one user, on user. No notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - dns
  - web
  - proxy
  - network
data_prereqs:
  datamodels:
    op: OR
    items:
    - "Network_Resolution.DNS"
    - "Web"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

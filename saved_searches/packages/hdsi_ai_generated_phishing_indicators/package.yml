version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Generated Phishing Indicators
description: "Detects delivered inbound email linking to sites published with AI site and app builders (Lovable, v0, Gamma, Base44, Bolt, Replit, Framer, Figma Sites) and to Vercel/Netlify hosts that carry lure wording, a payload file, or that the gateway hard-blocked for other recipients (non-bulk senders only); a documented delivery channel for AI-generated phishing pages. Risk on the internal recipient, scored up for lure wording, payload links, free-mail senders, partially blocked campaigns and a recipient web visit. Needs an email source that maps CIM Email.url. Risk only, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - email
  - web
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Email.All_Email"
  searches:
    op: AND
    items:
    - '| tstats summariesonly=true allow_old_summaries=true count from datamodel=Email.All_Email where All_Email.url=* NOT All_Email.url="unknown" All_Email.recipient=* NOT All_Email.recipient="unknown" | where count > 0'
    - '| inputlookup cim_corporate_email_domains.csv | where NOT match(domain,"acmetech\\.com$") | append [| tstats summariesonly=true allow_old_summaries=true count from datamodel=Email.All_Email where All_Email.recipient_domain=* NOT All_Email.recipient_domain="unknown" All_Email.src_user_domain=* NOT All_Email.src_user_domain="unknown" | where count > 0] | stats count | where count > 0'
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

[hdsi_ai_generated_phishing_indicators_filter]
definition = ()
description = v1.1 Tenant exclusion hook inside the Email tstats where clause (All_Email.* field names), e.g. NOT All_Email.src_user IN ("newsletter@vendor.example"). Ships empty. Mail from internal senders is already excluded (cim_corporate_email_domain_search plus the inferred internal domains).
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_url_prefilter]
definition = (All_Email.url="*.lovable.app*" OR All_Email.url="*.lovableproject.com*" OR All_Email.url="*.vusercontent.net*" OR All_Email.url="*gamma.app/docs/*" OR All_Email.url="*gamma.app/public/*" OR All_Email.url="*gamma.app/embed/*" OR All_Email.url="*.gamma.site*" OR All_Email.url="*.base44.app*" OR All_Email.url="*.bolt.host*" OR All_Email.url="*.created.app*" OR All_Email.url="*.replit.app*" OR All_Email.url="*.replit.dev*" OR All_Email.url="*.framer.website*" OR All_Email.url="*.framer.app*" OR All_Email.url="*.figma.site*" OR All_Email.url="*.vercel.app*" OR All_Email.url="*.netlify.app*")
description = v1.1 Cheap Email.url prefilter for links to sites published by AI site/app builders and generic hosting they deploy to. It only keeps tstats small; hostnames are classified exactly by the _platform macro. Add a pattern here AND a case() branch in _platform to cover another builder.
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_platform]
definition = eval ai_platform=case(match(url_host,"\\.lovable\\.app$|\\.lovableproject\\.com$"),"Lovable", match(url_host,"\\.vusercontent\\.net$"),"Vercel v0 preview", match(url_host,"\\.gamma\\.site$") OR (url_host="gamma.app" AND match(url_path,"^/(docs|public|embed)/")),"Gamma", match(url_host,"\\.base44\\.app$"),"Base44", match(url_host,"\\.bolt\\.host$"),"Bolt", match(url_host,"\\.created\\.app$"),"Create", match(url_host,"\\.replit\\.(app|dev)$"),"Replit", match(url_host,"\\.framer\\.(website|app)$"),"Framer", match(url_host,"\\.figma\\.site$"),"Figma Sites", match(url_host,"\\.vercel\\.app$"),"Vercel (generic hosting)", match(url_host,"\\.netlify\\.app$"),"Netlify (generic hosting)"), platform_tier=case(isnull(ai_platform),null(), match(ai_platform,"generic hosting"),"generic", true(),"ai_builder")
description = v1.1 Classifies url_host/url_path into ai_platform and platform_tier. ai_builder = hosts that only serve content published from an AI site/app builder (Lovable, v0 previews, Gamma docs, Base44, Bolt, Create, Replit, Framer, Figma Sites). generic = general static hosting that AI builders deploy to (vercel.app, netlify.app); these count only when the link also has lure wording, a payload extension, or the gateway stopped the same site for other recipients. Builder home pages (lovable.dev, v0.app, bolt.new, gamma.app root) are deliberately not matched.
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_web_prefilter]
definition = (Web.url_domain="*.lovable.app" OR Web.url_domain="*.lovableproject.com" OR Web.url_domain="*.vusercontent.net" OR Web.url_domain="gamma.app" OR Web.url_domain="*.gamma.site" OR Web.url_domain="*.base44.app" OR Web.url_domain="*.bolt.host" OR Web.url_domain="*.created.app" OR Web.url_domain="*.replit.app" OR Web.url_domain="*.replit.dev" OR Web.url_domain="*.framer.website" OR Web.url_domain="*.framer.app" OR Web.url_domain="*.figma.site" OR Web.url_domain="*.vercel.app" OR Web.url_domain="*.netlify.app" OR Web.site="*.lovable.app" OR Web.site="*.lovableproject.com" OR Web.site="*.vusercontent.net" OR Web.site="gamma.app" OR Web.site="*.gamma.site" OR Web.site="*.base44.app" OR Web.site="*.bolt.host" OR Web.site="*.created.app" OR Web.site="*.replit.app" OR Web.site="*.replit.dev" OR Web.site="*.framer.website" OR Web.site="*.framer.app" OR Web.site="*.figma.site" OR Web.site="*.vercel.app" OR Web.site="*.netlify.app")
description = v1.1 Web.url_domain / Web.site prefilter for the optional click branch (same hosts as _url_prefilter). Web.site is included because many proxies map the hostname to site but not url_domain. A recipient whose web traffic reached the emailed host in the same window is scored higher. Web data whose site holds SSE app names (not hostnames) contributes nothing.
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_web_filter]
definition = ()
description = v1.1 Tenant exclusion hook inside the Web tstats where clause of the click branch (Web.* field names), e.g. NOT Web.src IN ("10.0.0.5"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_allowed_hosts]
definition = "__none__"
description = v1.1 Quoted, comma-separated url_host values (wildcards allowed) that are known-good for this tenant, e.g. "status-page.vercel.app","*.example-brand.framer.website". Applied with search NOT url_host IN (...) before scoring.
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_static_path_regex]
definition = "(\\.(png|jpe?g|gif|svg|webp|ico|bmp|css|woff2?|ttf|otf|eot)$|^/(__l5e|_next/static|_next/image|_astro|static/media)/)"
description = v1.1 Regex (string literal for match()) on the lowercased URL path for static assets that are dropped before scoring: images, stylesheets and fonts by extension, plus extension-less asset paths such as Lovable /__l5e/assets-v1/<id> (images in marketing mail) and Next.js/Astro static paths. .js is NOT here: a direct email link to a script is scored by _payload_regex.
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_payload_regex]
definition = "\\.(zip|rar|7z|gz|tgz|iso|img|vhdx?|exe|msi|msix|scr|bat|cmd|ps1|vbs|vbe|js|jse|wsf|wsh|hta|lnk|jar|apk|dmg|pkg|xll|one)$"
description = v1.1 Regex (string literal for match()) on the lowercased URL path for links that download an archive, script, disk image or executable. A hit adds 20 to the score and makes a generic-hosting link eligible. Archive and script links on vercel.app hosts were seen in gateway-stopped campaigns on the validation tenants.
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_internal_domains]
definition = append [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Email.All_Email where earliest=-1445m@m latest=-5m@m All_Email.recipient_domain=* All_Email.src_user_domain=* NOT All_Email.recipient_domain="unknown" NOT All_Email.src_user_domain="unknown" by All_Email.recipient_domain All_Email.src_user_domain | rename All_Email.* as * | eval recipient_domain=lower(recipient_domain), src_user_domain=lower(src_user_domain) | where recipient_domain!=src_user_domain | eval pair=mvappend("in:".recipient_domain."|".src_user_domain, "out:".src_user_domain."|".recipient_domain) | mvexpand pair | rex field=pair "^(?<dir>in|out):(?<domain>[^|]+)\|(?<peer>.+)$" | stats dc(eval(if(dir="in",peer,null()))) as in_dc dc(eval(if(dir="out",peer,null()))) as out_dc by domain | eval two_way=min(in_dc,out_dc) | eventstats max(two_way) as top | where two_way>=10 AND two_way>=0.25*top | eval internal_domain=domain, dom_row=1 | fields internal_domain dom_row] | eventstats values(internal_domain) as internal_domains | where isnull(dom_row) | eval internal_domains="|".coalesce(mvjoin(internal_domains,"|"),"__none__")."|" | fields - internal_domain dom_row
description = v1.1 Infers the tenant's own mail domain(s) from the last 24 h of Email data, so the rule works where ES identities do not hold mailbox addresses and cim_corporate_email_domains.csv still holds only the CIM example row. A domain is internal when it both receives mail from and sends mail to at least 10 other domains, and at least a quarter as many as the busiest domain (on the validation tenants this selects exactly the primary mail domain; free-mail domains are one-directional). Output: internal_domains="|dom1|dom2|". Senders in these domains are excluded and recipients in them count as internal. To pin domains instead, replace the definition with: eval internal_domains="|example.com|example.org|". Costs one tstats over 24 h of Email (1-6 s on the validation tenants). It is an append subsearch: if it hits the subsearch time limit or returns nothing, internal_domains becomes |__none__| and only the identity and CIM-lookup paths mark recipients as internal, so pin the domains on tenants that rely on inference.
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_lure_regex]
definition = "(log-?in|sign-?in|signon|(^|[^a-z])e?-?sign([^a-z]|$)|verif|secur|account|passw|passcode|mfa|2fa|authenticat|unlock|suspend|document|docu-?sign|shared?-?file|invoice|payment|remittance|receipt|pay-?stub|pay-?slip|payroll|salary|bonus|benefit|(^|[^a-z0-9])(w-?2|tax|fax|rfq|rfp|hr)([^a-z0-9]|$)|refund|wire-?transfer|contract|agreement|proposal|purchase-?order|quotation|statement|updat|voice-?mail|e-?fax|encrypt|secure-?message|outlook|office-?365|o365|m365|microsoft|onedrive|sharepoint|adobe|dropbox|wetransfer|webmail|mailbox|quarantine|wallet|bank)"
description = v1.1 Regex (string literal for match()) of lure words checked against the linked hostname and path: credential (login, verify, password, MFA), document and e-signature (document, contract, agreement, proposal, sign, DocuSign), finance and HR (invoice, receipt, paystub, payroll, salary, bonus, benefit, W-2, tax, refund, statement), update/notice and brand names. Short words (sign, tax, fax, hr, w2, rfq, rfp) need a non-letter on both sides. A hit adds 15 to the score and makes a generic-hosting link eligible. Tune if a frequent legitimate sender trips it.
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_bulk_sender_regex]
definition = "^(no-?reply|do-?not-?reply|bounces?[-+._]|mailer-daemon|newsletters?|notifications?|notify|marketing)[^@]*@|^[0-9a-f]{16}-[0-9a-f]{8}-[0-9a-f]{4}-|@([a-z0-9-]+\\.)*(send|mail|email|em|e|news|newsletter|notify|notifications|bounces?|mg|mailer|marketing)-?\\d*\\.[a-z0-9-]+\\.[a-z.]+$|@([a-z0-9-]+\\.)*(mcdlv\\.net|mcsv\\.net|rsgsv\\.net|list-manage\\.com|beehiiv\\.com|sendgrid\\.net|amazonses\\.com|hubspotemail\\.net|hs-email\\.net|constantcontact\\.com|ccsend\\.com|mailgun\\.org|sparkpostmail\\.com|klaviyomail\\.com|mktomail\\.com|exacttarget\\.com|substack\\.com|createsend\\.com|cmail\\d+\\.com|mandrillapp\\.com|e2ma\\.net|sender-sib\\.com|sendibm\\d*\\.com|sendinblue\\.com|brevosend\\.com|brevo\\.com)$"
description = v1.1 Regex (string literal for match()) on the lowercased sender address that marks newsletter / email-service-provider mail: no-reply and bounce mailboxes, Amazon SES VERP addresses, ESP sending subdomains (send., mail., em-1234. ...) and ESP domains (Mailchimp, SendGrid, SES, Brevo/Sendinblue, HubSpot ...). When any sender of a link matches, every delivered copy of that link scores -15. Small businesses increasingly host tracking, unsubscribe and booking pages on AI builders, so this is the main noise control.
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_freemail_regex]
definition = "@(gmail|googlemail|outlook|hotmail|live|msn|yahoo|ymail|aol|icloud|me|mac|proton|protonmail|pm|gmx|mail|zoho|yandex|tutanota|fastmail)\\.[a-z]{2,3}(\\.[a-z]{2})?$"
description = v1.1 Regex (string literal for match()) on the lowercased sender address for consumer free-mail domains. A free-mail sender linking to an AI-built site scores +10.
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_min_score]
definition = 20
description = v1.1 Lowest per-link score (before the identity multiplier) that is emitted. 20 drops a plain AI-builder link from a bulk/ESP sender with no other indicator (25-15=10) and keeps any other delivered AI-builder link. Raise to 35 to keep only links with a second indicator (lure, payload, free-mail sender, stopped copies or a visit).
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_delivered_actions]
definition = "delivered","allowed"
description = v1.1 Lowercase Email.action values that mean the message reached the mailbox. Only these rows can create risk. Proofpoint and Exchange use delivered.
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_blocked_actions]
definition = "blocked","quarantined","quarantine","dropped","rejected"
description = v1.1 Lowercase Email.action values that are a hard gateway block. A recipient whose copy was blocked counts as stopped. When the gateway stopped links to the same site for other recipients in the window, each delivered copy scores +15 (partially caught campaign); for a generic-hosting link this also makes it eligible unless the link came from a bulk/ESP sender. Discards count only if listed in _discard_actions (opt-in).
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_discard_actions]
definition = "__none__"
description = v1.1 Opt-in. Lowercase Email.action values for a gateway discard that should count as stopped, e.g. "deleted","discarded","discard" (Proofpoint disposition discard maps to deleted). Ships as "__none__" because on Tenant A deleted is a routine graymail/bulk disposition (about 190k URL-bearing events a day, mostly vendor and conference marketing); counting it as stopped turned legitimate marketing links into risk. Enable only if your gateway uses discard solely for malicious mail. A discarded copy then counts as stopped unless the same recipient also has a delivered copy of the same link (relay duplicate).
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_benign_link_regex]
definition = "(unsubscribe|preference|opt-?out|email-?settings|subscription|manage-?(email|subscription)|view-?in-?browser|webversion)"
description = v1.1 Regex (string literal for match()) on the lowercased host and path for newsletter housekeeping links (unsubscribe, preference centre, subscription management, web version). A hit clears the lure flag, so words such as update in update-preferences do not score as a lure. Payload and other signals are unaffected.
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation. Fields: user (recipient address), recipient, url_host (host of the top-scoring link), top_link, url_hosts, url_host_list, links, link_count, ai_platforms, provider, senders, sender_list, sender_count, subject, email_events, lure, payload, freemail_sender, link_bulk, other_stopped, clicked, evidence, base_score, risk_multiplier, risk_score. Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_generated_phishing_indicators_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust or override risk_score (keep it at or below 100) per tenant. Ships as search *.
disabled = False
iseval = 0

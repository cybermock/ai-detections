[Threat - HDSI AI Generated Phishing Indicators - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Generated Phishing Indicators
action.correlationsearch.annotations = {"mitre_attack": ["T1566.002", "T1608.005", "T1588.007"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$risk_object$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI-builder links emailed to $recipient$","search":"| tstats summariesonly=t allow_old_summaries=t count values(All_Email.action) as action values(All_Email.subject) as subject min(_time) as firstTime max(_time) as lastTime from datamodel=Email.All_Email where All_Email.recipient=\"$recipient$\" `hdsi_ai_generated_phishing_indicators_url_prefilter` by All_Email.src_user All_Email.recipient All_Email.url | rename All_Email.* as * | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, src_user, recipient, action, url, subject, count | sort - lastTime","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View who visited $url_host$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count values(Web.action) as action values(Web.url) as url min(_time) as firstTime max(_time) as lastTime from datamodel=Web where (Web.url_domain=\"$url_host$\" OR Web.site=\"$url_host$\") by Web.user Web.src Web.url_domain Web.site | rename Web.* as * | eval url_domain=if(url_domain!=\"unknown\",url_domain,site) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, url_domain, action, count, url | sort - lastTime","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = $recipient$ received $email_events$ delivered email event(s) from $sender_count$ external sender(s) linking to site(s) on AI site-builder or generic static hosting ($provider$: $url_host_list$). Evidence: $evidence$.
action.notable.param.rule_title = HDSI AI Generated Phishing Indicators ($user$)
action.notable.param.security_domain = threat
action.notable.param.severity = medium
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":25}]
action.risk.param._risk_message = $recipient$ received delivered email from $sender_list$ linking to AI-builder or generic static hosting site(s) $url_host_list$ ($provider$). Evidence: $evidence$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 12 * * * *
description = v1.1.0 Detects delivered inbound email linking to sites published with AI site and app builders (Lovable, v0, Gamma, Base44, Bolt, Create, Replit, Framer, Figma Sites) and to Vercel/Netlify hosts with lure wording, a payload file or copies the gateway blocked for other recipients, a documented delivery channel for AI-generated phishing pages. Risk on the internal recipient, scored up for lure wording, payload links, free-mail senders, a partially blocked campaign and a recipient visit. No notable.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t count as email_events min(_time) as firstTime max(_time) as lastTime values(All_Email.subject) as subject from datamodel=Email.All_Email where `hdsi_ai_generated_phishing_indicators_url_prefilter` NOT All_Email.recipient="unknown" `hdsi_ai_generated_phishing_indicators_filter` by All_Email.recipient All_Email.src_user All_Email.url All_Email.action \
	| rename All_Email.* as * \
	| rex field=url "^(?:[A-Za-z][A-Za-z0-9+.-]*://)?(?:[^@/?#]*@)?(?<url_host>[^/:?#\s]+)(?::\d+)?(?<url_path>/[^?#\s]*)?" \
	| eval recipient=lower(recipient), sender_lc=lower(src_user), rcpt_domain=replace(recipient,"^.*@",""), sender_domain=replace(sender_lc,"^.*@",""), url_host=replace(lower(trim(url_host,".")),"^www\\d*\\.",""), url_path=lower(coalesce(url_path,"/")) \
	| `hdsi_ai_generated_phishing_indicators_platform` \
	| where isnotnull(ai_platform) AND NOT match(url_path, `hdsi_ai_generated_phishing_indicators_static_path_regex`) \
	| search NOT url_host IN (`hdsi_ai_generated_phishing_indicators_allowed_hosts`) \
	| eval link=url_host.replace(url_path,"/+$",""), site_key=if(url_host="gamma.app", link, url_host), link_text=url_host." ".replace(url_path,"^/(docs|public|embed)/",""), lure=if(match(link_text, `hdsi_ai_generated_phishing_indicators_lure_regex`) AND NOT match(link_text, `hdsi_ai_generated_phishing_indicators_benign_link_regex`),1,0), payload=if(match(url_path, `hdsi_ai_generated_phishing_indicators_payload_regex`),1,0), act=lower(action), delivered=if(in(act, `hdsi_ai_generated_phishing_indicators_delivered_actions`),1,0), hard_block=if(in(act, `hdsi_ai_generated_phishing_indicators_blocked_actions`),1,0), discard=if(in(act, `hdsi_ai_generated_phishing_indicators_discard_actions`),1,0) \
	| eventstats max(delivered) as rcpt_link_delivered by recipient link \
	| eval stopped=if(hard_block=1 OR (discard=1 AND rcpt_link_delivered=0),1,0) \
	| eventstats dc(eval(if(stopped=1,recipient,null()))) as site_stopped_rcpts by site_key \
	| eventstats max(stopped) as own_stopped by recipient site_key \
	| eval other_stopped=site_stopped_rcpts-own_stopped, bulk_sender=if(match(sender_lc, `hdsi_ai_generated_phishing_indicators_bulk_sender_regex`),1,0), freemail_sender=if(match(sender_lc, `hdsi_ai_generated_phishing_indicators_freemail_regex`),1,0) \
	| eventstats max(bulk_sender) as link_bulk by link \
	| where delivered=1 AND (platform_tier="ai_builder" OR lure=1 OR payload=1 OR (other_stopped>0 AND link_bulk=0)) \
	| `hdsi_ai_generated_phishing_indicators_internal_domains` \
	| eval sender_internal=if(like(internal_domains,"%|".sender_domain."|%"),1,0), rcpt_internal=if(like(internal_domains,"%|".rcpt_domain."|%"),1,0) \
	| search sender_internal=0 NOT `cim_corporate_email_domain_search("src_user")` \
	| lookup identity_lookup_expanded identity as recipient OUTPUT identity as rcpt_identity \
	| search rcpt_identity=* OR rcpt_internal=1 OR `cim_corporate_email_domain_search("recipient")` \
	| eval user=recipient, id_key=lower(coalesce(mvindex(rcpt_identity,0),recipient)), side="email" \
	| append [| tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count as click_events from datamodel=Web where `hdsi_ai_generated_phishing_indicators_web_prefilter` NOT Web.user="unknown" `hdsi_ai_generated_phishing_indicators_web_filter` by Web.user Web.url_domain Web.site \
		| rename Web.* as * \
		| where user!="unknown" \
		| eval url_host=replace(lower(trim(if(url_domain!="unknown",url_domain,site),".")),"^www\\d*\\.",""), web_user=lower(replace(user,"^[^\\\\]+[\\\\]","")) \
		| lookup identity_lookup_expanded identity as web_user OUTPUT identity as web_identity \
		| eval id_key=lower(coalesce(mvindex(web_identity,0),web_user)), side="web" \
		| fields id_key url_host click_events side] \
	| eventstats max(eval(if(side="web",1,0))) as clicked by id_key url_host \
	| where side="email" \
	| eval row_score=if(platform_tier="ai_builder",25,20)+if(lure=1,15,0)+if(payload=1,20,0)+if(freemail_sender=1,10,0)+if(other_stopped>0,15,0)+if(clicked=1,20,0)-if(link_bulk=1,15,0) \
	| where row_score>=`hdsi_ai_generated_phishing_indicators_min_score` \
	| sort 0 user -row_score \
	| stats first(row_score) as base_score first(url_host) as url_host first(link) as top_link first(lure) as lure first(payload) as payload first(freemail_sender) as freemail_sender first(link_bulk) as link_bulk first(other_stopped) as other_stopped first(clicked) as clicked sum(email_events) as email_events dc(link) as link_count values(url_host) as url_hosts values(link) as links values(ai_platform) as ai_platforms values(src_user) as senders dc(src_user) as sender_count values(subject) as subject min(firstTime) as firstTime max(lastTime) as lastTime by user \
	| `ai_risk_multiplier` \
	| eval risk_score=min(60, round(base_score*coalesce(risk_multiplier,1),0)), recipient=user, evidence=mvappend(if(lure=1,"lure wording in link",null()), if(payload=1,"link to a downloadable file (archive/script/executable)",null()), if(freemail_sender=1,"free-mail sender",null()), if(link_bulk=1,"bulk or ESP sender",null()), if(other_stopped>0,"gateway stopped the same site for ".other_stopped." other recipient(s)",null()), if(clicked=1,"recipient web traffic reached the host",null())), evidence=coalesce(mvjoin(evidence,"; "),"delivered link only"), provider=mvjoin(ai_platforms,", "), url_host_list=mvjoin(mvindex(url_hosts,0,4),", "), sender_list=mvjoin(mvindex(senders,0,2),", "), links=mvindex(links,0,9), subject=mvindex(subject,0,4) \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="ai_builder_phishing_link", detection_id="hdsi_ai_generated_phishing_indicators", mitre_attack="T1566.002,T1608.005,T1588.007", ai_kill_chain_phase="initial_access" \
	| `hdsi_ai_generated_phishing_indicators_customizations` \
	| `hdsi_ai_generated_phishing_indicators_risk_score`

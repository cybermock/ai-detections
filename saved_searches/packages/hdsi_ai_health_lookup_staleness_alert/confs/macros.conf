[hdsi_ai_health_lookup_staleness_alert_filter]
definition = ()
description = v1.1 Tenant exclusion hook, inline in the search clause that runs after each lookup's status is computed (fields: lookup_name, status, curated, age_days, enabled_rows, missing_controls, medium_risk_threshold, high_risk_threshold, ...). Example: (NOT (lookup_name="ai_api_key_patterns" status="AGE_UNKNOWN")). Ships as () so nothing is excluded.
disabled = False
iseval = 0

[hdsi_ai_health_lookup_staleness_alert_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped before the final alert=1 filter, so it can override status, severity or alert (for example eval alert=if(status="AGE_UNKNOWN",1,alert) to be reminded about lookups that carry no review date). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_health_lookup_staleness_alert_curated_lookups]
definition = "ai_provider_domains,ai_provider_apps,ai_tool_processes,ai_api_key_patterns,ai_prompt_injection_patterns"
description = v1.1 Quoted, comma-separated lookup definitions whose content goes out of date as AI products change (provider domains and SaaS app names, AI tool process names, API-key and prompt-injection pattern libraries). Each must exist, must hold at least one enabled row, and is STALE when its newest review date (max of the last_verified column and the file modification time) is older than max_age_days, or when more than stale_row_pct percent of its enabled rows were last verified before that limit. These are the lookups the shipped AI-RBA detections read for matching.
disabled = False
iseval = 0

[hdsi_ai_health_lookup_staleness_alert_config_lookups]
definition = "ai_sanctioned_entities,ai_department_sensitivity,ai_detection_config"
description = v1.1 Quoted, comma-separated configuration lookup definitions that detections read with lookup (a missing one is a FATAL search error) but that do not age with time, so they are only checked for presence. ai_sanctioned_entities is also checked for enabled entries that have expired or expire within expiry_warn_days.
disabled = False
iseval = 0

[hdsi_ai_health_lookup_staleness_alert_rule_title_regex]
definition = "HDSI (RBA )?AI "
description = v1.1 Case-sensitive regex (used with where match) for the titles of the AI-RBA detections and aggregators that gate the alert: a notable is only created when at least one enabled, scheduled saved search matches it (health checks excluded). REST saved/searches is read unfiltered because its search="title=<wildcard>" argument returns no rows on Splunk Cloud; a case-insensitive search title=*HDSI*AI* would also count unrelated HDSI rules whose titles contain words such as Chain or Email.
disabled = False
iseval = 0

[hdsi_ai_health_lookup_staleness_alert_required_controls]
definition = "medium_risk_threshold,high_risk_threshold"
description = v1.1 Quoted, comma-separated control_name rows of ai_detection_config that shipped searches still read with lookup ai_detection_config control_name OUTPUTNEW value. Only the user risk aggregators do: hdsi_rba_ai_user_risk_threshold_exceeded (medium and high) and hdsi_rba_ai_user_critical_risk_threshold_exceeded (high). They fall back to built-in defaults (medium 60, high 90) when a row is missing or not numeric, so a missing row is reported as MISSING_CONTROLS (low: tenant tuning is ignored), not as a failure. The other ai_detection_config rows are marked DEPRECATED and have no reader, so they are not required. Add a name here only when a search starts reading a new control.
disabled = False
iseval = 0

[hdsi_ai_health_lookup_staleness_alert_max_age_days]
definition = 90
description = v1.1 A curated lookup is STALE when its newest review date (last_verified column or file modification time, whichever is newer) is more than this many days old. 90 days matches the pace at which AI providers add domains and apps; raise it only if the tenant reviews the lists on a slower, documented cycle.
disabled = False
iseval = 0

[hdsi_ai_health_lookup_staleness_alert_stale_row_pct]
definition = 50
description = v1.1 A curated lookup is also STALE when more than this percentage of its enabled rows carry a last_verified date older than max_age_days, even if a few rows were re-verified recently (a partial refresh must not hide a mostly out-of-date list). Only applies to lookups with a last_verified column.
disabled = False
iseval = 0

[hdsi_ai_health_lookup_staleness_alert_expiry_warn_days]
definition = 14
description = v1.1 ai_sanctioned_entities entries that are enabled and expire within this many days are reported as EXPIRING_ENTRIES, so the owner can renew an approved exemption before the users it covers start to accumulate AI risk.
disabled = False
iseval = 0

[hdsi_ai_health_lookup_staleness_alert_content_stats(1)]
args = lookup
definition = inputlookup $lookup$ | eval zz_enabled=coalesce(tonumber(enabled),1), zz_verified=strptime(last_verified,"%Y-%m-%d"), zz_expires=strptime(expires,"%Y-%m-%d"), zz_today=relative_time(now(),"@d"), zz_stale_before=zz_today-86400*`hdsi_ai_health_lookup_staleness_alert_max_age_days`, zz_warn_until=zz_today+86400*`hdsi_ai_health_lookup_staleness_alert_expiry_warn_days` | stats count as content_rows, sum(eval(if(zz_enabled=1,1,0))) as enabled_rows, max(zz_verified) as newest_verified, count(zz_verified) as verified_rows, sum(eval(if(zz_enabled=1 AND zz_verified<zz_stale_before,1,0))) as stale_rows, sum(eval(if(zz_enabled=1 AND zz_expires<zz_today,1,0))) as expired_enabled, sum(eval(if(zz_enabled=1 AND zz_expires>=zz_today AND zz_expires<zz_warn_until,1,0))) as expiring_enabled | eval lookup_name="$lookup$"
description = v1.1 Generating search used inside an append subsearch: reads one AI-RBA lookup and always returns exactly one row of content facts: content_rows, enabled_rows (enabled column, default 1), newest_verified, verified_rows and stale_rows (optional last_verified YYYY-MM-DD column), expired_enabled and expiring_enabled (optional expires YYYY-MM-DD column). Columns a lookup does not have yield null or 0. A missing lookup yields content_rows=0 plus a non-fatal ERROR message; the REST definition and file checks then report it as missing.
disabled = False
iseval = 0

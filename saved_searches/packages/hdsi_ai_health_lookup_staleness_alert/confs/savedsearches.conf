[Audit - HDSI AI Health Lookup Staleness Alert - Rule]
action.correlationsearch.annotations = {}
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Health Lookup Staleness Alert
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 1
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View AI-RBA lookup definitions, files and file modification times","search":"| rest /servicesNS/-/-/data/transforms/lookups splunk_server=local count=0 | where match(title,\"^ai_\") | eval lookup_name=title, file_key=lower(filename), def_app='eai:acl.app' | fields lookup_name file_key def_app collection | join type=left max=1 file_key [| rest /servicesNS/-/-/data/lookup-table-files splunk_server=local count=0 | where match(title,\"^ai_\") | eval file_key=lower(title), file_app='eai:acl.app', file_epoch=strptime(updated,\"%Y-%m-%dT%H:%M:%S%:z\") | eval last_file_update=if(file_epoch>86400, strftime(file_epoch,\"%Y-%m-%d %H:%M:%S %z\"), \"not reported (app-shipped file)\") | stats values(file_app) as file_app values(last_file_update) as last_file_update by file_key] | table lookup_name def_app file_key file_app last_file_update collection | sort lookup_name","earliest_offset":"-1d@d","latest_offset":"now"},{"name":"View the rows of $lookup_name$ (oldest last_verified first) with their enabled, last_verified and expires values","search":"| inputlookup $lookup_name$ | eval enabled=coalesce(enabled,\"1 (no enabled column)\"), last_verified=coalesce(last_verified,\"(no last_verified column)\"), expires=coalesce(expires,\"-\") | sort 0 last_verified | head 1000","earliest_offset":"-1d@d","latest_offset":"now"},{"name":"View enabled AI-RBA detections that read $lookup_name$ directly","search":"| rest /servicesNS/-/-/saved/searches splunk_server=local count=0 f=title f=disabled f=is_scheduled f=search f=cron_schedule f=next_scheduled_time f=eai:acl | where match(title,\"HDSI (RBA )?AI \") AND NOT match(title,\"HDSI AI Health \") AND disabled=0 AND is_scheduled=1 | eval lookup_name=mvappend(if(match(search,\"ai_domains_filter|ai_provider_domains\"),\"ai_provider_domains\",null()), if(match(search,\"ai_domains_filter|ai_provider_apps\"),\"ai_provider_apps\",null()), if(match(search,\"ai_process_filter|ai_process_enrich|ai_tool_processes\"),\"ai_tool_processes\",null()), if(match(search,\"ai_api_key_patterns\"),\"ai_api_key_patterns\",null()), if(match(search,\"ai_prompt_injection_patterns\"),\"ai_prompt_injection_patterns\",null()), if(match(search,\"ai_unsanctioned_filter|ai_sanctioned_entities\"),\"ai_sanctioned_entities\",null()), if(match(search,\"ai_risk_multiplier|ai_department_sensitivity\"),\"ai_department_sensitivity\",null()), if(match(search,\"ai_detection_config\"),\"ai_detection_config\",null())) | mvexpand lookup_name | search lookup_name=\"$lookup_name$\" | eval app='eai:acl.app' | table title app cron_schedule next_scheduled_time lookup_name","earliest_offset":"-1d@d","latest_offset":"now"}]
action.notable.param.rule_description = The AI-RBA lookup $lookup_name$ is $status$: $reason$ $enabled_ai_rules$ HDSI AI-RBA detection(s) are enabled on this search head.
action.notable.param.rule_title = HDSI AI Health Lookup Staleness Alert ($lookup_name$ $status$)
action.notable.param.security_domain = audit
action.notable.param.severity = medium
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = lookup_name,status
alert.suppress.period = 518400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 15 9 * * *
description = v1.1.0 Daily audit health check for the lookups that HDSI AI-RBA detections read (ai_provider_domains, ai_provider_apps, ai_tool_processes, ai_api_key_patterns, ai_prompt_injection_patterns, ai_sanctioned_entities, ai_department_sensitivity, ai_detection_config). Reports a lookup whose definition or file is missing (every dependent search fails), a curated list with no enabled rows, user risk threshold rows in ai_detection_config that leave the medium aggregator band empty or start at zero (high) or that are missing or non-numeric, so the aggregators silently use their defaults (low), a curated list whose newest review date (last_verified column or file modification time) is older than 90 days or whose enabled rows are mostly unverified for 90 days, and sanctioned-use entries that have expired or expire within 14 days. Creates one audit notable per lookup and status, only when at least one HDSI AI-RBA detection (title matching "HDSI AI " or "HDSI RBA AI ", health checks excluded) is enabled and scheduled. No risk, no email.
disabled = 0
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | makeresults \
	| eval lookup_name=split(`hdsi_ai_health_lookup_staleness_alert_curated_lookups`.",".`hdsi_ai_health_lookup_staleness_alert_config_lookups`, ",") \
	| mvexpand lookup_name \
	| eval lookup_name=trim(lookup_name), expected=1, curated=if(match(",".`hdsi_ai_health_lookup_staleness_alert_curated_lookups`.",", ",".lookup_name.","), 1, 0) \
	| fields lookup_name expected curated \
	| append [| rest /servicesNS/-/-/data/transforms/lookups splunk_server=local count=0 | where match(title,"^ai_") | eval lookup_name=title, def_app='eai:acl.app', def_file=lower(filename), def_kv=if(len(collection)>0 OR len(external_type)>0, 1, 0) | fields lookup_name def_app def_file def_kv] \
	| append [| `hdsi_ai_health_lookup_staleness_alert_content_stats(ai_provider_domains)`] \
	| append [| `hdsi_ai_health_lookup_staleness_alert_content_stats(ai_provider_apps)`] \
	| append [| `hdsi_ai_health_lookup_staleness_alert_content_stats(ai_tool_processes)`] \
	| append [| `hdsi_ai_health_lookup_staleness_alert_content_stats(ai_api_key_patterns)`] \
	| append [| `hdsi_ai_health_lookup_staleness_alert_content_stats(ai_prompt_injection_patterns)`] \
	| append [| `hdsi_ai_health_lookup_staleness_alert_content_stats(ai_sanctioned_entities)`] \
	| append [| `hdsi_ai_health_lookup_staleness_alert_content_stats(ai_department_sensitivity)`] \
	| append [| `hdsi_ai_health_lookup_staleness_alert_content_stats(ai_detection_config)`] \
	| append [| makeresults | eval control_name=split(`hdsi_ai_health_lookup_staleness_alert_required_controls`, ","), required=1 | mvexpand control_name | eval control_name=trim(control_name) | append [| inputlookup ai_detection_config | eval control_value=tonumber(value) | where isnotnull(control_value) | eval present=1 | fields control_name present control_value] | stats max(required) as required, max(present) as present, max(control_value) as control_value by control_name | where required=1 | eval missing_control=if(isnull(present), control_name, null()), cfg_medium=if(control_name="medium_risk_threshold", control_value, null()), cfg_high=if(control_name="high_risk_threshold", control_value, null()) | stats count(missing_control) as missing_controls_count, values(missing_control) as missing_controls, max(cfg_medium) as cfg_medium, max(cfg_high) as cfg_high | eval lookup_name="ai_detection_config"] \
	| stats max(expected) as expected, max(curated) as curated, count(def_app) as def_count, values(def_app) as def_app, values(def_file) as def_file, max(def_kv) as def_kv, max(content_rows) as content_rows, max(enabled_rows) as enabled_rows, max(newest_verified) as newest_verified, max(verified_rows) as verified_rows, max(stale_rows) as stale_rows, max(expired_enabled) as expired_enabled, max(expiring_enabled) as expiring_enabled, max(missing_controls_count) as missing_controls_count, values(missing_controls) as missing_controls, max(cfg_medium) as cfg_medium, max(cfg_high) as cfg_high by lookup_name \
	| where expected=1 \
	| eval file_key=coalesce(mvindex(def_file,0), lookup_name.".csv") \
	| append [| rest /servicesNS/-/-/data/lookup-table-files splunk_server=local count=0 | where match(title,"^ai_") | eval file_key=lower(title), file_app='eai:acl.app', file_epoch=strptime(updated,"%Y-%m-%dT%H:%M:%S%:z") | eval file_epoch=if(file_epoch>86400, file_epoch, null()) | fields file_key file_app file_epoch] \
	| append [| rest /servicesNS/-/-/saved/searches splunk_server=local count=0 f=title f=disabled f=is_scheduled | where match(title, `hdsi_ai_health_lookup_staleness_alert_rule_title_regex`) AND NOT match(title, "HDSI AI Health ") AND disabled=0 AND is_scheduled=1 | stats dc(title) as enabled_ai_rules] \
	| eventstats count(file_app) as file_count, values(file_app) as file_app, max(file_epoch) as file_epoch by file_key \
	| eventstats max(enabled_ai_rules) as enabled_ai_rules \
	| where expected=1 \
	| fillnull value=0 curated def_count def_kv file_count content_rows enabled_rows verified_rows stale_rows expired_enabled expiring_enabled missing_controls_count enabled_ai_rules \
	| eval max_age_days=`hdsi_ai_health_lookup_staleness_alert_max_age_days`, expiry_warn_days=`hdsi_ai_health_lookup_staleness_alert_expiry_warn_days`, stale_row_pct=`hdsi_ai_health_lookup_staleness_alert_stale_row_pct` \
	| eval medium_risk_threshold=if(lookup_name="ai_detection_config", coalesce(cfg_medium, 60), null()), high_risk_threshold=if(lookup_name="ai_detection_config", coalesce(cfg_high, 90), null()), bad_band=if(lookup_name="ai_detection_config" AND (medium_risk_threshold<=0 OR medium_risk_threshold>=high_risk_threshold), 1, 0) \
	| eval last_reviewed=max(coalesce(file_epoch,0), coalesce(newest_verified,0)), last_reviewed=if(last_reviewed>0, last_reviewed, null()) \
	| eval review_source=case(isnull(last_reviewed), "none", isnotnull(newest_verified) AND newest_verified>=coalesce(file_epoch,0), "last_verified column", true(), "file modification time"), age_days=if(isnotnull(last_reviewed), floor((now()-last_reviewed)/86400), null()) \
	| eval status=case(def_count=0, "MISSING_DEFINITION", def_kv=0 AND file_count=0, "MISSING_FILE", curated=1 AND enabled_rows=0, "EMPTY", bad_band=1, "INVALID_CONTROLS", missing_controls_count>0, "MISSING_CONTROLS", curated=1 AND (age_days>max_age_days OR (verified_rows>0 AND stale_rows*100>enabled_rows*stale_row_pct)), "STALE", expired_enabled>0, "EXPIRED_ENTRIES", expiring_enabled>0, "EXPIRING_ENTRIES", curated=1 AND isnull(age_days), "AGE_UNKNOWN", true(), "OK") \
	| eval last_reviewed_date=if(isnotnull(last_reviewed), strftime(last_reviewed,"%Y-%m-%d"), "unknown"), newest_verified_date=if(isnotnull(newest_verified), strftime(newest_verified,"%Y-%m-%d"), "none"), last_file_update=if(isnotnull(file_epoch), strftime(file_epoch,"%Y-%m-%d %H:%M:%S %z"), "not reported") \
	| eval reason=case(status="MISSING_DEFINITION", "no lookup definition named ".lookup_name." is visible on this search head, so every AI-RBA search that reads it stops with a FATAL lookup error.", status="MISSING_FILE", "the lookup definition exists but its file ".file_key." is not visible, so every AI-RBA search that reads it stops with a FATAL lookup error.", status="EMPTY", "the lookup has ".content_rows." rows and none is enabled, so the detections that match against it cannot find anything.", status="INVALID_CONTROLS", "the effective user risk thresholds are medium_risk_threshold=".medium_risk_threshold." and high_risk_threshold=".high_risk_threshold." (a missing or non-numeric row uses the aggregator default, 60 or 90). ".if(medium_risk_threshold<=0, "A medium threshold of 0 or less makes hdsi_rba_ai_user_risk_threshold_exceeded fire for every user with any AI risk.", "The medium band (at least medium, below high) is empty, so hdsi_rba_ai_user_risk_threshold_exceeded can never create a notable."), status="MISSING_CONTROLS", missing_controls_count." control row(s) that the user risk aggregators read are missing or not numeric (".mvjoin(missing_controls,", ")."), so the aggregators use the built-in default for each (medium_risk_threshold 60, high_risk_threshold 90) and any tenant tuning of that row is ignored.", status="STALE", "the newest review date is ".last_reviewed_date." (".review_source."), ".age_days." days ago; the limit is ".max_age_days." days. ".if(verified_rows>0, stale_rows." of ".enabled_rows." enabled rows were last verified more than ".max_age_days." days ago (limit ".stale_row_pct."%).", "The lookup has no last_verified column."), status="EXPIRED_ENTRIES", expired_enabled." enabled entries are past their expires date and no longer exempt anyone; renew or disable them.", status="EXPIRING_ENTRIES", expiring_enabled." enabled entries expire within ".expiry_warn_days." days; renew them before the covered identities start to accumulate AI risk.", status="AGE_UNKNOWN", "the lookup has no last_verified column and the file reports no modification time (typical for app-shipped files), so its age cannot be measured.", curated=1, "present, populated and reviewed within ".max_age_days." days.", true(), "present (configuration lookup: checked for presence, required controls and expiry, not for age).") \
	| eval severity=case(in(status,"MISSING_DEFINITION","MISSING_FILE","EMPTY","INVALID_CONTROLS"), "high", in(status,"STALE","EXPIRED_ENTRIES"), "medium", true(), "low"), alert=if(enabled_ai_rules>0 AND NOT in(status,"OK","AGE_UNKNOWN"), 1, 0) \
	| search lookup_name=* `hdsi_ai_health_lookup_staleness_alert_filter` \
	| `hdsi_ai_health_lookup_staleness_alert_customizations` \
	| where alert=1 \
	| table lookup_name, status, severity, reason, age_days, last_reviewed_date, review_source, newest_verified_date, last_file_update, content_rows, enabled_rows, verified_rows, stale_rows, expired_enabled, expiring_enabled, missing_controls_count, missing_controls, medium_risk_threshold, high_risk_threshold, def_app, file_app, file_key, curated, enabled_ai_rules, max_age_days, stale_row_pct

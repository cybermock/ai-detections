description = v1.1.0 Detects AI command-line agents (Claude Code, Codex, Gemini CLI, GitHub Copilot CLI, Amazon Q, Aider, llm and others, including node-, python- and natively-installed builds) started without a person at the keyboard: launched by a script interpreter, build tool, orchestrator or another AI agent, run headless (-p, --print, codex exec), or run with flags that switch off the agent's approval prompts or sandbox. Risk on the user (when attributable) and the system, no notable.

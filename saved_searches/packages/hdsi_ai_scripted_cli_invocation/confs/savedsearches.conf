search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where (Processes.process_name IN (`hdsi_ai_scripted_cli_invocation_cli_names`) OR (Processes.process_name IN (`hdsi_ai_scripted_cli_invocation_js_hosts`) AND Processes.process IN (`hdsi_ai_scripted_cli_invocation_node_cli_patterns`)) OR (Processes.process_name IN (`hdsi_ai_scripted_cli_invocation_py_hosts`) AND Processes.process IN (`hdsi_ai_scripted_cli_invocation_python_cli_patterns`)) OR (Processes.process_name IN (`hdsi_ai_scripted_cli_invocation_native_version_names`) AND Processes.process IN (`hdsi_ai_scripted_cli_invocation_native_cli_patterns`)) OR (Processes.process_name IN (`hdsi_ai_scripted_cli_invocation_amazon_q_names`) AND Processes.process IN ("* chat*"))) `hdsi_ai_scripted_cli_invocation_filter` by Processes.user Processes.dest Processes.parent_process_name Processes.parent_process Processes.process_name Processes.process \
	| rename Processes.* as * \
	| eval src=if(lower(dest) IN ("unknown","-",""), null(), dest), pn_lc=lower(replace(process_name,"^.*[\\\\/]","")), parent_lc=lower(replace(parent_process_name,"^.*[\\\\/]","")), cmd_lc=if(lower(process) IN ("unknown","-",""), "", lower(process)), parent_cmd_lc=if(lower(parent_process) IN ("unknown","-",""), "", lower(parent_process)), is_js_host=if(match(pn_lc,"^(node|bun|deno)(\\.exe)?$"),1,0), is_py_host=if(match(pn_lc,"^(python[0-9.]*w?|py)(\\.exe)?$"),1,0) \
	| eval process_name_lc=case(is_js_host=1 AND match(cmd_lc,"claude-code|[\\\\/]bin[\\\\/]claude(\\s|$)"),"claude", is_js_host=1 AND match(cmd_lc,"@openai[\\\\/]codex|[\\\\/]bin[\\\\/]codex(\\s|$)"),"codex", is_js_host=1 AND match(cmd_lc,"gemini-cli|[\\\\/]bin[\\\\/]gemini(\\s|$)"),"gemini", is_js_host=1 AND match(cmd_lc,"@github[\\\\/]copilot|[\\\\/]bin[\\\\/]copilot(\\s|$)"),"gh-copilot", is_js_host=1 AND match(cmd_lc,"@qwen-code[\\\\/]|[\\\\/]bin[\\\\/]qwen(\\s|$)"),"qwen", is_py_host=1 AND match(cmd_lc,"[\\\\/]bin[\\\\/]aider(\\s|$)|\\s-m\\s+aider(\\s|$)"),"aider", is_py_host=1 AND match(cmd_lc,"[\\\\/]bin[\\\\/]llm(\\s|$)|\\s-m\\s+llm(\\s|$)"),"llm", is_py_host=1 AND match(cmd_lc,"[\\\\/]bin[\\\\/]sgpt(\\s|$)"),"sgpt", match(pn_lc,"^[0-9]+\\.[0-9]+\\.[0-9]+") AND match(cmd_lc,"(^|[\\\\/\\s\"])claude(\\s|\"|$)|[\\\\/]claude[\\\\/]versions[\\\\/]"),"claude", match(pn_lc,"^copilot(\\.exe)?$"),"gh-copilot", match(pn_lc,"^(q|qchat)(\\.exe)?$"),"amazon-q", true(),pn_lc) \
	| `hdsi_ai_scripted_cli_invocation_name_collision_check` \
	| `ai_process_filter` \
	| where usage_type="cli" AND isnotnull(src) \
	| eval js_parent=if(match(parent_lc,"^(node|bun|deno)(\\.exe)?$"),1,0), parent_tool=case(js_parent=1 AND match(parent_cmd_lc,"claude-code|[\\\\/]bin[\\\\/]claude(\\s|\"|$)"),"claude", js_parent=1 AND match(parent_cmd_lc,"@openai[\\\\/]codex|[\\\\/]bin[\\\\/]codex(\\s|\"|$)"),"codex", js_parent=1 AND match(parent_cmd_lc,"gemini-cli|[\\\\/]bin[\\\\/]gemini(\\s|\"|$)"),"gemini", js_parent=1 AND match(parent_cmd_lc,"@github[\\\\/]copilot|[\\\\/]bin[\\\\/]copilot(\\s|\"|$)"),"gh-copilot", js_parent=1 AND match(parent_cmd_lc,"@qwen-code[\\\\/]|[\\\\/]bin[\\\\/]qwen(\\s|\"|$)"),"qwen", match(parent_lc,"^[0-9]+\\.[0-9]+\\.[0-9]+") AND match(parent_cmd_lc,"(^|[\\\\/\\s\"])claude(\\s|\"|$)|[\\\\/]claude[\\\\/]versions[\\\\/]"),"claude", match(parent_lc,"^copilot(\\.exe)?$"),"gh-copilot", match(parent_lc,"^(q|qchat)(\\.exe)?$"),"amazon-q", match(parent_lc,"^(claude|codex|gemini|gh-copilot|qwen|cursor-agent|opencode|goose|crush|amp|aider|kiro-cli|amazon-q|cline)(\\.exe)?$"),replace(parent_lc,"\\.exe$","")) \
	| eval parent_class=case(parent_lc IN ("unknown","-",""),"none", match(parent_lc,`hdsi_ai_scripted_cli_invocation_ide_parents`) OR match(parent_cmd_lc,`hdsi_ai_scripted_cli_invocation_ide_host_cmd`) OR (js_parent=1 AND parent_cmd_lc="" AND match(cmd_lc,`hdsi_ai_scripted_cli_invocation_ide_host_cmd`)),"ide", parent_tool=tool OR (js_parent=1 AND is_js_host=1 AND parent_cmd_lc=""),"cli_relaunch", isnotnull(parent_tool),"ai_agent", js_parent=1 AND is_js_host=0 AND match(cmd_lc,"node_modules[\\\\/]"),"npm_launcher", match(parent_lc,`hdsi_ai_scripted_cli_invocation_package_runners`) OR (match(parent_lc,"^(node|bun|deno|python[0-9.]*w?|py)(\\.exe)?$") AND match(parent_cmd_lc,`hdsi_ai_scripted_cli_invocation_package_runners`)),"package_runner", match(parent_lc,`hdsi_ai_scripted_cli_invocation_automation_parents`),"automation", true(),"shell_or_other"), unattended=if(NOT tool IN (`hdsi_ai_scripted_cli_invocation_chat_clis`) AND (match(cmd_lc,`hdsi_ai_scripted_cli_invocation_unattended_flags`) OR match(cmd_lc,`hdsi_ai_scripted_cli_invocation_unattended_subcommands`) OR (tool IN (`hdsi_ai_scripted_cli_invocation_short_p_tools`) AND match(cmd_lc,"\\s-p(\\s|=|$)"))),1,0), bypass=if(match(cmd_lc,`hdsi_ai_scripted_cli_invocation_bypass_flags`) OR (tool IN ("gemini","qwen") AND match(cmd_lc,"\\s-y(\\s|$)")) OR (tool="codex" AND match(cmd_lc,"\\s-a[= ]?never(\\s|\"|$)")),1,0), launcher=case(parent_class="ai_agent","another AI agent", parent_class="automation","an automation parent") \
	| eval reason=case(bypass=1 AND isnotnull(launcher),"permission bypass, launched by ".launcher, bypass=1,"permission bypass flag", isnotnull(launcher) AND unattended=1,"headless run launched by ".launcher, isnotnull(launcher),"launched by ".launcher, unattended=1 AND parent_class!="ide","headless one-shot run"), base=case(bypass=1 AND isnotnull(launcher),50, bypass=1,40, isnotnull(launcher) AND unattended=1,35, isnotnull(launcher),30, isnotnull(reason),20) \
	| where isnotnull(reason) \
	| eval provider=coalesce(provider,"AI CLI"), user=if(match(lower(user),`hdsi_ai_scripted_cli_invocation_nonhuman_users`), "unknown", user) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| stats sum(count) as count min(firstTime) as firstTime max(lastTime) as lastTime max(base) as base values(reason) as reasons values(tool) as tool values(provider) as provider values(process_name) as process_name values(parent_process_name) as parent_process_name values(parent_class) as parent_class values(process) as process by user src \
	| eval user=if(user="unknown", null(), user), user_display=coalesce(user,"an unattributed account"), tools=mvjoin(tool,", "), providers=mvjoin(provider,", "), parent_processes=mvjoin(parent_process_name,", "), reasons=mvjoin(reasons,"; "), process=mvindex(process,0,4) \
	| `ai_risk_multiplier` \
	| eval risk_multiplier=coalesce(risk_multiplier,1.0), risk_score=min(80, round(base*risk_multiplier)) \
	| eval ai_activity="scripted_cli_execution", detection_id="hdsi_ai_scripted_cli_invocation", mitre_attack="T1059", ai_kill_chain_phase="execution" \
	| convert ctime(firstTime) ctime(lastTime) \
	| table firstTime, lastTime, user, user_display, src, tools, tool, providers, provider, reasons, parent_processes, parent_process_name, parent_class, process_name, process, count, base, sensitivity_level, risk_multiplier, risk_score, ai_activity, detection_id, mitre_attack, ai_kill_chain_phase \
	| `hdsi_ai_scripted_cli_invocation_customizations` \
	| `hdsi_ai_scripted_cli_invocation_risk_score`

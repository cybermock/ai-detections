version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Scripted CLI Invocation
description: "Detects AI command-line agents (Claude Code, Codex, Gemini CLI, GitHub Copilot CLI, Amazon Q, Aider, llm and others, including npm installs that run inside node, pip/pipx installs that run inside python and native Claude Code installs whose image is a version number) started without a person at the keyboard: launched by a script interpreter, build tool, orchestrator or another AI agent, run headless (-p, --print, codex exec), or run with flags that disable the agent's approval prompts or sandbox (--dangerously-skip-permissions, --yolo/-y, --trust-all-tools, -s danger-full-access, --ask-for-approval never). Interactive terminal use, one-shot chat CLIs typed by a person, package runners (npx, uvx, pipx) and CLI self-relaunches are ignored unless a headless or bypass flag is present; IDE-hosted agents, including remote IDE extension hosts (VS Code Remote, Cursor and Windsurf servers), are ignored unless a bypass flag is present. Risk on the user (when attributable) and the system, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_process_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - process
  - endpoint
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Endpoint.Processes"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

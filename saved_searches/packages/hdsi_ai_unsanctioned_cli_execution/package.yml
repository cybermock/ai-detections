version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Unsanctioned CLI Execution
description: "Detects execution of AI coding and chat CLIs (Claude Code, OpenAI Codex CLI, Gemini CLI, GitHub Copilot CLI, Amazon Q / Kiro CLI, Cursor CLI, Qwen Code, OpenCode, Amp, Aider, Shell GPT, llm and similar) on Windows, macOS and Linux from Endpoint.Processes: by exact binary name, shell-launched generic name, node/python command line (npm package path or POSIX bin symlink), or the native Claude Code image path. Excludes package installs and IDE-hosted Copilot runtimes, honours the ai_sanctioned_entities allowlist. Risk only on user and system, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_unsanctioned_filter(3)
tags:
  - rba_only
  - process
  - endpoint
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Endpoint.Processes"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

[hdsi_ai_unsanctioned_cli_execution_cli_names]
definition = "codex","codex.exe","gemini","gemini.exe","gh-copilot","gh-copilot.exe","aider","aider.exe","sgpt","sgpt.exe","tgpt","tgpt.exe","aichat","aichat.exe","amazon-q","amazon-q.exe","qchat","qchat.exe","kiro-cli","kiro-cli.exe","openai","openai.exe","cursor-agent","cursor-agent.exe","opencode","opencode.exe"
description = v1.1 Distinctive AI CLI binary names matched exactly on Processes.process_name with any parent. Used inside Processes.process_name IN (...). Add new AI CLIs here only when the name does not collide with other software; otherwise use the generic_names macro.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_cli_execution_generic_names]
definition = "claude","claude.exe","llm","llm.exe","fabric","fabric.exe","mods","mods.exe","cline","cline.exe","copilot","copilot.exe","amp","amp.exe"
description = v1.1 AI CLI binary names that collide with other software (Claude desktop app, Microsoft Service Fabric Fabric.exe, Windows Copilot app). They count only when the parent is an interactive shell or terminal (shell_parents) or the command line is a known CLI install path (generic_path_patterns). Live data showed Fabric.exe under FabricHost.exe on Service Fabric nodes.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_cli_execution_shell_parents]
definition = "cmd.exe","powershell.exe","pwsh.exe","pwsh","bash","bash.exe","zsh","sh","dash","fish","ksh","tcsh","csh","nu","nu.exe","wsl.exe","WindowsTerminal.exe","OpenConsole.exe","conhost.exe","tmux","screen","login","iTerm2","Terminal","alacritty","alacritty.exe","kitty","wezterm-gui","wezterm-gui.exe","ghostty"
description = v1.1 Interactive shells and terminal emulators, matched exactly on Processes.parent_process_name. A generic-name binary launched from one of these is treated as a CLI invocation. Exact names on purpose: the pre-v1.1 unanchored regex (sh|wt|...) also matched parents such as dashost.exe or ssh.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_cli_execution_generic_path_patterns]
definition = "*claude-code*","*.local*bin*claude*","*.claude*local*claude*"
description = v1.1 Wildcards that identify the Claude Code CLI binary (native installer path ~/.local/bin/claude or %USERPROFILE%\.local\bin\claude.exe, legacy ~/.claude/local, or the claude-code IDE extension bundle) when its parent is not a shell. Matched against both Processes.process and Processes.process_path, and only for generic_names. The Claude desktop app installs under AppData\Local\AnthropicClaude or /Applications and does not match.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_cli_execution_native_path_patterns]
definition = "*.local*share*claude*versions*"
description = v1.1 Image-path wildcards for the native Claude Code installer on macOS and Linux. ~/.local/bin/claude is a symlink to ~/.local/share/claude/versions/<version>, so EDRs that name a process after its resolved image report process_name as the version string (for example 2.1.289), which no name list can match. Matched on Processes.process_path for any process name; a command-line hit counts only when the command line starts with this path (enforced after tstats).
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_cli_execution_launchers]
definition = "node","node.exe","bun","bun.exe","deno","deno.exe","python*","pythonw*","py.exe","uv","uv.exe","uvx","uvx.exe","pipx","pipx.exe"
description = v1.1 Runtimes whose command line is inspected (cmdline_patterns) for an AI CLI package. npm/pnpm/bun-installed CLIs run as node or bun: on Windows the npm shim passes the package path (node_modules\@google\gemini-cli\...), on macOS and Linux the shebang re-executes node with the bin symlink instead (node --no-warnings=DEP0040 /opt/homebrew/bin/gemini). pip/pipx CLIs (aider, sgpt, llm, openai) run as python3 /path/bin/<name> or python -m <module>.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_cli_execution_cmdline_patterns]
definition = "*claude-code*","*gemini-cli*","*@openai*codex*","*@qwen-code*","*@github*copilot*","*@sourcegraph*amp*","*cursor-agent*","*/bin/claude*","*/bin/gemini*","*/bin/codex*","*/bin/qwen*","*/bin/copilot*","*/bin/amp*","*/bin/openai*","*/bin/llm*","*/bin/aider*","*/bin/sgpt*","*-m aider*","*-m sgpt*","*-m llm*","*-m openai*","*aider-chat*","*aider_chat*","*shell_gpt*","*shell-gpt*"
description = v1.1 Command-line wildcards (Processes.process) applied only to launcher process names. Two forms: package-scoped paths (Windows npm shims, pnpm/Volta shims, npx) and POSIX bin-symlink paths (*/bin/<cli>, how npm, Homebrew, nvm, bun and pip entry points appear on macOS and Linux). Bare words such as *codex* are avoided on purpose because they occur in user profile and project paths. The wildcards are a prefilter only. The rule then classifies on the first four command-line tokens with anchored forms: a scoped npm package directory (@anthropic-ai/claude-code, @google/gemini-cli, @openai/codex, @github/copilot, @qwen-code/qwen-code, @sourcegraph/amp, not -core/-sdk siblings), a bin entry named exactly (/bin/gemini followed by a quote, space or end, so /bin/ampx is dropped), the Cursor CLI versions directory, python -m <module>, or aider-chat / shell-gpt as a whole token or pipx/uv tool venv. Project folders such as claude-code-demo or aider-chat-logs therefore do not classify.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_cli_execution_match]
definition = (Processes.process_name IN (`hdsi_ai_unsanctioned_cli_execution_cli_names`) OR (Processes.process_name IN (`hdsi_ai_unsanctioned_cli_execution_generic_names`) AND (Processes.parent_process_name IN (`hdsi_ai_unsanctioned_cli_execution_shell_parents`) OR Processes.process IN (`hdsi_ai_unsanctioned_cli_execution_generic_path_patterns`) OR Processes.process_path IN (`hdsi_ai_unsanctioned_cli_execution_generic_path_patterns`))) OR (Processes.process_name IN (`hdsi_ai_unsanctioned_cli_execution_launchers`) AND Processes.process IN (`hdsi_ai_unsanctioned_cli_execution_cmdline_patterns`)) OR Processes.process_path IN (`hdsi_ai_unsanctioned_cli_execution_native_path_patterns`) OR Processes.process IN (`hdsi_ai_unsanctioned_cli_execution_native_path_patterns`))
description = v1.1 The tstats prefilter shared by the rule and its process drilldown, in Endpoint.Processes field names. Four paths: distinctive names with any parent; generic names from a shell or a Claude Code install path; launchers with an AI CLI command line; the native Claude Code image path regardless of process name. Edit the named lists rather than this expression.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_cli_execution_parent_match]
definition = (Processes.parent_process_name IN (`hdsi_ai_unsanctioned_cli_execution_cli_names`) OR (Processes.parent_process_name IN ("claude","claude.exe") AND NOT Processes.parent_process_path IN ("*AnthropicClaude*","*Claude.app*","*WindowsApps*Claude*") AND NOT Processes.process IN ("*--type=*")) OR Processes.parent_process IN (`hdsi_ai_unsanctioned_cli_execution_generic_path_patterns`) OR Processes.parent_process_path IN (`hdsi_ai_unsanctioned_cli_execution_generic_path_patterns`) OR Processes.parent_process_path IN (`hdsi_ai_unsanctioned_cli_execution_native_path_patterns`) OR (Processes.parent_process_name IN (`hdsi_ai_unsanctioned_cli_execution_launchers`) AND Processes.parent_process IN (`hdsi_ai_unsanctioned_cli_execution_cmdline_patterns`)))
description = v1.1 Parent-side version of the match, used by the child-process drilldown: children of AI CLIs by name, by Claude Code install or native image path, or of node/python launchers running an AI CLI. A parent named claude/claude.exe is skipped when its image is the Claude desktop app (AnthropicClaude, Claude.app, WindowsApps) and Electron helper children (--type=) are skipped, so desktop-app renderer/GPU/utility processes do not flood the drilldown. Requires parent_process and parent_process_path in Endpoint.Processes for the path forms.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_cli_execution_ide_host_exclusion]
definition = match(cmd_lc, "agent-host.sdk-cache|vscode-proxy|github_copilot_vscode_agent|copilot-language-server")
description = v1.1 Eval expression on cmd_lc (lowercased command lines) that removes IDE-hosted GitHub Copilot runtimes. VS Code Copilot agent mode starts a bundled codex.exe app-server from Code\agent-host\sdk-cache that talks to the Copilot proxy, not to OpenAI (some process events carry only the path, so the path is matched too); live data showed this as the only codex.exe activity. Set to false() to keep these rows.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_cli_execution_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the tstats where clause before aggregation. Use Endpoint.Processes field names, e.g. NOT Processes.dest IN ("build-*") or NOT Processes.user IN ("svc_ci*"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_cli_execution_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation (fields: user, src, provider, ai_tool, launch_context, process_name, parent_process_name, process, count). Use it to drop sanctioned tools or developer hosts. Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_cli_execution_risk_score]
definition = search *
description = v1.1 Risk score hook, last pipe. Static scores ship in action.risk.param._risk (user 30, system 20); set a numeric risk_score field here (min(100,...)) to override both objects for a row. Ships as search *.
disabled = False
iseval = 0

description = v1.1.0 Detects execution of AI coding and chat CLIs (Claude Code, OpenAI Codex CLI, Gemini CLI, GitHub Copilot CLI, Amazon Q / Kiro CLI, Cursor CLI, Qwen Code, OpenCode, Amp, Aider, Shell GPT, llm and similar) from Endpoint.Processes on Windows, macOS and Linux: by exact binary name, by shell-launched generic name, by node/python command line (npm package path or POSIX bin symlink), or by the native Claude Code image path, excluding package installs and IDE-hosted Copilot runtimes. Risk only on user and system, no notable.

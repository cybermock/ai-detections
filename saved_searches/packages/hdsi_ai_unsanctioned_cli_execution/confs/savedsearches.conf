search = | tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime values(Processes.process_path) as process_path from datamodel=Endpoint.Processes where `hdsi_ai_unsanctioned_cli_execution_match` `hdsi_ai_unsanctioned_cli_execution_filter` by Processes.user Processes.dest Processes.process_name Processes.parent_process_name Processes.process \
	| rename Processes.* as * \
	| eval process_name_lc=lower(process_name), tool_name=replace(process_name_lc,"\.exe$",""), parent_lc=lower(coalesce(parent_process_name,"")), cmd_lc=lower(coalesce(process,"")), path_lc=lower(coalesce(mvjoin(process_path," "),"")) \
	| rex field=cmd_lc "^\s*(?<cmd_head>(?:(?:\"[^\"]*\"|\S+)\s*){1,4})" \
	| eval cmd_head=coalesce(cmd_head,"") \
	| eval is_launcher=if(match(tool_name,"^(node|bun|deno|pythonw?[0-9.]*|py|uv|uvx|pipx)$"),1,0) \
	| where NOT (is_launcher=1 AND match(cmd_lc, "^\s*((\"[^\"]*\"|\S+)\s+)?(\"([^\"]*\W)?|(\S*\W)?)(npm|pnpm|yarn|bun|pip[0-9.]*|pipx|uv)(-cli\.js|\.cmd|\.exe|\.c?js)?\"?(\s+(-\S+|tool|pip|global))*\s+(install|i|ci|uninstall|un|remove|rm|add|update|upgrade|up|ls|list|view|info|outdated|show|freeze|download|cache)(\s|$)|^\s*(\"[^\"]*\"|\S+)(\s+-[a-z]+)*\s+-m\s+(pip|ensurepip|venv|virtualenv|pytest|unittest)(\s|$)")) \
	| where NOT (`hdsi_ai_unsanctioned_cli_execution_ide_host_exclusion`) \
	| eval name_key=if(tool_name IN ("claude","gemini","codex","openai","copilot","gh-copilot","amazon-q","qchat","kiro-cli","cursor-agent","opencode","amp","aider","sgpt","tgpt","aichat","mods","fabric","cline","llm"),tool_name,null()) \
	| eval native_key=if(match(path_lc,"\.local\Wshare\Wclaude\Wversions\W") OR match(cmd_lc,"^\s*(\"[^\"]*|\S*)\.local\Wshare\Wclaude\Wversions\W"),"claude",null()) \
	| eval script_key=if(is_launcher=1, case(match(cmd_head,"@anthropic-ai\Wclaude-code([^-\w.]|$)|\Wanthropic\.claude-code-\d|\Wbin\Wclaude(\.c?js)?(\"|\s|$)"),"claude", match(cmd_head,"@google\Wgemini-cli([^-\w.]|$)|\Wbin\Wgemini(\.c?js)?(\"|\s|$)"),"gemini", match(cmd_head,"@openai\Wcodex([^-\w.]|$)|\Wbin\Wcodex(\.c?js)?(\"|\s|$)"),"codex", match(cmd_head,"@github\Wcopilot([^-\w.]|$)|\Wbin\Wcopilot(\.c?js)?(\"|\s|$)"),"copilot", match(cmd_head,"@qwen-code\Wqwen-code([^-\w.]|$)|\Wbin\Wqwen(\.c?js)?(\"|\s|$)"),"qwen", match(cmd_head,"@sourcegraph\Wamp([^-\w.]|$)|\Wbin\Wamp(\.c?js)?(\"|\s|$)"),"amp", match(cmd_head,"\Wcursor-agent\Wversions\W|\Wbin\Wcursor-agent(\"|\s|$)"),"cursor-agent", match(cmd_head,"\s-m\s+aider(\s|$)|\Wbin\Waider(\.py)?(\"|\s|$)|(^|\s|\")aider[-_]chat(==\S*)?(\"|\s|$)|\W(venvs|tools)\Waider[-_]chat\W"),"aider", match(cmd_head,"\s-m\s+sgpt(\s|$)|\Wbin\Wsgpt(\.py)?(\"|\s|$)|(^|\s|\")shell[-_]gpt(==\S*)?(\"|\s|$)|\W(venvs|tools)\Wshell[-_]gpt\W"),"sgpt", match(cmd_head,"\s-m\s+llm(\s|$)|\Wbin\Wllm(\.py)?(\"|\s|$)"),"llm", match(cmd_head,"\s-m\s+openai(\s|$)|\Wbin\Wopenai(\.py)?(\"|\s|$)"),"openai"), null()) \
	| eval tool_key=coalesce(name_key, native_key, script_key) \
	| where isnotnull(tool_key) \
	| lookup ai_tool_processes process_name_lc as tool_key OUTPUTNEW provider as tool_provider usage_type as tool_usage_type enabled as tool_enabled \
	| where coalesce(tonumber(tool_enabled),1)=1 AND coalesce(tool_usage_type,"cli")="cli" \
	| eval ai_tool=case(tool_key="claude","Claude Code", tool_key="gemini","Gemini CLI", tool_key="codex","OpenAI Codex CLI", tool_key="openai","OpenAI CLI", tool_key IN ("copilot","gh-copilot"),"GitHub Copilot CLI", tool_key IN ("amazon-q","qchat","kiro-cli"),"Amazon Q / Kiro CLI", tool_key="cursor-agent","Cursor CLI", tool_key="qwen","Qwen Code", tool_key="opencode","OpenCode", tool_key="amp","Amp CLI", tool_key="aider","Aider", tool_key="sgpt","Shell GPT", tool_key="tgpt","tgpt", tool_key="aichat","aichat", tool_key="mods","Charm mods", tool_key="fabric","Fabric", tool_key="cline","Cline CLI", tool_key="llm","LLM CLI", true(),tool_key) \
	| eval provider=coalesce(tool_provider, case(tool_key="claude","Anthropic", tool_key="gemini","Google Gemini", tool_key IN ("codex","openai"),"OpenAI", tool_key="copilot","GitHub Copilot", tool_key="gh-copilot","Microsoft Copilot", tool_key IN ("amazon-q","qchat"),"Amazon", tool_key="kiro-cli","Kiro", tool_key="cursor-agent","Cursor", tool_key="qwen","Alibaba Qwen", tool_key="opencode","OpenCode", tool_key="amp","Sourcegraph", tool_key="aider","Aider", tool_key="sgpt","Shell GPT", tool_key="mods","Charm", tool_key="fabric","Fabric", tool_key="cline","Cline", tool_key="llm","LLM CLI", true(),ai_tool)) \
	| eval launch_context=case(match(parent_lc,"^(cmd|powershell|pwsh|bash|zsh|sh|dash|fish|ksh|tcsh|csh|nu|wsl|windowsterminal|openconsole|conhost|tmux|screen|login|iterm2|terminal|alacritty|kitty|wezterm-gui|ghostty)(\.exe)?$"),"terminal", match(cmd_lc,"\.vscode|\.cursor|\.windsurf|extensions|agent-host"),"ide_extension", match(process_name_lc,"^(node|bun|deno|python|pythonw|py|uv|uvx|pipx)"),"interpreter", true(),"other") \
	| eval user_lc=lower(coalesce(user,"")), user=if(user_lc IN ("","unknown","-","n/a","null","system","root","local service","network service") OR like(user_lc,"nt authority%") OR like(user_lc,"%$"),null(),user), src=if(lower(coalesce(dest,"")) IN ("","unknown","-"),null(),dest) \
	| where isnotnull(src) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| eval user_key=coalesce(user,"__none__") \
	| stats sum(count) as count min(firstTime) as firstTime max(lastTime) as lastTime values(ai_tool) as ai_tool values(provider) as provider values(launch_context) as launch_context values(process_name) as process_name values(parent_process_name) as parent_process_name values(process) as process values(process_path) as process_path by user_key src \
	| eval user=if(user_key="__none__",null(),user_key), user_display=coalesce(user,"an unattributed or system account"), ai_tool=mvjoin(ai_tool,", "), provider=mvjoin(provider,", "), launch_context=mvjoin(launch_context,", "), process_name=mvjoin(process_name,", "), parent_process_name=mvjoin(parent_process_name,", "), process=mvindex(process,0,2), process_path=mvindex(process_path,0,2) \
	| eval process=mvmap(process,substr(process,1,300)) \
	| fields - user_key \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="cli_execution", detection_id="hdsi_ai_unsanctioned_cli_execution", mitre_attack=split("T1588.007,T1059",","), ai_kill_chain_phase="execution" \
	| `hdsi_ai_unsanctioned_cli_execution_customizations` \
	| `hdsi_ai_unsanctioned_cli_execution_risk_score`

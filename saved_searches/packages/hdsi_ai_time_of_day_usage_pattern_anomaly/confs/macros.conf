description = v1.1 Inline tstats pre-filter on Web.url_domain and Web.site, generated on 2026-10-09 from the enabled usage_type=web rows of the common lookups: every ai_provider_domains name and its www. form, and every ai_provider_apps SSE/CASB application name. Exact terms only, on purpose: leading-wildcard terms (*.name) made one day of the search slower than no filter at all (233 s) on a tenant with high-cardinality inbound Web data, while exact terms read one day in 11-19 s, which is what makes a multi-week hourly baseline affordable. Subdomains that are not their own lookup row (e.g. ws.chatgpt.com) are therefore not counted; the main hosts carry the interactive use. Regenerate it with the SPL in the README when web rows are added to the common lookups or ..._usage_types is widened.
disabled = False
iseval = 0

[hdsi_ai_time_of_day_usage_pattern_anomaly_usage_types]
definition = "web"
description = v1.1 ai_provider_domains usage_type values that count as personal, interactive AI use (quoted, comma separated). Ships "web" only: IDE assistants, API endpoints and model registries are called by tools that run unattended, so their hour of activity says little about the person. Widening it also needs a regenerated ..._prefilter.
disabled = False
iseval = 0

[hdsi_ai_time_of_day_usage_pattern_anomaly_background_hosts]
definition = "^(ab|bzr|bzrcdn|cdn|static|assets?|assets-proxy|sentry[a-z0-9-]*|telemetry|events?|stats|metrics|ms-sso|auth|accounts?|login|downloads?)\\.|(^|\\.)(gstatic\\.com|oaistatic\\.com)$"
description = v1.1 Regex (quoted) for AI hostnames that an open tab, extension or app calls without the person using it: experiment flags (ab.chatgpt.com), static and CDN assets, error reporting (sentry-*), sign-in and update checks. They are removed before the hourly histogram is built, so an idle tab left open overnight does not create a new active hour.
disabled = False
iseval = 0

[hdsi_ai_time_of_day_usage_pattern_anomaly_min_baseline_days]
definition = 5
description = v1.1 Minimum number of baseline days (the dispatch window minus the evaluated day, 14 by default) on which the user used AI web services at all. Users with a thinner history have no stable daily pattern and are not scored. 5 of 14 kept 224 of 2,866 daily AI users on the busiest validation tenant. Raise it (e.g. 10) when the baseline is widened to 28 days.
disabled = False
iseval = 0

[hdsi_ai_time_of_day_usage_pattern_anomaly_max_usual_days]
definition = 1
description = v1.1 An hour of the day is unusual for a user only when the user was active within one hour of it on at most this many baseline days. 1 tolerates a single earlier occurrence; 0 flags only hours never seen before.
disabled = False
iseval = 0

[hdsi_ai_time_of_day_usage_pattern_anomaly_min_requests]
definition = 20
description = v1.1 Minimum foreground AI web requests (Web events, background hosts excluded) by the user in one unusual hour on the evaluated day. Keeps a single page load or an open tab from counting as use. Requests are Web data model events, so the value depends on the proxy: 20 is about the 92nd percentile of a user's AI requests per active hour on a URL-logging firewall/proxy (p90 17, p98 69), while an SSE connection log records about one event per session (p99 6), where 3 is the equivalent. Derive per tenant (README).
disabled = False
iseval = 0

[hdsi_ai_time_of_day_usage_pattern_anomaly_zscore]
definition = 3
description = v1.1 Minimum z-score of the unusual hour against the user's own zero-filled baseline for that hour (+/- 1 hour, over every active baseline day, including days with no activity in that hour). With the stdev floored at 1 request it removes hours where one earlier day already had heavy use. Replaces ai_detection_config time_anomaly_zscore.
disabled = False
iseval = 0

[hdsi_ai_time_of_day_usage_pattern_anomaly_customizations]
definition = search *
description = v1.1 Tenant customization hook after the per-user aggregation (fields: user, provider, provider_list, ai_domains, eval_day, anomalous_hours, anomalous_hour_count, anomalous_requests, z_score, usual_days, baseline_days, usual_hours, bunit, severity_weight, risk_multiplier, base_score, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_time_of_day_usage_pattern_anomaly_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust or override risk_score (integer 1-100) per tenant. Ships as search *.
disabled = False
iseval = 0

search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count from datamodel=Web where `hdsi_ai_time_of_day_usage_pattern_anomaly_prefilter` Web.user!="unknown" `hdsi_ai_time_of_day_usage_pattern_anomaly_filter` by Web.user Web.url_domain Web.site _time span=1h \
	| rename Web.* as * \
	| eval user=if(isnull(user) OR trim(user)="" OR in(lower(user),"unknown","-","n/a","none","null"), null(), user) \
	| where isnotnull(user) \
	| eval ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))), ai_input_type=if(isnull(nullif(url_domain,"unknown")),"app","host") \
	| stats sum(count) as count by user ai_domain ai_input_type _time \
	| `ai_domains_filter` \
	| search usage_type IN (`hdsi_ai_time_of_day_usage_pattern_anomaly_usage_types`) \
	| where NOT match(ai_domain, `hdsi_ai_time_of_day_usage_pattern_anomaly_background_hosts`) \
	| lookup identity_lookup_expanded identity as user OUTPUTNEW bunit \
	| eval bunit=mvindex(bunit,0), severity_weight=tonumber(severity_weight) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| addinfo \
	| eval eval_end=relative_time(info_max_time,"@d"), eval_start=relative_time(eval_end,"-1d@d"), is_eval=if(_time>=eval_start,1,0) \
	| where _time<eval_end \
	| stats sum(count) as requests values(eval(if(is_eval=1,provider,null()))) as providers values(eval(if(is_eval=1,ai_domain,null()))) as ai_domains max(eval(if(is_eval=1,severity_weight,null()))) as severity_weight max(is_eval) as is_eval max(eval_start) as eval_start by user _time \
	| eval day=strftime(_time,"%Y-%m-%d"), hour=tonumber(strftime(_time,"%H")) \
	| eventstats dc(eval(if(is_eval=0,day,null()))) as baseline_days by user \
	| eventstats dc(eval(if(is_eval=0,day,null()))) as hour_days by user hour \
	| eval usual_hour=if(is_eval=0 AND hour_days>=baseline_days*0.25, if(hour<10,"0","").hour, null()) \
	| eventstats values(usual_hour) as usual_hours by user \
	| eval window_hour=if(is_eval=1, hour, mvappend(tostring((hour+23)%24), tostring(hour), tostring((hour+1)%24))) \
	| mvexpand window_hour \
	| eval window_hour=tonumber(window_hour) \
	| stats sum(requests) as requests values(providers) as providers values(ai_domains) as ai_domains max(severity_weight) as severity_weight max(eval_start) as eval_start max(baseline_days) as baseline_days values(usual_hours) as usual_hours by user window_hour day is_eval \
	| stats sum(eval(if(is_eval=0,requests,0))) as base_sum sum(eval(if(is_eval=0,requests*requests,0))) as base_sumsq dc(eval(if(is_eval=0,day,null()))) as usual_days max(eval(if(is_eval=1,requests,null()))) as hour_requests values(providers) as providers values(ai_domains) as ai_domains max(severity_weight) as severity_weight max(baseline_days) as baseline_days max(eval_start) as eval_start values(usual_hours) as usual_hours by user window_hour \
	| where isnotnull(hour_requests) AND baseline_days>=`hdsi_ai_time_of_day_usage_pattern_anomaly_min_baseline_days` AND hour_requests>=`hdsi_ai_time_of_day_usage_pattern_anomaly_min_requests` AND usual_days<=`hdsi_ai_time_of_day_usage_pattern_anomaly_max_usual_days` \
	| eval baseline_mean=round(base_sum/baseline_days,2), baseline_stdev=round(sqrt(max(0, base_sumsq/baseline_days - pow(base_sum/baseline_days,2))),2), z_score=round((hour_requests-base_sum/baseline_days)/max(baseline_stdev,1),2) \
	| where z_score>=`hdsi_ai_time_of_day_usage_pattern_anomaly_zscore` \
	| eval hour_label=if(window_hour<10,"0","").window_hour.":00" \
	| stats sum(hour_requests) as anomalous_requests dc(window_hour) as anomalous_hour_count values(hour_label) as anomalous_hours max(z_score) as z_score max(usual_days) as usual_days max(baseline_days) as baseline_days values(providers) as providers values(ai_domains) as ai_domains max(severity_weight) as severity_weight values(usual_hours) as usual_hours max(eval_start) as eval_start by user \
	| lookup identity_lookup_expanded identity as user OUTPUTNEW bunit \
	| eval bunit=mvindex(bunit,0) \
	| `ai_risk_multiplier` \
	| eval severity_weight=coalesce(severity_weight,1.0), base_score=15, risk_score=min(40, max(1, round(base_score*severity_weight*coalesce(risk_multiplier,1),0))) \
	| eval usual_hours=coalesce(mvjoin(mvsort(usual_hours),","),"none"), eval_day=strftime(eval_start,"%Y-%m-%d"), provider=mvindex(providers,0), provider_list=mvjoin(providers,", "), anomalous_hours=mvjoin(anomalous_hours,", "), ai_domains=mvindex(ai_domains,0,9) \
	| fields - providers eval_start _final_multiplier \
	| eval ai_activity="time_pattern_anomaly", detection_id="hdsi_ai_time_of_day_usage_pattern_anomaly", mitre_attack=split("T1078,T1567",","), ai_kill_chain_phase="exfiltration" \
	| `hdsi_ai_time_of_day_usage_pattern_anomaly_customizations` \
	| `hdsi_ai_time_of_day_usage_pattern_anomaly_risk_score`

description = v1.1.0 Daily. Risk on users who made sustained interactive AI web use (default 20+ requests in an hour) yesterday at an hour of the day that is new for them (active within an hour of that time on at most 1 of 5+ AI-active days in a 14-day personal hourly baseline, zero-filled z-score 3+). Needs egress proxy or SSE Web data with a user. User risk 15, scaled, max 40. Risk only, no notable.
disabled = 0
dispatch.earliest_time = -15d@d
dispatch.latest_time = @d
dispatch.rt_backfill = 1
dispatch.ttl = 2p

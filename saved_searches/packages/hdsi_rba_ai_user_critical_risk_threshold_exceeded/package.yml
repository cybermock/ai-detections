version: 1.1.0
creation_date: '2026-03-04'
package_title: RBA AI User Critical Risk Threshold Exceeded
description: "High notable when one user's HDSI AI risk in a rolling 24 hours reaches the critical threshold (ai_detection_config high_risk_threshold, default 90). Reads user risk events written by the HDSI AI detections from index=risk, merges a person's UPN and account-name forms, ignores placeholder, machine, OS service and unqualified built-in accounts (qualified built-ins stay per host), and lists the contributing detections, kill-chain phases and ATT&CK techniques. Upper band of the user threshold pair with hdsi_rba_ai_user_risk_threshold_exceeded. Writes no risk."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - lookups:ai_detection_config
tags:
  - rba_only
data_prereqs:
  datamodels:
    op: AND
    items:
      - Risk.All_Risk
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

[hdsi_rba_ai_user_critical_risk_threshold_exceeded_risk_index]
definition = index=risk
description = v1.1 Where ES writes risk events. The rule reads the risk index directly (it keeps every multivalue annotations.mitre_attack value, which the Risk data model search did not on one validation tenant). Change it together with the Risk data model constraint if risk is written to a renamed or additional index, e.g. (index=risk OR index=risk_archive), and keep it identical to hdsi_rba_ai_user_risk_threshold_exceeded_risk_index so both band rules total the same events.
disabled = False
iseval = 0

[hdsi_rba_ai_user_critical_risk_threshold_exceeded_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inline in the risk index base search before aggregation. Use risk index field names, e.g. NOT risk_object IN ("svc_*","test.user*") or NOT source="Network - HDSI AI DNS Queries To AI Domains - Rule". Apply the same exclusion to hdsi_rba_ai_user_risk_threshold_exceeded_filter, otherwise the two band rules total different events. Ships empty.
disabled = False
iseval = 0

[hdsi_rba_ai_user_critical_risk_threshold_exceeded_user_key]
definition = eval user_key=lower(trim(risk_object)), user_key=if(match(user_key, "^([^\x5c@]+\x5c)?(administrator|admin|guest|defaultaccount|wdagutilityaccount)(@.+)?$"), replace(user_key, "\x5c", "/"), replace(replace(user_key, "@.*$", ""), "^.*\x5c", ""))
description = v1.1 Builds the per-person aggregation key from risk_object so one person's UPN (jdoe@example.com), DOMAIN\jdoe and jdoe forms add up together (web/SSE detections score the UPN, endpoint detections the account name). Built-in local accounts (administrator, admin, guest, defaultaccount, wdagutilityaccount) keep their HOST\ or @domain qualifier (written HOST/administrator) so the same built-in name on different machines or domains is never merged into one fleet-wide identity. Known gap: a domain built-in in UPN form (administrator@example.com) keeps the UPN as its key, so it is not merged with EXAMPLE\Administrator (example/administrator); the README gives a tested alternative. Use eval user_key=lower(trim(risk_object)) when separate email domains or forests reuse account names for different people. Must stay identical to hdsi_rba_ai_user_risk_threshold_exceeded_user_key: the bands only stay disjoint when both rules total the same key, and that rule finds this rule's notables by user_key.
disabled = False
iseval = 0

[hdsi_rba_ai_user_critical_risk_threshold_exceeded_excluded_accounts]
definition = match(user_key, "^(unknown|-|none|null|n/a|\(null\)|undefined|system|localsystem|local system|local service|network service|anonymous logon|root|nobody|daemon|krbtgt|dwm-\d+|umfd-\d+|administrator|admin|guest|defaultaccount|wdagutilityaccount)$") OR match(user_key, "^\*+$|\$$") OR match(lower(trim(risk_object)), "^(nt authority|nt service|window manager|font driver host|iis apppool)\x5c")
description = v1.1 Boolean expression (fields user_key, risk_object) for risk objects that are never one person and must not total up: placeholders (unknown, -, none, null, n/a, (null), all-asterisk masks), $-suffixed computer accounts, OS service identities (SYSTEM, LOCAL SERVICE, NETWORK SERVICE, NT AUTHORITY\*, NT SERVICE\*, IIS APPPOOL\*, DWM-n, UMFD-n), shared Unix accounts (root, nobody, daemon) and built-in accounts with no HOST\ or @domain qualifier (a bare administrator, admin or guest cannot be tied to one machine or domain). These collapse activity from many hosts into one fleet-wide pseudo-user. Qualified built-in accounts (HOST\Administrator) are kept, one key per host, by the user_key macro. Their risk stays in the ES risk index. Remove root from the list if root logins are individually attributable in your tenant. Service and automation accounts (svc_*, *-svc) are not excluded by default, because an automation account driving AI agents or CLIs is itself worth a notable; add a tenant pattern here if they flood, and keep the expression identical to hdsi_rba_ai_user_risk_threshold_exceeded_excluded_accounts.
disabled = False
iseval = 0

[hdsi_rba_ai_user_critical_risk_threshold_exceeded_min_detections]
definition = 1
description = v1.1 Minimum distinct HDSI AI detections behind the 24-hour total. Ships as 1 so every user at or above high_risk_threshold gets the critical notable, including a single repeated high-severity detection. Raising it leaves single-detection critical totals with no notable from either user threshold rule.
disabled = False
iseval = 0

[hdsi_rba_ai_user_critical_risk_threshold_exceeded_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after the threshold (fields: user, user_key, account, risk_objects, total_risk, detection_count, risk_event_count, top_detection_risk, detections, detection_list, phases, phase_list, contributing_mitre_attack, ai_providers, high_risk_threshold, firstTime, lastTime). Filter rows only: do not drop, rename or rewrite user_key. hdsi_rba_ai_user_risk_threshold_exceeded skips its medium notable for a user_key that has a notable from this stanza in the last 24 hours, so a missing user_key (or a renamed stanza) lets a medium notable follow a critical one. Ships as search *.
disabled = False
iseval = 0

search = `hdsi_rba_ai_user_critical_risk_threshold_exceeded_risk_index` risk_object_type="user" (source="* - HDSI AI * - Rule" OR detection_id=hdsi_ai_*) NOT source="* - HDSI AI Health * - Rule" NOT detection_id=hdsi_ai_health_* risk_object=* NOT risk_object IN ("unknown","-","*$") `hdsi_rba_ai_user_critical_risk_threshold_exceeded_filter` \
	| `hdsi_rba_ai_user_critical_risk_threshold_exceeded_user_key` \
	| where len(user_key)>0 AND NOT (`hdsi_rba_ai_user_critical_risk_threshold_exceeded_excluded_accounts`) AND isnotnull(tonumber(risk_score)) \
	| eval risk_score=tonumber(risk_score), phase=coalesce(ai_kill_chain_phase, "unspecified"), contributing_mitre=coalesce('annotations.mitre_attack', mitre_attack), ai_provider=coalesce(provider, provider_list) \
	| stats sum(risk_score) as risk count as events values(phase) as phases values(contributing_mitre) as contributing_mitre values(ai_provider) as ai_providers min(_time) as firstTime max(_time) as lastTime by user_key risk_object source \
	| eventstats sum(risk) as object_risk by user_key risk_object \
	| eventstats max(object_risk) as top_object_risk by user_key \
	| eval top_object=if(object_risk==top_object_risk, risk_object, null()), detection=replace(source, "^\S+ - (.+) - Rule$", "\1") \
	| stats sum(risk) as detection_risk sum(events) as detection_events values(phases) as phases values(contributing_mitre) as contributing_mitre values(ai_providers) as ai_providers values(risk_object) as risk_objects values(top_object) as top_object min(firstTime) as firstTime max(lastTime) as lastTime by user_key detection \
	| sort 0 user_key - detection_risk \
	| eval detection_summary=detection." (".round(detection_risk).")" \
	| stats sum(detection_risk) as total_risk sum(detection_events) as risk_event_count dc(detection) as detection_count max(detection_risk) as top_detection_risk list(detection_summary) as detection_summary values(detection) as detections values(phases) as phases values(contributing_mitre) as contributing_mitre_attack values(ai_providers) as ai_providers values(risk_objects) as risk_objects values(top_object) as top_object min(firstTime) as firstTime max(lastTime) as lastTime by user_key \
	| eval control_name="high_risk_threshold" \
	| lookup ai_detection_config control_name OUTPUTNEW value as high_risk_threshold \
	| eval high_risk_threshold=coalesce(tonumber(high_risk_threshold), 90) \
	| where total_risk>=high_risk_threshold AND detection_count>=`hdsi_rba_ai_user_critical_risk_threshold_exceeded_min_detections` \
	| eval user=mvindex(top_object, 0), risk_object=user, account=replace(replace(user_key, "@.*$", ""), "^.*/", ""), total_risk=round(total_risk), top_detection_risk=round(top_detection_risk), contributing_mitre_attack=mvfilter(match(contributing_mitre_attack, "^T\d{4}")), detection_list=mvjoin(mvindex(detection_summary, 0, 7), "; "), phase_list=mvjoin(phases, ", "), ai_providers=mvindex(ai_providers, 0, 9), firstTime=strftime(firstTime, "%Y-%m-%d %H:%M:%S"), lastTime=strftime(lastTime, "%Y-%m-%d %H:%M:%S") \
	| fields user user_key account risk_object risk_objects total_risk high_risk_threshold detection_count risk_event_count top_detection_risk detections detection_list phases phase_list contributing_mitre_attack ai_providers firstTime lastTime \
	| `hdsi_rba_ai_user_critical_risk_threshold_exceeded_customizations`

version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Multiple Services In Single Session
description: "Detects one user or host actively using several distinct AI providers (default 4) within one hour, from Web proxy/SSE evidence (user attributed) or DNS evidence (host attributed). Background, IDE-assistant, shared-resolver, shared-address and roaming home-network DNS noise is removed. A sign of prompt or data shopping across services. Risk only, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - web
  - proxy
  - dns
data_prereqs:
  datamodels:
    op: OR
    items:
    - "Web"
    - "Network_Resolution"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

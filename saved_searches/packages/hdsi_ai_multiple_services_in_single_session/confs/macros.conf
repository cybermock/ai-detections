description = v1.1 Inline tstats pre-filter on DNS.query (generated 2026-10-09): every enabled ai_provider_domains row that can count here (traffic_class interactive, usage_type not ide), plus the cloud AI endpoint patterns of ai_domains_filter, with names already covered by a broader term removed (123 terms including the cloud patterns). Background, site and IDE-assistant rows are left out because the search drops them anyway. Each term is wildcarded on both sides so trailing-dot, www. and SRV-prefixed names still match; ai_domains_filter makes the exact decision. Without it the hourly DNS branch scans every query (about 46 million an hour on the largest validation tenant). Regenerate it with the SPL in the README when rows are added to ai_provider_domains.
disabled = False
iseval = 0

[hdsi_ai_multiple_services_in_single_session_excluded_providers]
definition = "GitHub Copilot","Cursor","Windsurf","Tabnine","Sourcegraph","Microsoft 365 Copilot","Microsoft Security Copilot"
description = v1.1 Providers that never count toward the distinct-provider total (quoted, comma separated, provider names as in ai_provider_domains / ai_provider_apps). Ships with the IDE coding assistants, which poll in the background all day and are scored by hdsi_ai_code_assistant_network_connection (their ide-type hosts are also dropped by ..._excluded_traffic), and the tenant-bound Microsoft 365 / Security Copilot. To stop a provider licensed for everyone (e.g. "OpenAI" with ChatGPT Enterprise) from counting, add it here or add an organisation-wide *|<provider> row to ai_sanctioned_entities. Use "__none__" to count every provider.
disabled = False
iseval = 0

[hdsi_ai_multiple_services_in_single_session_excluded_traffic]
definition = in(ai_traffic_class,"background","site") OR usage_type="ide"
description = v1.1 Eval condition on the ai_domains_filter outputs for evidence that is not someone using a service in this hour: registry rows marked traffic_class=background (update checks, A/B tests, auth, extension streams, telemetry) or site (documentation and download sites), and IDE-assistant hosts (usage_type=ide, e.g. cloudcode-pa.googleapis.com for Gemini Code Assist), which poll all day. Evidence: bzr.openai.com and bzrcdn.openai.com were resolved by about 1,450 hosts a day on one validation tenant that showed only about 130 hosts resolving chatgpt.com. If you remove usage_type="ide", regenerate both pre-filters with the IDE rows included.
disabled = False
iseval = 0

[hdsi_ai_multiple_services_in_single_session_unreliable_dns_src]
definition = match(mvjoin(vendor_product,"|"),"(?i)umbrella|cloud.?security|secure.?access") AND (cidrmatch("192.168.0.0/16",src) OR cidrmatch("10.0.0.0/24",src))
description = v1.1 Eval condition on DNS src and vendor_product for addresses that are not one host; matching DNS evidence is dropped before it can count for a host or a user. Ships on for roaming DNS-security clients (Cisco Umbrella / Cloud Security / Secure Access), which log the laptop's local address: the home-router ranges 192.168.0.0/16 and 10.0.0.0/24 are reused by many unrelated laptops. On Tenant B one flagged address carried 5 to 7 different roaming identities in every hour (raw events), and 7 of 12 hosts that reached 4 providers in a 24-hour replay were in 192.168.0.0/16. In one scheduled hour the condition removed 314 of 395 AI-resolving roaming sources on Tenant B and 163 of 182 on Tenant C. Same definition as hdsi_ai_dns_queries_to_ai_domains_unreliable_src. Add other roaming products to the vendor_product regex or more home ranges; use false() once the TA maps the roaming device identity to src.
disabled = False
iseval = 0

[hdsi_ai_multiple_services_in_single_session_background_names]
definition = match(ai_domain,"^ms-sso\\.copilot(\\.microsoft)?\\.com$|^(comet-sync|comet-safebrowsing|browser-download)\\.perplexity\\.ai$|(^|[.-])(telemetry|sentry|collector|segment|cdn[0-9]*)[.-]")
description = v1.1 Eval condition on the normalised ai_domain (trailing dot and www. already removed) for names that are not evidence of use and are not marked in the registry: Copilot SSO hosts (no exact registry name), Perplexity Comet browser sync, safe-browsing and download hosts, and any telemetry, error-reporting (sentry, collector, segment) or embeddable CDN label. The registry background and site rows (bzr/bzrcdn.openai.com, ab.chatgpt.com, auth.openai.com, gemini.gstatic.com, downloads.claude.ai, the QuillBot extension streams, aider.chat, ollama.com, lmstudio.ai, ...) are dropped through ai_traffic_class by ..._excluded_traffic. Use false() to count every name.
disabled = False
iseval = 0

[hdsi_ai_multiple_services_in_single_session_min_requests]
definition = 3
description = v1.1 Minimum requests (Web events, or DNS queries with query/response pairs counted once) to one provider by one user or host within the hour before that provider counts as used. Background names are already excluded. One or two requests an hour are typical of link previews, browser prefetch and embedded widgets rather than use. Raise it if prefetch noise remains.
disabled = False
iseval = 0

[hdsi_ai_multiple_services_in_single_session_min_providers]
definition = 4
description = v1.1 Distinct AI providers a user or host must use within the hourly window to raise risk. On the validation tenant with the most AI DNS activity, three 24-hour hourly replays gave 51 to 83 hosts a day at 3 providers, almost all ChatGPT + Claude + Gemini power users, and 9 to 15 hosts a day at 4 (latest: 26 host-hours, 11 hosts). Derive a tenant value with the SPL in the README.
disabled = False
iseval = 0

[hdsi_ai_multiple_services_in_single_session_shared_src_names]
definition = 3000
description = v1.1 Shared-source guard: a DNS client that resolved at least this many distinct names in the hourly window is treated as a resolver, forwarder, proxy or NAT egress and its DNS evidence is dropped (it represents many people). Workstations stayed below about 650 names an hour at the 99th percentile on every validation tenant. On two tenants every DNS-only multi-provider candidate resolved 6,000 to 63,000 names an hour, i.e. shared infrastructure.
disabled = False
iseval = 0

[hdsi_ai_multiple_services_in_single_session_max_src_users]
definition = 1
description = v1.1 Shared-address guard for the system risk object: an address on which the Web data shows more than this many distinct users in the hourly window (all Web traffic, not only AI) is shared (NAT or SSE egress, VDI, terminal server, proxy). Users are compared after lowercasing and removing DOMAIN\ and @suffix (for addresses with up to 50 raw user values), so one person logged as DOMAIN\jdoe by one source and jdoe@example.com by another is one user. A shared address never receives src risk and never passes DNS evidence to a user; the user keeps their own Web-based risk. On one validation tenant whose SSE logs the public egress address as src, 35 addresses carried more than 20 users an hour (up to 617).
disabled = False
iseval = 0

[hdsi_ai_multiple_services_in_single_session_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after the per-entity aggregation and scoring (fields: entity, user, user_display, src, src_display, src_web_users, provider (multivalue), providers, provider_count, provider_list, usage_type_list, evidence_type, request_count, ai_domain_sample, ai_domain_count, bunit, sensitivity_level, risk_multiplier, base_score, risk_score, drill_user, drill_src, drill_web_src, firstTime, lastTime, ai_activity, detection_id, mitre_attack, ai_kill_chain_phase). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_multiple_services_in_single_session_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust or override risk_score (integer, at most 100; it applies to both the user and the system risk object). Ships as search *.
disabled = False
iseval = 0

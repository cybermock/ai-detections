action.notable.param.drilldown_searches = [{"name":"View associated risk events for $user_display$ / $src_display$","search":"| from datamodel:\"Risk.All_Risk\" | search (risk_object=\"$drill_user$\" OR risk_object=\"$drill_src$\") source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI web activity for $user_display$ on $src_display$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count sum(Web.bytes_out) as bytes_out min(_time) as firstTime max(_time) as lastTime values(Web.action) as action values(sourcetype) as orig_sourcetype from datamodel=Web where (Web.url_domain=* OR Web.site=*) `hdsi_ai_multiple_services_in_single_session_web_prefilter` (Web.user=\"$drill_user$\" OR Web.src=\"$drill_web_src$\") by Web.user Web.src Web.url_domain Web.site | rename Web.* as * | eval url_domain=coalesce(nullif(url_domain,\"unknown\"),site), ai_domain=lower(url_domain), ai_input_type=if(site=url_domain,\"app\",\"host\") | `ai_domains_filter` | eval mb_out=round(bytes_out/1024/1024,2) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, provider, usage_type, ai_traffic_class, url_domain, count, mb_out, action, orig_sourcetype | sort provider - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI DNS names resolved by $drill_src$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count min(_time) as firstTime max(_time) as lastTime values(DNS.message_type) as message_type values(DNS.vendor_product) as vendor_product from datamodel=Network_Resolution where DNS.src=\"$drill_src$\" `hdsi_ai_multiple_services_in_single_session_dns_prefilter` by DNS.src DNS.query | rename DNS.* as * | eval ai_domain=query, ai_input_type=\"dns\" | `ai_domains_filter` | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, src, provider, usage_type, ai_traffic_class, ai_match, query, message_type, vendor_product, count | sort provider - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]

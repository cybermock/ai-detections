search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) as firstTime max(_time) as lastTime from datamodel=Web where `hdsi_ai_multiple_services_in_single_session_web_prefilter` Web.user!="unknown" `hdsi_ai_multiple_services_in_single_session_filter` by Web.user Web.src Web.url_domain Web.site \
	| rename Web.* as * \
	| eval ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))), ai_input_type=if(isnull(nullif(url_domain,"unknown")),"app","host"), evidence_type="web" \
	| fields - url_domain site \
	| append maxtime=900 maxout=50000 [| tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Resolution where `hdsi_ai_multiple_services_in_single_session_dns_prefilter` NOT DNS.src IN ("unknown","-","0.0.0.0","127.0.0.1","::1") `hdsi_ai_multiple_services_in_single_session_dns_filter` by DNS.src DNS.query DNS.message_type DNS.vendor_product | rename DNS.* as * | stats max(count) as count min(firstTime) as firstTime max(lastTime) as lastTime values(vendor_product) as vendor_product by src query | where NOT (`hdsi_ai_multiple_services_in_single_session_unreliable_dns_src`) | eval ai_domain=query, ai_input_type="dns", evidence_type="dns" | fields - query vendor_product] \
	| `ai_domains_filter` \
	| where NOT provider IN (`hdsi_ai_multiple_services_in_single_session_excluded_providers`) AND NOT (`hdsi_ai_multiple_services_in_single_session_excluded_traffic`) AND NOT (`hdsi_ai_multiple_services_in_single_session_background_names`) \
	| eval user=if(isnull(user) OR in(lower(trim(user)),"unknown","-","","n/a","none","null"), null(), trim(user)), src=if(isnull(src) OR in(lower(trim(src)),"unknown","-",""), null(), trim(src)), severity_weight=tonumber(severity_weight), user_key=if(isnull(user), null(), coalesce(nullif(lower(replace(replace(user,"^[^\\\\]+[\\\\]",""),"@.*$","")),""), lower(user))) \
	| append maxtime=900 maxout=50000 [| tstats summariesonly=t allow_old_summaries=t dc(DNS.query) as src_name_count from datamodel=Network_Resolution where NOT DNS.src IN ("unknown","-","0.0.0.0","127.0.0.1","::1") `hdsi_ai_multiple_services_in_single_session_dns_filter` by DNS.src | where src_name_count>=`hdsi_ai_multiple_services_in_single_session_shared_src_names` | rename DNS.src as src | eval shared_src=1] \
	| append maxtime=900 maxout=50000 [| tstats summariesonly=t allow_old_summaries=t dc(Web.user) as src_web_users values(Web.user) as src_web_user_list from datamodel=Web where Web.user!="unknown" `hdsi_ai_multiple_services_in_single_session_filter` by Web.src | where src_web_users>`hdsi_ai_multiple_services_in_single_session_max_src_users` | eval src_web_user_list=if(src_web_users<=50, src_web_user_list, null()), src_web_users=if(isnull(src_web_user_list), src_web_users, mvcount(mvdedup(mvmap(src_web_user_list, if(in(lower(trim(src_web_user_list)),"-","","n/a","none","null"), null(), lower(replace(replace(src_web_user_list,"^[^\\\\]+[\\\\]",""),"@.*$",""))))))) | where src_web_users>`hdsi_ai_multiple_services_in_single_session_max_src_users` | rename Web.src as src | eval web_shared_src=1 | fields src src_web_users web_shared_src] \
	| eventstats max(shared_src) as shared_src max(web_shared_src) as web_shared_src max(src_web_users) as src_web_users by src \
	| where isnotnull(provider) AND NOT (evidence_type="dns" AND shared_src=1) \
	| eventstats dc(user_key) as src_user_count values(user) as src_users values(user_key) as src_user_keys by src \
	| eval inherit=if(isnull(user) AND src_user_count=1 AND isnull(web_shared_src), 1, 0), user=if(inherit=1, mvindex(src_users,0), user), user_key=if(inherit=1, src_user_keys, user_key), entity=coalesce("user:".user_key, "host:".src) \
	| where isnotnull(entity) \
	| stats sum(count) as provider_requests values(user) as user values(src) as srcs values(eval(if(web_shared_src=1, src, null()))) as shared_srcs max(src_web_users) as src_web_users values(ai_domain) as ai_domains values(usage_type) as usage_type values(evidence_type) as evidence_type max(severity_weight) as severity_weight min(firstTime) as firstTime max(lastTime) as lastTime by entity provider \
	| where provider_requests>=`hdsi_ai_multiple_services_in_single_session_min_requests` \
	| eval user=mvindex(user,0), src=mvindex(srcs,0) \
	| lookup identity_lookup_expanded identity as user OUTPUTNEW bunit \
	| eval bunit=mvindex(bunit,0) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| stats dc(provider) as provider_count values(provider) as providers sum(provider_requests) as request_count values(user) as user values(srcs) as srcs values(ai_domains) as ai_domains values(usage_type) as usage_types values(evidence_type) as evidence_type values(bunit) as bunit values(shared_srcs) as shared_srcs max(src_web_users) as src_web_users min(firstTime) as firstTime max(lastTime) as lastTime by entity \
	| where provider_count>=`hdsi_ai_multiple_services_in_single_session_min_providers` \
	| eval user=mvindex(user,0), src=if(mvcount(srcs)=1 AND isnull(shared_srcs), srcs, null()), src_display=case(mvcount(srcs)=1 AND isnotnull(shared_srcs), srcs." (shared address, ".src_web_users." Web users)", mvcount(srcs)=1, srcs, mvcount(srcs)>1, mvcount(srcs)." hosts (".mvjoin(mvindex(srcs,0,2),", ").")", true(), "an unknown host"), user_display=coalesce(user, "an unattributed user") \
	| where isnotnull(user) OR isnotnull(src) \
	| `ai_risk_multiplier` \
	| eval risk_multiplier=if(isnotnull(user), coalesce(risk_multiplier,1), 1), base_score=5*provider_count, risk_score=max(1, min(40, round(base_score*risk_multiplier, 0))) \
	| eval provider=providers, provider_list=mvjoin(providers,", "), usage_type_list=mvjoin(usage_types,", "), evidence_type=mvjoin(evidence_type," + "), ai_domain_count=mvcount(ai_domains), ai_domain_sample=mvjoin(mvindex(ai_domains,0,7),", "), drill_user=replace(coalesce(user,"__none__"),"[\\\\\"]","*"), drill_src=replace(coalesce(src,mvindex(srcs,0),"__none__"),"[\\\\\"]","*"), drill_web_src=if(isnull(user), drill_src, "__none__") \
	| fields - ai_domains usage_types srcs shared_srcs _final_multiplier \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="multi_service_session", detection_id="hdsi_ai_multiple_services_in_single_session", mitre_attack="T1588.007", ai_kill_chain_phase="recon" \
	| `hdsi_ai_multiple_services_in_single_session_customizations` \
	| `hdsi_ai_multiple_services_in_single_session_risk_score`

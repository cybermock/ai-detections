description = v1.1.0 Detects one user or host actively using several distinct AI providers within one hour (Web proxy/SSE or DNS evidence), a sign of prompt or data shopping across services. Background, IDE-assistant, shared-resolver, shared-address and roaming home-network DNS noise is removed. Risk only, no notable.

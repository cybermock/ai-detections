[hdsi_ai_api_key_exposure_in_code_dlp_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the Endpoint.Processes tstats where clause before aggregation. Use datamodel field names, e.g. NOT Processes.dest IN ("build-agent-*"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_api_key_exposure_in_code_dlp_process_prefilter]
definition = Processes.process IN ("*sk-proj-*","*sk-svcacct-*","*sk-admin-*","*sk-ant-*","*sk-or-*","*T3BlbkFJ*","*AIzaSy*","*hf_*","*r8_*","*tog-*","*gsk_*","*fw_*","*xai-*","*pplx-*","*co-*","*api_key*","*api-key*","*apikey*","*deepseek*","*mistral*","*cohere*","*azure_openai*","*azure-openai*")
description = v1.1 Cheap tstats pre-filter on the command line (case-insensitive wildcards). It only narrows candidates; the exact key regexes from ai_api_key_patterns decide. If you enable a new pattern in that lookup, add its literal prefix here or it can never match.
disabled = False
iseval = 0

[hdsi_ai_api_key_exposure_in_code_dlp_log_sources]
definition = (index=* sourcetype IN ("*github*","*gitlab*","*bitbucket*","*dlp*","*code_review*","*secret_scan*","*gitguardian*","*trufflehog*") NOT sourcetype="stash")
description = v1.1 Raw code-repository, DLP and secret-scanner logs scanned for key material. Pin the real index list per tenant (index=* is a portable default). Never include sourcetype stash: it is the summary/risk/notable index sourcetype, not Bitbucket.
disabled = False
iseval = 0

[hdsi_ai_api_key_exposure_in_code_dlp_pattern_policy]
definition = NOT in(pattern_id,"AK-019","AK-020") AND (NOT `hdsi_ai_api_key_exposure_in_code_dlp_contextual_patterns` OR match(scan_text,"(?i)(openai|anthropic|claude|gemini|groq|huggingface|cohere|(?<![a-z])co[_-]api[_-]?key|mistral|deepseek|together[_-]?(ai[_-]?)?api|fireworks|(?<![a-z])llm(?![a-z]))")) AND (pattern_id!="AK-004" OR match(scan_text,"(?i)(gemini|generativelanguage|aistudio|aiplatform|genai|google_api_key)")) AND (pattern_id!="AKX-002" OR match(scan_text,"(?i)deepseek")) AND (pattern_id!="AKX-005" OR match(scan_text,"(?i)fireworks"))
description = v1.1 Which key patterns count. Drops AK-019 (AWS key ID, not a secret, not AI) and AK-020 (GitHub token, not AI). Contextual (label-led) patterns need an AI provider named in the same text; plain "azure" no longer counts (it matched any Azure URL) and "llm" must be a whole word (it matched DllMain/InstallMode). AK-004 (any Google AIza key, e.g. public keys in crash reporters) needs Gemini/Generative Language context; AKX-002 (sk- + 32 hex) needs deepseek and AKX-005 (short fw_ keys) needs fireworks in the same text.
disabled = False
iseval = 0

[hdsi_ai_api_key_exposure_in_code_dlp_contextual_patterns]
definition = in(pattern_id,"AK-005","AK-006","AK-010","AK-012","AK-022","AKX-002","AKX-003","AKX-004","AKX-006")
description = v1.1 Boolean eval expression naming the label-led (contextual) patterns. These match at their exact length (no trailing extension; a key character right after the match fails it) and need AI context in the same text (see _pattern_policy). Add the pattern_id of any new contextual pattern you enable in ai_api_key_patterns.
disabled = False
iseval = 0

[hdsi_ai_api_key_exposure_in_code_dlp_extra_patterns]
definition = split("AKX-002#~#DeepSeek#~#high#~#sk-[a-f0-9]{32}@@AKX-003#~#Together#~#high#~#(?i)together[_-]?(?:ai[_-]?)?api[_-]?key[^A-Za-z0-9_-]{1,8}[A-Za-z0-9_-]{40,}@@AKX-004#~#Cohere#~#high#~#(?i)co[_-]api[_-]?key[^A-Za-z0-9_-]{1,8}[A-Za-z0-9]{40}@@AKX-005#~#Fireworks#~#high#~#fw_[A-Za-z0-9]{20,}@@AKX-006#~#Azure OpenAI#~#high#~#(?i)(?:azure[_-]?openai[_-]?(?:api[_-]?)?key|api[_-]?key)[^A-Za-z0-9_-]{1,8}[A-Za-z0-9]{84}", "@@")
description = v1.1 Package-local key formats the shared ai_api_key_patterns lookup lacks or may get wrong, as an eval expression returning pattern_id#~#provider#~#severity#~#regex values separated by @@ (no backslashes or double quotes inside). AKX-002 DeepSeek sk- + 32 hex anywhere in text naming deepseek (AK-022 needs the label right before the key). AKX-003 Together = any 40+ character value after a TOGETHER_API_KEY-style label (no vendor-documented prefix; AK-009 tog- is unverified). AKX-004 Cohere = 40 characters after the SDK variable CO_API_KEY. AKX-005 Fireworks fw_ + 20 or more with fireworks in the text. AKX-006 Azure OpenAI 84-character keys after an azure_openai or api-key label. Return null() to disable; drop an entry once the shared lookup covers it.
disabled = False
iseval = 0

[hdsi_ai_api_key_exposure_in_code_dlp_log_prefilter]
definition = regex _raw="(?i)(sk-|AIzaSy|hf_|r8_|tog-|gsk_|fw_|xai-|pplx-|co-|api[_-]?key|apikey|azure|cohere|mistral|deepseek|together|fireworks)"
description = v1.1 Cheap raw-text candidate filter for the log path, shared by the search and its log drilldown so both see the same events. The key regexes decide afterwards.
disabled = False
iseval = 0

[hdsi_ai_api_key_exposure_in_code_dlp_log_identity]
definition = eval user=coalesce(user, actor, src_user, user_name, sender, author_email, committer_email, 'SourceMetadata.Data.Git.email', 'SourceMetadata.Data.Github.email', 'SourceMetadata.Data.Gitlab.email'), dest=coalesce(src_nt_host, src_host, src, 'SourceMetadata.Data.Git.repository', 'SourceMetadata.Data.Github.repository', 'SourceMetadata.Data.Gitlab.repository', repository, repo)
description = v1.1 Log-path attribution, shared by the search and its log drilldown. User = CIM user fields, then git author/committer email (TruffleHog JSON SourceMetadata.Data.Git.email). Host = the endpoint (src_nt_host/src_host/src), then the repository for secret-scanner output. Never dest or host: on DLP data dest is the website or disk target and host is the collector.
disabled = False
iseval = 0

[hdsi_ai_api_key_exposure_in_code_dlp_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after normalisation (fields: user, dest, provider, matched_patterns, evidence_sources, process_names, key_hints, distinct_keys, exposure_count). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_api_key_exposure_in_code_dlp_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. risk_score is already set (50 critical-provider key, 40 other, x risk_multiplier, capped 80). Ships as search *.
disabled = False
iseval = 0

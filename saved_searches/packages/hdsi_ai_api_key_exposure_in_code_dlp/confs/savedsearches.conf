[Audit - HDSI AI API Key Exposure In Code/DLP - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI API Key Exposure In Code/DLP
action.correlationsearch.annotations = {"mitre_attack": ["T1552", "T1552.001"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$risk_object$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View command lines carrying AI key material on $dest_display$","search":"| tstats summariesonly=true allow_old_summaries=true count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where Processes.dest=\"$dest_dd$\" `hdsi_ai_api_key_exposure_in_code_dlp_process_prefilter` by Processes.user Processes.parent_process_name Processes.process_name Processes.process | rename Processes.* as * | convert ctime(firstTime) ctime(lastTime) | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View code, DLP and secret-scanner log events for $user_display$ / $dest_display$","search":"search `hdsi_ai_api_key_exposure_in_code_dlp_log_sources` | `hdsi_ai_api_key_exposure_in_code_dlp_log_prefilter` | `hdsi_ai_api_key_exposure_in_code_dlp_log_identity` | search user=\"$user_dd$\" OR dest=\"$dest_dd$\" | table _time, index, sourcetype, source, user, dest, _raw | sort - _time | head 200","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = AI provider API key material ($provider$; $distinct_keys$ distinct key(s), patterns $matched_patterns$) was written in clear text $exposure_count$ time(s) to $evidence_sources$ for user $user_display$ on $dest_display$. Key suffixes: $key_hints$. Rotate the key(s).
action.notable.param.rule_title = HDSI AI API Key Exposure In Code/DLP ($user_display$ on $dest_display$)
action.notable.param.security_domain = audit
action.notable.param.severity = high
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":50},{"risk_object_field":"dest","risk_object_type":"system","risk_score":30}]
action.risk.param._risk_message = AI provider API key material ($provider$; $distinct_keys$ distinct key(s), patterns $matched_patterns$) was written in clear text $exposure_count$ time(s) to $evidence_sources$ for user $user_display$ on $dest_display$. Key suffixes: $key_hints$. Rotate the key(s).
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user,dest
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 1-59/15 * * * *
description = v1.1.0 Detects AI provider API keys (shared ai_api_key_patterns library plus package patterns for DeepSeek, Together, Cohere CO_API_KEY, short Fireworks and 84-character Azure OpenAI keys) written in clear text to endpoint command lines (Endpoint.Processes) or to code-repository, DLP and secret-scanner logs. Risk only on the user and host, no notable; the key itself is never copied into the risk event.
disabled = 0
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=true allow_old_summaries=true count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where `hdsi_ai_api_key_exposure_in_code_dlp_process_prefilter` `hdsi_ai_api_key_exposure_in_code_dlp_filter` by Processes.dest Processes.user Processes.process_name Processes.process \
	| rename Processes.* as * \
	| eval evidence_source="endpoint_command_line", scan_text=process \
	| append [search `hdsi_ai_api_key_exposure_in_code_dlp_log_sources` \
	| `hdsi_ai_api_key_exposure_in_code_dlp_log_prefilter` \
	| `hdsi_ai_api_key_exposure_in_code_dlp_log_identity` \
	| eval evidence_source="log:".sourcetype, scan_text=_raw, count=1, firstTime=_time, lastTime=_time \
	| fields user dest sourcetype evidence_source scan_text count firstTime lastTime | fields - _raw] \
	| eval user=if(isnull(user) OR match(lower(user), "^(|-|unknown|n/a|null|system|local service|network service)$") OR match(lower(user), "\\\\(system|local service|network service)$") OR match(user, "\$$"), null(), user), dest=if(isnull(dest) OR match(lower(dest), "^(|-|unknown|n/a|null)$"), null(), dest) \
	| where isnotnull(user) OR isnotnull(dest) \
	| fillnull value="" user dest \
	| streamstats count as zz_evidence_row \
	| append [| `ai_api_key_patterns_enabled` | eval zz_pattern_row=1] \
	| eventstats values(eval(if(zz_pattern_row=1, pattern_id."#~#".provider."#~#".severity."#~#".regex_pattern, null()))) as pattern_bundle \
	| where isnull(zz_pattern_row) AND isnotnull(scan_text) \
	| fields - pattern_id provider severity regex_pattern zz_pattern_row \
	| eval pattern_bundle=mvappend(pattern_bundle, `hdsi_ai_api_key_exposure_in_code_dlp_extra_patterns`) \
	| mvexpand pattern_bundle \
	| rex field=pattern_bundle "^(?<pattern_id>[^#]+)#~#(?<provider>[^#]+)#~#(?<key_severity>[^#]+)#~#(?<key_regex>.+)$" \
	| eval key_match_regex=if(`hdsi_ai_api_key_exposure_in_code_dlp_contextual_patterns`, "(?<![A-Za-z0-9])(?:".key_regex.")(?![A-Za-z0-9_-])", "(?:(?<![A-Za-z0-9_-])|(?<=%3[DdAa]|%2[027Cc]|\\\\[nrt]))(?:".key_regex.")[A-Za-z0-9_-]*") \
	| where `hdsi_ai_api_key_exposure_in_code_dlp_pattern_policy` AND match(scan_text, key_match_regex) \
	| eval matched_text=replace(scan_text, "(?s)^.*?(".key_match_regex.").*$", "\1") \
	| eval matched_key=replace(matched_text, "^.*?([A-Za-z0-9_-]+)$", "\1") \
	| where NOT match(matched_key, "(?i)(x{6,}|0{8,}|your|example|placeholder|dummy|redacted|changeme|sample|fake)") \
	| eval key_sha256=sha256(matched_key), key_last4=substr(matched_key, -4) \
	| stats values(provider) as provider values(pattern_id) as pattern_id values(key_severity) as key_severity first(key_last4) as key_last4 first(count) as count first(user) as user first(dest) as dest first(evidence_source) as evidence_source first(process_name) as process_name first(sourcetype) as sourcetype first(firstTime) as firstTime first(lastTime) as lastTime by zz_evidence_row key_sha256 \
	| eval key_hint=mvjoin(provider, "/")." ****".key_last4 \
	| stats values(provider) as provider values(pattern_id) as pattern_id values(key_severity) as key_severity values(key_hint) as key_hint values(key_sha256) as key_sha256 first(count) as count first(user) as user first(dest) as dest first(evidence_source) as evidence_source first(process_name) as process_name first(sourcetype) as sourcetype first(firstTime) as firstTime first(lastTime) as lastTime by zz_evidence_row \
	| stats sum(count) as exposure_count dc(key_sha256) as distinct_keys values(provider) as provider values(pattern_id) as matched_patterns values(key_severity) as key_severities values(key_hint) as key_hints values(evidence_source) as evidence_sources values(process_name) as process_names values(sourcetype) as log_sourcetypes min(firstTime) as firstTime max(lastTime) as lastTime by user dest \
	| eval user=nullif(user, ""), dest=nullif(dest, ""), key_severity=if(isnotnull(mvfind(key_severities, "critical")), "critical", "high") \
	| eval provider=mvjoin(provider, ", "), matched_patterns=mvjoin(matched_patterns, ", "), evidence_sources=mvjoin(evidence_sources, ", "), key_hints=mvjoin(mvindex(key_hints, 0, 4), ", "), user_display=coalesce(user, "no attributed user"), dest_display=coalesce(dest, "no attributed host"), user_dd=if(isnull(user), "hdsi_no_attributed_user", replace(user, "[\\\\\"]", "*")), dest_dd=if(isnull(dest), "hdsi_no_attributed_host", replace(dest, "[\\\\\"]", "*")) \
	| `ai_risk_multiplier` \
	| eval risk_score=min(80, round(if(key_severity="critical", 50, 40) * coalesce(risk_multiplier, 1))) \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="api_key_exposure", detection_id="hdsi_ai_api_key_exposure_in_code_dlp", mitre_attack=mvappend("T1552", "T1552.001"), ai_kill_chain_phase="staging" \
	| fields - key_severities \
	| `hdsi_ai_api_key_exposure_in_code_dlp_customizations` \
	| `hdsi_ai_api_key_exposure_in_code_dlp_risk_score`

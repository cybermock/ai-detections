action.correlationsearch.label = HDSI AI Usage Volume Anomaly
action.correlationsearch.annotations = {"mitre_attack": ["T1567"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name": "View associated risk events", "search": "| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$user_dd$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time", "earliest_offset": "$info_min_time$", "latest_offset": "$info_max_time$"}, {"name": "View daily AI firewall App-ID sessions for $user$", "search": "| tstats summariesonly=t allow_old_summaries=t count as sessions sum(All_Traffic.bytes_out) as bytes_out from datamodel=Network_Traffic where All_Traffic.user=\"$user_dd$\" NOT All_Traffic.action=\"blocked\" `hdsi_ai_usage_volume_anomaly_app_prefilter` by _time span=1d All_Traffic.app | rename All_Traffic.* as * | eval ai_domain=app, ai_input_type=\"app\" | `ai_domains_filter` | search usage_type IN (`hdsi_ai_usage_volume_anomaly_usage_types`) NOT ai_traffic_class IN (\"background\",\"site\") | eval day=strftime(_time,\"%F\") | stats sum(sessions) as sessions sum(bytes_out) as bytes_out values(app) as app by day provider | eval mb_out=round(bytes_out/1048576,2) | fields - bytes_out | sort - day", "earliest_offset": "$info_min_time$", "latest_offset": "$info_max_time$"}, {"name": "View daily AI web activity for $user$", "search": "| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count as requests sum(Web.bytes_out) as bytes_out from datamodel=Web where Web.user=\"$user_dd$\" NOT Web.action=\"blocked\" (Web.url_domain=* OR Web.site=*) by _time span=1d Web.url_domain Web.site | rename Web.* as * | eval ai_input_type=if(url_domain=\"unknown\",\"app\",\"host\"), url_domain=coalesce(nullif(url_domain,\"unknown\"),site), ai_domain=lower(url_domain) | `ai_domains_filter` | search usage_type IN (`hdsi_ai_usage_volume_anomaly_usage_types`) NOT ai_traffic_class IN (\"background\",\"site\") | eval day=strftime(_time,\"%F\") | stats sum(requests) as requests sum(bytes_out) as bytes_out values(ai_domain) as url_domain by day provider | eval mb_out=round(bytes_out/1048576,2) | fields - bytes_out | sort - day", "earliest_offset": "$info_min_time$", "latest_offset": "$info_max_time$"}]
action.notable.param.rule_description = $user$ used AI services far above their own baseline on the evaluated day ($anomaly_type$): $requests$ $evidence$ $count_unit$ (baseline avg $mean_requests$ over $baseline_days$ active of $history_days$ covered history days, z=$z_requests$) and $mb_out$ MB uploaded (baseline avg $mean_mb$ MB, z=$z_mb$) to $provider$.
action.notable.param.rule_title = HDSI AI Usage Volume Anomaly ($user$)
action.notable.param.security_domain = network
action.notable.param.severity = medium
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":30}]
action.risk.param._risk_message = $user$ used AI services far above their own baseline on the evaluated day ($anomaly_type$): $requests$ $evidence$ $count_unit$ (baseline avg $mean_requests$ over $baseline_days$ active of $history_days$ covered history days, z=$z_requests$) and $mb_out$ MB uploaded (baseline avg $mean_mb$ MB, z=$z_mb$) to $provider$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 82800s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 30 3 * * *
description = v1.1.0 Daily per-user AI usage anomaly: compares each user's AI sessions/requests and MB uploaded on the last complete day with their own baseline over the 14 prior days (firewall App-ID sessions from Network_Traffic, web requests from Web, whether proxy, SSE, URL-filtering or enterprise-browser logs; needs data model summaries covering at least 15 days for a full baseline) and raises risk on the user when the day is far above it. Risk only, no notable.
disabled = 0
dispatch.earliest_time = -15d@d
dispatch.latest_time = @d
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t count as requests sum(All_Traffic.bytes_out) as bytes_out from datamodel=Network_Traffic where NOT All_Traffic.action="blocked" `hdsi_ai_usage_volume_anomaly_app_prefilter` `hdsi_ai_usage_volume_anomaly_filter` by _time span=1d All_Traffic.user All_Traffic.app \
	| rename All_Traffic.* as * \
	| eval ai_domain=app, ai_input_type="app", evidence="firewall App-ID" \
	| `ai_domains_filter` \
	| `hdsi_ai_usage_volume_anomaly_daily_baseline` \
	| append maxtime=1800 timeout=1800 [| tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count as requests sum(Web.bytes_out) as bytes_out from datamodel=Web where NOT Web.action="blocked" `hdsi_ai_usage_volume_anomaly_web_prefilter` `hdsi_ai_usage_volume_anomaly_web_filter` by _time span=1d Web.user Web.url_domain Web.site | rename Web.* as * | eval ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))), ai_input_type=if(isnull(nullif(url_domain,"unknown")),"app","host"), evidence="web/SSE log" | `ai_domains_filter` | `hdsi_ai_usage_volume_anomaly_daily_baseline`] \
	| eval mb_out=round(bytes_out/1048576,2), sd_requests=max(coalesce(stdev_requests,0),0.5*mean_requests,1), sd_mb=max(coalesce(stdev_mb,0),0.5*mean_mb,1), z_requests=(requests-mean_requests)/sd_requests, z_mb=(mb_out-mean_mb)/sd_mb \
	| eventstats median(z_requests) as fleet_z_requests median(z_mb) as fleet_z_mb count as fleet_users by evidence \
	| eval fleet_shift=if(fleet_users>=`hdsi_ai_usage_volume_anomaly_fleet_min_users`,1,0), z_requests=round(z_requests-if(fleet_shift=1,max(fleet_z_requests,0),0),1), z_mb=round(z_mb-if(fleet_shift=1,max(fleet_z_mb,0),0),1) \
	| eval count_unit=if(evidence="firewall App-ID","sessions","requests"), min_count=if(evidence="firewall App-ID",`hdsi_ai_usage_volume_anomaly_min_sessions`,`hdsi_ai_usage_volume_anomaly_min_requests`), req_anomaly=if(z_requests>=`hdsi_ai_usage_volume_anomaly_zscore` AND requests>=min_count,1,0), mb_anomaly=if(z_mb>=`hdsi_ai_usage_volume_anomaly_zscore` AND mb_out>=`hdsi_ai_usage_volume_anomaly_min_mb`,1,0) \
	| where req_anomaly=1 OR mb_anomaly=1 \
	| eval anomaly_type=case(req_anomaly=1 AND mb_anomaly=1,"requests and upload", mb_anomaly=1,"upload", true(),"requests"), z_max=max(if(req_anomaly=1,z_requests,0),if(mb_anomaly=1,z_mb,0)), base_score=case(req_anomaly=1 AND mb_anomaly=1,50, mb_anomaly=1 AND z_max>=8,40, mb_anomaly=1,30, z_max>=8,30, true(),20), ai_kill_chain_phase=if(mb_anomaly=1,"exfiltration","execution") \
	| sort 0 - base_score - z_max \
	| dedup user \
	| eval mean_requests=round(mean_requests,0), mean_mb=round(mean_mb,2), provider=mvjoin(mvindex(providers,0,9),", "), eval_day=strftime(_time,"%F"), user_dd=replace(user,"[\x5c\x22]","*") \
	| `ai_risk_multiplier` \
	| eval risk_score=min(70,round(base_score*coalesce(risk_multiplier,1),0)) \
	| fields - providers bytes_out stdev_requests stdev_mb sd_requests sd_mb min_count req_anomaly mb_anomaly bunit fleet_z_requests fleet_z_mb fleet_shift \
	| eval ai_activity="volume_anomaly", detection_id="hdsi_ai_usage_volume_anomaly", mitre_attack="T1567" \
	| `hdsi_ai_usage_volume_anomaly_customizations` \
	| `hdsi_ai_usage_volume_anomaly_risk_score`

description = v1.1 Inline pre-filter for the Web branch: every enabled interactive ai_provider_domains host as an exact url_domain/site value (traffic_class background and site hosts are left out because the rule does not count them), 21 wildcard patterns (*.base for 15 high-volume chat/API provider bases, not the IDE assistants, which hdsi_ai_usage_volume_anomaly_usage_types leaves out, plus 6 cloud AI endpoint patterns for Azure OpenAI, Azure AI Foundry, Azure AI Services, Bedrock, SageMaker and Vertex AI), and the enabled ai_provider_apps names (SSE/CASB and enterprise-browser products put an app name in site). Leading wildcards are expensive in tstats (about 0.4-1.3 s per pattern per day of data on the validation tenants; a full 131-pattern list took up to 175 s per day), so other providers count only on their listed hosts. It only narrows the read: ai_domains_filter still decides the provider. Add a *.base pattern here for a provider whose subdomains matter to you. On a Web data model dominated by inbound server logs, restrict the branch to the proxy/SSE indexes with the web_filter macro rather than emptying this one.
disabled = False
iseval = 0

[hdsi_ai_usage_volume_anomaly_usage_types]
definition = "web","api","cli","local_llm","model_registry"
description = v1.1 ai_domains_filter usage_type values that count toward a user's daily AI volume. IDE coding assistants (usage_type ide, e.g. GitHub Copilot, Cursor) are left out: their traffic follows coding workload and on the SSE validation tenant they made up almost every low-threshold anomaly. hdsi_ai_code_assistant_network_connection covers them. Add "ide" to baseline them too.
disabled = False
iseval = 0

[hdsi_ai_usage_volume_anomaly_zscore]
definition = 4
description = v1.1 Minimum z-score of the evaluated day against the user's own baseline (after the fleet-shift correction), for sessions/requests or MB uploaded. z uses max(stdev, 0.5 x mean, 1), so 4 also means at least 3x the user's mean day. Replaces ai_detection_config volume_anomaly_zscore (3). In validation on the largest tenant, z>=4 flagged 3 of 47 scored firewall users and 29 of 736 scored proxy users on one day; with the absolute floors 2 firewall and 4 proxy rows remained. The SSE tenant flagged 0-2 users a day. Derive it with the README SPL.
disabled = False
iseval = 0

[hdsi_ai_usage_volume_anomaly_min_baseline_days]
definition = 7
description = v1.1 Target number of active AI-usage days in the 14-day history (the dispatch window is -15d@d to @d) before a user is scored, so first-time and occasional users never look anomalous. It applies in full only when the Web / Network_Traffic summaries cover the whole history; when they cover less (data model acceleration earliest_time shorter than -15d, or a newly accelerated model), the baseline macro scales it down in proportion to the covered days, never below hdsi_ai_usage_volume_anomaly_min_baseline_floor. Replaces ai_detection_config volume_anomaly_min_days. Raise it (and widen dispatch.earliest_time and the acceleration range together) for a steadier baseline at a higher search cost.
disabled = False
iseval = 0

[hdsi_ai_usage_volume_anomaly_min_baseline_floor]
definition = 4
description = v1.1 Lowest number of active baseline days a user can be scored on when the data model summaries cover less than the 14-day history (for example acceleration earliest_time = -1w, as on one validation tenant, where only about 6 complete history days exist). With 7 covered days the requirement becomes 4 instead of 7, so the rule does not silently score only always-on accounts. A 4-day baseline was sane in validation because z uses max(stdev, 0.5 x mean, 1). Raise it to 7 to refuse short baselines altogether.
disabled = False
iseval = 0

[hdsi_ai_usage_volume_anomaly_coverage_share]
definition = 0.02
description = v1.1 A history day counts as covered (summaries present) for an evidence source when the number of users with AI activity that day is at least this share of the busiest day in the window. 0.02 ignores days that hold only a handful of users from stale old summaries (on the validation tenant with a 1-week acceleration range: 2-5 users against a peak of about 5,800) while still counting quiet weekend days (on the SSE validation tenant: 4-7 users against a peak of 73). Used only to scale the required baseline days.
disabled = False
iseval = 0

[hdsi_ai_usage_volume_anomaly_min_requests]
definition = 100
description = v1.1 Web (proxy, SSE, URL-filtering or enterprise-browser logs) branch: minimum AI requests on the evaluated day for a request-count anomaly, so a jump from 2 to 20 requests never scores. It is a noise floor, not the anomaly test (the z-score decides): any value between the median and the p99 of a scored user-day works (README Threshold). On the largest validation tenant 736 Web users were scored with p90 40 and p99 334 requests; the floor removed 25 of 29 z>=4 rows, all of 6-72 requests. On the SSE tenant (p99 6) it means request counts alone cannot fire, only uploads. Firewall sessions use hdsi_ai_usage_volume_anomaly_min_sessions.
disabled = False
iseval = 0

[hdsi_ai_usage_volume_anomaly_min_sessions]
definition = 500
description = v1.1 Network_Traffic (firewall App-ID) branch: minimum AI sessions on the evaluated day for a session-count anomaly. Firewall App-ID logs count sessions, which run several times higher per user than proxy requests, so a separate floor keeps small session counts from scoring on z alone. It is a noise floor, not the anomaly test: any value between the median and the p99 of a scored user-day works, and 500 sits between the median and the p75. On the largest validation tenant 47 firewall users were scored with median 119, p75 717 and p90 1,911 sessions; 500 kept 2 of the 3 z>=4 rows (2,069 and 4,544 sessions against means of 373 and 282) and dropped a 457-session day. Derive it with the README Threshold SPL.
disabled = False
iseval = 0

[hdsi_ai_usage_volume_anomaly_min_mb]
definition = 20
description = v1.1 Minimum MB uploaded (bytes_out) to AI services on the evaluated day for an upload anomaly to count. A noise floor, deliberately low: 20 MB of prompts and files in a day is already a lot, and the z-score must qualify the day too. It sits below the p90 of a scored firewall user-day on the largest validation tenant (p90 46 MB, p99 165 MB); raise it toward the p90 if upload rows are too frequent. That tenant's Web logs carry no bytes_out, so only the firewall branch can measure uploads there. Hourly bulk uploads are covered separately by hdsi_ai_high_volume_upload_to_ai_service.
disabled = False
iseval = 0

[hdsi_ai_usage_volume_anomaly_fleet_min_users]
definition = 20
description = v1.1 Fleet-shift guard. When at least this many users are scored from one evidence source, the median z-score of that population (if positive) is subtracted from every user's z-score, so an organisation-wide change (a provider outage ending, a new built-in assistant, a log source catching up) does not make hundreds of users anomalous at once. Below this population size z-scores are used as is.
disabled = False
iseval = 0

[hdsi_ai_usage_volume_anomaly_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after scoring (fields: user, user_dd, provider, evidence, count_unit, requests, mean_requests, z_requests, mb_out, mean_mb, z_mb, baseline_days, history_days, required_days, anomaly_type, ai_kill_chain_phase (exfiltration when the upload is anomalous, execution for request-only rows), base_score, risk_multiplier, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_usage_volume_anomaly_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. The SPL sets risk_score = base (50 when both requests and upload are anomalous; upload only 30, or 40 at z>=8; requests/sessions only 20, or 30 at z>=8, because a request spike carries no upload evidence) x risk_multiplier (identity bunit sensitivity, privileged x1.25), capped at 70, on the user. Override risk_score here (keep it 1-100). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_usage_volume_anomaly_daily_baseline]
definition = search usage_type IN (`hdsi_ai_usage_volume_anomaly_usage_types`) NOT ai_traffic_class IN ("background","site") | eval user=lower(trim(user)) | where isnotnull(user) AND NOT match(user,"^(unknown|-|n/a|null|none|)$") AND isnotnull(provider) | stats sum(requests) as requests sum(bytes_out) as bytes_out by _time user provider evidence | addinfo | eval eval_end=relative_time(info_max_time,"@d"), eval_start=relative_time(eval_end,"-1d@d"), history_window_days=max(round((eval_start-relative_time(info_min_time,"@d"))/86400,0),1) | where _time<eval_end | eventstats dc(user) as day_users by _time evidence | eventstats max(day_users) as peak_day_users by evidence | eval covered_day=if(_time<eval_start AND day_users>=`hdsi_ai_usage_volume_anomaly_coverage_share`*peak_day_users,_time,null()) | eventstats dc(covered_day) as history_days by evidence | eval required_days=min(`hdsi_ai_usage_volume_anomaly_min_baseline_days`,max(`hdsi_ai_usage_volume_anomaly_min_baseline_floor`,ceiling(`hdsi_ai_usage_volume_anomaly_min_baseline_days`*history_days/history_window_days))) | eventstats max(_time) as last_active by user evidence | where last_active>=eval_start | `ai_unsanctioned_filter(user,src,provider)` | stats sum(requests) as requests sum(bytes_out) as bytes_out values(provider) as providers by _time user evidence eval_start history_days required_days | eval bytes_out=coalesce(bytes_out,0), hist_requests=if(_time<eval_start,requests,null()), hist_mb=if(_time<eval_start,bytes_out/1048576,null()) | eventstats count(hist_requests) as baseline_days avg(hist_requests) as mean_requests stdev(hist_requests) as stdev_requests avg(hist_mb) as mean_mb stdev(hist_mb) as stdev_mb by user evidence | where _time>=eval_start AND baseline_days>=required_days | fields _time user evidence providers requests bytes_out baseline_days history_days required_days mean_requests stdev_requests mean_mb stdev_mb
description = v1.1 Shared per-branch pipeline (Network_Traffic and Web). Input rows: _time (1-day span), user, provider, evidence, requests, bytes_out after ai_domains_filter. Keeps the usage types in hdsi_ai_usage_volume_anomaly_usage_types and only interactive hosts (ai_traffic_class background and site rows, such as gemini.gstatic.com, Copilot telemetry, ChatGPT/OpenAI analytics hosts and vendor download sites, are not usage), drops rows without a usable user, removes ai_sanctioned_entities allow-listed pairs (user, ES identity group or organisation-wide * key with the provider; ai_unsanctioned_filter looks up the identity bunit itself), sums each user's AI activity per day across providers, and builds the user's own baseline from the history days only (the evaluated day, the last complete day of the dispatch window, is excluded so a spike cannot inflate its own baseline). It also measures history_days, the history days that really hold summaries for that evidence source (a day counts when its scored-user population is at least hdsi_ai_usage_volume_anomaly_coverage_share of the busiest day, so stray old summaries and empty days do not count), and scales the required active days to that coverage: required_days = min(min_baseline_days, max(min_baseline_floor, ceiling(min_baseline_days x history_days / history window days))). Returns one row per user and evidence source for the evaluated day, only for users with at least required_days active baseline days. Not a tuning hook.
disabled = False
iseval = 0

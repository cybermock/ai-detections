[hdsi_ai_usage_volume_anomaly_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Network_Traffic (firewall App-ID) branch, applied inside its tstats where clause before aggregation. Use datamodel field names, e.g. NOT All_Traffic.user IN ("svc_*") or NOT All_Traffic.src IN ("192.0.2.0/24") for a service account, NAT pool or approved AI integration whose volume swings by design. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_usage_volume_anomaly_web_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Web (proxy, SSE, URL-filtering or enterprise-browser logs) branch, applied inside its tstats where clause before aggregation. Use datamodel field names, e.g. NOT Web.user IN ("svc_*"). If the Web data model also holds large inbound server logs (load balancer, WAF, IIS), restrict it to the egress proxy/SSE indexes, e.g. index IN ("proxy","netskope"): an index filter prunes whole summaries and is the cheapest way to cut this branch's run time. On a tenant whose Web data has no user-attributed AI requests (README Deployment check), turn the branch off with index="hdsi_web_branch_off" (a non-existent index; on the inbound-only validation tenant this cut the 15-day Web read from about 10 minutes to 1.5 s). Filtering out the unknown user does not make the read cheaper. Ships empty.
disabled = False
iseval = 0


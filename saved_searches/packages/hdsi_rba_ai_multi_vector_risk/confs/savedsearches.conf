[Threat - HDSI RBA AI Multi-Vector Risk - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI RBA AI Multi-Vector Risk
action.correlationsearch.annotations = {"mitre_attack": ["T1588.007"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 1
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View contributing AI risk events for $risk_object$","search":"| from datamodel:\"Risk.All_Risk\" | search source=\"* - HDSI AI * - Rule\" risk_object_type IN (\"user\", \"system\") risk_object IN ($contributing_objects$) | table _time, source, risk_object, risk_object_type, risk_score, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"Summarize AI risk by detection for $risk_object$","search":"| from datamodel:\"Risk.All_Risk\" | search source=\"* - HDSI AI * - Rule\" risk_object_type IN (\"user\", \"system\") risk_object IN ($contributing_objects$) | stats count as risk_events sum(risk_score) as total_risk min(_time) as firstTime max(_time) as lastTime values(risk_object) as risk_objects latest(risk_message) as latest_message by source | sort - total_risk | convert ctime(firstTime) ctime(lastTime)","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View all risk (any content) for $risk_object$ and its related systems","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object IN ($contributing_objects$) | stats count as risk_events sum(risk_score) as total_risk values(annotations.mitre_attack.mitre_technique_id) as mitre_technique_id by source risk_object risk_object_type | sort - total_risk","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = The $risk_object_type$ $risk_object$ accumulated AI risk across $vector_count$ distinct vectors ($vector_list$) in 24 hours, including the high-impact vector(s) $high_impact_list$. Newly added vector(s): $new_vector_list$. Contributing: $detection_count$ HDSI AI detections, $risk_event_count$ risk results, total risk $total_risk$ (each result counted once, even when it scored both a user and a host). Related systems merged into this object: $related_system_list$.
action.notable.param.rule_title = HDSI AI Multi-Vector Risk for $risk_object_type$ $risk_object$ ($vector_count$ vectors)
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 0
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = risk_object_key,risk_object_type,vector_count
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 6-59/15 * * * *
description = v1.1.0 Notable when one user (with the hosts attributed only to that user) or one unattributed system accumulates HDSI AI risk across 3 or more of 6 distinct AI risk vectors in 24 hours, at least one of them high impact (data exposure, risky access or adversarial AI). Fires on a rising edge, when an object reaches the threshold or adds a vector. Reads index=risk; writes no risk.
disabled = 0
dispatch.earliest_time = -24h
dispatch.latest_time = now
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = index=risk source="* - HDSI AI * - Rule" risk_object_type IN ("user", "system") risk_object=* NOT risk_object IN ("*$") NOT tag="risk_suppression" `hdsi_rba_ai_multi_vector_risk_filter` \
	| eval risk_object_key=lower(trim(mvindex(risk_object, 0))) \
	| where isnotnull(risk_object_key) AND NOT in(risk_object_key, "", "unknown", "-", "n/a", "na", "none", "null", "undefined") AND NOT (risk_object_type="user" AND match(risk_object_key, `hdsi_rba_ai_multi_vector_risk_builtin_accounts`)) \
	| eval detection_label=replace(replace(source, "^[^-]+ - HDSI AI ", ""), " - Rule$", "") \
	| eval detection_key=if(match(mvindex(detection_id, 0), "^hdsi_ai_[a-z0-9_]+$"), mvindex(detection_id, 0), "hdsi_ai_".trim(replace(lower(detection_label), "[^a-z0-9]+", "_"), "_")) \
	| `hdsi_rba_ai_multi_vector_risk_vector_map` \
	| where isnotnull(ai_vector) \
	| eval user_key=lower(trim(mvindex(user, 0))) \
	| eval attributed_user=case(risk_object_type!="system", null(), mvcount(user)>1, "__multiple__", isnull(user_key) OR in(user_key, "", "unknown", "-", "n/a", "na", "none", "null", "undefined") OR like(user_key, "%$") OR match(user_key, `hdsi_rba_ai_multi_vector_risk_builtin_accounts`), null(), true(), user_key) \
	| eventstats dc(attributed_user) as host_user_count values(attributed_user) as host_users by risk_object_key risk_object_type \
	| eval owner_key=case(risk_object_type="user", risk_object_key, host_user_count=1 AND host_users!="__multiple__", host_users, true(), null()) \
	| eventstats count(eval(risk_object_type="user")) as owner_user_events by owner_key \
	| eval merged=if(risk_object_type="system" AND isnotnull(owner_key) AND owner_user_events>0, 1, 0) \
	| eval group_key=if(merged=1, owner_key, risk_object_key), group_type=if(merged=1, "user", risk_object_type), related_system=if(merged=1, risk_object_key, null()), display_object=if(merged=1, null(), mvindex(risk_object, 0)) \
	| eval high_impact_vector=if(match(ai_vector, `hdsi_rba_ai_multi_vector_risk_high_impact_vectors`), ai_vector, null()) \
	| eval vector_detection=ai_vector.": ".detection_label, mitre_ids=coalesce('annotations.mitre_attack', mitre_attack) \
	| eval event_score=coalesce(calculated_risk_score, risk_score), pair_key=md5(source."|"._time."|".coalesce(mvindex(risk_message, 0), "")), indexed_time=coalesce(_indextime, _time) \
	| eventstats count as pair_events by group_key group_type pair_key \
	| eventstats min(indexed_time) as vector_first_indexed by group_key group_type ai_vector \
	| eval score_share=event_score/pair_events, new_vector=if(vector_first_indexed>=relative_time(now(), `hdsi_rba_ai_multi_vector_risk_new_vector_window`), ai_vector, null()) \
	| eval object_term="\"".replace(risk_object_key, "\\\\", "\\\\\\\\")."\"" \
	| stats dc(pair_key) as risk_event_count sum(score_share) as total_risk max(event_score) as max_risk_score dc(ai_vector) as vector_count values(ai_vector) as vectors dc(new_vector) as new_vector_count values(new_vector) as new_vectors dc(high_impact_vector) as high_impact_count values(high_impact_vector) as high_impact_vectors dc(detection_key) as detection_count values(vector_detection) as vector_detections values(mitre_ids) as contributing_mitre values(attributed_user) as attributed_users values(related_system) as related_systems values(object_term) as object_terms first(display_object) as risk_object min(_time) as firstTime max(_time) as lastTime by group_key group_type \
	| where vector_count>=`hdsi_rba_ai_multi_vector_risk_min_vectors` AND high_impact_count>=`hdsi_rba_ai_multi_vector_risk_min_high_impact` AND new_vector_count>=1 \
	| rename group_key as risk_object_key, group_type as risk_object_type \
	| eval risk_object=coalesce(risk_object, risk_object_key), total_risk=round(total_risk, 0), attributed_users=if(risk_object_type="system", mvfilter(attributed_users!="__multiple__"), null()) \
	| eval user=if(risk_object_type="user", risk_object, null()), src=if(risk_object_type="system", risk_object, null()) \
	| eval vector_list=mvjoin(vectors, ", "), high_impact_list=coalesce(mvjoin(high_impact_vectors, ", "), "none"), related_system_list=coalesce(mvjoin(related_systems, ", "), "none"), new_vector_list=mvjoin(new_vectors, ", "), contributing_objects=mvjoin(object_terms, ","), mitre_attack="T1588.007" \
	| convert ctime(firstTime) ctime(lastTime) \
	| fields risk_object risk_object_key risk_object_type user src attributed_users related_systems related_system_list vector_count vectors vector_list new_vectors new_vector_list high_impact_count high_impact_vectors high_impact_list detection_count vector_detections risk_event_count total_risk max_risk_score contributing_objects contributing_mitre mitre_attack firstTime lastTime \
	| `hdsi_rba_ai_multi_vector_risk_customizations`

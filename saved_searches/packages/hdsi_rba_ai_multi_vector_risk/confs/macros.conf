[hdsi_rba_ai_multi_vector_risk_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inline in the base index=risk search before aggregation. Use risk event field names, e.g. NOT risk_object IN ("svc_*") or risk_object_type="user" to alert on users only. Ships empty.
disabled = False
iseval = 0

[hdsi_rba_ai_multi_vector_risk_vector_map]
definition = eval ai_vector=case(\
detection_key="hdsi_ai_agent_autonomous_action_detection", if(in(coalesce(lower(mvindex(risk_category, 0)), ""), "credential_access", "persistence", "system_change") OR (isnull(risk_category) AND lower(mvindex(risk_tier, 0))="sensitive"), "adversarial", "local_tooling"), \
in(detection_key, "hdsi_ai_unsanctioned_web_access", "hdsi_ai_first_seen_provider_for_user", "hdsi_ai_repeated_unsanctioned_access_burst", "hdsi_ai_multiple_services_in_single_session", "hdsi_ai_new_provider_adoption_velocity", "hdsi_ai_dns_queries_to_ai_domains", "hdsi_ai_api_access_from_non_dev_endpoint", "hdsi_ai_code_assistant_network_connection"), "shadow_usage", \
in(detection_key, "hdsi_ai_after_hours_service_usage", "hdsi_ai_time_of_day_usage_pattern_anomaly", "hdsi_ai_usage_volume_anomaly", "hdsi_ai_user_peer_group_usage_anomaly"), "usage_anomaly", \
in(detection_key, "hdsi_ai_unsanctioned_cli_execution", "hdsi_ai_unsanctioned_desktop_app_execution", "hdsi_ai_scripted_cli_invocation", "hdsi_ai_local_llm_framework_execution", "hdsi_ai_local_llm_listening_port_detected", "hdsi_ai_agent_framework_execution", "hdsi_ai_mcp_server_execution", "hdsi_ai_llm_model_file_download", "hdsi_ai_browser_extension_activity"), "local_tooling", \
in(detection_key, "hdsi_ai_access_via_vpn_proxy_evasion", "hdsi_ai_access_from_unmanaged_device", "hdsi_ai_usage_from_personal_account_oauth_mismatch", "hdsi_ai_privileged_account_service_usage"), "risky_access", \
in(detection_key, "hdsi_ai_high_volume_upload_to_ai_service", "hdsi_ai_dlp_violation_on_service_upload", "hdsi_ai_sanctioned_dlp_violation", "hdsi_ai_personal_email_to_ai_service_upload_correlation", "hdsi_ai_gradual_data_exfiltration_via_ai", "hdsi_ai_copy_paste_correlation_to_ai_service", "hdsi_ai_usage_following_data_access_spike", "hdsi_ai_browser_extension_high_volume_data_transmission", "hdsi_ai_suspicious_model_file_exfiltration", "hdsi_ai_api_key_exposure_in_code_dlp"), "data_exposure", \
in(detection_key, "hdsi_ai_prompt_injection_indicators_in_web_uploads", "hdsi_ai_generated_phishing_indicators", "hdsi_ai_deepfake_tool_execution_access", "hdsi_ai_voice_cloning_api_access", "hdsi_ai_compromised_plugin_extension_installation", "hdsi_ai_assisted_lateral_movement"), "adversarial", \
in(detection_key, "hdsi_ai_unknown_high_volume_external_api_discovery", "hdsi_ai_health_data_model_availability", "hdsi_ai_health_lookup_staleness_alert"), null(), \
in(lower(mvindex(ai_kill_chain_phase, 0)), "exfiltration", "collection"), "data_exposure", \
in(lower(mvindex(ai_kill_chain_phase, 0)), "execution", "staging"), "local_tooling", \
in(lower(mvindex(ai_kill_chain_phase, 0)), "initial_access", "lateral_movement"), "adversarial", \
lower(mvindex(ai_kill_chain_phase, 0))="recon", "shadow_usage", \
true(), null())
description = v1.1 Maps each contributing detection (detection_key = the detection_id the rule writes, or the package id derived from the stanza name) to one of six AI risk vectors. Every risk-emitting HDSI AI rule is listed explicitly; an unlisted future rule falls back to its ai_kill_chain_phase. Agent Autonomous Action counts as adversarial only for its high-signal risk events (risk_category credential_access, persistence or system_change, i.e. risk_tier=sensitive). Its agent_activity events (routine and development tiers: package installs, git push, curl/wget, recursive deletes) count as local_tooling, so one developer running Claude Code or Codex cannot reach a high-impact vector from ordinary coding work. Re-map a rule here to change how it counts.
disabled = False
iseval = 0

[hdsi_rba_ai_multi_vector_risk_builtin_accounts]
definition = "^(nt authority\x5c)?(system|localsystem|local service|network service|root)$"
description = v1.1 Regex (on the lower-cased value) of built-in OS accounts. A user risk object matching it is dropped, because one shared account name such as root or SYSTEM would merge activity from unrelated hosts into a false multi-vector hotspot; a host whose user is one of these accounts is never merged into a user. Machine accounts (ending in $) are excluded separately. Add tenant service accounts here.
disabled = False
iseval = 0

[hdsi_rba_ai_multi_vector_risk_new_vector_window]
definition = "-65m"
description = v1.1 Rising-edge window (relative time on index time). An object fires only when at least one of its vectors was first indexed inside this window, so a notable means a vector was just added, and a vector ageing out of the rolling 24 hours never raises a second, smaller notable. -65m covers four 15-minute runs, so skipped runs do not lose a notable. Set to "-24h" to return to level-triggered alerting (for example for one run at deployment).
disabled = False
iseval = 0

[hdsi_rba_ai_multi_vector_risk_high_impact_vectors]
definition = "^(data_exposure|risky_access|adversarial)$"
description = v1.1 Regex of the vectors that count as high impact. A notable needs at least min_high_impact of them, so ordinary heavy AI use (shadow_usage + usage_anomaly + local_tooling) alone never fires.
disabled = False
iseval = 0

[hdsi_rba_ai_multi_vector_risk_min_vectors]
definition = 3
description = v1.1 Distinct AI risk vectors (of 6) one risk object must reach in 24 hours. Replaces the multi_vector_categories row of ai_detection_config. Raise to 4 if 3-vector notables are mostly benign power users.
disabled = False
iseval = 0

[hdsi_rba_ai_multi_vector_risk_min_high_impact]
definition = 1
description = v1.1 Minimum number of distinct high-impact vectors (data_exposure, risky_access, adversarial) required. Set to 0 to alert on breadth alone.
disabled = False
iseval = 0

[hdsi_rba_ai_multi_vector_risk_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation (fields: risk_object, risk_object_key, risk_object_type, vector_count, vectors, high_impact_vectors, detection_count, total_risk, attributed_users, related_systems). Ships as search *.
disabled = False
iseval = 0

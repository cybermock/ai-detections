version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Compromised Plugin/Extension Installation
description: "Detects install and runner command lines, browser extension fetches and package/extension downloads that reference a known-compromised or malicious AI-ecosystem package or extension (npm, PyPI, VS Code, Chrome) from a maintained IOC macro. Risk on the host and the real user, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
tags:
  - rba_only
  - ioc
  - endpoint
  - process
  - web
  - proxy
data_prereqs:
  datamodels:
    op: OR
    items:
    - "Endpoint.Processes"
    - "Web"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

[hdsi_ai_compromised_plugin_extension_installation_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the Endpoint.Processes tstats where clause before aggregation. Use datamodel field names, e.g. NOT Processes.dest IN ("build-agent-*"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_compromised_plugin_extension_installation_install_commands]
definition = (Processes.process="*npm*install*" OR Processes.process="*npm* i *" OR Processes.process="*npm* add *" OR Processes.process="*npm* exec *" OR Processes.process="*npx *" OR Processes.process="*npx.cmd*" OR Processes.process="*npx-cli*" OR Processes.process="*yarn* add *" OR Processes.process="*yarn* dlx *" OR Processes.process="*pnpm* add *" OR Processes.process="*pnpm* install*" OR Processes.process="*pnpm* dlx *" OR Processes.process="*bun* add *" OR Processes.process="*bunx *" OR Processes.process="*pip* install*" OR Processes.process="*pipx* install*" OR Processes.process="*pipx* run *" OR Processes.process="*uv* add *" OR Processes.process="*uv* pip *" OR Processes.process="*uv* tool install*" OR Processes.process="*uv* tool run *" OR Processes.process="*uvx *" OR Processes.process="*--install-extension*")
description = v1.1 Pre-filter (tstats where clause) for package-manager, package-runner and IDE-extension install command lines: npm install/add/exec, npx (incl. npx.cmd and node npx-cli.js), yarn add/dlx, pnpm add/install/dlx, bun add, bunx, pip/pipx install/run, uv add/pip/tool, uvx and code/cursor/windsurf --install-extension. Runners matter because MCP servers are usually launched with npx/uvx. Keeps the IOC regex off the full process stream. Add a pattern here if your developers use another installer.
disabled = False
iseval = 0

[hdsi_ai_compromised_plugin_extension_installation_web_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Web branch, applied inside the Web tstats where clause. Use datamodel field names, e.g. NOT Web.src IN ("10.9.9.0/24"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_compromised_plugin_extension_installation_store_urls]
definition = (Web.url="*clients2.google.com/service/update2/crx*" OR Web.url="*clients2.googleusercontent.com/crx/*" OR Web.url="*edge.microsoft.com/extensionwebstorebase/*" OR Web.url="*gallery.vsassets.io/_apis/*" OR Web.url="*marketplace.visualstudio.com/_apis/*" OR Web.url="*open-vsx.org/api/*" OR Web.url="*openvsxorg.blob.core.windows.net/*" OR Web.url="*gvt1.com/edgedl/chromewebstore/*" OR Web.url="*registry.npmjs.org/*/-/*" OR Web.url="*registry.yarnpkg.com/*/-/*" OR Web.url="*files.pythonhosted.org/packages/*")
description = v1.1 Web pre-filter (tstats where clause) for browser extension update/download URLs (they carry the extension ID), including the Chrome Web Store CRX redirect host *.gvt1.com/edgedl/chromewebstore/, VS Code/Open VSX package downloads and npm (registry.npmjs.org, registry.yarnpkg.com) and PyPI package tarballs. Only useful where the proxy logs full URL paths (TLS inspection); domain-only SSE logs never match the IOC list.
disabled = False
iseval = 0

[hdsi_ai_compromised_plugin_extension_installation_ioc_match(1)]
args = text
definition = case(match($text$, "(^|[\s'\x22=]|npmjs[.]org/|node-modules[\x5c/]|-/)nx[@-](20[.](9|10|11|12)[.]0|21[.][5-8][.]0)(?!\d|[.]\d|-[0-9a-z])"), "npm: Nx s1ngularity compromise (2025-08), weaponised local AI CLIs", match($text$, "@nx(/|%2f| )(devkit|js|workspace|node)(@|/-/[a-z-]+-)(20[.]9[.]0|21[.]5[.]0)(?!\d|[.]\d|-[0-9a-z])"), "npm: Nx s1ngularity compromised plugin (2025-08)", match($text$, "@nx(/|%2f| )eslint(@|/-/eslint-)21[.]5[.]0(?!\d|[.]\d|-[0-9a-z])"), "npm: Nx s1ngularity compromised plugin (2025-08)", match($text$, "@nx(/|%2f| )(key|enterprise-cloud)(@|/-/[a-z-]+-)3[.]2[.]0(?!\d|[.]\d|-[0-9a-z])"), "npm: Nx s1ngularity compromised plugin (2025-08)", match($text$, "(^|[\s'\x22=]|npmjs[.]org/|yarnpkg[.]com/|node-modules[\x5c/])(sw-cur1?|aiide-cur)($|[\s'\x22@=<>~!;,/\x5c]|-\d)"), "npm: Cursor AI IDE backdoor package (2025-05)", match($text$, "(^|[\s'\x22=]|npmjs[.]org/|yarnpkg[.]com/|node-modules[\x5c/])postmark-mcp($|[\s'\x22@=<>~!;,/\x5c]|-\d)"), "npm: malicious MCP server postmark-mcp (2025-09)", match($text$, "(^|[\s'\x22=/\x5c])(gptplus|claudeai-eng)($|[\s'\x22=<>~!\[;,/\x5c]|-\d)"), "PyPI: fake ChatGPT/Claude SDK, JarkaStealer (2024-11)", match($text$, "(^|[\s'\x22=/\x5c])(deepseeek|deepseekai)($|[\s'\x22=<>~!\[;,/\x5c]|-\d)"), "PyPI: fake DeepSeek SDK infostealer (2025-01)", match($text$, "(^|[\s'\x22=/\x5c])(aliyun-ai-labs-snippets-sdk|ai-labs-snippets-sdk|aliyun-ai-labs-sdk)($|[\s'\x22=<>~!\[;,/\x5c]|-\d)"), "PyPI: malicious AI Labs SDK (2025-05)", match($text$, "(^|[\s'\x22=/\x5c])ultralytics(==|-)8[.]3[.](41|42|45|46)(?!\d|[.]\d|[a-z]|[.](dev|post))"), "PyPI: compromised Ultralytics release, cryptominer (2024-12)", match($text$, "(^|[\s'\x22=/\x5c])torchtriton($|[\s'\x22=<>~!\[;,/\x5c]|-\d)"), "PyPI: PyTorch torchtriton dependency confusion (2022-12)", match($text$, "amazon-q-vscode[@/ -]1[.]84[.]0(?!\d|[.]\d)"), "VS Code: compromised Amazon Q extension 1.84.0 (2025-07)", match($text$, "(^|[^a-p]|%3d)(bibjgkidgpfbblifamdlkdlhgihmfohh|pkgciiiancapdlpcbppfkmeaieppikkk|cedgndijpacnfbdggppddacngjfdkaca|bbdnohkpnbkdkmnkddobeafboooinpla|epdjhgbipjpbbhoccdeipghoihibnfja)($|[^a-p])"), "Browser: AI-branded Chrome extension hijacked in the 2024 Web Store campaign")
description = v1.1 Known-compromised or malicious AI-ecosystem packages and IDE extensions (public advisories). Returns an IOC label, or null when nothing matches. Input is the lower-cased command line or URL with "_" folded to "-"; package regexes accept both the install spec (name@ver) and the registry tarball path (name/-/name-ver.tgz, including scoped @scope/name/-/name-ver.tgz, on registry.npmjs.org or registry.yarnpkg.com). Pinned versions reject prereleases and builds of the same number (nx@21.5.0-beta.1, ultralytics 8.3.41rc1/.dev0) but keep wheel and sdist names (ultralytics-8.3.41-py3-none-any.whl). Extend it by adding match(...), "label" pairs from your threat-intel advisories; no generic AI keyword belongs here.
disabled = False
iseval = 0

[hdsi_ai_compromised_plugin_extension_installation_ioc_tag]
definition = eval ioc_text=" ".replace(lower(evidence),"_","-")." " | eval ioc_name=`hdsi_ai_compromised_plugin_extension_installation_ioc_match(ioc_text)` | where isnotnull(ioc_name)
description = v1.1 Applied inside EACH branch (Web main search and the process append subsearch) so only IOC rows leave a branch. Running the IOC match after the append let Splunk subsearch limits (50,000 rows / 60 s) silently drop store and registry URLs before they were checked. Input field: evidence (command line or URL). Outputs ioc_text and ioc_name.
disabled = False
iseval = 0

[hdsi_ai_compromised_plugin_extension_installation_service_accounts]
definition = "^(unknown|-|n/a|null|none|system|localsystem|local service|network service|web browser|codexsandbox(offline|online)?|root|daemon|nobody|jenkins|gitlab-runner|runner|github-runner|actions-runner|buildkite-agent|teamcity|bamboo|azure-pipelines|azdevops|vsts.*|svc[-_.].*)$"
description = v1.1 Regex (quoted string) of non-person account names that must never become a user risk object. Matched against the lower-cased user with any DOMAIN\ or /prefix and @domain suffix removed. NT AUTHORITY\* and machine accounts (HOST$, also in UPN form HOST$@DOMAIN) are always nulled in the search. Covers Windows built-ins (SYSTEM, LocalSystem, LOCAL SERVICE), the Codex sandbox accounts (CodexSandboxOffline/Online), the firewall placeholder "Web browser" and common Linux/macOS CI identities (root, jenkins, gitlab-runner, runner...). Add your build or service account naming here so CI installs score the host only.
disabled = False
iseval = 0

[hdsi_ai_compromised_plugin_extension_installation_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after normalisation (fields: user, dest, ioc_name, ioc_list, install_vector, install_tool, parent_process_name, evidence). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_compromised_plugin_extension_installation_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. The rule ships static scores (user 40, system 60); set a numeric risk_score field here to override both. Ships as search *.
disabled = False
iseval = 0

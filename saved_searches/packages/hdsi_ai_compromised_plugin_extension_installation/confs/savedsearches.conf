action.correlationsearch.annotations = {"mitre_attack": ["T1195.001", "T1176.001", "T1176.002"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search (risk_object=\"$dest_drill$\" OR risk_object=\"$user_drill$\") source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View package and extension install commands on the host (process-branch hits: host or user)","search":"| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where (Processes.dest=\"$dest_drill$\" OR Processes.user=\"$user_drill$\") `hdsi_ai_compromised_plugin_extension_installation_install_commands` by Processes.user Processes.dest Processes.parent_process_name Processes.process_name Processes.process | rename Processes.* as * | convert ctime(firstTime) ctime(lastTime) | sort - lastTime","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View extension store and package registry downloads from the source (web-branch hits: source IP or user)","search":"| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Web where (Web.src=\"$dest_drill$\" OR Web.user=\"$user_drill$\") `hdsi_ai_compromised_plugin_extension_installation_store_urls` by Web.user Web.src Web.url | rename Web.* as * | convert ctime(firstTime) ctime(lastTime) | sort - lastTime","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = Known-compromised AI package or extension ($ioc_list$) seen on $dest_display$ for user $user_display$ via $install_vector$. Evidence: $evidence_sample$
action.notable.param.rule_title = HDSI AI Compromised Plugin/Extension Installation ($title_object$)
action.notable.param.security_domain = endpoint
action.notable.param.severity = high
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"dest","risk_object_type":"system","risk_score":60},{"risk_object_field":"user","risk_object_type":"user","risk_score":40}]
action.risk.param._risk_message = Known-compromised AI package or extension ($ioc_list$) seen on $dest_display$ for user $user_display$ via $install_vector$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = dest,user
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 1-59/15 * * * *
description = v1.1.0 Detects install and runner commands, browser extension fetches and registry downloads that reference a known-compromised or malicious AI-ecosystem package or extension (IOC list macro). Risk on the host and, when it is a real person, the user. No notable.
disabled = 0
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Web where `hdsi_ai_compromised_plugin_extension_installation_store_urls` `hdsi_ai_compromised_plugin_extension_installation_web_filter` by Web.user Web.src Web.url \
	| rename Web.* as * \
	| eval dest=src, evidence=url, install_vector="web_store_or_registry" \
	| `hdsi_ai_compromised_plugin_extension_installation_ioc_tag` \
	| append [| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime values(Processes.parent_process_name) as parent_process_name from datamodel=Endpoint.Processes where `hdsi_ai_compromised_plugin_extension_installation_install_commands` `hdsi_ai_compromised_plugin_extension_installation_filter` by Processes.user Processes.dest Processes.process_name Processes.process \
	| rename Processes.* as * \
	| eval evidence=process, install_vector="process_command_line" \
	| `hdsi_ai_compromised_plugin_extension_installation_ioc_tag`] \
	| eval mitre_attack=case(match(ioc_name,"^Browser"),"T1176.001", match(ioc_name,"^VS Code"),"T1176.002", true(),"T1195.001") \
	| eval user_short=replace(replace(lower(user),"^.*[\x5c/]",""),"@.*$","") \
	| eval user=if(isnull(user) OR user="" OR match(lower(user),"^nt authority") OR match(user_short,"[$]$") OR match(user_short,`hdsi_ai_compromised_plugin_extension_installation_service_accounts`), null(), user), dest=if(isnull(dest) OR dest="" OR lower(dest)="unknown", null(), dest) \
	| where isnotnull(dest) OR isnotnull(user) \
	| fillnull value="__none__" user dest \
	| stats sum(count) as event_count min(firstTime) as firstTime max(lastTime) as lastTime values(ioc_name) as ioc_name values(install_vector) as install_vector values(process_name) as install_tool values(parent_process_name) as parent_process_name values(evidence) as evidence values(mitre_attack) as mitre_attack by user dest \
	| eval user=if(user="__none__", null(), user), dest=if(dest="__none__", null(), dest) \
	| eval ioc_list=mvjoin(ioc_name, "; "), user_display=coalesce(user, "n/a (service or unattributed)"), evidence_sample=substr(mvjoin(mvindex(evidence, 0, 2), " | "), 1, 400), install_vector=mvjoin(install_vector, ", ") \
	| eval dest_display=coalesce(dest, "n/a (no host or source)"), title_object=coalesce(dest, user), dest_drill=coalesce(replace(dest,"[\\\\\"]","*"), "__none__"), user_drill=coalesce(replace(user,"[\\\\\"]","*"), "__none__") \
	| eval ai_activity="compromised_plugin", detection_id="hdsi_ai_compromised_plugin_extension_installation", ai_kill_chain_phase="initial_access" \
	| `hdsi_ai_compromised_plugin_extension_installation_customizations` \
	| `hdsi_ai_compromised_plugin_extension_installation_risk_score`

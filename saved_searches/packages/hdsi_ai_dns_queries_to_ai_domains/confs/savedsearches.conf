[Network - HDSI AI DNS Queries To AI Domains - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI DNS Queries To AI Domains
action.correlationsearch.annotations = {"mitre_attack": ["T1588.007"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events for $src$","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$src$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI DNS names resolved by $src$","search":"| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime values(DNS.answer) as answer values(DNS.message_type) as message_type values(DNS.vendor_product) as vendor_product from datamodel=Network_Resolution where DNS.src=\"$src$\" `hdsi_ai_dns_queries_to_ai_domains_query_prefilter` by DNS.src DNS.query | rename DNS.* as * | eval ai_domain=query, ai_input_type=\"dns\" | `ai_domains_filter` | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, src, provider, usage_type, ai_match, query, answer, message_type, vendor_product, count | sort provider - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View all DNS names resolved by $src$","search":"| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Resolution where DNS.src=\"$src$\" by DNS.src DNS.query | rename DNS.* as * | convert ctime(firstTime) ctime(lastTime) | sort - count | head 500","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = $src$ resolved AI service names for $provider_count$ provider(s) ($provider_list$; usage: $usage_type_list$) with $dns_query_count$ DNS queries between $firstTime$ and $lastTime$. Sample names: $ai_domain_sample$.
action.notable.param.rule_title = HDSI AI DNS Queries To AI Domains ($src$)
action.notable.param.security_domain = network
action.notable.param.severity = informational
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"src","risk_object_type":"system","risk_score":10}]
action.risk.param._risk_message = $src$ resolved AI service names for $provider_count$ provider(s) ($provider_list$; usage: $usage_type_list$) with $dns_query_count$ DNS queries in one day, e.g. $ai_domain_sample$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = src
alert.suppress.period = 72000s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 35 1 * * *
description = v1.1.0 One risk event per host per day for hosts whose DNS queries show real use of AI services (chat, API, local LLM, model registry), resolved through ai_domains_filter. Background and prefetch lookups, coding assistants (covered by hdsi_ai_code_assistant_network_connection), resolvers and other shared DNS clients, and roaming DNS-security home-network and egress addresses are excluded. System risk only, no notable.
disabled = 0
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Resolution where `hdsi_ai_dns_queries_to_ai_domains_query_prefilter` NOT DNS.src IN ("unknown","-","0.0.0.0","127.0.0.1","::1") `hdsi_ai_dns_queries_to_ai_domains_filter` by DNS.src DNS.query DNS.message_type DNS.vendor_product \
	| rename DNS.* as * \
	| where src!="unknown" \
	| stats max(count) as count min(firstTime) as firstTime max(lastTime) as lastTime values(vendor_product) as vendor_product by src query \
	| eval ai_domain=query, ai_input_type="dns" \
	| `ai_domains_filter` \
	| where NOT provider IN (`hdsi_ai_dns_queries_to_ai_domains_excluded_providers`) \
	| eval src=lower(src), severity_weight=tonumber(severity_weight), is_api=if(in(usage_type,"api","local_llm","model_registry","cli"),1,0), is_background=if(`hdsi_ai_dns_queries_to_ai_domains_background_names`,1,0) \
	| stats sum(count) as query_count sum(eval(if(is_api=0 AND is_background=0,count,0))) as web_evidence_count sum(eval(if(is_api=1 AND is_background=0,count,0))) as api_query_count values(ai_domain) as ai_domains values(usage_type) as usage_types max(severity_weight) as severity_weight values(vendor_product) as vendor_product min(firstTime) as firstTime max(lastTime) as lastTime by src provider \
	| where api_query_count>=`hdsi_ai_dns_queries_to_ai_domains_min_api_queries` OR web_evidence_count>=`hdsi_ai_dns_queries_to_ai_domains_min_queries` \
	| append maxtime=900 maxout=50000 [| tstats summariesonly=t allow_old_summaries=t dc(DNS.query) as src_name_count from datamodel=Network_Resolution where NOT DNS.src IN ("unknown","-","0.0.0.0","127.0.0.1","::1") `hdsi_ai_dns_queries_to_ai_domains_filter` by DNS.src | where src_name_count>=`hdsi_ai_dns_queries_to_ai_domains_shared_src_names` | rename DNS.src as src | eval src=lower(src), shared_src=1] \
	| eventstats max(shared_src) as shared_src by src \
	| where isnull(shared_src) AND isnotnull(provider) \
	| where NOT (`hdsi_ai_dns_queries_to_ai_domains_unreliable_src`) \
	| lookup asset_lookup_by_str ip as src OUTPUT bunit as src_bunit \
	| lookup asset_lookup_by_str dns as src OUTPUTNEW bunit as src_bunit \
	| eval bunit=lower(mvindex(src_bunit,0)), bunit=if(bunit="unknown" OR bunit="",null(),bunit) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| eval evidence_count=web_evidence_count+api_query_count, provider_score=round(10*coalesce(severity_weight,1.0),0) \
	| stats sum(query_count) as dns_query_count sum(evidence_count) as evidence_query_count dc(provider) as provider_count values(provider) as providers values(usage_types) as usage_types max(provider_score) as max_provider_score values(ai_domains) as ai_domains values(bunit) as bunit values(vendor_product) as vendor_product min(firstTime) as firstTime max(lastTime) as lastTime by src \
	| eval base_score=max_provider_score+3*(provider_count-1), risk_score=min(30,base_score) \
	| eval provider=providers, provider_list=mvjoin(providers,", "), usage_type_list=mvjoin(usage_types,", "), ai_domain_count=mvcount(ai_domains), ai_domain_sample=mvjoin(mvindex(ai_domains,0,7),", ") \
	| fields - ai_domains usage_types max_provider_score \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="ai_dns_query", detection_id="hdsi_ai_dns_queries_to_ai_domains", mitre_attack="T1588.007", ai_kill_chain_phase="recon" \
	| `hdsi_ai_dns_queries_to_ai_domains_customizations` \
	| `hdsi_ai_dns_queries_to_ai_domains_risk_score`

disabled = False
iseval = 0

[hdsi_ai_dns_queries_to_ai_domains_excluded_providers]
definition = "GitHub Copilot","Cursor","Windsurf","Tabnine","Sourcegraph","Microsoft 365 Copilot","Microsoft Security Copilot"
description = v1.1 Providers removed after resolution (quoted, comma separated, ai_provider_domains provider names). Ships with the coding assistants that hdsi_ai_code_assistant_network_connection already scores per host per day with licence-tier awareness, so the same DNS evidence is not counted twice, plus Microsoft 365 Copilot (Copilot Studio, Copilot for Finance) and Microsoft Security Copilot, which only work inside the organisation's own Entra tenant and are licensed, not shadow, AI. Add providers the organisation licenses for everyone, e.g. "Microsoft 365 Copilot" or "OpenAI" for ChatGPT Enterprise. Use "__none__" to keep every provider.
disabled = False
iseval = 0

[hdsi_ai_dns_queries_to_ai_domains_background_names]
definition = match(ai_domain,"^(bzr|bzrcdn)\\.openai\\.com$|^ab\\.chatgpt\\.com$|^gemini\\.gstatic\\.com$|^ms-sso\\.copilot(\\.microsoft)?\\.com$|^downloads\\.claude\\.ai$|(^|[.-])telemetry[.-]|(^|\\.)cdn[0-9]*\\.")
description = v1.1 Eval condition on the normalised ai_domain for names that software resolves without a person using the service (update checks, feature-flag polling, browser prefetch, SSO, telemetry, and CDN hosts that other sites embed, e.g. cdn.midjourney.com images or cdn1.suno.ai audio). Their queries are listed but do not count toward ..._min_queries or ..._min_api_queries. Evidence: bzrcdn.openai.com and bzr.openai.com were resolved by 1,457 and 584 hosts a day on one validation tenant that showed only 129 hosts resolving chatgpt.com, and ab.chatgpt.com (installed ChatGPT client feature flags) was polled up to 574 times a day by hosts that never resolved chatgpt.com. The cdn term needs a dot after it, so model-weight downloads from cdn-lfs.huggingface.co and cdn-lfs.hf.co still count as Model Registry use. Use false() to count every name.
disabled = False
iseval = 0

[hdsi_ai_dns_queries_to_ai_domains_min_queries]
definition = 10
description = v1.1 Minimum DNS queries per host per provider per day, counting only web/IDE names that are not background names, before a web provider counts as used. Browser and OS prefetch of gemini.google.com, chatgpt.com and copilot.com showed a median of 2 queries a day on hosts with no other evidence; active ChatGPT users showed a median of about 36 for chatgpt.com.
disabled = False
iseval = 0

[hdsi_ai_dns_queries_to_ai_domains_min_api_queries]
definition = 1
description = v1.1 Minimum DNS queries per host per provider per day to API, local-LLM, model-registry and CLI names (usage_type api, local_llm, model_registry, cli). One lookup of api.anthropic.com, a Bedrock or Vertex AI endpoint or ollama.com already shows a tool or script on that host talking to the service. Raise it if SDK health checks create noise.
disabled = False
iseval = 0

[hdsi_ai_dns_queries_to_ai_domains_shared_src_names]
definition = 10000
description = v1.1 Shared-source guard: a DNS client that resolved at least this many distinct names in the daily window is treated as a resolver, forwarder, proxy, mail relay or NAT egress, and its rows are dropped (risk on it would describe many people). In validation the forwarders and egress addresses that otherwise topped the results resolved 18,000 to over 220,000 names a day. Most clients stayed below 3,000, but 24 to 114 clients per tenant resolved 3,000 to 10,000 (busy servers, jump hosts and, on roaming tenants, shared home-network addresses, which ..._unreliable_src handles), so do not lower this value without checking those clients. Derive a tenant value with the SPL in the README.
disabled = False
iseval = 0

[hdsi_ai_dns_queries_to_ai_domains_unreliable_src]
definition = match(mvjoin(vendor_product,"|"),"(?i)umbrella|cloud.?security|secure.?access") AND (cidrmatch("192.168.0.0/16",src) OR cidrmatch("10.0.0.0/24",src))
description = v1.1 Eval condition on src and vendor_product (CIM DNS.vendor_product) for addresses that are not one host. Matching rows are dropped. Ships on for roaming DNS-security clients (Cisco Umbrella / Cloud Security / Secure Access), which log the laptop's local address: the home-router ranges 192.168.0.0/16 and 10.0.0.0/24 are reused by many unrelated laptops. In an 8-hour raw sample on the two roaming validation tenants, 37% and 33% (Tenant B) and 42% and 76% (Tenant C, three or more identities) of such addresses carried several roaming identities. Public IPv4 sources (2-6% shared), IPv6, CGNAT and other RFC 1918 sources were almost always one device and are kept; large egress addresses are caught by ..._shared_src_names. Resolver and network-capture sources are not affected. Add other roaming products to the vendor_product regex (e.g. zscaler|cloudflare) or more home ranges, or use false() once the TA maps the roaming device identity to src.
disabled = False
iseval = 0

[hdsi_ai_dns_queries_to_ai_domains_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after the per-host aggregation (fields: src, provider, providers, provider_count, provider_list, usage_type_list, dns_query_count, evidence_query_count, ai_domain_sample, ai_domain_count, bunit, vendor_product, base_score, risk_score, firstTime, lastTime). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_dns_queries_to_ai_domains_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust or override risk_score (integer, at most 100) per tenant, e.g. raise it for a critical asset class. Ships as search *.
disabled = False
iseval = 0

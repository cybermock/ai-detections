[hdsi_ai_dns_queries_to_ai_domains_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside both Network_Resolution tstats where clauses (main search and shared-source guard). Use DNS.* field names, e.g. NOT DNS.src IN ("10.1.1.10","10.1.1.11") for internal resolvers, forwarders, web proxies or NAT egress addresses that appear as the DNS client. Ships empty.
disabled = False
iseval = 0


version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Unsanctioned Web Access
description: "Detects users using AI web apps (chat assistants, AI writing, image, video, voice and app-builder tools) that the organisation has not sanctioned, from proxy, NGFW URL filtering, SSE/CASB and enterprise-browser logs in the CIM Web model. Hosts (from url_domain, or from the url when a source logs only that) and SSE app names are resolved through the common AI provider lookups; inbound web server and WAF traffic is excluded. Risk on the user; system risk on the internal src and host-only rows are opt-in. One event per entity and provider per day. No notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_risk_multiplier
  - macros:ai_unsanctioned_filter(3)
tags:
  - rba_only
  - web
  - proxy
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Web"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

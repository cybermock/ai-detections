[hdsi_ai_unsanctioned_web_access_filter]
definition = ()
description = v1.1 Tenant exclusion hook, inline in the Web tstats where clause before aggregation. Use Web datamodel field names, e.g. NOT Web.user IN ("svc_*") or NOT sourcetype IN ("aws:elb:accesslogs","aws:waf") to keep inbound web server, load-balancer and WAF logs out. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_web_access_scope]
definition = (Web.url_domain IN (`hdsi_ai_unsanctioned_web_access_domains`) OR Web.site IN (`hdsi_ai_unsanctioned_web_access_domains`,`hdsi_ai_unsanctioned_web_access_apps`))
description = v1.1 Pre-filter inline in the Web tstats where clause: AI web hosts (and subdomains) in Web.url_domain or Web.site, plus SSE/CASB app names in Web.site. It keeps the scan to AI traffic only; without it the search groups every web domain and did not finish an hourly window on a large NGFW tenant. Final provider resolution, enabled flags and subdomain rules still come from ai_domains_filter, so a host listed here but disabled or unmatched in the lookups is dropped later.
disabled = False
iseval = 0


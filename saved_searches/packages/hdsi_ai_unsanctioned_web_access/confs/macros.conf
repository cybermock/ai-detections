iseval = 0

[hdsi_ai_unsanctioned_web_access_prepare]
definition = eval user=if(match(lower(user),`hdsi_ai_unsanctioned_web_access_invalid_users`),null(),user), src=replace(src,"(?i)^::ffff:(\d)","\1") | eval src=if(match(lower(src),"^(unknown|-|n/a|null|none|0\.0\.0\.0|::|)$"),null(),src) | eval src_public=case(isnull(src),0, match(src,"^\d{1,3}(\.\d{1,3}){3}$"),if(cidrmatch("10.0.0.0/8",src) OR cidrmatch("172.16.0.0/12",src) OR cidrmatch("192.168.0.0/16",src) OR cidrmatch("100.64.0.0/10",src) OR cidrmatch("169.254.0.0/16",src) OR cidrmatch("127.0.0.0/8",src),0,1), match(src,":") AND match(src,"^[0-9A-Fa-f:]+$"),if(match(lower(src),"^(fc|fd|fe[89ab]|::1$)"),0,1), true(),0) | eval ai_host_source=coalesce(ai_host_source,if(isnull(nullif(url_domain,"unknown")),"site","url_domain")), ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))), ai_input_type=if(ai_host_source="site","app","host"), ai_domain=if(ai_input_type="host",replace(ai_domain,"[&;,\s].*$",""),ai_domain)
description = v1.1 Shared pre-processing for the rule and the README threshold SPL, so both classify rows the same way. Nulls users that match the invalid-users macro; reads IPv4-mapped IPv6 src as IPv4; nulls placeholder src values; sets src_public (0 for RFC 1918, 100.64/10, 169.254/16, 127/8, IPv6 ULA, link-local and ::1, and for hostnames; 1 for any other IPv4 or IPv6 address); sets ai_host_source (url_domain, site, or url from the fallback branch), ai_domain and ai_input_type (host for hostnames, app for SSE app names in site). For hostnames it cuts anything after &, ; , or whitespace (NGFW url_domain values such as gemini.google.com&hfcr_pid=2), which ai_domains_filter does not strip.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_web_access_url_sourcetypes]
definition = "*"
description = v1.1 Sourcetypes read by the url fallback branch, as quoted comma-separated values (wildcards allowed). The branch is a second tstats on Web.url IN (hdsi_ai_unsanctioned_web_access_urls) for rows whose url_domain and site do not match the scope, for example a cloud-delivered NGFW feed that logs the AI host only in Web.url. The host is extracted from the url and the rows join the main pipeline. Ships "*" (all sourcetypes): with prefix-only url patterns it added about 7 s per hour on the largest validation tenant and found about 23 user-provider pairs in 4 h that the url_domain/site scope missed. Narrow it to the url-only sourcetypes from the README discovery SPL to save cost, or set "__none__" to turn the branch off. The branch runs as an append subsearch capped at 180 s and 50,000 rows.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_web_access_src_risk]
definition = 0
description = v1.1 1 adds the internal src as a system risk object on rows that have a user (only when exactly one non-shared internal src was seen). 0, the default, scores the user only: no HDSI AI aggregator reads system risk, and in validation this src was mostly a DHCP address (about 1,720 extra system events a day in the largest tenant). The src is still shown in the risk message and still used for per-system approvals. System-only rows (see hdsi_ai_unsanctioned_web_access_system_only_min_events) always score their src.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_web_access_sanctioned_providers]
definition = "__none__"
description = v1.1 Providers sanctioned for the whole organisation, as a comma-separated list of quoted provider names exactly as in ai_provider_domains (case-insensitive), e.g. "OpenAI","Microsoft Copilot". Matching rows are dropped before scoring. Ships with a placeholder that matches nothing. This macro applies to this rule only; an organisation-wide row *|<provider> in ai_sanctioned_entities applies to every AI rule that calls ai_unsanctioned_filter, including this one. Use ai_sanctioned_entities for per-user, per-system or per-bunit approvals too.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_web_access_min_events]
definition = 3
description = v1.1 Minimum Web events per risk entity and provider in the hourly window before a hostname match counts. It removes single incidental requests (an embedded asset, an SSO redirect, a link preview). App-name matches from SSE/CASB sources count from 1 event, because those products log one row per session or connection.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_web_access_auxiliary_hosts]
definition = "^(ms-sso\.copilot\.microsoft\.com|ms-sso\.copilot\.com)$"
description = v1.1 Quoted regex of AI support hosts that on their own do not show an interactive session and are not yet flagged in the common registry: the Edge/Copilot sidebar sign-in frame (ms-sso). Hosts whose ai_provider_domains traffic_class is background (gemini.gstatic.com, ab.chatgpt.com, bzr/bzrcdn.openai.com, auth.openai.com, downloads.claude.ai, QuillBot extension streams) or site are already treated the same way through ai_traffic_class. A risk entity whose only hosts for a provider are non-interactive is dropped. Set to "^$" to count the ms-sso hosts.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_web_access_invalid_users]
definition = "^(unknown|-|n/a|null|none|anonymous|)$|^\d{1,3}(\.\d{1,3}){3}$|^[0-9a-f:]*:[0-9a-f:]*$|[0-9a-f]{8}[.-][0-9a-f]{4}[.-][0-9a-f]{4}[.-][0-9a-f]{4}[.-][0-9a-f]{12}"
description = v1.1 Quoted regex, matched against lower(Web.user), of values that are not a person: placeholders (unknown, -, empty), IP addresses, and identities that contain a GUID (enterprise-browser extension and service pseudo-identities, raw directory object IDs). A matching user is treated as missing, so the row can only score its internal src. In validation an enterprise-browser feed logged GUID-based extension identities that ES cannot match to an identity. Extend it for tenant-specific service or kiosk accounts.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_web_access_system_only_min_events]
definition = 0
description = v1.1 Opt-in for system-only rows (no user, internal src only). 0, the default, drops them: in validation they were about 85 percent of all rows on an NGFW tenant, every HDSI AI aggregator reads only risk_object_type=user, and hdsi_ai_dns_queries_to_ai_domains already scores the same hosts once a day. Set a positive integer to keep system-only rows that reach that many events per provider in the hourly window; derive it from the system_only rows of the README threshold SPL (the p50 there was 2 to 7 events for the main providers in the largest validation tenant, so a gate at p90 keeps only the heaviest hosts). Rows with a user are not affected.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_web_access_max_users_per_src]
definition = 3
description = v1.1 Shared-source cut-off. When more than this many distinct users reach AI providers from the same internal src in the window (NAT, explicit proxy, VDI or terminal server), src is cleared for those rows: it is not used for system approvals, display or system risk, and system-only rows on it are dropped. User risk is kept.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_web_access_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation and scoring (fields: risk_entity, user, src, risk_src, src_ip_list, src_user_count, shared_src, provider, usage_type, ai_match, ai_host_source, ai_domains, interactive_domains, event_count, bytes_out, web_actions, blocked_only, sourcetypes, severity_weight, risk_multiplier, base_score, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_web_access_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust or override risk_score (max 100); ES applies it to every risk object in the row (user and system). Ships as search *.
disabled = False
iseval = 0

[Network - HDSI AI Unsanctioned Web Access - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Unsanctioned Web Access
action.correlationsearch.annotations = {"mitre_attack": ["T1588.007"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$risk_object$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI web activity for $risk_entity$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count sum(Web.bytes_out) as bytes_out sum(Web.bytes_in) as bytes_in values(Web.url) as url values(Web.http_user_agent) as http_user_agent values(Web.action) as action min(_time) as firstTime max(_time) as lastTime from datamodel=Web where (Web.user=\"$risk_entity$\" OR Web.src=\"$risk_entity$\") (`hdsi_ai_unsanctioned_web_access_scope` OR (sourcetype IN (`hdsi_ai_unsanctioned_web_access_url_sourcetypes`) Web.url IN (`hdsi_ai_unsanctioned_web_access_urls`))) by sourcetype Web.user Web.src Web.url_domain Web.site | rename Web.* as * | eval url_domain=if(url_domain=\"unknown\",site,url_domain) | eval mb_out=round(bytes_out/1024/1024,2), mb_in=round(bytes_in/1024/1024,2) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, url_domain, action, count, mb_out, mb_in, sourcetype, http_user_agent, url | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = Unsanctioned AI web access to $provider$ ($ai_domain_list$) by $user_display$ from $src_display$: $event_count$ requests, actions $web_action_list$, seen in $sourcetype_list$.
action.notable.param.rule_title = HDSI AI Unsanctioned Web Access ($risk_entity$ to $provider$)
action.notable.param.security_domain = network
action.notable.param.severity = low
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":15},{"risk_object_field":"risk_src","risk_object_type":"system","risk_score":15}]
action.risk.param._risk_message = Unsanctioned AI web access to $provider$ ($ai_domain_list$) by $user_display$ from $src_display$: $event_count$ requests, actions $web_action_list$, seen in $sourcetype_list$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = risk_entity,provider
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 17 * * * *
description = v1.1.0 Detects users (and, opt-in, internal hosts) reaching AI web apps (chat assistants, AI writing, image, video and voice tools) that the organisation has not sanctioned, from proxy, NGFW URL, SSE/CASB and enterprise-browser logs in the CIM Web model. Matches hostnames (url_domain, or the host inside url for sources that log only the url) and SSE app names against the common AI provider lookups. Risk on the user; system risk on the internal src and user-less (system-only) rows are opt-in. No notable.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count sum(Web.bytes_out) as bytes_out values(Web.action) as web_actions min(_time) as firstTime max(_time) as lastTime from datamodel=Web where `hdsi_ai_unsanctioned_web_access_scope` `hdsi_ai_unsanctioned_web_access_filter` by sourcetype Web.user Web.src Web.url_domain Web.site \
	| rename Web.* as * \
	| append maxtime=180 maxout=50000 [| tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count sum(Web.bytes_out) as bytes_out values(Web.action) as web_actions min(_time) as firstTime max(_time) as lastTime from datamodel=Web where sourcetype IN (`hdsi_ai_unsanctioned_web_access_url_sourcetypes`) Web.url IN (`hdsi_ai_unsanctioned_web_access_urls`) NOT `hdsi_ai_unsanctioned_web_access_scope` `hdsi_ai_unsanctioned_web_access_filter` by sourcetype Web.user Web.src Web.url | rename Web.* as * | eval url_domain=lower(replace(url,"^(?:[A-Za-z][A-Za-z0-9+.-]*://)?(?:[^/@?#]*@)?([^/:?#&;\s]+).*$","\1")), site="unknown", ai_host_source="url" | stats sum(count) as count sum(bytes_out) as bytes_out values(web_actions) as web_actions min(firstTime) as firstTime max(lastTime) as lastTime by sourcetype user src url_domain site ai_host_source] \
	| `hdsi_ai_unsanctioned_web_access_prepare` \
	| where isnotnull(user) OR (isnotnull(src) AND src_public=0) \
	| `ai_domains_filter` \
	| where usage_type="web" \
	| search NOT provider IN (`hdsi_ai_unsanctioned_web_access_sanctioned_providers`) \
	| eval severity_weight=coalesce(tonumber(severity_weight),1.0), risk_entity=coalesce(user,src), src_internal=if(src_public=0,src,null()), ai_interactive_domain=if(coalesce(ai_traffic_class,"interactive")="interactive" AND NOT match(ai_domain,`hdsi_ai_unsanctioned_web_access_auxiliary_hosts`),ai_domain,null()) \
	| stats sum(count) as event_count sum(bytes_out) as bytes_out values(ai_domain) as ai_domains values(ai_interactive_domain) as interactive_domains values(ai_match) as ai_match values(ai_host_source) as ai_host_source values(web_actions) as web_actions values(sourcetype) as sourcetypes values(src) as src_ip_list values(src_internal) as src_internal values(user) as user max(severity_weight) as severity_weight min(firstTime) as firstTime max(lastTime) as lastTime by risk_entity provider usage_type \
	| where event_count>=`hdsi_ai_unsanctioned_web_access_min_events` OR isnotnull(mvfind(ai_match,"^app_name$")) \
	| where isnotnull(interactive_domains) \
	| eval src=if(mvcount(src_internal)=1,src_internal,null()) \
	| eventstats dc(user) as src_user_count by src \
	| eval shared_src=if(coalesce(src_user_count,0)>`hdsi_ai_unsanctioned_web_access_max_users_per_src`,1,0), src=if(shared_src=1,null(),src) \
	| where isnotnull(user) OR (isnotnull(src) AND `hdsi_ai_unsanctioned_web_access_system_only_min_events`>0 AND event_count>=`hdsi_ai_unsanctioned_web_access_system_only_min_events`) \
	| eval risk_src=if(isnotnull(src) AND (isnull(user) OR `hdsi_ai_unsanctioned_web_access_src_risk`=1),src,null()) \
	| eval blocked_only=if(isnotnull(web_actions) AND isnull(mvfilter(NOT match(web_actions,"(?i)^(block|blocked|deny|denied|drop|dropped|reset.*)$"))),1,0) \
	| lookup identity_lookup_expanded identity as user OUTPUT bunit as _user_bunit \
	| lookup asset_lookup_by_str ip as src OUTPUT bunit as _src_bunit \
	| lookup asset_lookup_by_str dns as src OUTPUTNEW bunit as _src_bunit \
	| eval bunit=lower(coalesce(nullif(mvindex(_user_bunit,0),""),nullif(mvindex(_src_bunit,0),""))) \
	| fields - _user_bunit _src_bunit src_internal \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| `ai_risk_multiplier` \
	| eval base_score=round(15*severity_weight*if(blocked_only=1,0.5,1)), risk_score=min(30,max(3,round(base_score*coalesce(risk_multiplier,1)))) \
	| eval user_display=coalesce(user,"not attributed"), src_display=coalesce(src,mvjoin(mvindex(src_ip_list,0,2),", "),"n/a"), ai_domain_list=mvjoin(mvindex(interactive_domains,0,4),", "), web_action_list=mvjoin(web_actions,", "), sourcetype_list=mvjoin(sourcetypes,", ") \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="web_access", detection_id="hdsi_ai_unsanctioned_web_access", mitre_attack="T1588.007", ai_kill_chain_phase="recon" \
	| fields - _allow_* _final_multiplier \
	| `hdsi_ai_unsanctioned_web_access_customizations` \
	| `hdsi_ai_unsanctioned_web_access_risk_score`

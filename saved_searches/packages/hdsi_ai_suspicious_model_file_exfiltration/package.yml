version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Suspicious Model File Exfiltration
description: "Detects a user or host publishing a model or dataset to an external model hub (Hugging Face, ModelScope, Ollama registry, Replicate r8.im, Kaggle). Evidence comes from any of three sources: publish commands on endpoints (Endpoint.Processes: hf/huggingface-cli upload, ollama push, cog push, kaggle models variations (versions) create or kaggle datasets create/version, git push with a hub URL or the git-lfs pre-push hook for a hub remote, the --push_to_hub training-script flag or push_to_hub()), upload-only API requests or upload App-IDs (Web, Network_Traffic), or a large upload volume to a model host. Downloads, browsing and recognisable inference traffic do not count. Escalates when the source asset is tagged as ML infrastructure. Runs hourly. Risk on the user and/or host, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - data_exfiltration
  - web
  - proxy
  - network
  - pan
  - endpoint
  - process
data_prereqs:
  datamodels:
    op: OR
    items:
    - "Web"
    - "Network_Traffic"
    - "Endpoint.Processes"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

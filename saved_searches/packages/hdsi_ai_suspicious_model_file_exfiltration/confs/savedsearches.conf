action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":40},{"risk_object_field":"src","risk_object_type":"system","risk_score":30}]
action.risk.param._risk_message = Possible model or dataset exfiltration to $provider_list$ by $user_display$ from $src_display$ ($evidence_list$): $mb_out$ MB sent to $ai_domain_list$, $upload_url_events$ upload API requests, $upload_app_events$ upload App-ID sessions, $tool_events$ publish commands ($tool_command_list$).

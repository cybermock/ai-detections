alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 23 * * * *
description = v1.1.0 Detects a user or host publishing a model or dataset to an external model hub (Hugging Face, ModelScope, Ollama registry, Replicate r8.im, Kaggle): publish commands on endpoints (hf upload, ollama push, cog push, kaggle models variations (versions) create or kaggle datasets create/version, git push with a hub URL or the git-lfs pre-push hook for a hub remote, the --push_to_hub training-script flag or push_to_hub()), upload-only API requests or upload App-IDs, or a large upload volume to a model host (recognisable inference traffic excluded). Escalates for ML infrastructure assets. Risk on user and/or host, no notable.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count sum(Web.bytes_out) as bytes_out min(_time) as firstTime max(_time) as lastTime from datamodel=Web where `hdsi_ai_suspicious_model_file_exfiltration_web_scope` `hdsi_ai_suspicious_model_file_exfiltration_filter` by sourcetype Web.user Web.src Web.url_domain Web.site Web.http_method Web.url \
	| rename Web.* as * \
	| eval evidence_source="web", ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))), ai_input_type=if(isnull(nullif(url_domain,"unknown")),"app","host"), url_path=if(url="unknown","",replace(url,"^([A-Za-z][A-Za-z0-9+.-]*://)?[^/?#]+","")), bytes_out=tonumber(bytes_out), upload_url_events=if(match(http_method,"(?i)^(POST|PUT|PATCH)$") AND match(url_path,`hdsi_ai_suspicious_model_file_exfiltration_upload_url_regex`),count,0), upload_app_events=0, inf_host=if(ai_input_type="app" AND match(url,"^([A-Za-z][A-Za-z0-9+.-]*://)?[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+(:\d+)?([/?#]|$)"),lower(replace(url,"^([A-Za-z][A-Za-z0-9+.-]*://)?([^/?#]+).*$","\2")),ai_domain) \
	| where NOT match(inf_host.url_path,`hdsi_ai_suspicious_model_file_exfiltration_inference_regex`) \
	| fields - url url_domain site http_method url_path inf_host \
	| append maxtime=600 [| tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count sum(All_Traffic.bytes_out) as bytes_out min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Traffic where `hdsi_ai_suspicious_model_file_exfiltration_traffic_scope` `hdsi_ai_suspicious_model_file_exfiltration_traffic_filter` by sourcetype All_Traffic.user All_Traffic.src All_Traffic.app | rename All_Traffic.* as * | eval evidence_source="network_traffic", bytes_out=tonumber(bytes_out), upload_app_events=if(match(app,`hdsi_ai_suspicious_model_file_exfiltration_upload_app_regex`),count,0), upload_url_events=0, ai_domain=replace(lower(app),"-base$",""), ai_input_type="app" | fields - app] \
	| append maxtime=600 [| tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where `hdsi_ai_suspicious_model_file_exfiltration_process_scope` `hdsi_ai_suspicious_model_file_exfiltration_process_filter` by sourcetype Processes.user Processes.dest Processes.process | rename Processes.* as * | where match(process,`hdsi_ai_suspicious_model_file_exfiltration_upload_tool_regex`) | eval evidence_source="endpoint", src=dest, tool_events=count, bytes_out=0, tool_command=substr(replace(replace(replace(process,"(hf_|r8_)[A-Za-z0-9]{16,}","\1***"),"://[^/@\s]+@","://***@"),"(?i)((--(token|api[_-]?key|password)|(token|api[_-]?key|password|authorization:\s*(bearer|basic)))(\s*[=:]\s*|\s+))[^\s&]+","\1***"),1,200), ai_domain=case(match(process,"(?i)(^|[^a-z0-9_.-])ollama(\.exe)?[^a-z0-9\s]*\s+push\s"),"registry.ollama.ai", match(process,"(?i)(^|[^a-z0-9_.-])cog(\.exe)?[^a-z0-9\s]*\s+push\b"),"r8.im", match(process,"(?i)(^|[^a-z0-9_.-])kaggle(\.exe)?[^a-z0-9\s]*\s+(models|datasets|m|d)\s"),"kaggle.com", match(process,"(?i)((^|[^a-z0-9_.-])modelscope(\.exe)?[^a-z0-9\s]*\s+upload\b|[/@.]modelscope\.cn([/:\s]|$))"),"modelscope.cn", true(),"huggingface.co"), ai_input_type="host" | fields - dest process] \
	| `ai_domains_filter` \
	| where in(usage_type,"model_registry","local_llm") \
	| eval user=if(isnull(user) OR match(lower(user),"^(unknown|-|n/a|null|none|anonymous|)$") OR match(user,"^\d{1,3}(\.\d{1,3}){3}$") OR match(user,"^[0-9A-Fa-f]{0,4}(:[0-9A-Fa-f]{0,4}){2,7}$") OR match(lower(user),"(^|\\\\)(system|local service|network service)$") OR like(user,"%$"),null(),lower(user)), src=if(isnull(src) OR match(lower(src),"^(unknown|-|n/a|null|none|0\.0\.0\.0|127\.0\.0\.1|::1|)$"),null(),lower(src)), src_untrusted=if(isnotnull(src) AND (`hdsi_ai_suspicious_model_file_exfiltration_untrusted_src`),1,0) \
	| where isnotnull(user) OR (isnotnull(src) AND src_untrusted=0) \
	| eval src=if(src_untrusted=1,null(),src), bytes_out=coalesce(bytes_out,0), bytes_logged=if(bytes_out>0,count,0), upload_app_bytes=if(upload_app_events>0,bytes_out,0), user_key=coalesce(user,"-"), src_key=coalesce(src,"-") \
	| stats sum(count) as event_count sum(bytes_out) as bytes_out sum(bytes_logged) as bytes_logged sum(upload_url_events) as upload_url_events sum(upload_app_events) as upload_app_events sum(upload_app_bytes) as upload_app_bytes sum(tool_events) as tool_events values(tool_command) as tool_commands values(ai_domain) as ai_domains values(evidence_source) as evidence_sources values(sourcetype) as sourcetypes min(firstTime) as firstTime max(lastTime) as lastTime by user_key src_key provider \
	| eval user=if(user_key="-",null(),user_key), src=if(src_key="-",null(),src_key) \
	| lookup identity_lookup_expanded identity as user OUTPUT bunit as _user_bunit \
	| lookup asset_lookup_by_str ip as src OUTPUT bunit as _src_bunit category as _src_category \
	| lookup asset_lookup_by_str dns as src OUTPUTNEW bunit as _src_bunit category as _src_category \
	| lookup asset_lookup_by_str nt_host as src OUTPUTNEW bunit as _src_bunit category as _src_category \
	| eval bunit=lower(coalesce(nullif(mvindex(_user_bunit,0),""),nullif(mvindex(_src_bunit,0),""))), bunit=if(bunit="unknown",null(),bunit), src_category=_src_category \
	| fields - _user_bunit _src_bunit _src_category \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| stats sum(event_count) as event_count sum(bytes_out) as bytes_out sum(bytes_logged) as bytes_logged sum(upload_url_events) as upload_url_events sum(upload_app_events) as upload_app_events sum(upload_app_bytes) as upload_app_bytes sum(tool_events) as tool_events values(tool_commands) as tool_commands values(provider) as providers values(ai_domains) as ai_domains values(evidence_sources) as evidence_sources values(sourcetypes) as sourcetypes values(src_category) as src_category values(bunit) as bunit min(firstTime) as firstTime max(lastTime) as lastTime by user_key src_key \
	| eval user=if(user_key="-",null(),user_key), src=if(src_key="-",null(),src_key), bunit=mvindex(bunit,0) \
	| fillnull value=0 bytes_out bytes_logged upload_url_events upload_app_events upload_app_bytes tool_events \
	| eval evidence=mvappend(if(tool_events>0,"publish command",null()), if(upload_app_events>0 AND upload_app_bytes>=`hdsi_ai_suspicious_model_file_exfiltration_min_evidence_mb`*1048576,"upload App-ID",null()), if(upload_url_events>0 AND (bytes_logged=0 OR bytes_out>=`hdsi_ai_suspicious_model_file_exfiltration_min_evidence_mb`*1048576),"upload API request",null()), if(bytes_out>=`hdsi_ai_suspicious_model_file_exfiltration_min_mb`*1048576,"large upload",null())) \
	| where mvcount(evidence)>0 \
	| eval ml_infra=if(match(coalesce(mvjoin(src_category,"|"),""),`hdsi_ai_suspicious_model_file_exfiltration_ml_asset_regex`),1,0) \
	| `ai_risk_multiplier` \
	| eval base_score=case(tool_events>0,45, isnotnull(mvfind(evidence,"^upload (App-ID|API request)$")),40, true(),35)+if(mvcount(evidence)>1,10,0)+if(ml_infra=1,10,0), risk_score=min(70,max(10,round(base_score*coalesce(risk_multiplier,1)))) \
	| eval mb_out=round(bytes_out/1048576,1), user_display=coalesce(user,"not attributed"), src_display=coalesce(src,"n/a"), provider_list=mvjoin(providers,", "), evidence_list=mvjoin(evidence,", "), ai_domain_list=mvjoin(mvindex(ai_domains,0,4),", "), tool_command_list=coalesce(mvjoin(mvindex(tool_commands,0,1)," || "),"none") \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="model_exfiltration", detection_id="hdsi_ai_suspicious_model_file_exfiltration", mitre_attack=mvappend("T1567.001","T1567.002"), ai_kill_chain_phase="exfiltration" \
	| fields - _allow_* _final_multiplier user_key src_key bytes_logged \
	| `hdsi_ai_suspicious_model_file_exfiltration_customizations` \
	| `hdsi_ai_suspicious_model_file_exfiltration_risk_score`

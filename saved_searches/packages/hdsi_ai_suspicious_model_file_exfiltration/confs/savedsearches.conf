action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$risk_object$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View model hub web requests for $user_display$ / $src_display$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count sum(Web.bytes_out) as bytes_out min(_time) as firstTime max(_time) as lastTime from datamodel=Web where (Web.user=\"$user$\" OR Web.src=\"$src$\") `hdsi_ai_suspicious_model_file_exfiltration_web_scope` by sourcetype Web.user Web.src Web.url_domain Web.site Web.http_method Web.url | rename Web.* as * | eval url_domain=if(url_domain=\"unknown\",site,url_domain), mb_out=round(tonumber(bytes_out)/1048576,2) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, url_domain, http_method, url, count, mb_out, sourcetype | sort - mb_out","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View model hub firewall sessions for $user_display$ / $src_display$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count sum(All_Traffic.bytes_out) as bytes_out sum(All_Traffic.bytes_in) as bytes_in values(All_Traffic.dest) as dest min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Traffic where (All_Traffic.user=\"$user$\" OR All_Traffic.src=\"$src$\") `hdsi_ai_suspicious_model_file_exfiltration_traffic_scope` by sourcetype All_Traffic.user All_Traffic.src All_Traffic.app | rename All_Traffic.* as * | eval mb_out=round(bytes_out/1048576,2), mb_in=round(bytes_in/1048576,2) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, app, count, mb_out, mb_in, dest, sourcetype | sort - mb_out","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View model publish commands for $user_display$ / $src_display$","search":"| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where (Processes.user=\"$user$\" OR Processes.dest=\"$src$\") `hdsi_ai_suspicious_model_file_exfiltration_process_scope` by Processes.user Processes.dest Processes.parent_process_name Processes.process_name Processes.process | rename Processes.* as * | where match(process,`hdsi_ai_suspicious_model_file_exfiltration_upload_tool_regex`) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, dest, parent_process_name, process_name, process, count | sort - lastTime","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = Possible model or dataset exfiltration to $provider_list$ by $user_display$ from $src_display$ ($evidence_list$, $mb_out$ MB sent).

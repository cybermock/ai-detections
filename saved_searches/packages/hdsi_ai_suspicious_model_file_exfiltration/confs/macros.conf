[hdsi_ai_suspicious_model_file_exfiltration_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Web branch, inline in its tstats where clause before aggregation. Use Web datamodel field names, e.g. NOT Web.user IN ("svc_mlops") or NOT sourcetype IN ("aws:elb:accesslogs","aws:waf") to keep inbound load-balancer and WAF logs out. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_suspicious_model_file_exfiltration_traffic_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Network_Traffic (App-ID) branch, inline in its tstats where clause. Use Network_Traffic field names, e.g. NOT All_Traffic.src IN ("10.20.0.0/16") for a sanctioned training cluster that publishes to the organisation's own model hub account. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_suspicious_model_file_exfiltration_process_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Endpoint.Processes branch, inline in its tstats where clause. Use Processes field names, e.g. NOT Processes.dest IN ("ci-runner-*") for a CI/CD runner whose job publishes models. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_suspicious_model_file_exfiltration_web_scope]
definition = (Web.url_domain IN ("huggingface.co*","*.huggingface.co*","hf.co*","*.hf.co*","modelscope.cn*","*.modelscope.cn*","ollama.com*","*.ollama.com*","registry.ollama.ai*","dd20bb891979d25aebc8bec07b2b3bbc.r2.cloudflarestorage.com*","r8.im*","kaggle.com*","*.kaggle.com*") OR Web.site IN ("huggingface.co*","*.huggingface.co*","hf.co*","*.hf.co*","modelscope.cn*","*.modelscope.cn*","ollama.com*","*.ollama.com*","registry.ollama.ai*","r8.im*","kaggle.com*","*.kaggle.com*","hugging face","huggingface*","modelscope*","ollama*","kaggle"))
description = v1.1 Inline pre-filter for the Web tstats: hosts that accept model or dataset uploads (Hugging Face hub and Xet storage, ModelScope, the Ollama registry and its blob bucket, the Replicate r8.im model registry, Kaggle) in Web.url_domain or Web.site, plus SSE/CASB app names in Web.site. The trailing wildcard tolerates a logged :port. Provider resolution and the enabled flags come from ai_domains_filter, so a value listed here that the common lookups do not resolve to a model_registry or local_llm row is dropped later. Today all listed hostnames resolve, and of the app names only "hugging face", "huggingface*" and "kaggle" do; "modelscope*" and "ollama*" app names are kept so they count as soon as the common ai_provider_apps lookup lists them. Inference hosts and paths are removed by inference_regex.
disabled = False
iseval = 0

[hdsi_ai_suspicious_model_file_exfiltration_traffic_scope]
definition = (All_Traffic.app IN ("huggingface*","hugging face*","ollama*","modelscope*","kaggle*"))
description = v1.1 Inline pre-filter for the Network_Traffic tstats: firewall App-IDs of model hubs. The PAN "-base" suffix is stripped before provider resolution through ai_domains_filter (ai_provider_apps). Today only huggingface, huggingface-base, huggingface-upload and kaggle resolve; ollama* and modelscope* App-IDs are pre-selected but dropped until the common ai_provider_apps lookup lists them. Replicate App-IDs are deliberately not in scope: they carry inference traffic and cannot be told apart from a cog push. Firewalls without App-ID (app=ssl or similar) contribute nothing here.
disabled = False
iseval = 0

[hdsi_ai_suspicious_model_file_exfiltration_process_scope]
definition = (Processes.process IN ("*hf upload*","*hf.exe* upload*","*huggingface-cli*upload*","*huggingface_hub*upload*","*hfapi*upload*","*hfapi*create_commit*","*ollama* push *","*cog* push *","*kaggle* models *","*kaggle* m *","*kaggle* datasets *","*kaggle* d *","*modelscope* upload*","*push_to_hub*","*push-to-hub*","*upload_folder*","*upload_large_folder*","*git* push *huggingface.co*","*git* push *hf.co*","*git* push *modelscope.cn*","*lfs*pre-push*huggingface.co*","*lfs*pre-push*hf.co*","*lfs*pre-push*modelscope.cn*"))
description = v1.1 Inline pre-filter for the Endpoint.Processes tstats: command lines that may publish a model or dataset, including the Kaggle CLI short group aliases (kaggle m ..., kaggle d ...), the --push_to_hub / --push-to-hub training-script flag, the git-lfs pre-push hook (which carries the remote URL even when the user typed a bare git push) and the python -m huggingface_hub CLI form. Deliberately broad; the upload_tool_regex macro decides.
disabled = False
iseval = 0

[hdsi_ai_suspicious_model_file_exfiltration_upload_tool_regex]
definition = "(?i)((^|[^a-z0-9_.-])((hf|huggingface-cli)(\.exe)?[^a-z0-9\s]*\s+(upload|upload-large-folder|lfs-multipart-upload)\b|ollama(\.exe)?[^a-z0-9\s]*\s+push\s|cog(\.exe)?[^a-z0-9\s]*\s+push\b|kaggle(\.exe)?[^a-z0-9\s]*\s+((models|m)\s+(instances|variations|i|v)\s+((versions|v)\s+)?create|(datasets|d)\s+(create|version))\b|modelscope(\.exe)?[^a-z0-9\s]*\s+upload\b|git(\.exe)?[^a-z0-9\s]*\s+((-c\s+\S+|--?[a-z][a-z0-9-]*(=\S+)?)\s+)*push\s[^|;&]*?[/@.](huggingface\.co|hf\.co|modelscope\.cn)([/:\s]|$)|git(-lfs|(\.exe)?[^a-z0-9\s]*\s+lfs)(\.exe)?[^a-z0-9\s]*\s+pre-push\s+\S+\s+\S*[/@.](huggingface\.co|hf\.co|modelscope\.cn)([/:\s]|$))|huggingface_hub\.[a-z0-9_.]+\s+(upload|upload-large-folder)\b|push_to_hub\s*\(|\s--push[_-]to[_-]hub(?=[\s=]|$)(?!(\s+|\s*=\s*)(false|0|no)\b)|(huggingface_hub|hfapi).*?(upload_(large_)?folder|upload_file|create_commit)\s*\()"
description = v1.1 Quoted regex on Processes.process for a model or dataset publish command: hf / huggingface-cli upload (also python -m huggingface_hub.<cli> upload), upload-large-folder and the git-lfs multipart upload agent, ollama push, cog push (Replicate), the Kaggle CLI model-version upload in its current and legacy spellings (kaggle models variations create, kaggle models variations versions create, kaggle models instances (versions) create, and the aliases m / i / v) and kaggle datasets create/version (also kaggle d ...), modelscope upload, git push with a hub URL (global options such as -C/-c and push options such as --force may come first), the git-lfs pre-push hook for a hub remote (git lfs pre-push <remote> <hub URL>; this is how a bare "git push origin main" to an LFS-tracked hub repo becomes visible), the --push_to_hub / --push-to-hub flag of Transformers, TRL, diffusers and accelerate training scripts (unless followed by False/0/no), inline push_to_hub(, and huggingface_hub/HfApi upload_folder/upload_large_folder/upload_file/create_commit calls (a bare upload_folder( from another SDK such as Box does not count). The hub hostname must be a whole host label (preceded by / @ or . and followed by / : whitespace or end), so a remote such as gitlab.examplehf.com or myhf.corp never matches. kaggle models create (model metadata only, no files) does not count. A bare git push to a hub remote in a repository without git-lfs carries no URL on the command line and is only visible to the network paths. Downloads (hf download, ollama pull, git clone) never match.
disabled = False
iseval = 0

[hdsi_ai_suspicious_model_file_exfiltration_upload_url_regex]
definition = "(?i)(/v1/(xorbs|shards)(/|$)|/api/(models|datasets)/.+/(preupload|xet-write-token)/|/info/lfs/objects/(verify|[0-9a-f]{64})|/v2/.+/blobs/uploads/|/v2/.+/manifests/)"
description = v1.1 Quoted regex on the URL path of POST/PUT/PATCH requests to model hosts that only a file upload makes: Hugging Face Xet xorb/shard uploads, the model/dataset preupload and xet-write-token API, Git LFS upload verify, and OCI registry blob uploads or manifest pushes (Ollama registry, Replicate r8.im). The hub commit endpoint and Space (application code) repositories are deliberately excluded: on a source that logs no bytes a lone commit is indistinguishable from a web-UI README or model-card edit. Needs a proxy or decrypting firewall that logs method and path.
disabled = False
iseval = 0

[hdsi_ai_suspicious_model_file_exfiltration_upload_app_regex]
definition = "(?i)(-upload$|\supload$)"
description = v1.1 Quoted regex on a firewall App-ID (Network_Traffic All_Traffic.app) that the vendor reserves for uploads (Palo Alto huggingface-upload). Such sessions count as upload evidence once they reach min_evidence_mb. It is not applied to Web/SSE app names: CIM Web has no activity field, and SSE site values seen in validation (for example "Hugging Face") do not separate uploads from downloads.
disabled = False
iseval = 0

[hdsi_ai_suspicious_model_file_exfiltration_inference_regex]
definition = "(?i)^((router|api-inference)\.huggingface\.co\.?(:\d+)?(/|$)|[^/]*/(api/inference-proxy|hf-inference|v1/(chat/completions|completions|embeddings|responses|predictions|files))(/|$))"
description = v1.1 Quoted regex on the lowercased request host concatenated with the URL path. The host is Web.url_domain, or for SSE rows that carry only an app name in Web.site the hostname taken from Web.url when the URL carries one (otherwise the app name). Matching rows are dropped before evidence is counted, because they are model inference (chat, embeddings, predictions, prediction input files), not model or dataset publication: the Hugging Face Inference Providers router and serverless inference API, the hub inference proxy, /hf-inference/ paths, and OpenAI-style or Replicate-style inference paths on any in-scope host. An SSE row with neither a host nor a path cannot be classified and still counts toward volume. Replicate is only in scope through its r8.im model registry (cog push), so api.replicate.com and the Replicate App-ID never count.
disabled = False
iseval = 0

[hdsi_ai_suspicious_model_file_exfiltration_min_mb]
definition = 100
description = v1.1 MB sent (bytes_out, Web plus Network_Traffic) to model hosts by one user/host pair in the hourly window that counts as an upload on its own, without URL, App-ID or command evidence. Rows matching inference_regex never count; SSE rows without a host or path cannot be classified and do count. In 7 days of validation data the largest hourly upload to a model hub from one user or host was about 1 MB on firewall App-ID data, and no SSE user sent more than 25 MB to any model-hosting site in the whole week, while a small quantised model is hundreds of MB. Lower it (for example to 50) only if LoRA adapters are a concern and your baseline allows it.
disabled = False
iseval = 0

[hdsi_ai_suspicious_model_file_exfiltration_min_evidence_mb]
definition = 10
description = v1.1 Minimum MB sent with an upload App-ID, or alongside upload-URL requests when the source logs bytes, before that evidence counts. Keeps small API calls out when bytes are logged. Sources that log no bytes (most firewall URL logs) count upload-URL requests regardless, which is why upload_url_regex excludes the commit endpoint (a web-UI README or model-card edit) and Space repositories.
disabled = False
iseval = 0

[hdsi_ai_suspicious_model_file_exfiltration_ml_asset_regex]
definition = "(?i)(^|[^a-z0-9])(mlops|machine[ _-]?learning|data[ _-]?science|gpu|jupyter|ai[ _-]?(compute|cluster|platform)|model[ _-]?(training|serving|registry)|ml[ _-]?(server|platform|cluster|node|workstation|infra|dev|prod))([^a-z0-9]|$)"
description = v1.1 Quoted regex on the source asset category (asset_lookup_by_str, all values joined with |) that marks ML or data-science infrastructure and adds 10 to the score. Word-bounded on purpose: the previous unanchored ml|training|notebook regex matched unrelated medical-lab, training-room and laptop categories on validation tenants. Extend it with your own CMDB category names.
disabled = False
iseval = 0

[hdsi_ai_suspicious_model_file_exfiltration_untrusted_src]
definition = (match(src,"^\d{1,3}(\.\d{1,3}){3}$") AND NOT (cidrmatch("10.0.0.0/8",src) OR cidrmatch("172.16.0.0/12",src) OR cidrmatch("192.168.0.0/16",src) OR cidrmatch("100.64.0.0/10",src))) OR match(src,"^[23][0-9a-f]{0,3}:[0-9a-f:.]*$")
description = v1.1 Eval condition on the lowercased src for addresses that are not one of your endpoints. Rows that match and have no user are dropped, and a matching src is never a risk object. Ships as "public IPv4 or global-unicast IPv6 (2000::/3)": inbound WAF and load-balancer logs in the Web data model carry internet clients that send model-hub Host headers, and SSE/cloud proxies log a remote user's home address (IPv6 included). Private IPv4, ULA (fc00::/7) and link-local (fe80::/10) addresses stay trusted. Use false() if your clients have public addresses.
disabled = False
iseval = 0

[hdsi_ai_suspicious_model_file_exfiltration_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation and scoring (fields: user, src, providers, ai_domains, evidence, evidence_sources, mb_out, upload_url_events, upload_app_events, tool_events, tool_commands, ml_infra, src_category, sourcetypes, bunit, risk_multiplier, base_score, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_suspicious_model_file_exfiltration_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust or override risk_score (max 100); ES applies it to every risk object in the row (user and system). Ships as search *.
disabled = False
iseval = 0

version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Deepfake Tool Execution/Access
description: "Detects execution of open-source face-swap, voice-cloning, lip-sync and local image-generation tools (FaceFusion, Deep-Live-Cam, DeepFaceLab, RVC, XTTS, SadTalker and others) from Endpoint.Processes command lines, image paths and process names. Risk on user and system, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - process
  - endpoint
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Endpoint.Processes"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

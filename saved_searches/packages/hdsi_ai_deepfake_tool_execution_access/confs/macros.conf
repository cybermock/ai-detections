[hdsi_ai_deepfake_tool_execution_access_filter]
definition = ()
description = v1.1 Tenant exclusion hook, inlined in the tstats where clause before aggregation. Use Endpoint.Processes field names, e.g. NOT Processes.dest IN ("media-lab-*") or NOT Processes.user="svc_render". Ships empty.
disabled = False
iseval = 0


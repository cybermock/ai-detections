"*faceswap*", "*swapface*", "*simswap*", "*avatarify*", "*visomaster*", "*rope.bat*", "*rope.py*", "*rope.exe*", "*rope-pearl*", "*rope-opal*", "*rope-live*", "*rope-next*", "*sd-webui-reactor*", "*comfyui-reactor*", "*rvc-webui*", "*retrieval-based-voice*", "*infer-web*", "*applio*", "*tortoise-tts*", "*tortoise_tts*", "*xtts*", "*alltalk*", "*openvoice*", "*sovits*", "*so-vits*", "*fish-speech*", "*fish_speech*", "*cosyvoice*", "*styletts*", "*f5-tts*", "*f5_tts*", "*whisperspeech*", "*vall-e-x*", "*valle-x*", "*valle_x*", "*vall_e_x*", "*wav2lip*", "*sadtalker*", "*liveportrait*", "*musetalk*", "*latentsync*", "*stable-diffusion-webui*", "*sd.webui*", "*sd-webui*", "*comfyui*", "*fooocus*"))
description = v1.1 Cheap tstats pre-filter: command-line, image-path or process-name substrings of open-source face-swap, voice-clone, lip-sync and local image-generation tools, plus tool-specific arguments (face_swapper frame processor, run.py --execution-provider, SadTalker --driven_audio) that survive a plain python run.py launch. Never add a bare short word (a bare *rope* matched millions of 'property' command lines in live testing). Only rows that also pass hdsi_ai_deepfake_tool_execution_access_classify are kept, so substrings here may be broad. Add a term here AND a case in the classify macro together.
disabled = False
iseval = 0

[hdsi_ai_deepfake_tool_execution_access_classify]
definition = eval _df_exe=replace(lower(coalesce(process_name, process_path, replace(coalesce(process,""),"(?s)^\s*(\"[^\"]*\"|\S*).*$","\1"))),"^.*[\\\\/]|\"",""), _df_proc=lower(coalesce(process,"")), _df_proc=if(match(_df_exe,"^(chrome|chromium|msedge|msedgewebview2|firefox|brave|opera|opera_gx|iexplore|vivaldi|arc|safari|explorer|rundll32)([.]exe)?$"), replace(_df_proc,"[a-z][a-z0-9+.-]*://[^\s\"']+"," "), _df_proc) | eval _df_cmd=replace(_df_proc." ".lower(coalesce(process_path,""))." ".lower(coalesce(process_name,"")),"([\\\\/])(users|homes?|profiles?|redirect[a-z]*|documents and settings)([$]?)[\\\\/]+[^\\\\/\"]+","\1\2\3/~") | eval _df_roop=replace(replace(_df_cmd,"\\\\\\\\[^\\\\/\s\"]+\\\\[^\\\\/\s\"]+(\\\\[^\\\\/\"]+)?","//~/~/~"),"(/user:|/u:|/ru\s+|(?:^|\s)-u\s+|obj=\s*|--user[=\s]+)(\"?)[a-z0-9._-]+\\\\[^\s\"\\\\/]+","\1\2~") | eval tool_name=case(match(_df_cmd,"facefusion"),"FaceFusion", match(_df_cmd,"deepfacelab"),"DeepFaceLab", match(_df_cmd,"deepfacelive"),"DeepFaceLive", match(_df_cmd,"deep[-_]?live[-_]?cam"),"Deep-Live-Cam", match(_df_cmd,"(^|[^a-z0-9])(sd-webui|comfyui)-reactor"),"ReActor", match(_df_cmd,"visomaster"),"VisoMaster", match(_df_cmd,"(^|[^a-z0-9])rope([.](bat|py|exe)|-(pearl|opal|live|next))"),"Rope", match(_df_cmd,"inswapper"),"InSwapper face-swap model", match(_df_roop,"/roop([-_][a-z0-9]+)*([\\\\/\s\"']|[.](git|zip)|$)|\\\\roop([-_][a-z0-9]+)*([\\\\/]|[.](git|zip))|(^|[\s\"'=(])([a-z]:|//)[^\s\"']*\\\\roop([-_][a-z0-9]+)*([\s\"']|$)|(^|[^a-z0-9])roop([-_][a-z0-9]+)*[.](py|bat|cmd|ps1|exe|ipynb)([^a-z0-9]|$)"),"Roop", match(_df_cmd,"(^|[^a-z0-9])faceswap([^a-z0-9]|$)"),"Faceswap", match(_df_cmd,"(^|[^a-z0-9])swapface([^a-z0-9]|$)"),"Swapface", match(_df_cmd,"simswap"),"SimSwap", match(_df_cmd,"avatarify"),"Avatarify", match(_df_cmd,"wav2lip"),"Wav2Lip", match(_df_cmd,"sadtalker|--driven_audio"),"SadTalker", match(_df_cmd,"liveportrait"),"LivePortrait", match(_df_cmd,"musetalk"),"MuseTalk", match(_df_cmd,"latentsync"),"LatentSync", match(_df_cmd,"rvc-webui|retrieval-based-voice|infer-web[.]py"),"RVC", match(_df_cmd,"(^|[^a-z0-9])applio([^a-z0-9]|$)"),"Applio", match(_df_cmd,"tortoise[-_]tts"),"Tortoise TTS", match(_df_cmd,"(^|[^a-z0-9])xtts([^a-z0-9]|v2|$)|alltalk[-_]?tts"),"Coqui XTTS", match(_df_cmd,"openvoice"),"OpenVoice", match(_df_cmd,"so-?vits"),"SoVITS", match(_df_cmd,"fish[-_]speech"),"Fish Speech", match(_df_cmd,"cosyvoice"),"CosyVoice", match(_df_cmd,"styletts"),"StyleTTS", match(_df_cmd,"(^|[^a-z0-9])f5[-_]tts"),"F5-TTS", match(_df_cmd,"whisperspeech"),"WhisperSpeech", match(_df_cmd,"vall[-_]?e[-_]?x"),"VALL-E-X", match(_df_cmd,"stable-diffusion-webui|(^|[^a-z0-9])sd[.-]webui"),"Stable Diffusion WebUI", match(_df_cmd,"(^|[^a-z0-9])comfyui([^a-z0-9]|$)"),"ComfyUI", match(_df_cmd,"(^|[^a-z0-9])fooocus([^a-z0-9]|$)"),"Fooocus", match(_df_cmd,"face[-_]swapper|(^|[^a-z0-9])run[.]py([^a-z0-9].*)?--execution-provider"),"Roop-family face swapper (generic launch)") | eval tool_category=case(isnull(tool_name),null(), match(tool_name,"^(FaceFusion|DeepFaceLab|DeepFaceLive|Deep-Live-Cam|ReActor|VisoMaster|Rope|InSwapper|Roop|Faceswap|Swapface|SimSwap|Avatarify)"),"face_swap", match(tool_name,"^(Wav2Lip|SadTalker|LivePortrait|MuseTalk|LatentSync)"),"lip_sync_avatar", match(tool_name,"^(Stable Diffusion WebUI|ComfyUI|Fooocus)$"),"image_generation", true(),"voice_clone") | fields - _df_cmd _df_roop _df_exe _df_proc
description = v1.1 Assigns tool_name and tool_category (face_swap, voice_clone, lip_sync_avatar, image_generation) from process, process_path and process_name with boundary-anchored regexes. Generic terms (rope, xtts, faceswap, applio, comfyui) require non-alphanumeric boundaries or a file suffix because bare substrings matched csc.exe temp folders, base64 arguments and "property" in live testing. Roop matches only as a backslash folder followed by another separator (\roop\, \roop-<fork>\), a forward-slash path or clone URL (/roop), a drive-rooted path ending in \roop, or a script/executable name (roop.py, roop.exe). Before matching, the folder after any users, home, homes, profile(s) or redirect* segment (with or without $, e.g. \Users\<name>\, /home/<name>/, \\server\users$\<name>\) is masked for every tool; for the Roop check only, the server, share and first folder of a UNC path and DOMAIN\name values after /user:, /u:, /ru, -u, obj= and --user are masked too. So an account value (roop.example, roop.example@..., CORP\roop) or a profile or home folder named after a tool never classifies as Roop; a user name used as an ordinary deeper folder (D:\scratch\roop\) still does. URLs are removed from browser, explorer.exe and rundll32.exe command lines, so a clicked link to a tool repository is not tool execution (git, curl, pip and PowerShell downloads are still matched). A tstats "unknown" fill value never matches. Rows without a tool_name are dropped.
disabled = False
iseval = 0

[hdsi_ai_deepfake_tool_execution_access_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after normalisation (fields: user, src, tools, tool_categories, process_sample, executions). Example: search NOT (tool_categories="image_generation" AND src="design-ws-*"). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_deepfake_tool_execution_access_risk_score]
definition = search *
description = v1.1 Risk score hook, last pipe. risk_score is already set from the tool category base (face_swap/voice_clone 40, lip_sync_avatar 30, image_generation 15) x risk_multiplier, capped at 80; override it here per tenant. Ships as search *.
disabled = False
iseval = 0

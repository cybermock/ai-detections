action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Deepfake Tool Execution/Access
action.correlationsearch.annotations = {"mitre_attack": ["T1588.007"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$risk_object$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View deepfake tool processes for $user_display$ on $host_display$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count min(_time) as firstTime max(_time) as lastTime values(Processes.parent_process_name) as parent_process_name values(Processes.process_path) as process_path from datamodel=Endpoint.Processes where (Processes.dest=\"$src$\" OR Processes.user=\"$user$\") `hdsi_ai_deepfake_tool_execution_access_tool_terms` by Processes.user Processes.dest Processes.process_name Processes.process | rename Processes.* as * | `hdsi_ai_deepfake_tool_execution_access_classify` | where isnotnull(tool_name) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, dest, tool_name, tool_category, process_name, parent_process_name, process_path, process, count | sort - count","earliest_offset":"-7d","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = $user_display$ ran deepfake or synthetic-media tooling on $host_display$: $tools$ ($tool_categories$), $executions$ process events, e.g. $process_sample$.

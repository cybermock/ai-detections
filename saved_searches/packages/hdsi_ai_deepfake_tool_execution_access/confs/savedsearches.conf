action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":40},{"risk_object_field":"src","risk_object_type":"system","risk_score":40}]
action.risk.param._risk_message = $user_display$ ran deepfake or synthetic-media tooling on $host_display$: $tools$ ($tool_categories$), $executions$ process events, e.g. $process_sample$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user,src
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 4-59/15 * * * *
description = v1.1.0 Detects execution of open-source face-swap, voice-cloning, lip-sync and local image-generation tools on endpoints from process command lines, image paths and process names. Risk on user and system, no notable.
disabled = 0
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite

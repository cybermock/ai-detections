search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where `hdsi_ai_deepfake_tool_execution_access_tool_terms` `hdsi_ai_deepfake_tool_execution_access_filter` by Processes.user Processes.dest Processes.process_name Processes.process_path Processes.process Processes.parent_process_name \
	| rename Processes.* as * \
	| foreach process process_path process_name parent_process_name [eval <<FIELD>>=if('<<FIELD>>'="unknown", null(), '<<FIELD>>')] \
	| `hdsi_ai_deepfake_tool_execution_access_classify` \
	| where isnotnull(tool_name) \
	| eval user=if(isnull(user) OR in(user,"unknown","-","") OR like(user,"%$") OR match(lower(user),"(^|\\\\)(system|local service|network service)$"), "__none__", user), src=if(isnull(dest) OR in(dest,"unknown","-",""), "__none__", dest) \
	| where user!="__none__" OR src!="__none__" \
	| eval sample_cmd=coalesce(process,process_path,process_name) \
	| sort 0 firstTime \
	| stats sum(count) as executions values(tool_name) as tools values(tool_category) as tool_categories values(process_name) as process_name values(parent_process_name) as parent_process_name values(process) as process first(sample_cmd) as sample_cmd min(firstTime) as firstTime max(lastTime) as lastTime by user src \
	| eval user=if(user="__none__", null(), user), src=if(src="__none__", null(), src) \
	| eval process_sample=substr(sample_cmd,1,250), user_display=coalesce(user,"a system or unattributed account"), host_display=coalesce(src,"an unidentified host"), base_score=case(isnotnull(mvfind(tool_categories,"^(face_swap|voice_clone)$")),40, isnotnull(mvfind(tool_categories,"^lip_sync_avatar$")),30, true(),15), provider="Deepfake Tool" \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| `ai_risk_multiplier` \
	| eval risk_multiplier=coalesce(risk_multiplier,1), risk_score=min(80, round(base_score*risk_multiplier)) \
	| eval ai_activity="deepfake_tool", detection_id="hdsi_ai_deepfake_tool_execution_access", mitre_attack="T1588.007", ai_kill_chain_phase="staging" \
	| convert ctime(firstTime) ctime(lastTime) \
	| fields user src user_display host_display tools tool_categories executions process_name parent_process_name process process_sample firstTime lastTime base_score risk_multiplier risk_score provider ai_activity detection_id mitre_attack ai_kill_chain_phase \
	| `hdsi_ai_deepfake_tool_execution_access_customizations` \
	| `hdsi_ai_deepfake_tool_execution_access_risk_score`

action.notable.param.drilldown_searches = [{"name":"View associated risk events for $user$","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$user$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI web activity for $user$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count sum(Web.bytes_out) as bytes_out sum(Web.bytes_in) as bytes_in values(Web.src) as src values(Web.dest) as dest values(Web.http_user_agent) as http_user_agent min(_time) as firstTime max(_time) as lastTime from datamodel=Web where (Web.url_domain=* OR Web.site=*) Web.user=\"$user$\" by Web.user Web.url_domain Web.site | rename Web.* as * | eval ai_domain=lower(coalesce(nullif(url_domain,\"unknown\"),nullif(site,\"unknown\"))), ai_input_type=if(isnull(nullif(url_domain,\"unknown\")),\"app\",\"host\") | `ai_domains_filter` | eval url_domain=coalesce(nullif(url_domain,\"unknown\"),site), mb_out=round(bytes_out/1024/1024,2), mb_in=round(bytes_in/1024/1024,2) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, provider, usage_type, url_domain, count, mb_out, mb_in, dest, http_user_agent | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI App-ID traffic for $user$","search":"| tstats summariesonly=t allow_old_summaries=t count sum(All_Traffic.bytes_out) as bytes_out sum(All_Traffic.bytes_in) as bytes_in values(All_Traffic.dest) as dest values(All_Traffic.action) as action min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Traffic where All_Traffic.user=\"$user$\" by All_Traffic.user All_Traffic.src All_Traffic.app | rename All_Traffic.* as * | eval app_lc=lower(trim(app)) | lookup ai_provider_apps app_name as app_lc OUTPUT app_name as app_exact | eval ai_domain=if(isnotnull(app_exact),app_lc,replace(app_lc,\"-base$\",\"\")), ai_input_type=\"app\" | `ai_domains_filter` | eval mb_out=round(bytes_out/1024/1024,2), mb_in=round(bytes_in/1024/1024,2) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, app, provider, usage_type, action, count, mb_out, mb_in, dest | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View sign-ins by $user$ to AI applications","search":"| tstats summariesonly=t allow_old_summaries=t count values(Authentication.src) as src values(Authentication.dest) as dest values(sourcetype) as sourcetype min(_time) as firstTime max(_time) as lastTime from datamodel=Authentication where Authentication.user=\"$user$\" by Authentication.user Authentication.app Authentication.action | rename Authentication.* as * | eval ai_domain=`hdsi_ai_privileged_account_service_usage_sso_app_name`, ai_input_type=\"app\" | `ai_domains_filter` | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, app, provider, action, count, src, dest, sourcetype | sort - lastTime","earliest_offset":"-7d@d","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = Privileged account $user$ ($privilege_reason$) used AI service(s) $provider_list$ via $evidence_list$: $request_count$ events, $mb_out$ MB sent, e.g. $ai_name_sample$, from $src_sample$. Basis: $privilege_basis$; evidence types: $evidence_list$; usage: $usage_type_list$; first $firstTime$, last $lastTime$.
action.notable.param.rule_title = HDSI AI Privileged Account Service Usage ($user$ - $provider_list$)
action.notable.param.security_domain = identity
action.notable.param.severity = medium
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":30}]
action.risk.param._risk_message = Privileged account $user$ ($privilege_reason$) used AI service(s) $provider_list$ via $evidence_list$: $request_count$ events, $mb_out$ MB sent, e.g. $ai_name_sample$, from $src_sample$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 23 * * * *
description = v1.1.0 Risk on a privileged account (built-in administrator such as Administrator or root, ES identity category such as privileged, domain_admin or service, or an admin naming convention) that used an AI service, seen in any of three places: proxy/SSE web logs (Web), firewall App-ID traffic with User-ID (Network_Traffic) or an SSO sign-in to a non-suite AI application (Authentication). One risk event per account per day listing every provider seen in that run. User risk only, no notable.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count sum(Web.bytes_out) as bytes_out values(Web.src) as src min(_time) as firstTime max(_time) as lastTime from datamodel=Web where NOT Web.user IN ("unknown","-") `hdsi_ai_privileged_account_service_usage_web_scope` `hdsi_ai_privileged_account_service_usage_filter` by Web.user Web.url_domain Web.site \
	| rename Web.* as * \
	| eval evidence="web", ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))), ai_input_type=if(isnull(nullif(url_domain,"unknown")),"app","host") \
	| `hdsi_ai_privileged_account_service_usage_privileged_users` \
	| fields user user_bare src ai_domain ai_input_type evidence count bytes_out firstTime lastTime privilege_basis user_category user_priority user_bunit \
	| append maxtime=600 [| tstats summariesonly=t allow_old_summaries=t count sum(All_Traffic.bytes_out) as bytes_out values(All_Traffic.src) as src min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Traffic where NOT All_Traffic.user IN ("unknown","-") `hdsi_ai_privileged_account_service_usage_traffic_scope` `hdsi_ai_privileged_account_service_usage_traffic_filter` by All_Traffic.user All_Traffic.app | rename All_Traffic.* as * | eval evidence="network", app_lc=lower(trim(app)) | `hdsi_ai_privileged_account_service_usage_privileged_users` | lookup ai_provider_apps app_name as app_lc OUTPUT app_name as app_exact | eval ai_domain=if(isnotnull(app_exact),app_lc,replace(app_lc,"-base$","")), ai_input_type="app" | fields user user_bare src ai_domain ai_input_type evidence count bytes_out firstTime lastTime privilege_basis user_category user_priority user_bunit] \
	| append maxtime=600 [| tstats summariesonly=t allow_old_summaries=t count values(Authentication.src) as src min(_time) as firstTime max(_time) as lastTime from datamodel=Authentication where Authentication.action="success" NOT Authentication.user IN ("unknown","-") `hdsi_ai_privileged_account_service_usage_sso_scope` `hdsi_ai_privileged_account_service_usage_sso_filter` by Authentication.user Authentication.app | rename Authentication.* as * | eval evidence="sso", ai_domain=`hdsi_ai_privileged_account_service_usage_sso_app_name`, ai_input_type="app", bytes_out=0 | `hdsi_ai_privileged_account_service_usage_privileged_users` | fields user user_bare src ai_domain ai_input_type evidence count bytes_out firstTime lastTime privilege_basis user_category user_priority user_bunit] \
	| `ai_domains_filter` \
	| where coalesce(ai_traffic_class,"interactive")!="background" \
	| eval severity_weight=tonumber(severity_weight), src=mvfilter(NOT match(src,"^(unknown|-)?$")) \
	| stats sum(count) as request_count sum(eval(if(evidence="sso",count,0))) as sso_count sum(eval(if(evidence="sso",0,count))) as net_count sum(bytes_out) as total_bytes values(evidence) as evidence values(ai_domain) as ai_names values(usage_type) as usage_types values(src) as src_list max(severity_weight) as severity_weight min(firstTime) as firstTime max(lastTime) as lastTime values(privilege_basis) as privilege_basis values(user_category) as user_category values(user_priority) as user_priority values(user_bunit) as user_bunit by user provider \
	| eval ambient=if(in(provider,`hdsi_ai_privileged_account_service_usage_ambient_providers`),1,0) \
	| where (sso_count>0 AND ambient=0) OR net_count>=if(ambient=1,`hdsi_ai_privileged_account_service_usage_ambient_min_events`,`hdsi_ai_privileged_account_service_usage_min_events`) \
	| eval privilege_basis=case(isnotnull(mvfind(privilege_basis,"^builtin_admin$")),"builtin_admin", isnotnull(mvfind(privilege_basis,"^es_identity$")),"es_identity", isnotnull(mvfind(privilege_basis,"^service_account$")),"service_account", true(),"account_naming"), user_group=case(privilege_basis="account_naming","privileged_naming", privilege_basis="service_account","privileged_service", true(),"privileged"), src=mvindex(src_list,0) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| eval bunit_lc=lower(trim(mvindex(user_bunit,0))), bunit_leaf=trim(replace(bunit_lc,"^.*[/\\\\>|:]","")), bunit_top=trim(replace(bunit_lc,"[/\\\\>|:].*$","")) \
	| lookup ai_department_sensitivity department as bunit_lc OUTPUT sensitivity_level as bunit_sl0 risk_multiplier as bunit_m0 \
	| lookup ai_department_sensitivity department as bunit_leaf OUTPUT sensitivity_level as bunit_sl1 risk_multiplier as bunit_m1 \
	| lookup ai_department_sensitivity department as bunit_top OUTPUT sensitivity_level as bunit_sl2 risk_multiplier as bunit_m2 \
	| eval bunit_multiplier=round(min(2.0,coalesce(tonumber(bunit_m0),tonumber(bunit_m1),tonumber(bunit_m2),1.0)),2), sensitivity_level=case(isnotnull(tonumber(bunit_m0)),bunit_sl0, isnotnull(tonumber(bunit_m1)),bunit_sl1, isnotnull(tonumber(bunit_m2)),bunit_sl2), severity_weight=coalesce(severity_weight,1.0), basis_weight=if(privilege_basis="builtin_admin",1.5,1.0), row_score=min(60, max(15, round(30*basis_weight*severity_weight*bunit_multiplier,0))) \
	| fields - bunit_lc bunit_leaf bunit_top bunit_sl0 bunit_sl1 bunit_sl2 bunit_m0 bunit_m1 bunit_m2 ambient \
	| eval privilege_reason=case(privilege_basis="builtin_admin", "built-in administrator account", privilege_basis="es_identity", "ES identity category ".coalesce(mvjoin(mvfilter(match(user_category,"^[A-Za-z0-9_]+$") AND NOT match(user_category,"(?i)^(default|normal|employee|contractor)$")),"/"),"privileged").if(isnotnull(user_priority),", priority ".mvjoin(user_priority,"/"),""), privilege_basis="service_account", "ES service account", true(), "admin account naming convention") \
	| stats values(provider) as provider dc(provider) as provider_count max(row_score) as row_score max(severity_weight) as severity_weight sum(request_count) as request_count sum(sso_count) as sso_count sum(total_bytes) as total_bytes values(evidence) as evidence values(ai_names) as ai_names values(usage_types) as usage_types values(src_list) as src_list min(firstTime) as firstTime max(lastTime) as lastTime first(privilege_basis) as privilege_basis first(privilege_reason) as privilege_reason first(user_group) as user_group values(user_category) as user_category values(user_priority) as user_priority values(user_bunit) as user_bunit first(sensitivity_level) as sensitivity_level first(bunit_multiplier) as bunit_multiplier first(basis_weight) as basis_weight by user \
	| eval risk_score=min(60, row_score+5*(provider_count-1)), provider_list=mvjoin(provider,", "), evidence_list=mvjoin(evidence,", "), usage_type_list=mvjoin(usage_types,", "), mb_out=round(coalesce(total_bytes,0)/1024/1024,2), ai_name_sample=mvjoin(mvindex(ai_names,0,4),", "), src_sample=coalesce(mvjoin(mvindex(src_list,0,2),", "),"n/a"), src=mvindex(src_list,0), user_category=mvindex(user_category,0,9) \
	| fields - total_bytes usage_types src_list ai_names \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="privileged_ai_usage", detection_id="hdsi_ai_privileged_account_service_usage", mitre_attack=mvappend("T1078","T1588.007"), ai_kill_chain_phase="collection" \
	| `hdsi_ai_privileged_account_service_usage_customizations` \
	| `hdsi_ai_privileged_account_service_usage_risk_score`

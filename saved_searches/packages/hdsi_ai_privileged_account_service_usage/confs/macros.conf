[hdsi_ai_privileged_account_service_usage_sso_app_name]
definition = if(match(lower(app),"(^|[^a-z0-9])(chatgpt|openai|claude|anthropic|perplexity|deepseek|midjourney|elevenlabs|windsurf|huggingface)([^a-z0-9]|$)"),replace(lower(app),"^(?:.*?[^a-z0-9])?(chatgpt|openai|claude|anthropic|perplexity|deepseek|midjourney|elevenlabs|windsurf|huggingface)(?:[^a-z0-9].*)?$","\\1"),replace(replace(replace(lower(trim(app)),"[:_-]+"," "),"\\s*\\([^)]*\\)\\s*$",""),"(\\s+(sso|saml|oidc|oauth|enterprise|edu|team|teams|business|for work|for enterprise|for business|workspace|platform|app|prod|production))+\\s*$",""))
description = v1.1 Eval expression that turns an IdP application label (Authentication.app) into an ai_provider_apps key. If the label contains a distinctive provider word as a separate token (chatgpt, openai, claude, anthropic, perplexity, deepseek, midjourney, elevenlabs, windsurf, huggingface), that word is the key, so custom labels with an organisation prefix or hyphens ("<org>-chatgpt-sso", "Corp ChatGPT Enterprise") resolve. Otherwise the label is lowercased, ":"/"_"/"-" become spaces, a trailing "(...)" is removed and trailing deployment words such as SSO, SAML, Enterprise, Edu, Team, Business or "for Work" are removed ("Mistral AI Enterprise" -> mistral ai). Add words here if your IdP labels AI apps differently.
disabled = False
iseval = 0

[hdsi_ai_privileged_account_service_usage_privileged_identity]
definition = isnotnull(mvfind(user_category_lc,"^(privileged|privileged_user|admin|admins|administrator|administrators|domain_admin|domain_admins|enterprise_admin|enterprise_admins|schema_admin|global_admin|tier0|tier_0)$"))
description = v1.1 Eval condition: the ES identity is an administrative account (service accounts are classified separately by ..._service_identity). user_category_lc is the lowercased, multivalue ES identity category. Matches whole category values only: category values in some tenants are job titles such as "administrative assistant", so substring tests like "admin" or "priv" flag thousands of ordinary staff. To also treat ES priority=critical as privileged (validation showed critical used for VIPs and executives, not admin accounts, on one tenant) append: OR user_priority="critical".
disabled = False
iseval = 0

[hdsi_ai_privileged_account_service_usage_service_identity]
definition = isnotnull(mvfind(user_category_lc,"^(service|service_account|service_accounts)$"))
description = v1.1 Eval condition: the ES identity category marks a service account. Checked after ..._privileged_identity, so an identity that is both admin and service stays es_identity. Service accounts get privilege_basis=service_account and the sanction group privileged_service, so sanctioned automation (an integration host calling an AI API) can be allowlisted for all service accounts at once with privileged_service|<provider> in ai_sanctioned_entities. Use false() to stop treating service accounts as privileged.
disabled = False
iseval = 0

[hdsi_ai_privileged_account_service_usage_privileged_name]
definition = match(user_bare,"^(adm|admin|priv)[-_.][a-z0-9]|[a-z0-9]{2,}[-_.](adm|admin|priv)[0-9]{0,2}$|[a-z0-9]{2,}[-_](da|ea)$") OR (match(user_bare,"^[a-z0-9]{2,}adm(in)?[0-9]{0,2}$") AND isnotnull(user_base_identity))
description = v1.1 Eval condition on user_bare (lowercased account name without DOMAIN\ prefix or @suffix): naming conventions for separate admin accounts. A separator form (adm-jdoe, admin_jdoe, jdoe-adm, jdoe.admin2, jdoe-da) is accepted on its own. A suffix without separator (jdoeadm, jdoeadmin1) is accepted only when the remaining name (jdoe) is itself an ES identity (user_base_identity), so personal accounts whose name happens to end in "adm" (a first name plus initials, such as a synthetic jsmithadm whose base jsmith is not an identity) are not mistaken for admin accounts. Used when the identity has no privileged ES category, because ES categories rarely mark admin accounts (one validation tenant had about 120 "...adm" accounts categorised as normal employees). Ambiguous short prefixes (pa-, sa-, da-) are left out because they also match division and department names. Use false() to rely on ES categories only.
disabled = False
iseval = 0

[hdsi_ai_privileged_account_service_usage_builtin_admin]
definition = match(user_bare,"^(administrator|administrateur|administrador|admin|root|globaladmin|global_admin|globaladministrator|domainadmin|domain_admin|enterpriseadmin|superadmin|superuser|sysadmin|adminuser|admin_user)$")
description = v1.1 Eval condition on user_bare (lowercased account name without DOMAIN\ prefix or @suffix): built-in or break-glass administrator accounts (Administrator, root, admin, globaladmin and similar). These count as privileged whatever ES says about them, including when the identity exists only in the ES built-in default account list, and they score 1.5 times the base (45 instead of 30) because AI use from a shared top-level admin account is the strongest signal this rule produces. Add tenant break-glass names here; use false() to switch the class off.
disabled = False
iseval = 0

[hdsi_ai_privileged_account_service_usage_privileged_users]
definition = eval user_lc=lower(trim(user)), user_bare=replace(replace(user_lc,"^[^\\\\]+\\\\",""),"@.*$","") | where user_bare!="" AND NOT user_lc IN ("unknown","-","n/a","none","null") AND NOT match(user_bare,"\\$$") | lookup identity_lookup_expanded identity as user_lc OUTPUT category as user_category priority as user_priority bunit as user_bunit | lookup identity_lookup_expanded identity as user_bare OUTPUTNEW category as user_category priority as user_priority bunit as user_bunit | eval user_base=if(match(user_bare,"^[a-z0-9]{2,}adm(in)?[0-9]{0,2}$"),replace(user_bare,"adm(in)?[0-9]{0,2}$",""),null()) | lookup identity_lookup_expanded identity as user_base OUTPUT identity as user_base_identity | eval user_category_lc=mvmap(user_category,lower(user_category)), es_default_only=if(isnotnull(mvfind(user_category_lc,"^default$")) AND coalesce(mvcount(mvfilter(NOT match(user_category_lc,"^(default|normal|privileged)$"))),0)=0,1,0), privilege_basis=case(`hdsi_ai_privileged_account_service_usage_builtin_admin`,"builtin_admin", es_default_only=1,null(), `hdsi_ai_privileged_account_service_usage_privileged_identity`,"es_identity", `hdsi_ai_privileged_account_service_usage_service_identity`,"service_account", `hdsi_ai_privileged_account_service_usage_privileged_name`,"account_naming") | where isnotnull(privilege_basis) | fields - es_default_only user_base user_base_identity
description = v1.1 Keeps only privileged accounts. Looks the account up in identity_lookup_expanded as given (lowercased) and then as the bare name (DOMAIN\ and @domain removed). Built-in administrator names (..._builtin_admin: Administrator, root, admin, globaladmin, ...) are always privileged. Other identities that exist only in the ES built-in default account list (category default/privileged with no directory data: anonymous, guest, public, test, cisco, oracle, adm and similar device or shared names) are then dropped. Computer accounts (names ending in $, which firewall User-ID can map to a host IP) are dropped first. The rest are privileged by ES admin category (..._privileged_identity), ES service-account category (..._service_identity) or, failing both, by naming convention (..._privileged_name). Outputs privilege_basis (builtin_admin, es_identity, service_account or account_naming), user_category, user_priority, user_bunit, user_bare.
disabled = False
iseval = 0

[hdsi_ai_privileged_account_service_usage_min_events]
definition = 3
description = v1.1 Minimum Web plus App-ID events for one account and provider in the hourly window (65 minutes) before network evidence counts. An SSO sign-in to a non-ambient AI application always counts. Measured in hourly buckets on Tenant A (24 h): deliberate OpenAI use by privileged accounts had a median of about 24 events per account-hour, while 1-2 event hours are typical of embedded widgets and prefetch. Derive a tenant value with the hourly SPL in the README Threshold section.
disabled = False
iseval = 0

[hdsi_ai_privileged_account_service_usage_ambient_providers]
definition = "Google Gemini","Microsoft Copilot","Microsoft 365 Copilot","Gemini for Workspace"
description = v1.1 Providers built into everyday suites (quoted, comma separated, provider strings from the common lookups; the last two only resolve when a tenant enables the opt-in common rows or uses the Copilot Studio App-IDs). Their App-ID, web traffic and IdP sign-ins appear whenever a user opens Gmail, Docs, Edge or Office, so for these providers an SSO sign-in alone never counts and Web plus App-ID evidence must reach ..._ambient_min_events. Evidence, hourly buckets on Tenant A (24 h): the google-gemini App-ID was seen for about 75,000 users a day; privileged accounts had about 200 Gemini account-hours across 51 accounts, with p50 1, p90 5 and max 21 events per account-hour. Use "__none__" to treat every provider alike.
disabled = False
iseval = 0

[hdsi_ai_privileged_account_service_usage_ambient_min_events]
definition = 25
description = v1.1 Minimum Web plus App-ID events in the hourly window (65 minutes) for one account and one of the ..._ambient_providers. Hourly buckets on Tenant A (24 h): privileged-account Gemini account-hours had p50 1, p90 5 and max 21 events, while deliberate OpenAI use had a median of about 24, so 25 sits above all measured ambient hours. SSO sign-ins to these providers do not count on their own.
disabled = False
iseval = 0

[hdsi_ai_privileged_account_service_usage_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after the final one-row-per-account aggregation (fields: user, provider (multivalue), provider_list, provider_count, privilege_basis (builtin_admin, es_identity, service_account or account_naming), privilege_reason, user_group, user_category, user_bunit, evidence_list, request_count, sso_count, mb_out, ai_name_sample, src_sample, usage_type_list, severity_weight, bunit_multiplier, basis_weight, row_score, risk_score). E.g. search NOT privilege_basis="account_naming". To drop one provider for some accounts, use ai_sanctioned_entities instead (it runs per provider before the aggregation). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_privileged_account_service_usage_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust or override risk_score (integer, at most 100) per tenant, e.g. eval risk_score=if(privilege_basis="es_identity",risk_score+10,risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_privileged_account_service_usage_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Web branch, applied inside the Web tstats where clause before aggregation. Use Web.* field names, e.g. NOT Web.user IN ("svc_proxyprobe"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_privileged_account_service_usage_traffic_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Network_Traffic (firewall App-ID with User-ID) branch, applied inside its tstats where clause. Use All_Traffic.* field names, e.g. NOT All_Traffic.src IN ("10.20.30.40"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_privileged_account_service_usage_sso_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Authentication (SSO sign-in to an AI app) branch, applied inside its tstats where clause. Use Authentication.* field names, e.g. NOT Authentication.app="OpenAI SSO". Ships empty.
disabled = False
iseval = 0


version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Privileged Account Service Usage
description: "Risk on a privileged account (built-in administrator such as Administrator, root or admin; ES identity category such as privileged, domain_admin or service; or an admin naming convention such as adm-jdoe or jdoe_admin) that used an AI service. Evidence comes from any of three CIM sources keyed on the account: proxy/SSE web logs (Web), firewall App-ID traffic with User-ID (Network_Traffic) and SSO sign-ins to non-suite AI applications (Authentication). Hourly, one risk event per account per day listing every provider seen, user risk only, no notable. Needs ES identities and at least one source that carries the account name."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
tags:
  - rba_only
  - identity
  - web
  - network
  - authentication
  - pan
  - okta
data_prereqs:
  datamodels:
    op: OR
    items:
    - "Web"
    - "Network_Traffic"
    - "Authentication"
  searches:
    op: AND
    items:
    - '| inputlookup identity_lookup_expanded | head 1'
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

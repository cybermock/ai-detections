[hdsi_ai_usage_following_data_access_spike_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the file-access branch (Endpoint.Filesystem), applied inside its tstats where clause before aggregation. Use datamodel field names, e.g. NOT Filesystem.user IN ("svc_backup*","svc_scan*") for backup, indexing, antivirus or migration accounts, or NOT Filesystem.dest="fileserver-dfs*" for a replication host. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_usage_following_data_access_spike_excluded_actions]
definition = "deleted","failure","failed","blocked","denied","acl_modified"
description = v1.1 Filesystem.action values that are not data access and are dropped before counting files. A deny list is used instead of an allow list because real feeds rarely use only the CIM values: Windows share and object auditing (5145/4663) arrives as action success, Microsoft 365 SharePoint/OneDrive file events as unknown. Add values that represent failures or permission changes in your feed.
disabled = False
iseval = 0

[hdsi_ai_usage_following_data_access_spike_excluded_sourcetypes]
definition = "audittrail"
description = v1.1 Sourcetypes in Endpoint.Filesystem that are not user file access. Ships as audittrail: Splunk's own audit trail of configuration and lookup file changes is mapped into Endpoint.Filesystem on some Splunk Cloud stacks and would otherwise count Splunk admin activity as data access.
disabled = False
iseval = 0

[hdsi_ai_usage_following_data_access_spike_excluded_paths]
definition = "*\\Windows\\*","*\\WinSxS\\*","*\\System32\\*","*\\SysWOW64\\*","*WinREAgent\\*","*\\Program Files\\*","*\\Program Files (x86)\\*","*\\ProgramData\\*","*\\AppData\\*","*\\Users\\Default\\*","*\\System Volume Information\\*","*\\$Recycle.Bin\\*","*\\ADMIN$\\*","*\\IPC$\\*","*\\SYSVOL\\*","*\\NETLOGON\\*","*\\DfsrPrivate\\*"
description = v1.1 Filesystem.file_path patterns dropped inside the file-branch tstats where clause before files are counted. Windows object and share auditing logs servicing, patching, software deployment, profile and replication activity as file access; on the validation tenant with per-file auditing about 90 percent of distinct files in 100-file user-hours were under these paths. Matching is case-insensitive. Remove a pattern only if your users keep real data under it.
disabled = False
iseval = 0

[hdsi_ai_usage_following_data_access_spike_excluded_extensions]
definition = "*.dll","*.exe","*.sys","*.drv","*.ocx","*.mui","*.mum","*.cat","*.cdf-ms","*.manifest","*.inf","*.inf_loc","*.pnf","*.msi","*.msp","*.cab","*.pdb","*.jar","*.war","*.class","*.tmp","*.temp","*.ini","*.lnk","*.pf","*.etl","*.job","*.customdestinations-ms","*.automaticdestinations-ms"
description = v1.1 Filesystem.file_name patterns (binary, installer, servicing, temporary and shell-metadata files) dropped inside the file-branch tstats where clause, so the count reflects documents and data rather than software installs or updates. Matching is case-insensitive. Add extensions your deployment or backup tooling touches in bulk.
disabled = False
iseval = 0

[hdsi_ai_usage_following_data_access_spike_min_files]
definition = 100
description = v1.1 Minimum distinct data files (Filesystem.file_path with an extension, after the excluded_paths and excluded_extensions macros) one user must touch in the hourly window to count as a data access spike. Snapshot from the tenant with per-file auditing, 24 h to 2026-10-09: 372 user-hours, 95th percentile 22 files, 99th about 140, maximum 249; 9 user-hours reached 100 (41 before OS and software paths were excluded). Re-derive it with the README files SPL. A user at 5x this value adds 10 to the base score.
disabled = False
iseval = 0

[hdsi_ai_usage_following_data_access_spike_min_upload_mb]
definition = 5
description = v1.1 Minimum MB (bytes_out) the same user must send to AI services in the hourly window, checked separately per upload source (firewall App-ID or proxy/SSE). Snapshot from the firewall App-ID tenant, 6 h on 2026-10-09, with the full App-ID set in ai_provider_apps (including the Claude and Anthropic API App-IDs): 113k user-hours, median 0.007 MB, 99th percentile 0.60 MB, 99.9th 2.8 MB, 71 user-hours (0.06 percent) at 5 MB or more. The distribution moves whenever ai_provider_apps rows are enabled or added, so re-derive it with the README upload SPL after lookup changes. A user at 10x this value adds 10 to the base score.
disabled = False
iseval = 0

[hdsi_ai_usage_following_data_access_spike_max_upload_srcs]
definition = 5
description = v1.1 Maximum distinct source addresses the user may upload to AI services from in the hourly window. More than this means a shared or generic account (kiosk, clinical workstation login, service identity reused on many hosts) rather than one person collecting data; in the first validation round the only correlated account uploaded from 31 addresses in 4 hours. Raise it if users roam across many VPN or VDI addresses.
disabled = False
iseval = 0

[hdsi_ai_usage_following_data_access_spike_app_ids]
definition = All_Traffic.app IN ("openai*","chatgpt*","claude*","anthropic*","google-gemini*","gemini*","github-copilot*","ms-office365-copilot*","ms-office65-copilot*","ms-copilot*","microsoft-copilot*","copilot*","deepseek*","perplexity*","mistral*","groq*","grok*","xai*","meta-ai*","qwen*","huggingface*","cursor*","windsurf*","codeium*","poe","phind","replicate*","runway*","suno*","murf*","deepgram*","leonardo*","ideogram*","midjourney*","elevenlabs*","z-ai*","baidu-yiyan*","vercel-v0*","sourcegraph-cody*","dify*","gamma","venice*","lovable*","casetext*","grammarly*","otter*","fireflies*","sapling*")
description = v1.1 Inline pre-filter of firewall App-ID values (Network_Traffic.app) that can belong to an AI service, so tstats only aggregates candidate sessions. It only narrows the search: a value counts only when ai_domains_filter resolves it through an enabled ai_provider_apps row (the common lookup carries the claude-*, anthropic-api-*, openai-*, google-gemini-*, deepseek-api and xai-grok App-IDs). When you enable or add an App-ID in ai_provider_apps, make sure a pattern here covers it. Matching is case-insensitive.
disabled = False
iseval = 0

[hdsi_ai_usage_following_data_access_spike_network_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the firewall App-ID branch (Network_Traffic), applied inside its tstats where clause. Use datamodel field names, e.g. NOT All_Traffic.src IN ("10.20.0.0/24") for a VDI or terminal-server range. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_usage_following_data_access_spike_web_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the proxy/SSE branch (Web), applied inside its tstats where clause. Use datamodel field names, e.g. NOT sourcetype IN ("aws:elb:accesslogs","ms:iis:auto") to skip inbound server logs that never carry user AI uploads and only slow the branch. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_usage_following_data_access_spike_usage_types]
definition = "web","api","cli","model_registry"
description = v1.1 ai_domains_filter usage_type values whose upload volume counts. IDE coding assistants (usage_type ide, e.g. GitHub Copilot, Cursor) are left out because they upload source context all day and would pair with any developer who opens many files. Add "ide" to include them.
disabled = False
iseval = 0

[hdsi_ai_usage_following_data_access_spike_excluded_providers]
definition = "Microsoft 365 Copilot"
description = v1.1 ai_domains_filter provider values whose uploads are not counted. Ships as Microsoft 365 Copilot (incl. Copilot Studio), which stays inside the tenant's own Microsoft 365 boundary and produces large background uploads through SSE. Use "__none__" to count every provider.
disabled = False
iseval = 0

[hdsi_ai_usage_following_data_access_spike_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after correlation and scoring (fields: user, src, upload_srcs, upload_src_count, provider, evidence, ai_mb, file_count, file_events, file_hosts, file_sample, first_file_time, last_file_time, last_upload_time, base_score, severity_weight, risk_multiplier, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_usage_following_data_access_spike_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. The SPL sets risk_score = base (40, +10 at 5x min_files, +10 at 10x min_upload_mb) x risk_multiplier (identity bunit sensitivity, privileged x1.25) x highest provider severity_weight, capped at 70. The only risk object is the user; src and upload_srcs are context. Override risk_score here (keep it 1-100). Ships as search *.
disabled = False
iseval = 0

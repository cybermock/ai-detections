[Endpoint - HDSI AI Usage Following Data Access Spike - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Usage Following Data Access Spike
action.correlationsearch.annotations = {"mitre_attack": ["T1039", "T1005", "T1567"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$risk_object$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View counted file access by $user$","search":"| tstats summariesonly=t allow_old_summaries=t count dc(Filesystem.file_path) as files values(Filesystem.file_path) as file_path values(Filesystem.action) as action min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Filesystem where Filesystem.user=\"*$user$*\" Filesystem.file_name=\"*.*\" NOT Filesystem.action IN (`hdsi_ai_usage_following_data_access_spike_excluded_actions`) NOT sourcetype IN (`hdsi_ai_usage_following_data_access_spike_excluded_sourcetypes`) NOT Filesystem.file_path IN (`hdsi_ai_usage_following_data_access_spike_excluded_paths`) NOT Filesystem.file_name IN (`hdsi_ai_usage_following_data_access_spike_excluded_extensions`) by Filesystem.user Filesystem.dest sourcetype | rename Filesystem.* as * | eval ukey=lower(replace(replace(trim(user),\"^.*\\x5c\",\"\"),\"@.*\",\"\")) | search ukey=\"$user$\" | eval file_sample=mvindex(file_path,0,19) | convert ctime(firstTime) ctime(lastTime) | sort - files | table firstTime, lastTime, user, dest, sourcetype, files, count, action, file_sample","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View firewall upload volume by application for $user$","search":"| tstats summariesonly=t allow_old_summaries=t count sum(All_Traffic.bytes_out) as bytes_out sum(All_Traffic.bytes_in) as bytes_in values(All_Traffic.dest) as dest values(All_Traffic.action) as action min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Traffic where All_Traffic.user=\"*$user$*\" All_Traffic.bytes_out>0 by All_Traffic.src All_Traffic.user All_Traffic.app | rename All_Traffic.* as * | eval ukey=lower(replace(replace(trim(user),\"^.*\\x5c\",\"\"),\"@.*\",\"\")) | search ukey=\"$user$\" | eval mb_out=round(bytes_out/1024/1024,2), mb_in=round(bytes_in/1024/1024,2) | convert ctime(firstTime) ctime(lastTime) | sort - mb_out | head 50 | table firstTime, lastTime, src, user, app, action, count, mb_out, mb_in, dest","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View related web activity for $user$","search":"| tstats summariesonly=t allow_old_summaries=t count sum(Web.bytes_out) as bytes_out sum(Web.bytes_in) as bytes_in values(Web.url) as url values(Web.http_method) as http_method values(Web.dest) as dest min(_time) as firstTime max(_time) as lastTime from datamodel=Web where Web.user=\"*$user$*\" (Web.url_domain=* OR Web.site=*) by Web.user Web.src Web.url_domain Web.site | rename Web.* as * | eval ukey=lower(replace(replace(trim(user),\"^.*\\x5c\",\"\"),\"@.*\",\"\")) | search ukey=\"$user$\" | eval url_domain=coalesce(url_domain,site), mb_out=round(bytes_out/1024/1024,2), mb_in=round(bytes_in/1024/1024,2) | convert ctime(firstTime) ctime(lastTime) | sort - mb_out | head 50 | table firstTime, lastTime, user, src, url_domain, count, mb_out, mb_in, http_method, dest, url","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = $user$ accessed $file_count$ distinct data files (on $file_hosts$) and uploaded $ai_mb$ MB to $provider$ (from $upload_srcs$) in the same hour.
action.notable.param.rule_title = HDSI AI Usage Following Data Access Spike ($user$)
action.notable.param.security_domain = endpoint
action.notable.param.severity = medium
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":40}]
action.risk.param._risk_message = $user$ accessed $file_count$ distinct data files (on $file_hosts$) and then uploaded $ai_mb$ MB to $provider$ from $upload_srcs$ ($evidence$) in the same hour.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 14400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 13 * * * *
description = v1.1.0 Correlates a user touching many distinct document and data files (file server or endpoint file auditing, OS and software paths excluded) with that same user uploading data to an AI service in the same hour. Risk on the user only, no notable.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t dc(Filesystem.file_path) as file_count count as file_events values(Filesystem.file_path) as file_paths values(Filesystem.dest) as file_hosts min(_time) as fs_first max(_time) as fs_last from datamodel=Endpoint.Filesystem where Filesystem.file_name="*.*" NOT Filesystem.action IN (`hdsi_ai_usage_following_data_access_spike_excluded_actions`) NOT sourcetype IN (`hdsi_ai_usage_following_data_access_spike_excluded_sourcetypes`) NOT Filesystem.file_path IN (`hdsi_ai_usage_following_data_access_spike_excluded_paths`) NOT Filesystem.file_name IN (`hdsi_ai_usage_following_data_access_spike_excluded_extensions`) `hdsi_ai_usage_following_data_access_spike_filter` by Filesystem.user \
	| rename Filesystem.* as * \
	| eval ukey=lower(trim(user)), ukey=replace(ukey,"^.*\x5c",""), ukey=replace(ukey,"@.*$","") \
	| where isnotnull(ukey) AND ukey!="" AND NOT match(ukey,"\$$") AND NOT ukey IN ("unknown","-","n/a","null","none","system","local service","network service","anonymous logon") \
	| stats dc(file_paths) as file_count sum(file_events) as file_events values(file_paths) as file_paths values(file_hosts) as file_hosts min(fs_first) as fs_first max(fs_last) as fs_last by ukey \
	| where file_count>=`hdsi_ai_usage_following_data_access_spike_min_files` \
	| eval file_sample=mvindex(file_paths,0,4), file_hosts=mvindex(file_hosts,0,4) \
	| fields - file_paths \
	| append maxtime=240 [| tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" sum(All_Traffic.bytes_out) as bytes_out max(_time) as ai_last from datamodel=Network_Traffic where All_Traffic.user=* All_Traffic.bytes_out>0 NOT All_Traffic.action="blocked" `hdsi_ai_usage_following_data_access_spike_app_ids` `hdsi_ai_usage_following_data_access_spike_network_filter` by All_Traffic.user All_Traffic.src All_Traffic.app | rename All_Traffic.* as * | eval ai_domain=app, ai_input_type="app", evidence="firewall App-ID" | `ai_domains_filter` | search usage_type IN (`hdsi_ai_usage_following_data_access_spike_usage_types`) NOT provider IN (`hdsi_ai_usage_following_data_access_spike_excluded_providers`) | eval ukey=lower(trim(user)), ukey=replace(ukey,"^.*\x5c",""), ukey=replace(ukey,"@.*$",""), src=if(isnull(src) OR match(lower(src),"^(unknown|-|n/a|null|none|0\.0\.0\.0|::|)$"),null(),src) | where isnotnull(ukey) AND ukey!="" AND NOT match(ukey,"\$$") AND NOT ukey IN ("unknown","-","n/a","null","none","system","local service","network service","anonymous logon") | lookup identity_lookup_expanded identity as ukey OUTPUTNEW bunit | eval bunit=mvindex(bunit,0) | `ai_unsanctioned_filter(ukey,src,provider)` | eval src=coalesce(src,"__nosrc__") | stats sum(bytes_out) as src_bytes max(ai_last) as ai_last values(provider) as providers max(severity_weight) as severity_weight by ukey evidence src | eval src=nullif(src,"__nosrc__") | sort 0 - src_bytes | stats sum(src_bytes) as ai_bytes max(ai_last) as ai_last values(providers) as providers values(src) as upload_srcs first(src) as top_src max(severity_weight) as severity_weight by ukey evidence | where ai_bytes>=`hdsi_ai_usage_following_data_access_spike_min_upload_mb`*1048576] \
	| append maxtime=240 [| tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" sum(Web.bytes_out) as bytes_out max(_time) as ai_last from datamodel=Web where (Web.url_domain=* OR Web.site=*) Web.bytes_out>0 NOT Web.action="blocked" NOT Web.user="unknown" `hdsi_ai_usage_following_data_access_spike_web_filter` by Web.user Web.src Web.url_domain Web.site | rename Web.* as * | eval ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))), ai_input_type=if(isnull(nullif(url_domain,"unknown")),"app","host"), evidence="web proxy" | `ai_domains_filter` | search usage_type IN (`hdsi_ai_usage_following_data_access_spike_usage_types`) NOT provider IN (`hdsi_ai_usage_following_data_access_spike_excluded_providers`) | eval ukey=lower(trim(user)), ukey=replace(ukey,"^.*\x5c",""), ukey=replace(ukey,"@.*$",""), src=if(isnull(src) OR match(lower(src),"^(unknown|-|n/a|null|none|0\.0\.0\.0|::|)$"),null(),src) | where isnotnull(ukey) AND ukey!="" AND NOT match(ukey,"\$$") AND NOT ukey IN ("unknown","-","n/a","null","none","system","local service","network service","anonymous logon") | lookup identity_lookup_expanded identity as ukey OUTPUTNEW bunit | eval bunit=mvindex(bunit,0) | `ai_unsanctioned_filter(ukey,src,provider)` | eval src=coalesce(src,"__nosrc__") | stats sum(bytes_out) as src_bytes max(ai_last) as ai_last values(provider) as providers max(severity_weight) as severity_weight by ukey evidence src | eval src=nullif(src,"__nosrc__") | sort 0 - src_bytes | stats sum(src_bytes) as ai_bytes max(ai_last) as ai_last values(providers) as providers values(src) as upload_srcs first(src) as top_src max(severity_weight) as severity_weight by ukey evidence | where ai_bytes>=`hdsi_ai_usage_following_data_access_spike_min_upload_mb`*1048576] \
	| sort 0 - ai_bytes \
	| stats max(file_count) as file_count max(file_events) as file_events values(file_sample) as file_sample values(file_hosts) as file_hosts min(fs_first) as fs_first max(fs_last) as fs_last max(ai_bytes) as ai_bytes max(ai_last) as ai_last values(providers) as providers values(upload_srcs) as upload_srcs first(top_src) as src values(evidence) as evidence max(severity_weight) as severity_weight by ukey \
	| where isnotnull(file_count) AND isnotnull(ai_bytes) AND fs_first<=ai_last \
	| eval user=ukey, ai_mb=round(ai_bytes/1048576,1), severity_weight=coalesce(tonumber(severity_weight),1.0), upload_src_count=coalesce(mvcount(upload_srcs),0), upload_srcs=coalesce(mvjoin(mvindex(upload_srcs,0,4),", "),"none logged") \
	| where upload_src_count<=`hdsi_ai_usage_following_data_access_spike_max_upload_srcs` \
	| eval base_score=40+if(file_count>=5*`hdsi_ai_usage_following_data_access_spike_min_files`,10,0)+if(ai_mb>=10*`hdsi_ai_usage_following_data_access_spike_min_upload_mb`,10,0) \
	| `ai_risk_multiplier` \
	| eval risk_score=min(70,round(base_score*coalesce(risk_multiplier,1)*severity_weight,0)) \
	| eval provider=mvjoin(providers,", "), evidence=mvjoin(evidence," + "), file_hosts=coalesce(mvjoin(file_hosts,", "),"host not logged"), first_file_time=strftime(fs_first,"%Y-%m-%d %H:%M:%S"), last_file_time=strftime(fs_last,"%Y-%m-%d %H:%M:%S"), last_upload_time=strftime(ai_last,"%Y-%m-%d %H:%M:%S") \
	| fields user src upload_srcs upload_src_count provider evidence ai_mb file_count file_events file_hosts file_sample first_file_time last_file_time last_upload_time base_score severity_weight risk_multiplier sensitivity_level risk_score \
	| fields - _final_multiplier \
	| eval ai_activity="data_access_ai_correlation", detection_id="hdsi_ai_usage_following_data_access_spike", mitre_attack="T1039,T1005,T1567", ai_kill_chain_phase="collection" \
	| `hdsi_ai_usage_following_data_access_spike_customizations` \
	| `hdsi_ai_usage_following_data_access_spike_risk_score`

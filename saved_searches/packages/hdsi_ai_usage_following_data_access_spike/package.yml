version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Usage Following Data Access Spike
description: "Correlates one user touching many distinct document and data files (file-share or endpoint file auditing in Endpoint.Filesystem, with OS, software and servicing paths excluded) with the same user uploading data to an AI service (firewall App-ID or proxy/SSE) in the same hour. Joined on a normalised user name. Risk on the user only, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - endpoint
  - filesystem
  - network
  - pan
  - web
  - data_exfiltration
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Endpoint.Filesystem"
  searches:
    op: AND
    items:
    - '| tstats summariesonly=true allow_old_summaries=true count from datamodel=Endpoint.Filesystem where earliest=-4h Filesystem.user=* Filesystem.file_name="*.*" NOT sourcetype="audittrail" NOT Filesystem.file_path IN ("*\\Windows\\*","*\\Program Files*","*\\ProgramData\\*","*\\AppData\\*") NOT Filesystem.file_name IN ("*.dll","*.exe","*.tmp","*.temp") | where count > 0'
    - '| tstats summariesonly=true allow_old_summaries=true count from datamodel=Network_Traffic where earliest=-4h All_Traffic.user=* All_Traffic.bytes_out>0 | append [| tstats summariesonly=true allow_old_summaries=true count from datamodel=Web where earliest=-4h Web.user=* NOT Web.user="unknown" Web.bytes_out>0] | stats sum(count) as count | where count > 0'
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

action.notable.param.drilldown_searches = [{"name":"View AI risk events behind the chain for $entity$","search":"| from datamodel:\"Risk.All_Risk\" | search detection_id=\"hdsi_ai_*\" | eval entity_key=if(risk_object_type=\"user\", lower(replace(replace(risk_object,\"^.*\\x5c\",\"\"),\"@.*\",\"\")), lower(risk_object)) | search entity_key=\"$entity$\" | table _time, search_name, detection_id, ai_kill_chain_phase, risk_object, risk_object_type, risk_score, risk_message | sort 0 _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"Summarize AI risk composition for $entity$","search":"| from datamodel:\"Risk.All_Risk\" | search detection_id=\"hdsi_ai_*\" | eval entity_key=if(risk_object_type=\"user\", lower(replace(replace(risk_object,\"^.*\\x5c\",\"\"),\"@.*\",\"\")), lower(risk_object)) | search entity_key=\"$entity$\" | stats count as risk_events sum(risk_score) as total_risk min(_time) as firstTime max(_time) as lastTime values(risk_object) as risk_objects by search_name ai_kill_chain_phase | convert ctime(firstTime) ctime(lastTime) | sort 0 firstTime","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = The $entity_type$ $entity$ had $collection_signals$ AI data-collection detection(s) followed within the correlation window by $exfil_signals$ AI upload/exfiltration detection(s), first collection $first_collection_time$, first chained upload $first_chained_exfil_time$, $total_risk$ AI risk points. Detections: $detections$.
action.notable.param.rule_title = AI Kill Chain - Data Collection to AI Upload ($entity$)
action.notable.param.security_domain = threat

action.risk.param._risk_message = AI data collection kill chain for $entity$: $collection_signals$ collection detection(s) followed by $exfil_signals$ AI upload detection(s) within $gap_minutes$ minutes. Detections: $detections$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = entity_type,entity
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 35 * * * *
description = v1.1.0 Correlates HDSI AI risk events: a data-collection detection (clipboard-to-AI, file-access spike, AI capture extension) followed within a configurable window by an AI upload or exfiltration detection for the same user, or host when no user is attributed. Notable only, no risk.
disabled = 0
dispatch.earliest_time = -24h@m
dispatch.latest_time = now
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = index=risk risk_object_type IN (`hdsi_rba_ai_data_collection_kill_chain_risk_object_types`) (detection_id IN (`hdsi_rba_ai_data_collection_kill_chain_collection_detections`) OR detection_id IN (`hdsi_rba_ai_data_collection_kill_chain_exfil_detections`)) NOT risk_object IN ("unknown","-","n/a","null","none") `hdsi_rba_ai_data_collection_kill_chain_filter` \
	| eval entity_type=risk_object_type, entity_key=`hdsi_rba_ai_data_collection_kill_chain_entity_key(risk_object, risk_object_type)`, user_lc=lower(mvindex(user,0)) \
	| where isnotnull(entity_key) AND entity_key!="" AND NOT entity_key IN ("unknown","-","n/a","null","none") \
	| where entity_type="user" OR isnull(user_lc) OR user_lc IN ("","unknown","-","n/a","null","none") \
	| eval kc_phase=if(in(detection_id, `hdsi_rba_ai_data_collection_kill_chain_collection_detections`),"collection","exfiltration"), coll_time=if(kc_phase="collection",_time,null()), order_time=if(kc_phase="collection",_time-60*`hdsi_rba_ai_data_collection_kill_chain_order_tolerance_minutes`,_time) \
	| sort 0 entity_type entity_key order_time \
	| streamstats last(coll_time) as prev_coll_time by entity_type entity_key \
	| eval chain_gap=if(kc_phase="exfiltration" AND isnotnull(prev_coll_time), _time-prev_coll_time, null()), chained=if(isnotnull(chain_gap) AND chain_gap<=3600*`hdsi_rba_ai_data_collection_kill_chain_window_hours`,1,0), chained_exfil_time=if(chained=1,_time,null()), chained_gap=if(chained=1,chain_gap,null()), coll_id=if(kc_phase="collection",detection_id,null()), exfil_id=if(chained=1,detection_id,null()), coll_name=if(kc_phase="collection",search_name,null()), exfil_name=if(chained=1,search_name,null()) \
	| stats count as risk_events sum(risk_score) as total_risk sum(chained) as chained_exfil_events dc(coll_id) as collection_signals dc(exfil_id) as exfil_signals values(coll_name) as collection_detections values(exfil_name) as exfil_detections values(detection_id) as detection_ids values(risk_object) as risk_objects values(provider) as providers min(coll_time) as first_collection_time min(chained_exfil_time) as first_chained_exfil_time min(chained_gap) as min_gap_seconds min(_time) as firstTime max(_time) as lastTime by entity_type entity_key \
	| where chained_exfil_events>=1 AND collection_signals>=1 AND exfil_signals>=1 \
	| eval entity=entity_key, user=if(entity_type="user",entity_key,null()), src=if(entity_type="system",entity_key,null()), kill_chain_phases=collection_signals+exfil_signals, gap_minutes=round(min_gap_seconds/60,0), detections=mvappend(collection_detections,exfil_detections), total_risk=round(total_risk,0), detection_id="hdsi_rba_ai_data_collection_kill_chain", ai_activity="collection_to_ai_upload_chain", ai_kill_chain_phase="exfiltration", mitre_attack=split("T1005,T1115,T1567",",") \
	| convert ctime(firstTime) ctime(lastTime) ctime(first_collection_time) ctime(first_chained_exfil_time) \
	| fields - entity_key min_gap_seconds \
	| `hdsi_rba_ai_data_collection_kill_chain_customizations`

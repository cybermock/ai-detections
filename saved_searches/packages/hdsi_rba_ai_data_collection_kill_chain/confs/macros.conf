[hdsi_rba_ai_data_collection_kill_chain_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the index=risk base search before correlation. Use risk event field names, e.g. NOT risk_object IN ("svc_backup*") or NOT search_name="*Browser Extension Activity*". Ships empty.
disabled = False
iseval = 0

[hdsi_rba_ai_data_collection_kill_chain_collection_detections]
definition = "hdsi_ai_copy_paste_correlation_to_ai_service","hdsi_ai_usage_following_data_access_spike","hdsi_ai_browser_extension_activity"
description = v1.1 detection_id values (written into every HDSI AI risk event) that count as the data-collection phase: clipboard copy from a business app pasted into AI, a file-access spike followed by AI use, and AI capture/page-reader browser extensions. Quoted and comma separated; used by both the base search IN() and eval in(). Keep disjoint from the exfiltration list.
disabled = False
iseval = 0

[hdsi_rba_ai_data_collection_kill_chain_exfil_detections]
definition = "hdsi_ai_high_volume_upload_to_ai_service","hdsi_ai_gradual_data_exfiltration_via_ai","hdsi_ai_dlp_violation_on_service_upload","hdsi_ai_sanctioned_dlp_violation","hdsi_ai_browser_extension_high_volume_data_transmission","hdsi_ai_personal_email_to_ai_service_upload_correlation","hdsi_ai_suspicious_model_file_exfiltration"
description = v1.1 detection_id values that count as the AI upload/exfiltration phase. Only detections with byte-volume, DLP-match or publish evidence are listed; time-of-day, after-hours and z-score usage anomalies are excluded on purpose because they do not prove data left. Keep disjoint from the collection list.
disabled = False
iseval = 0

[hdsi_rba_ai_data_collection_kill_chain_risk_object_types]
definition = "user","system"
description = v1.1 Risk object types correlated. System risk events are used only when the contributing row had no attributed user, so one activity never produces both a user and a host notable. Set to "user" for user-only chains.
disabled = False
iseval = 0

[hdsi_rba_ai_data_collection_kill_chain_window_hours]
definition = 4
description = v1.1 Maximum hours between the most recent collection signal and an AI upload signal for the same entity. The search reads 24 hours of risk, so values above 23 have no effect.
disabled = False
iseval = 0

[hdsi_rba_ai_data_collection_kill_chain_order_tolerance_minutes]
definition = 60
description = v1.1 Minutes a collection risk event may be timestamped after the upload event and still count as preceding it. Covers hourly contributor windows that bucket the same activity into different risk event times. Set to 0 to require strict collection-before-upload order.
disabled = False
iseval = 0

[hdsi_rba_ai_data_collection_kill_chain_entity_key(2)]
args = object, object_type
definition = if($object_type$="user", lower(replace(replace($object$,"^.*\x5c",""),"@.*","")), lower($object$))
description = v1.1 Correlation key. User risk objects arrive as DOMAIN\user, user@domain and bare user from different contributors (ES does not normalise them), so users are keyed on the lower-case bare account name; systems are keyed on the lower-case value. Replace with lower($object$) if bare names collide across domains.
disabled = False
iseval = 0

[hdsi_rba_ai_data_collection_kill_chain_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after correlation (fields: entity, entity_type, user, src, collection_signals, exfil_signals, chained_exfil_events, total_risk, gap_minutes, providers, detection_ids). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the DNS path, inline in the Network_Resolution tstats where clause (DNS.* field names), e.g. NOT DNS.src IN ("10.1.1.10","10.1.1.11") for resolvers, forwarders, proxies or NAT egress addresses, or NOT DNS.src IN ("10.20.30.*") for DHCP, Wi-Fi, VPN or VDI pools whose addresses move between people within days. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_dns_src_scope]
definition = (NOT DNS.src="192.168.*")
description = v1.1 Inline DNS.src scope for the DNS path (in the Network_Resolution tstats where clause). Ships excluding 192.168.0.0/16: on the two validation tenants with roaming DNS-security clients, 17% and 32% of the AI DNS clients were 192.168 addresses, i.e. the client's address on a home or hotel LAN, which many unrelated people share (one such address had 6 different users in a day). On a tenant whose own LAN uses 192.168 ranges, replace it with the home-LAN subnets only, or with () to keep every source.
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_web_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Web path, inline in the Web tstats where clause (Web.* field names), e.g. NOT Web.user IN ("svc_*") or NOT sourcetype IN ("aws:elb:accesslogs","aws:waf","ms:iis:*") for inbound server logs. To switch the Web path off on a tenant whose Web model holds no user egress (and save its scan), set it to (Web.user="__web_path_disabled__"). Ships empty.
disabled = False
iseval = 0


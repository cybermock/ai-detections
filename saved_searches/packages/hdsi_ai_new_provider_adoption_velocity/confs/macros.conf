description = v1.1 Inline tstats pre-filter for the Web path: name* and www.name* for every enabled ai_provider_domains row and name* for the same 51 recurring subdomains as _dns_names, in Web.url_domain or Web.site (the trailing wildcard tolerates a logged :port), the same regional cloud AI prefixes, plus the enabled ai_provider_apps names in Web.site for SSE/CASB products that log an app name instead of a host. Prefix-only patterns keep the scan cheap on Web models with users; on a Web model full of inbound load balancer/WAF events the scan is still the most expensive part of the search (see Cost in the README), so switch the Web path off there with _web_filter. Regenerate it with the SPL in the README when lookup rows are added.
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_window_days]
definition = 7
description = v1.1 Velocity window in whole days: a provider is new for an entity when its first touch (any DNS query or web event) falls inside the last N complete days. The rest of the dispatch window (default -21d@d, so 14 days) is the baseline. If you change it, keep dispatch.earliest_time at least _window_days + _min_baseline_days days back.
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_min_baseline_days]
definition = 7
description = v1.1 Minimum days of usable data required before the velocity window, checked per path (DNS and Web separately). A path's first covered day is the earliest day on which it saw at least 10% of the entities of its busiest day; if that day is later than _window_days + this value days ago, the path is dropped. This fails closed when a data model is accelerated for only about a week (one validation tenant: 7 days, with a trickle of older summaries), instead of reporting every provider as new.
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_min_new_providers]
definition = 3
description = v1.1 Distinct new providers an entity must adopt inside the velocity window before it is reported. 3 matches the original intent (3+ new providers in 7 days). On the validation tenant with the richest DNS data, among hosts whose latest adoption fell in the 2-day report window, 171 had 1 new provider, 38 had 2 and 9 had 3 or more, so 2 would have reported about 5 times as many hosts (47 instead of 9), mostly hosts adding Gemini or Copilot next to one real service.
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_report_days]
definition = 2
description = v1.1 An entity is reported when its latest adoption (the day it reached _min_new_providers) falls within the last N complete days. 2 lets the next daily run catch up an entity when one scheduled run is skipped. Suppression is 72 h on user,src,new_providers, so the overlapping second day does not report the same burst twice, while a burst that grows (a 4th or 5th provider) is reported again with its higher score. Set to 1 to report only yesterday.
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_host_burst_days]
definition = 1
description = v1.1 DNS (host) rows only: a new provider counts toward a host's velocity only if it became active within N days of the host's latest adoption (1 = the same day). A DNS client address is not a person: on the validation tenant with the most host rows, DHCP, Wi-Fi and VPN addresses carried 3 to 9 different users a week but usually 1 to 2 a day, so counting the whole 7-day window added several people's adoptions together. With 1, the 3 host rows of one run were each used by a single identity on the burst day; with 2, 2 of 5 rows mixed 2 to 5 identities; with 7, 15 rows. Users (Web rows) are not affected. Raise it only where DNS client addresses are static (fixed desktop IPs, resolver logs that name the host).
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_min_dns_queries]
definition = 10
description = v1.1 Minimum DNS queries per host per provider per day to its non-background names before the provider counts as actively used on that day. Browser and OS prefetch of gemini.google.com, chatgpt.com or copilot.com produces a few lookups a day without use; the sibling DNS rule measured a prefetch median of 2 and an active-user median of about 36 for chatgpt.com. Runtime API names (_api_names) have their own, lower bar (_min_api_queries).
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_min_web_events]
definition = 3
description = v1.1 Minimum Web events per user per provider per day before a provider counts as actively used on that day. SSE/CASB app-name matches and runtime API hosts (_api_names) count from 1 event, because a logged proxy request to them already is an application session or an API call (unlike a DNS lookup, which can be a background check).
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_api_names]
definition = (in(usage_type,"api","local_llm","model_registry","cli") AND coalesce(ai_traffic_class,"interactive")!="site" AND NOT match(ai_domain,"^(ollama\\.com|lmstudio\\.ai|huggingface\\.co|hf\\.co|modelscope\\.cn|kaggle\\.com|civitai\\.com|aider\\.chat|openrouter\\.ai|moonshot\\.(cn|ai)|bigmodel\\.cn)$")) OR match(ai_domain,"^(api|proxy)\\.(business|enterprise|individual)\\.githubcopilot\\.com$|^(api[2-4]|api2direct)\\.cursor\\.sh$|^agentn\\.([a-z]+\\.)?api5\\.cursor\\.sh$")
description = v1.1 Eval condition on the normalised ai_domain, usage_type and ai_traffic_class for runtime API, CLI, model-registry and local-LLM names. On a day they reach _min_api_queries DNS queries (or 1 Web event) the provider counts as actively used, and a new provider used this way earns the +5 API bonus. Provider websites are excluded, so they need the ordinary _min_dns_queries / _min_web_events bar and never earn the API bonus: rows the common lookup marks traffic_class=site (ollama.com, lmstudio.ai, aider.chat) and browsed api/model_registry rows (huggingface.co, hf.co, modelscope.cn, kaggle.com, civitai.com, openrouter.ai, moonshot, bigmodel.cn). The plan-specific GitHub Copilot runtime hosts (api. and proxy.business|enterprise|individual.githubcopilot.com) and the Cursor model back ends (api2-4, api2direct, agentn api5 .cursor.sh) are runtime names here although their parent rows are ide.
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_min_api_queries]
definition = 3
description = v1.1 Minimum DNS queries per host per day to a provider's runtime API names (_api_names) before the provider counts as actively used through an API on that day. One or two lookups a day are background checks: on one validation tenant api.githubcopilot.com and copilot-proxy had 1 or 2 queries a day on 870 hosts and Anthropic API names on 375 hosts. On that tenant, the 3-query bar together with excluding provider websites from _api_names cut the hosts reaching 3 new providers in the 21-day window from 31 to 15, and the hosts reported by one run from 14 to 9. Set to 1 to count any lookup.
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_background_names]
definition = coalesce(ai_traffic_class,"")="background" OR match(ai_domain,"^gemini\\.gstatic\\.com$|^oaistatic\\.com$|telemetry|static|(^|[.-])(r2)?cdn[0-9]*[.-]|^metrics\\.|^(exp|exp-tas|origin-tracker)\\.([a-z]+\\.)?githubcopilot\\.com$|^marketplace\\.cursorapi\\.com$|^ms-sso\\.|^(count|edge|comet-safebrowsing)\\.perplexity\\.ai$|(^|\\.)auth\\.openai\\.com$")
description = v1.1 Eval condition for names that software resolves or loads without a person using the service: every row the common lookup marks traffic_class=background (ab.chatgpt.com, bzr/bzrcdn.openai.com, auth.openai.com, downloads.claude.ai, Copilot telemetry, gemini.gstatic.com and others), plus static, CDN, telemetry and metrics hosts, the GitHub Copilot experiment and origin-tracker hosts, the Cursor extension marketplace, Copilot SSO and the Perplexity browser beacons. They count as a baseline touch, so a provider that was only touched this way before is not new, but they never make a provider active. Use false() to count everything.
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_shared_src_providers]
definition = 15
description = v1.1 Shared-source guard for the DNS path: a DNS client that touched at least this many distinct AI providers in the dispatch window is treated as a resolver, forwarder, proxy or NAT egress, and is dropped (every adoption by anyone behind it would look like velocity on one host). Derive a tenant value with the SPL in the README.
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_needs_baseline]
definition = entity_type="system"
description = v1.1 Eval condition for entities that must have touched at least one AI provider before the velocity window to be reported. Ships for hosts only: a DNS src with no earlier AI activity is usually a DHCP lease or roaming address that changed, not a new adopter. Set to true() to require an earlier AI footprint for users too (only established AI users expanding their toolset), or false() for neither.
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_excluded_providers]
definition = "Microsoft 365 Copilot","Microsoft Security Copilot"
description = v1.1 Providers removed before counting (quoted, comma separated ai_provider_domains/ai_provider_apps provider names). Ships with the tenant-bound, licensed Microsoft 365 Copilot (Copilot Studio, Copilot for Finance) and Microsoft Security Copilot. Add providers the organisation rolls out to everyone (e.g. "GitHub Copilot" during a licence rollout, or "OpenAI" with ChatGPT Enterprise) so their adoption does not count as velocity. Use "__none__" to keep every provider.
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after the per-entity aggregation (fields: entity, entity_type, user, src, path, new_providers, provider, provider_list, org_new_provider_list, api_provider_list, baseline_providers, usage_type_list, ai_domain_sample, ai_domain_count, event_count, first_adoption, latest_adoption, bunit). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_new_provider_adoption_velocity_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust or override risk_score (integer, at most 100) per tenant. Each row carries exactly one risk object (user for the Web path, src for the DNS path), so risk_score never spills onto a second object. Ships as search *.
disabled = False
iseval = 0

action.notable.param.drilldown_searches = [{"name":"View associated risk events for $entity$","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$entity$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI DNS names resolved by $entity$ per day","search":"| tstats summariesonly=t allow_old_summaries=t count from datamodel=Network_Resolution where DNS.src=\"$entity$\" `hdsi_ai_new_provider_adoption_velocity_dns_names` by DNS.src DNS.query _time span=1d | rename DNS.* as * | eval ai_domain=query, ai_input_type=\"dns\" | `ai_domains_filter` | stats sum(count) as count dc(_time) as days min(_time) as firstTime max(_time) as lastTime values(ai_domain) as ai_domains by src provider usage_type | convert timeformat=\"%Y-%m-%d\" ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, days, src, provider, usage_type, count, ai_domains | sort firstTime","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI web activity of $entity$ per day","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count from datamodel=Web where Web.user=\"$entity$\" `hdsi_ai_new_provider_adoption_velocity_web_scope` by sourcetype Web.user Web.url_domain Web.site _time span=1d | rename Web.* as * | eval url_domain=coalesce(nullif(url_domain,\"unknown\"),nullif(site,\"unknown\")), ai_domain=lower(url_domain), ai_input_type=if(site=url_domain,\"app\",\"host\") | `ai_domains_filter` | stats sum(count) as count dc(_time) as days min(_time) as firstTime max(_time) as lastTime values(url_domain) as url_domain values(sourcetype) as sourcetype by user provider usage_type | convert timeformat=\"%Y-%m-%d\" ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, days, user, provider, usage_type, count, url_domain, sourcetype | sort firstTime","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = $entity$ ($entity_type$) started using $new_providers$ AI providers in the last $window_days$ days that it had not touched in the preceding baseline: $provider_list$. Used through an API, CLI or model runtime: $api_provider_list$. New to the whole organisation: $org_new_provider_list$.
action.notable.param.rule_title = HDSI AI New Provider Adoption Velocity ($entity$)
action.notable.param.security_domain = network
action.notable.param.severity = low
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":25},{"risk_object_field":"src","risk_object_type":"system","risk_score":15}]
action.risk.param._risk_message = $entity$ started using $new_providers$ AI providers in $window_days$ days that it had not used before ($provider_list$); latest adopted on $latest_adoption$, used through an API or runtime: $api_provider_list$, new to the organisation: $org_new_provider_list$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user,src,new_providers
alert.suppress.period = 259200s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 45 2 * * *
description = v1.1.0 Daily risk on a user (Web data) or host (DNS data) that started using at least 3 AI providers it had not touched in the 14 days before: within the last 7 days for a user, on a single day for a host (a DNS client address is not a stable person). Providers are resolved through the common ai_domains_filter, including recurring service subdomains and regional Bedrock, SageMaker and Vertex AI endpoints; prefetch, background and one-off API lookups never make a provider active; resolvers, shared DNS clients and home-LAN (192.168) addresses are dropped; a path with less than 7 days of baseline data fails closed. Reports an entity on the run after it reaches the threshold (a skipped run is caught up the next day, a growing burst is reported again). Risk only, no notable.
disabled = 0
dispatch.earliest_time = -21d@d
dispatch.latest_time = @d
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t count from datamodel=Network_Resolution where `hdsi_ai_new_provider_adoption_velocity_dns_names` NOT DNS.src IN ("unknown","-","0.0.0.0","127.0.0.1","::1") `hdsi_ai_new_provider_adoption_velocity_dns_src_scope` `hdsi_ai_new_provider_adoption_velocity_filter` by _time span=1d DNS.src DNS.query DNS.message_type \
	| rename DNS.* as * \
	| stats max(count) as count by _time src query \
	| eval ai_domain=query, ai_input_type="dns" \
	| `ai_domains_filter` \
	| eval entity=lower(src), entity_type="system", path="dns", severity_weight=tonumber(severity_weight), is_background=if(`hdsi_ai_new_provider_adoption_velocity_background_names`,1,0), evidence=if(is_background=1,0,count), api_evidence=if(is_background=0 AND (`hdsi_ai_new_provider_adoption_velocity_api_names`),count,0) \
	| stats sum(count) as count sum(evidence) as evidence sum(api_evidence) as api_evidence values(ai_domain) as ai_domains values(usage_type) as usage_type max(severity_weight) as severity_weight by _time entity entity_type path provider \
	| eval api_active=if(api_evidence>=`hdsi_ai_new_provider_adoption_velocity_min_api_queries`,1,0), active=if(api_active=1 OR evidence>=`hdsi_ai_new_provider_adoption_velocity_min_dns_queries`,1,0) \
	| eventstats dc(entity) as day_entities by _time \
	| eventstats max(day_entities) as max_day_entities \
	| eval coverage_day=if(day_entities>=0.1*max_day_entities,_time,null()) \
	| eventstats min(coverage_day) as path_first_day \
	| stats max(path_first_day) as path_first_day min(_time) as first_touch min(eval(if(active=1,_time,null()))) as first_active dc(eval(if(active=1,_time,null()))) as active_days max(api_active) as api_active sum(count) as event_count values(ai_domains) as ai_domains values(usage_type) as usage_type max(severity_weight) as severity_weight by entity entity_type path provider \
	| append maxtime=900 maxout=50000 [| tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count from datamodel=Web where `hdsi_ai_new_provider_adoption_velocity_web_scope` `hdsi_ai_new_provider_adoption_velocity_web_filter` by _time span=1d Web.user Web.url_domain Web.site \
		| rename Web.* as * \
		| eval user=if(match(lower(user),"^(unknown|-|n/a|null|none|anonymous|system|)$") OR match(user,"^\d{1,3}(\.\d{1,3}){3}$"),null(),user) \
		| where isnotnull(user) \
		| eval ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))), ai_input_type=if(isnull(nullif(url_domain,"unknown")),"app","host") \
		| `ai_domains_filter` \
		| eval entity=lower(user), entity_type="user", path="web", severity_weight=tonumber(severity_weight), is_background=if(`hdsi_ai_new_provider_adoption_velocity_background_names`,1,0), evidence=if(is_background=1,0,count), api_evidence=if(is_background=0 AND (`hdsi_ai_new_provider_adoption_velocity_api_names`),count,0), app_session=if(is_background=0 AND ai_match="app_name",1,0) \
		| stats sum(count) as count sum(evidence) as evidence sum(api_evidence) as api_evidence max(app_session) as app_session values(ai_domain) as ai_domains values(usage_type) as usage_type max(severity_weight) as severity_weight by _time entity entity_type path provider \
		| eval api_active=if(api_evidence>=1,1,0), active=if(api_active=1 OR app_session=1 OR evidence>=`hdsi_ai_new_provider_adoption_velocity_min_web_events`,1,0) \
		| eventstats dc(entity) as day_entities by _time \
		| eventstats max(day_entities) as max_day_entities \
		| eval coverage_day=if(day_entities>=0.1*max_day_entities,_time,null()) \
		| eventstats min(coverage_day) as path_first_day \
		| stats max(path_first_day) as path_first_day min(_time) as first_touch min(eval(if(active=1,_time,null()))) as first_active dc(eval(if(active=1,_time,null()))) as active_days max(api_active) as api_active sum(count) as event_count values(ai_domains) as ai_domains values(usage_type) as usage_type max(severity_weight) as severity_weight by entity entity_type path provider] \
	| where NOT provider IN (`hdsi_ai_new_provider_adoption_velocity_excluded_providers`) \
	| eval win_start=relative_time(now(),"-".tostring(`hdsi_ai_new_provider_adoption_velocity_window_days`)."d@d") \
	| where path_first_day<=relative_time(now(),"-".tostring(`hdsi_ai_new_provider_adoption_velocity_window_days`+`hdsi_ai_new_provider_adoption_velocity_min_baseline_days`)."d@d") \
	| eval baseline_provider=if(first_touch<win_start,provider,null()) \
	| eventstats dc(provider) as touched_providers dc(baseline_provider) as baseline_providers min(first_touch) as entity_first_touch by entity entity_type \
	| where NOT (entity_type="system" AND touched_providers>=`hdsi_ai_new_provider_adoption_velocity_shared_src_providers`) \
	| eventstats min(first_touch) as org_first_touch by provider \
	| where first_touch>=win_start AND isnotnull(first_active) \
	| where NOT ((`hdsi_ai_new_provider_adoption_velocity_needs_baseline`) AND entity_first_touch>=win_start) \
	| eval org_new=if(org_first_touch>=win_start,1,0), user=if(entity_type="user",entity,null()), src=if(entity_type="system",entity,null()) \
	| lookup asset_lookup_by_str ip as src OUTPUT bunit as src_bunit \
	| lookup asset_lookup_by_str dns as src OUTPUTNEW bunit as src_bunit \
	| lookup identity_lookup_expanded identity as user OUTPUT bunit as user_bunit \
	| eval bunit=lower(mvindex(coalesce(user_bunit,src_bunit),0)), bunit=if(bunit="unknown" OR bunit="",null(),bunit) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| eventstats max(first_active) as entity_latest_active by entity entity_type \
	| where entity_type!="system" OR first_active>=entity_latest_active-86400*`hdsi_ai_new_provider_adoption_velocity_host_burst_days`+7200 \
	| stats dc(provider) as new_providers values(provider) as providers values(eval(if(org_new=1,provider,null()))) as org_new_providers values(eval(if(api_active=1,provider,null()))) as api_providers min(first_active) as first_adoption max(first_active) as latest_adoption values(usage_type) as usage_types values(ai_domains) as ai_domains sum(event_count) as event_count max(baseline_providers) as baseline_providers values(bunit) as bunit by entity entity_type path \
	| where new_providers>=`hdsi_ai_new_provider_adoption_velocity_min_new_providers` AND latest_adoption>=relative_time(now(),"-".tostring(`hdsi_ai_new_provider_adoption_velocity_report_days`)."d@d") \
	| eval user=if(entity_type="user",entity,null()), src=if(entity_type="system",entity,null()) \
	| `ai_risk_multiplier` \
	| eval risk_multiplier=if(entity_type="user",coalesce(risk_multiplier,1.0),1.0), has_api=if(coalesce(mvcount(api_providers),0)>0,1,0), org_new_count=coalesce(mvcount(org_new_providers),0) \
	| eval base_score=if(entity_type="user",25,15)+5*min(3,new_providers-`hdsi_ai_new_provider_adoption_velocity_min_new_providers`)+if(org_new_count>0,5,0)+if(has_api=1,5,0), risk_score=round(min(if(entity_type="user",60,40),base_score*risk_multiplier),0) \
	| eval provider=providers, provider_list=mvjoin(providers,", "), org_new_provider_list=if(org_new_count>0,mvjoin(org_new_providers,", "),"none"), api_provider_list=if(has_api=1,mvjoin(api_providers,", "),"none"), usage_type_list=mvjoin(usage_types,", "), ai_domain_count=mvcount(ai_domains), ai_domain_sample=mvjoin(mvindex(ai_domains,0,7),", "), window_days=`hdsi_ai_new_provider_adoption_velocity_window_days` \
	| fields - providers org_new_providers api_providers usage_types ai_domains sensitivity_level _final_multiplier \
	| convert timeformat="%Y-%m-%d" ctime(first_adoption) ctime(latest_adoption) \
	| eval ai_activity="provider_adoption_velocity", detection_id="hdsi_ai_new_provider_adoption_velocity", mitre_attack="T1588.007", ai_kill_chain_phase="recon" \
	| `hdsi_ai_new_provider_adoption_velocity_customizations` \
	| `hdsi_ai_new_provider_adoption_velocity_risk_score`

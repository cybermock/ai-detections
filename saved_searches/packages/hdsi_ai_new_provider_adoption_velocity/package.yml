version: 1.1.0
creation_date: '2026-03-04'
package_title: AI New Provider Adoption Velocity
description: "Daily risk on a user (Web data) or a host (DNS data) that started using at least 3 AI providers it had not touched in the 14 days before: within the last 7 days for a user, on a single day for a host, because a DNS client address can pass between people. Providers are resolved through the common ai_provider_domains and ai_provider_apps lookups; prefetch and background lookups never count as use; resolvers, other shared DNS clients and home-LAN addresses are dropped; a data path with less than 7 days of baseline fails closed. Needs at least 21 days of accelerated Network_Resolution and/or Web data. Risk only, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - dns
  - web
  - proxy
  - network
data_prereqs:
  datamodels:
    op: OR
    items:
    - "Network_Resolution"
    - "Web"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

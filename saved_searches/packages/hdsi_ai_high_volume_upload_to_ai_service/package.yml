version: 1.1.0
creation_date: '2026-03-04'
package_title: AI High Volume Upload To AI Service
description: "Detects a host or user uploading a high volume of data to AI services in one hour (tiers 50/100/500/2000 MB by default), measured from firewall App-ID sessions (Network_Traffic) or proxy/SSE logs with byte counts (Web). IDE coding assistants are excluded by default. Tiered risk on src and user, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - data_exfiltration
  - network
  - pan
  - web
  - proxy
data_prereqs:
  datamodels:
    op: OR
    items:
    - "Network_Traffic"
    - "Web"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

search = | tstats summariesonly=t allow_old_summaries=t sum(All_Traffic.bytes_out) as bytes_out sum(All_Traffic.bytes_in) as bytes_in count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Traffic where All_Traffic.bytes_out>0 NOT All_Traffic.action="blocked" `hdsi_ai_high_volume_upload_to_ai_service_app_ids` `hdsi_ai_high_volume_upload_to_ai_service_filter` by All_Traffic.src All_Traffic.user All_Traffic.app \
	| rename All_Traffic.* as * \
	| eval ai_domain=app, ai_input_type="app", evidence="firewall App-ID" \
	| `ai_domains_filter` \
	| append maxtime=240 [| tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" sum(Web.bytes_out) as bytes_out sum(Web.bytes_in) as bytes_in count min(_time) as firstTime max(_time) as lastTime from datamodel=Web where (Web.url_domain=* OR Web.site=*) Web.bytes_out>0 NOT Web.action="blocked" `hdsi_ai_high_volume_upload_to_ai_service_web_filter` by Web.src Web.user Web.url_domain Web.site | rename Web.* as * | eval ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))), ai_input_type=if(isnull(nullif(url_domain,"unknown")),"app","host"), evidence="web proxy" | `ai_domains_filter`] \
	| search usage_type IN (`hdsi_ai_high_volume_upload_to_ai_service_usage_types`) NOT provider IN (`hdsi_ai_high_volume_upload_to_ai_service_excluded_providers`) \
	| eval user=if(isnull(user) OR match(lower(user),"^(unknown|-|n/a|null|none|)$"),null(),lower(user)), src=if(isnull(src) OR match(lower(src),"^(unknown|-|n/a|null|none|0\.0\.0\.0|::|)$"),null(),src), severity_weight=coalesce(tonumber(severity_weight),1.0) \
	| where isnotnull(src) \
	| lookup identity_lookup_expanded identity as user OUTPUTNEW bunit \
	| eval bunit=mvindex(bunit,0) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| eval user=coalesce(user,"__none__") \
	| stats sum(bytes_out) as bytes_out sum(bytes_in) as bytes_in sum(count) as session_count values(provider) as providers values(ai_domain) as ai_endpoints max(severity_weight) as severity_weight min(firstTime) as firstTime max(lastTime) as lastTime by src user evidence \
	| eventstats sum(bytes_out) as src_ev_out sum(bytes_in) as src_ev_in sum(session_count) as src_ev_sessions by src evidence \
	| eventstats max(bytes_out) as user_out max(session_count) as user_sessions by src user \
	| eval user_out=if(user="__none__",0,user_out) \
	| eventstats max(user_out) as top_user_out by src \
	| eval top_user=if(user!="__none__" AND user_out=top_user_out,user,null()), top_user_sessions=if(user!="__none__" AND user_out=top_user_out,user_sessions,null()), attributed_user=if(user="__none__",null(),user) \
	| stats max(src_ev_out) as bytes_out max(src_ev_in) as bytes_in max(src_ev_sessions) as session_count values(top_user) as top_user max(top_user_out) as top_user_out max(top_user_sessions) as user_sessions dc(attributed_user) as attributed_users values(providers) as providers values(ai_endpoints) as ai_endpoints values(evidence) as evidence max(severity_weight) as severity_weight min(firstTime) as firstTime max(lastTime) as lastTime by src \
	| eval bytes_out_mb=round(bytes_out/1048576,1), bytes_in_mb=round(bytes_in/1048576,1), user_out_mb=round(top_user_out/1048576,1) \
	| where bytes_out_mb>=`hdsi_ai_high_volume_upload_to_ai_service_low_mb` \
	| eval top_user=mvindex(top_user,0), user_withheld=if(isnotnull(top_user) AND user_out_mb>=`hdsi_ai_high_volume_upload_to_ai_service_low_mb` AND user_sessions>`hdsi_ai_high_volume_upload_to_ai_service_max_user_sessions`,1,0), user=if(user_out_mb>=`hdsi_ai_high_volume_upload_to_ai_service_low_mb` AND user_withheld=0,top_user,null()) \
	| eval upload_tier=case(bytes_out_mb>=`hdsi_ai_high_volume_upload_to_ai_service_critical_mb`,"critical", bytes_out_mb>=`hdsi_ai_high_volume_upload_to_ai_service_high_mb`,"high", bytes_out_mb>=`hdsi_ai_high_volume_upload_to_ai_service_medium_mb`,"medium", true(),"low"), base_score=case(upload_tier="critical",60, upload_tier="high",45, upload_tier="medium",30, true(),20) \
	| `ai_risk_multiplier` \
	| eval risk_score=min(80,round(base_score*coalesce(risk_multiplier,1)*severity_weight,0)) \
	| eval provider=mvjoin(providers,", "), ai_endpoint_sample=mvjoin(mvindex(ai_endpoints,0,4),", "), evidence=mvjoin(evidence," + "), user_display=case(user_withheld=1, top_user." not scored: ".user_sessions." sessions under one login, likely a shared server", isnotnull(user) AND attributed_users>1, user." (".user_out_mb." MB; ".attributed_users." users on this src)", isnotnull(user), user, attributed_users>0, attributed_users." user(s), none above threshold", true(), "no user attribution") \
	| fields - providers ai_endpoints bytes_out bytes_in top_user top_user_out user_withheld \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="upload_burst", detection_id="hdsi_ai_high_volume_upload_to_ai_service", mitre_attack="T1567", ai_kill_chain_phase="exfiltration" \
	| `hdsi_ai_high_volume_upload_to_ai_service_customizations` \
	| `hdsi_ai_high_volume_upload_to_ai_service_risk_score`

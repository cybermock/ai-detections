[hdsi_ai_high_volume_upload_to_ai_service_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Network_Traffic (firewall App-ID) branch, applied inside its tstats where clause before aggregation. Use datamodel field names (All_Traffic.*; sourcetype and index take no prefix), e.g. NOT All_Traffic.src IN ("10.20.0.0/24") for a NAT pool, VDI subnet or approved AI integration server whose upload volume is expected. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_high_volume_upload_to_ai_service_app_ids]
definition = All_Traffic.app IN ("openai*","chatgpt*","claude*","anthropic*","google-gemini*","gemini*","github-copilot*","ms-office365-copilot*","ms-office65-copilot*","ms-copilot*","microsoft-copilot*","copilot*","deepseek*","perplexity*","mistral*","groq*","grok*","xai*","meta-ai*","qwen*","huggingface*","cursor*","windsurf*","codeium*","poe","phind","replicate*","runway*","suno*","murf*","deepgram*","leonardo*","ideogram*","midjourney*","elevenlabs*","z-ai*","baidu-yiyan*","vercel-v0*","sourcegraph-cody*","dify*","gamma","venice*","lovable*","casetext*","grammarly*")
description = v1.1 Inline pre-filter of firewall App-ID values (Network_Traffic.app) that can belong to an AI service, so tstats only aggregates candidate sessions. It only narrows the search: a value is counted only when ai_domains_filter resolves it through an enabled ai_provider_apps row. When you enable or add an App-ID in ai_provider_apps, make sure a pattern here covers it. Matching is case-insensitive. App-IDs that contain a dot (e.g. otter.ai-base) are left out: ai_domains_filter treats them as hostnames and cannot resolve them through ai_provider_apps.
disabled = False
iseval = 0

[hdsi_ai_high_volume_upload_to_ai_service_web_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Web (proxy/SSE) branch, applied inside its tstats where clause before aggregation. Use Web.* names for Web fields, e.g. NOT Web.src IN ("10.20.0.0/24"). sourcetype is an inherited field and takes no Web. prefix: exclude inbound server logs with NOT sourcetype IN ("aws:elb:accesslogs","aws:waf","ms:iis:auto") (Web.sourcetype matches nothing in tstats, so NOT Web.sourcetype=... silently excludes nothing). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_high_volume_upload_to_ai_service_usage_types]
definition = "web","api","cli","model_registry"
description = v1.1 ai_domains_filter usage_type values that count toward upload volume. IDE coding assistants (usage_type ide, e.g. GitHub Copilot, Cursor) are left out because they upload source context all day by design; hdsi_ai_code_assistant_network_connection covers them. Add "ide" to measure them too.
disabled = False
iseval = 0

[hdsi_ai_high_volume_upload_to_ai_service_excluded_providers]
definition = "Microsoft 365 Copilot"
description = v1.1 ai_domains_filter provider values whose upload volume is not counted. Ships as Microsoft 365 Copilot (incl. Copilot Studio), which stays inside the organisation's own Microsoft 365 boundary and in validation produced one 55-67 MB connection a day for most users of the SSE app name, with almost no response data. Use "__none__" to count every provider.
disabled = False
iseval = 0

[hdsi_ai_high_volume_upload_to_ai_service_low_mb]
definition = 50
description = v1.1 Minimum MB uploaded (bytes_out) to AI services by one src in the hourly window to raise risk (tier low, base 20); an attributed user also receives risk only when that user alone uploaded at least this much. Measured over 24 h on the largest validation tenant: 7,093 source-hours at 1 MB or more, 78 at 25 MB, 36 at 50 MB (99.99th percentile 26 MB). Derive it with the README SPL.
disabled = False
iseval = 0

[hdsi_ai_high_volume_upload_to_ai_service_medium_mb]
definition = 100
description = v1.1 MB uploaded to AI services in the hourly window for tier medium (base 30). Must be greater than the low threshold.
disabled = False
iseval = 0

[hdsi_ai_high_volume_upload_to_ai_service_high_mb]
definition = 500
description = v1.1 MB uploaded to AI services in the hourly window for tier high (base 45). Must be greater than the medium threshold.
disabled = False
iseval = 0

[hdsi_ai_high_volume_upload_to_ai_service_critical_mb]
definition = 2000
description = v1.1 MB uploaded to AI services in the hourly window for tier critical (base 60). Must be greater than the high threshold.
disabled = False
iseval = 0

[hdsi_ai_high_volume_upload_to_ai_service_max_user_sessions]
definition = 1000
description = v1.1 Most AI sessions the top attributed user on a src may have in the window and still receive user risk. Above it the user is named in user_display but not scored, because one login carrying that many sessions is a terminal, VDI or proxy server mapped to a single User-ID. Measured over 24 h on the largest validation tenant: per-user hourly sessions p99 16, p99.9 36; 12 user-hours from 5 sources exceeded 1000 (max about 4,700).
disabled = False
iseval = 0

[hdsi_ai_high_volume_upload_to_ai_service_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation and scoring (fields: src, user, user_display, user_out_mb, user_sessions, attributed_users, provider, ai_endpoint_sample, evidence, bytes_out_mb, bytes_in_mb, session_count, upload_tier, base_score, severity_weight, risk_multiplier, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_high_volume_upload_to_ai_service_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. The SPL sets risk_score = tier base (20/30/45/60) x risk_multiplier (identity bunit sensitivity, privileged x1.25) x highest provider severity_weight, capped at 80, for both src and user. Override risk_score here (keep it 1-100). Ships as search *.
disabled = False
iseval = 0

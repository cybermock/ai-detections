version: 1.1.0
creation_date: '2026-03-04'
package_title: AI MCP Server Execution
description: "Detects Model Context Protocol (MCP) servers running on endpoints from Endpoint.Processes: MCP server binaries, official MCP SDK and server packages, AI client and Docker mcp subcommands, and mcp packages, images or scripts in package position for npx/uvx/node/python/docker runners (other processes never match on arguments). Configuration-only commands and IDE-extension-hosted servers score lower and extension auto-registration is ignored. MCP servers give AI agents tool access to local files, databases, source control and SaaS data. Risk only on user and system, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - process
  - endpoint
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Endpoint.Processes"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

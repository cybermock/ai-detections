[hdsi_ai_mcp_server_execution_launcher_regex]
definition = "^(node|npx|npm|pnpm|yarn|bunx?|deno|tsx|uvx?|pipx|py|pythonw?[0-9.]*|docker|podman)(\.exe|\.cmd)?$"
description = v1.1 Regex (quoted, lowercase process_name) for the package runners and interpreters that host stdio MCP servers (npx/node, uvx/uv/python, pipx, deno, bun, docker/podman). Apart from MCP server binaries and AI-client "mcp" subcommands, a row counts only when one of these processes carries an mcp token in a package position: a scoped package (@playwright/mcp, @modelcontextprotocol/server-x, also under node_modules), the package argument of a runner (npx -y context7-mcp, uvx mcp-server-git), python -m *mcp*, the image of docker run after its options (mcp/fetch; --network/--name/-v values are skipped), or a .js/.ts/.py script under an *-mcp/mcp-* folder or file (test files and node_modules tooling below it are skipped). java -jar / dotnet count only for a *mcp-server*/*mcpserver* .jar or .dll. Any other process (browser, git, shell, IDE, archive tool, installer) never matches, whatever its arguments. Do not add a shell here.
disabled = False
iseval = 0

[hdsi_ai_mcp_server_execution_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the tstats where clause before aggregation. Use Endpoint.Processes field names, e.g. NOT Processes.dest IN ("build-*") or NOT Processes.process_name="approved-mcp-server.exe". Ships empty.
disabled = False
iseval = 0

[hdsi_ai_mcp_server_execution_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation (fields: user, src, bunit, mcp_activity, mcp_servers, mcp_types, mcp_roles, launchers, parent_process_name, mcp_commands (credential-redacted), executions, is_exec, data_access, base_score, risk_multiplier). Use it to drop sanctioned MCP servers, e.g. search NOT mcp_servers="*approved-internal-mcp*"; search is_exec=1 to drop configuration-only rows; or search mcp_activity!="MCP server started by an IDE extension" to drop GitLens-style extension-hosted servers. Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_mcp_server_execution_risk_score]
definition = search *
description = v1.1 Risk score hook, last pipe. The search sets risk_score = min(60, base_score x risk_multiplier). base_score is the highest per-event base in the row: 40 for a user-run data-access MCP server (filesystem, database, source control, SaaS, browser, infrastructure, Docker MCP gateway), 30 for any other user-run server, 15 for an MCP server started by an IDE extension (gk mcp --source=gitlens) and 15 for configuration-only commands (claude mcp add). risk_score overrides the static _risk scores (user 30, system 20) for both objects. Override or cap it here. Ships as search *.
disabled = False
iseval = 0

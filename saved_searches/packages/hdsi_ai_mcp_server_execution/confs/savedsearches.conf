description = v1.1.0 Detects Model Context Protocol (MCP) servers running on endpoints: MCP server binaries, official MCP SDK/server packages (@modelcontextprotocol, fastmcp, mcp-server-*, mcp-remote/proxy), AI client and Docker "mcp" subcommands, and mcp packages, images or scripts in package position for npx/uvx/node/python/docker runners (other processes never match on arguments). Configuration-only commands and IDE-extension-hosted servers score lower; extension-driven auto-registration is ignored. MCP servers give AI agents tool access to files, databases, source control and SaaS data. Risk only on user and system, no notable.
disabled = 0
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0

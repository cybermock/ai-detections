[hdsi_ai_local_llm_listening_port_detected_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the Endpoint.Ports tstats where clause before aggregation. Use Ports datamodel field names or host, e.g. NOT host IN ("lab-gpu-*"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_local_llm_listening_port_detected_ports]
definition = 11434,1234,1337,4891
description = v1.1 Default API ports that are specific to a local LLM server (Ollama 11434, LM Studio 1234, Jan 1337, GPT4All 4891). A listener on these ports is accepted when its own process ID resolves to a Local LLM entry in ai_tool_processes, or, only when no source reports any PID for that host+port (netstat), when a local LLM process ran on the same host. Port-only matches are not trusted: security agents bind these loopback ports too.
disabled = False
iseval = 0

[hdsi_ai_local_llm_listening_port_detected_generic_ports]
definition = 5001,8000,8080
description = v1.1 Ports shared with ordinary web applications that local LLM servers also use by default (KoboldCpp 5001, vLLM 8000, llama.cpp server/LocalAI/Open WebUI 8080). Gradio 7860 (text-generation-webui) was dropped: that server runs as python and cannot be attributed. A listener on these ports is accepted only when its own process ID resolves to a Local LLM process. Host-level corroboration is not enough.
disabled = False
iseval = 0

[hdsi_ai_local_llm_listening_port_detected_process_names]
definition = "ollama*","lm studio*","lmstudio*","llama-*","llamafile*","jan","jan.exe","gpt4all*","koboldcpp*","localai","local-ai","vllm","open-webui*","mlx_lm*","text-generation-launcher","chat.exe"
description = v1.1 Pre-filter for the Endpoint.Processes tstats that attributes a listener to a local LLM process. Matches are then resolved through ai_process_filter and kept only where ai_tool_processes says provider="Local LLM". lms/lms.exe are excluded in the search because Intel Local Management Service uses LMS.exe. chat.exe (GPT4All on Windows) is a generic name, so it is used for process-ID attribution only, never host attribution.
disabled = False
iseval = 0

[hdsi_ai_local_llm_listening_port_detected_process_lookback]
definition = -7d@h
description = v1.1 How far back the Endpoint.Processes lookup searches for the local LLM process that owns a listener. A server that has been running longer than this, and is seen only by a periodic netstat-style snapshot (no PID), is not attributed.
disabled = False
iseval = 0

[hdsi_ai_local_llm_listening_port_detected_corroboration]
definition = where isnotnull(llm_process)
description = v1.1 Requires every listener to be attributed to a Local LLM process (llm_process). Relax this only for hosts with no process telemetry, for example: where isnotnull(llm_process) OR (dest_port="11434" AND NOT match(bind_addr,"^127\.")).
disabled = False
iseval = 0

[hdsi_ai_local_llm_listening_port_detected_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation (fields: dest, user, llm_tool, llm_process, ports, bind_addrs, exposure, exposure_label, network_exposed, attribution, listen_events). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_local_llm_listening_port_detected_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. risk_score is 50 for a listener reachable from the network, otherwise 30 (loopback-only or bind address not reported). It applies to the single system risk object. Ships as search *.
disabled = False
iseval = 0

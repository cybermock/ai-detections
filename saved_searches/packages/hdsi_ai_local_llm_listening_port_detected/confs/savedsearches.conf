action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$dest$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View local LLM port listeners on $dest$","search":"| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime values(Ports.process_id) as process_id values(sourcetype) as sourcetype from datamodel=Endpoint.Ports where (host=\"$dest$\" OR host=\"$dest$.*\") Ports.dest_port IN (`hdsi_ai_local_llm_listening_port_detected_ports`,`hdsi_ai_local_llm_listening_port_detected_generic_ports`) by host Ports.dest Ports.dest_port Ports.transport Ports.state | rename Ports.dest as bind_addr, Ports.* as * | convert ctime(firstTime) ctime(lastTime) | sort - lastTime","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View local LLM processes on $dest$ (7 days)","search":"| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime values(Processes.process) as process values(Processes.parent_process_name) as parent_process_name from datamodel=Endpoint.Processes where earliest=-7d@h (Processes.dest=\"$dest$\" OR Processes.dest=\"$dest$.*\") Processes.process_name IN (`hdsi_ai_local_llm_listening_port_detected_process_names`) by Processes.dest Processes.user Processes.process_name Processes.process_id | rename Processes.* as * | convert ctime(firstTime) ctime(lastTime) | sort - lastTime","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]

alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 27 * * * *
description = v1.1.0 Detects a local LLM server (Ollama, LM Studio, Jan, GPT4All, llama.cpp server, KoboldCpp, LocalAI, vLLM when reported under its own process name) listening on its API port, attributed to the owning process from Endpoint.Processes (by process ID; by host only for dedicated ports with no PID reported). Scores higher when the listener is reachable from the network. Risk on the host only, no notable.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime values(Ports.process_id) as port_pid values(sourcetype) as port_sourcetype from datamodel=Endpoint.Ports where Ports.dest_port IN (`hdsi_ai_local_llm_listening_port_detected_ports`,`hdsi_ai_local_llm_listening_port_detected_generic_ports`) Ports.transport IN ("tcp","tcp6") NOT Ports.state IN ("established","time-wait","close-wait","syn-sent","syn-recv","fin-wait-1","fin-wait-2","last-ack","closing") `hdsi_ai_local_llm_listening_port_detected_filter` by host Ports.dest Ports.dest_port \
	| rename Ports.dest as bind_addr, Ports.dest_port as dest_port \
	| eval row_type="port", endpoint=if(match(bind_addr,"^[A-Za-z][A-Za-z0-9-]*(\.[A-Za-z0-9-]+)*$") AND NOT match(lower(bind_addr),"^(localhost|unknown)$"),bind_addr,host) \
	| append [| tstats summariesonly=t allow_old_summaries=t count as proc_events values(Processes.user) as proc_user from datamodel=Endpoint.Processes where earliest=`hdsi_ai_local_llm_listening_port_detected_process_lookback` Processes.process_name IN (`hdsi_ai_local_llm_listening_port_detected_process_names`) by Processes.dest Processes.process_id Processes.process_name | eval process_name_lc=lower('Processes.process_name') | `ai_process_filter` | where provider="Local LLM" AND NOT process_name_lc IN ("lms","lms.exe") | eval row_type="process", endpoint='Processes.dest', port_pid='Processes.process_id', llm_proc_name=process_name_lc | fields row_type endpoint port_pid llm_proc_name proc_user proc_events] \
	| eval endpoint=lower(endpoint), endpoint=if(match(endpoint,"^\d{1,3}(\.\d{1,3}){3}$"),endpoint,replace(endpoint,"\..*$","")), port_pid=coalesce(port_pid,"none") \
	| mvexpand port_pid \
	| eval port_pid=if(match(port_pid,"^0x[0-9A-Fa-f]+$"),tostring(tonumber(substr(port_pid,3),16)),port_pid) \
	| eval known_pid=if(row_type="port" AND port_pid!="none",port_pid,null()), host_proc_name=if(llm_proc_name="chat.exe",null(),llm_proc_name) \
	| eventstats values(llm_proc_name) as pid_llm_process by endpoint port_pid \
	| eventstats values(host_proc_name) as host_llm_process values(proc_user) as host_llm_user by endpoint \
	| eventstats dc(known_pid) as listener_pids by endpoint dest_port \
	| where row_type="port" \
	| eval is_generic_port=if(in(tonumber(dest_port),`hdsi_ai_local_llm_listening_port_detected_generic_ports`),1,0), llm_process=case(port_pid!="none" AND isnotnull(pid_llm_process),pid_llm_process, port_pid="none" AND listener_pids=0 AND is_generic_port=0,host_llm_process), attribution=case(port_pid!="none" AND isnotnull(pid_llm_process),"process_id", isnotnull(llm_process),"host") \
	| `hdsi_ai_local_llm_listening_port_detected_corroboration` \
	| eval exposure=case(isnull(bind_addr) OR bind_addr="" OR bind_addr="unknown","unknown", match(lower(bind_addr),"^(127\.|::1$|\[::1\]|\[::ffff:127\.|localhost$)"),"loopback", true(),"network") \
	| stats sum(count) as listen_events min(firstTime) as firstTime max(lastTime) as lastTime values(dest_port) as ports values(bind_addr) as bind_addrs values(exposure) as exposure values(llm_process) as llm_process values(attribution) as attribution values(host_llm_user) as proc_user values(port_sourcetype) as port_sourcetype by endpoint \
	| rename endpoint as dest \
	| lookup ai_tool_processes process_name_lc as llm_process OUTPUT tool as llm_tool \
	| eval proc_user=mvfilter(NOT match(lower(proc_user),"(^(unknown|-|n/a|local service|network service)$|system$)")), user=mvindex(proc_user,0), provider="Local LLM", network_exposed=if(isnotnull(mvfind(exposure,"^network$")),1,0), exposure_label=case(network_exposed=1,"reachable from the network", isnotnull(mvfind(exposure,"^unknown$")),"bind address not reported (exposure unknown)", true(),"bound to loopback only"), llm_tool=mvjoin(mvdedup(mvmap(llm_tool,if(llm_tool="chat","gpt4all",llm_tool))),", "), llm_process=mvjoin(llm_process,", "), ports=mvjoin(ports,", "), bind_addrs=mvjoin(bind_addrs,", ") \
	| `ai_unsanctioned_filter(user,dest,provider)` \
	| eval risk_score=if(network_exposed=1,50,30), ai_activity="local_llm_server_listening", detection_id="hdsi_ai_local_llm_listening_port_detected", mitre_attack="T1588.007", ai_kill_chain_phase="staging" \
	| `hdsi_ai_local_llm_listening_port_detected_customizations` \
	| `hdsi_ai_local_llm_listening_port_detected_risk_score`

version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Local LLM Listening Port Detected
description: "Detects a local LLM server (Ollama 11434, LM Studio 1234, Jan 1337, GPT4All 4891, and KoboldCpp, llama.cpp server, LocalAI or vLLM on 5001/8000/8080) listening on its API port. Listeners come from Endpoint.Ports and are kept only when Endpoint.Processes attributes them to a Local LLM process: by the listener process ID, or by host only on the dedicated ports when no source reports a PID. Scores higher when the listener is reachable from the network. Risk on the host only, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_process_filter
  - macros:ai_unsanctioned_filter(3)
tags:
  - rba_only
  - endpoint
  - process
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Endpoint.Ports"
    - "Endpoint.Processes"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

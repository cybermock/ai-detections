version: 1.1.0
creation_date: '2026-03-04'
package_title: AI After Hours Service Usage
description: "Hourly. Detects identified users with repeated (default 50+ allowed foreground requests over 2+ ten-minute periods) or upload-heavy (default 5+ MB) AI web use outside business hours (default before 06:00, from 20:00 and weekends). Blocked requests never count; DOMAIN\\ is stripped from the user. Silent until the business-hours UTC offset macro is set, hence adhoc. Needs proxy/SSE Web data with user and action. Contextual risk on the user only (one request and one upload event per user per day), no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - web
  - proxy
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Web"
deployment_type: adhoc
prereq_packages:
  - hdsi_ai_rba_common

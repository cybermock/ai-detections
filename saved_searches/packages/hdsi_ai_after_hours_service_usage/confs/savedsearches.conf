[Network - HDSI AI After Hours Service Usage - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI After Hours Service Usage
action.correlationsearch.annotations = {"mitre_attack": ["T1567"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$user$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI web activity by $user$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count sum(Web.bytes_out) as bytes_out values(Web.url) as url values(Web.action) as action values(Web.http_user_agent) as http_user_agent min(_time) as firstTime max(_time) as lastTime from datamodel=Web where (Web.url_domain=* OR Web.site=*) Web.user=\"$drilldown_user$\" by Web.user Web.src Web.url_domain Web.site | rename Web.* as * | eval ai_domain=lower(coalesce(nullif(url_domain,\"unknown\"),nullif(site,\"unknown\"))), ai_input_type=if(isnull(nullif(url_domain,\"unknown\")),\"app\",\"host\"), url_domain=coalesce(nullif(url_domain,\"unknown\"),site) | `ai_domains_filter` | eval mb_out=round(bytes_out/1024/1024,2), url=mvindex(url,0,9) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, provider, url_domain, usage_type, count, mb_out, action, http_user_agent, url | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = $user$ used AI services after hours ($after_hours_reason$, $local_start$ to $local_end$ $local_tz$, $signal_type$): $request_count$ allowed web requests over $active_buckets$ ten-minute periods ($total_requests$ allowed including background, $blocked_requests$ blocked not counted, action $action$) and $mb_out$ MB sent to $provider_list$ from $src$.
action.notable.param.rule_title = HDSI AI After Hours Service Usage ($user$)
action.notable.param.security_domain = network
action.notable.param.severity = low
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":10}]
action.risk.param._risk_message = $user$ used AI services after hours ($after_hours_reason$, $local_start$ to $local_end$ $local_tz$, $signal_type$): $request_count$ allowed web requests over $active_buckets$ ten-minute periods ($total_requests$ allowed including background, $blocked_requests$ blocked not counted, action $action$) and $mb_out$ MB sent to $provider_list$ from $src$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user,signal_type
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 12 * * * *
description = v1.1.0 Hourly. Detects identified users with repeated (default 50+ allowed foreground requests over 2+ ten-minute periods) or upload-heavy (5+ MB) AI web use outside business hours (default before 06:00, from 20:00 and weekends). Silent until the business-hours UTC offset macro is set. Blocked requests do not count. Contextual RBA signal on the user (10, 20 with upload, scaled, max 40), at most one request event and one upload event per user per day. Risk only, no notable.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count sum(Web.bytes_out) as bytes_out min(_time) as firstTime max(_time) as lastTime from datamodel=Web where (Web.url_domain=* OR Web.site=*) Web.user!="unknown" `hdsi_ai_after_hours_service_usage_filter` by Web.user Web.src Web.url_domain Web.site Web.action _time span=10m \
	| rename Web.* as * \
	| eval user_raw=if(isnull(user) OR trim(user)="" OR in(lower(user),"unknown","-","n/a","none","null"), null(), trim(user)), user=replace(user_raw,"^.*[\\\\]",""), user=if(isnull(user) OR user="" OR in(lower(user),"unknown","-","n/a","none","null"), null(), user), src=if(isnull(src) OR trim(src)="", "unknown", src) \
	| where isnotnull(user) \
	| `hdsi_ai_after_hours_service_usage_local_clock` \
	| where `hdsi_ai_after_hours_service_usage_after_hours` \
	| eval ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))), ai_input_type=if(isnull(nullif(url_domain,"unknown")),"app","host"), action=lower(action), blocked=if(in(action, `hdsi_ai_after_hours_service_usage_blocked_actions`), 1, 0), bytes_out=if(blocked=0 AND isnum(bytes_out), bytes_out, 0), allowed_count=if(blocked=0, count, 0), blocked_count=if(blocked=1, count, 0), allowed_t=if(blocked=0, _time, null()), allowed_first=if(blocked=0, firstTime, null()), allowed_last=if(blocked=0, lastTime, null()), allowed_action=if(blocked=0, action, null()), after_hours_reason=if(blocked=0, if(local_dow=0 OR local_dow=6, "weekend", "outside business hours"), null()) \
	| stats sum(allowed_count) as count sum(blocked_count) as blocked_count sum(bytes_out) as bytes_out values(allowed_t) as bk_t values(user_raw) as user_raw values(allowed_action) as action min(allowed_first) as firstTime max(allowed_last) as lastTime values(after_hours_reason) as after_hours_reason by user src ai_domain ai_input_type \
	| `ai_domains_filter` \
	| search usage_type IN (`hdsi_ai_after_hours_service_usage_usage_types`) \
	| eval severity_weight=tonumber(severity_weight), background=if(ai_traffic_class="background" OR match(ai_domain, `hdsi_ai_after_hours_service_usage_background_hosts`), 1, 0), fg_t=if(background=0, bk_t, null()), used_provider=if(count>0, provider, null()), used_domain=if(count>0, ai_domain, null()), used_weight=if(count>0, severity_weight, null()), used_src=if(count>0 AND lower(src)!="unknown", src, null()) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| stats sum(eval(if(background=0,count,0))) as request_count sum(count) as total_requests sum(blocked_count) as blocked_requests sum(bytes_out) as bytes_out values(used_provider) as providers values(used_domain) as ai_domains values(used_src) as srcs values(fg_t) as fg_t values(bk_t) as bk_t values(user_raw) as user_raw values(action) as action values(after_hours_reason) as after_hours_reason max(used_weight) as severity_weight min(firstTime) as firstTime max(lastTime) as lastTime by user \
	| eval mb_out=round(bytes_out/1024/1024,2), severity_weight=coalesce(severity_weight,1.0), upload_flag=if(mb_out>=`hdsi_ai_after_hours_service_usage_upload_mb`,1,0), active_buckets=coalesce(mvcount(fg_t),0) \
	| where (request_count>=`hdsi_ai_after_hours_service_usage_min_requests` AND active_buckets>=`hdsi_ai_after_hours_service_usage_min_buckets`) OR upload_flag=1 \
	| eval signal_type=if(upload_flag=1, "upload", "requests"), first_bucket=tonumber(mvindex(mvsort(bk_t),0)), last_bucket=tonumber(mvindex(mvsort(bk_t),-1)), _time=first_bucket \
	| `hdsi_ai_after_hours_service_usage_local_clock` \
	| eval local_start=local_slot, _time=last_bucket+600 \
	| `hdsi_ai_after_hours_service_usage_local_clock` \
	| eval local_end=local_slot, _time=lastTime \
	| `ai_risk_multiplier` \
	| eval base_score=if(upload_flag=1,20,10), risk_score=min(40, max(1, round(base_score*severity_weight*coalesce(risk_multiplier,1),0))) \
	| eval provider=mvindex(providers,0), provider_list=mvjoin(providers,", "), src=coalesce(mvjoin(mvindex(srcs,0,2),", "),"no source address"), ai_domains=mvindex(ai_domains,0,9), action=mvjoin(action,", "), after_hours_reason=mvjoin(after_hours_reason," and "), drilldown_user=replace(mvindex(user_raw,0),"[\\\\\"]","*"), user_raw=mvjoin(mvindex(user_raw,0,2),", ") \
	| fields - srcs bytes_out bk_t fg_t first_bucket last_bucket local_hour local_minute local_dow local_day local_slot _final_multiplier \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="after_hours_usage", detection_id="hdsi_ai_after_hours_service_usage", mitre_attack="T1567", ai_kill_chain_phase="exfiltration" \
	| `hdsi_ai_after_hours_service_usage_customizations` \
	| `hdsi_ai_after_hours_service_usage_risk_score`

[hdsi_ai_after_hours_service_usage_filter]
definition = ()
description = v1.1 Tenant exclusion hook inside the tstats where clause, before aggregation. Use Web.* names, e.g. NOT Web.user IN ("svc_*","noc_*") for service or night-shift accounts, or paste the optional AI-host pre-filter from the README on large proxy tenants. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_after_hours_service_usage_usage_types]
definition = "web"
description = v1.1 ai_provider_domains usage_type values that count as interactive after-hours use. Ships "web" only: IDE assistants (ide), API endpoints (api) and model registries poll in the background whenever an IDE, agent or job is running, which in validation made most after-hours rows. Widen e.g. to "web","cli" if wanted.
disabled = False
iseval = 0

[hdsi_ai_after_hours_service_usage_background_hosts]
definition = "^(ab|bzr|bzrcdn|cdn|static|assets?|assets-proxy|sentry[a-z0-9-]*|telemetry|events?|stats|metrics|stream|ms-sso|auth|accounts?|login|downloads?)\\.|(^|\\.)(gstatic\\.com|oaistatic\\.com)$"
description = v1.1 Regex (quoted) for extra AI hostnames that an open tab, extension or app calls in the background, on top of the common registry flag ai_traffic_class="background" (ab.chatgpt.com, bzr/bzrcdn.openai.com, gemini.gstatic.com, the QuillBot streams and Copilot telemetry). Covers static/CDN assets, error reporting (sentry-*), streaming channels and sign-in hosts not yet in the registry. Their requests do not count toward min_requests or min_buckets (they still count in total_requests and mb_out).
disabled = False
iseval = 0

[hdsi_ai_after_hours_service_usage_utc_offset]
definition = null()
description = v1.1 REQUIRED before enabling. Business-hours time zone as the standard (winter) UTC offset in hours, e.g. -5 (US Eastern), -6 (US Central), 0 (UK), 1 (Central Europe), 5.5; pair with the dst_rule macro. "owner" uses the saved search owner's time zone instead. Ships null(), which emits NOTHING: the rule stays silent until the clock is set, because the Splunk Cloud default (UTC) would label a US afternoon as after hours.
disabled = False
iseval = 0

[hdsi_ai_after_hours_service_usage_dst_rule]
definition = "none"
description = v1.1 Daylight saving rule applied to a numeric utc_offset: "us" (second Sunday of March 02:00 to first Sunday of November 02:00 local), "eu" (last Sunday of March to last Sunday of October, 01:00 UTC) or "none" (fixed offset all year). Ignored when utc_offset is "owner". Ships "none".
disabled = False
iseval = 0

[hdsi_ai_after_hours_service_usage_local_clock]
definition = eval ah_off=`hdsi_ai_after_hours_service_usage_utc_offset`, ah_dst=lower(`hdsi_ai_after_hours_service_usage_dst_rule`) | eval ah_owner=if(isstr(ah_off) AND lower(ah_off)="owner", 1, 0), ah_std=if(isnum(ah_off), _time+(ah_off*3600), null()), ah_y=strftime(ah_std,"%Y") | eval ah_a=case(ah_dst="us", strptime(ah_y."-03-08 +0000","%Y-%m-%d %z"), ah_dst="eu", strptime(ah_y."-03-31 +0000","%Y-%m-%d %z")), ah_b=case(ah_dst="us", strptime(ah_y."-11-01 +0000","%Y-%m-%d %z"), ah_dst="eu", strptime(ah_y."-10-31 +0000","%Y-%m-%d %z")) | eval ah_start=case(ah_dst="us", ah_a+((7-((floor(ah_a/86400)+4)%7))%7)*86400+7200, ah_dst="eu", ah_a-((floor(ah_a/86400)+4)%7)*86400+3600+(ah_off*3600)), ah_end=case(ah_dst="us", ah_b+((7-((floor(ah_b/86400)+4)%7))%7)*86400+3600, ah_dst="eu", ah_b-((floor(ah_b/86400)+4)%7)*86400+3600+(ah_off*3600)) | eval ah_local=if(isnotnull(ah_std), ah_std+if(isnotnull(ah_start) AND ah_std>=ah_start AND ah_std<ah_end, 3600, 0), null()) | eval local_hour=case(isnotnull(ah_local), floor((ah_local%86400)/3600), ah_owner=1, tonumber(strftime(_time,"%H"))), local_minute=case(isnotnull(ah_local), floor((ah_local%3600)/60), ah_owner=1, tonumber(strftime(_time,"%M"))), local_dow=case(isnotnull(ah_local), (floor(ah_local/86400)+4)%7, ah_owner=1, tonumber(strftime(_time,"%w"))), local_tz=case(isnotnull(ah_local), "UTC".if(ah_local>=_time,"+","-").floor(abs(ah_local-_time)/3600).if(abs(ah_local-_time)%3600>0, ":".round((abs(ah_local-_time)%3600)/60), ""), ah_owner=1, "owner time zone") | eval local_day=case(local_dow=0,"Sun",local_dow=1,"Mon",local_dow=2,"Tue",local_dow=3,"Wed",local_dow=4,"Thu",local_dow=5,"Fri",local_dow=6,"Sat"), local_slot=local_day." ".if(local_hour<10,"0","").local_hour.":".if(local_minute<10,"0","").local_minute | fields - ah_off ah_dst ah_owner ah_std ah_y ah_a ah_b ah_start ah_end ah_local
description = v1.1 Computes the business-hours clock of each tstats bucket: local_hour (0-23), local_minute, local_dow (0=Sun..6=Sat), local_day, local_slot ("Sat 21:10") and local_tz ("UTC-4"). Uses utc_offset plus dst_rule, or the owner time zone when utc_offset is "owner". All fields are null while utc_offset is unset, so the after_hours test drops every row. Not normally edited.
disabled = False
iseval = 0

[hdsi_ai_after_hours_service_usage_after_hours]
definition = (local_hour<6 OR local_hour>=20 OR local_dow=0 OR local_dow=6)
description = v1.1 Where-expression that defines after hours on the local clock. Ships as before 06:00, from 20:00, and all of Saturday and Sunday (the former ai_detection_config after_hours_start=20 / after_hours_end=6 defaults). Edit for other shifts or working weeks, e.g. replace the weekend terms with local_dow=5 OR local_dow=6 for a Sunday-Thursday week. Null clock fields (utc_offset unset) never match.
disabled = False
iseval = 0

[hdsi_ai_after_hours_service_usage_min_requests]
definition = 50
description = v1.1 Minimum allowed foreground AI web requests (Web events; blocked actions and background hosts excluded) by one user in the 60-minute dispatch window. Proxy verbosity drives this number: one PAN-OS page load can log 50+ events, which is why min_buckets is also required. In validation 50 sat at about the 90th percentile of a user's busiest after-hours window on a weekday night and the 95th on a Saturday on the PAN-OS tenant; derive per tenant (README).
disabled = False
iseval = 0

[hdsi_ai_after_hours_service_usage_min_buckets]
definition = 2
description = v1.1 Minimum number of distinct 10-minute periods with foreground AI requests that the request-count path also needs, so a single page-load burst (60 requests in 15 seconds on PAN-OS) does not count as repeated use. 1 disables the check, 3 or more demands roughly half-hour sessions. Does not apply to the upload path.
disabled = False
iseval = 0

[hdsi_ai_after_hours_service_usage_blocked_actions]
definition = "blocked","block","denied","deny","dropped","drop","reset","rejected","block-url","reset-both","reset-client","reset-server","quarantined"
description = v1.1 Lower-case Web.action values that mean the proxy stopped the request. Their requests and bytes never count toward min_requests, min_buckets or upload_mb (the user did not reach the AI service); they are reported as blocked_requests only. CIM uses "blocked"; the other values cover vendor add-ons that pass their own action through. Events with no action ("unknown") count as allowed.
disabled = False
iseval = 0

[hdsi_ai_after_hours_service_usage_upload_mb]
definition = 5
description = v1.1 After-hours MB sent (Web.bytes_out of allowed requests) to AI services by one user in the window that qualifies the user on its own and raises the base score from 10 to 20. Needs a proxy that reports bytes_out.
disabled = False
iseval = 0

[hdsi_ai_after_hours_service_usage_customizations]
definition = search *
description = v1.1 Tenant customization hook after aggregation (fields: user, user_raw, drilldown_user, src, provider, provider_list, ai_domains, action, signal_type, request_count, active_buckets, total_requests, blocked_requests, mb_out, upload_flag, local_start, local_end, local_tz, after_hours_reason, severity_weight, risk_multiplier, sensitivity_level, base_score, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_after_hours_service_usage_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust or override risk_score (1-100) per tenant. Ships as search *.
disabled = False
iseval = 0

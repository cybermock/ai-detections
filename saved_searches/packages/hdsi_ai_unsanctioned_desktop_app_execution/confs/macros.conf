[hdsi_ai_unsanctioned_desktop_app_execution_filter]
definition = ()
description = v1.1 Tenant exclusion hook inside the tstats where clause (Endpoint.Processes field names), applied before aggregation. Example: NOT Processes.dest IN ("vdi-gold-*") for an image-build host. Approved users, hosts or groups belong in ai_sanctioned_entities instead. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_desktop_app_execution_process_names]
definition = "chatgpt","chatgpt.exe","chatgpt helper*","chatgpt atlas*","claude","claude.exe","claude helper*","cursor","cursor.exe","cursor helper*","windsurf","windsurf.exe","windsurf helper*","trae","trae.exe","trae cn","trae cn.exe","trae helper*","kiro","kiro.exe","kiro helper*","perplexity","perplexity.exe","perplexity helper*","comet","comet.exe","comet helper*","pieces os","pieces os.exe","piecesos","pieces_os*","msty","msty.exe","msty helper*","msty studio*","anythingllm","anythingllm.exe","anythingllm helper*"
description = v1.1 Candidate AI desktop executable names (case-insensitive in tstats), used inside Processes.process_name IN (...). This is only the pre-filter: a name is reported only if the signature macro maps it to a tool. To add an app, add its name here AND a case() branch in hdsi_ai_unsanctioned_desktop_app_execution_signature. Generic editors/terminals and IDE plug-ins (Zed, Warp, Continue, Tabnine) were removed in v1.1: zed is also the Linux ZFS event daemon, and none of them is an AI desktop app in its own right. Electron/Chromium apps also run "<App> Helper" child processes (macOS: "Comet Helper", "Comet Helper (Renderer)"), and EDR sources may report only the helpers (a live Comet execution on one tenant appeared only as Comet Helper), so every Electron/Chromium app in the list has a "<app> helper*" entry.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_desktop_app_execution_signature]
definition = eval tool=case(match(process_name_lc,"^chatgpt atlas"),"ChatGPT Atlas", match(process_name_lc,"^chatgpt( helper.*)?(\\.exe)?$"),"ChatGPT desktop", match(process_name_lc,"^claude(\\.exe)?$") AND match(path_lc,"claude-agent-sdk"),"Claude Agent SDK (embedded agent)", match(process_name_lc,"^claude(\\.exe)?$") AND match(path_lc,"anthropicclaude|claude\\.app[\\\\/]|windowsapps\\\\[^\\\\]*claude"),"Claude desktop", match(process_name_lc,"^claude helper"),"Claude desktop", match(process_name_lc,"^cursor( helper.*)?(\\.exe)?$"),"Cursor", match(process_name_lc,"^windsurf( helper.*)?(\\.exe)?$"),"Windsurf", match(process_name_lc,"^trae( cn)?( helper.*)?(\\.exe)?$") AND match(path_lc,"[\\\\/]trae( cn)?[\\\\/]|trae( cn)?\\.app[\\\\/]"),"Trae", match(process_name_lc,"^kiro( helper.*)?(\\.exe)?$") AND match(path_lc,"[\\\\/]kiro[\\\\/]|kiro\\.app[\\\\/]"),"Kiro", match(process_name_lc,"^perplexity( helper.*)?(\\.exe)?$"),"Perplexity desktop", match(process_name_lc,"^comet( helper.*)?(\\.exe)?$") AND match(path_lc,"perplexity[\\\\/]comet|comet\\.app[\\\\/]"),"Perplexity Comet", match(process_name_lc,"^pieces[ _]?os"),"Pieces OS", match(process_name_lc,"^msty( studio)?( helper.*)?(\\.exe)?$"),"Msty", match(process_name_lc,"^anythingllm( helper.*)?(\\.exe)?$"),"AnythingLLM"), provider=case(match(tool,"^ChatGPT"),"OpenAI", match(tool,"^Claude"),"Anthropic", tool="Cursor","Cursor", tool="Windsurf","Windsurf", tool="Trae","ByteDance", tool="Kiro","Amazon", match(tool,"^Perplexity"),"Perplexity", tool="Pieces OS","Pieces", tool="Msty","Msty", tool="AnythingLLM","AnythingLLM"), app_class=case(tool IN ("ChatGPT Atlas","Perplexity Comet","Claude Agent SDK (embedded agent)"),"agentic", tool IN ("Cursor","Windsurf","Trae","Kiro"),"ai_ide", isnotnull(tool),"chat_client")
description = v1.1 Maps one candidate process row (process_name_lc; path_lc = lowercased process_path of that row) to tool, provider and app_class (chat_client | ai_ide | agentic); rows with no tool are dropped by the rule. Short or generic names need path corroboration: claude/claude.exe counts as the Claude desktop app (AnthropicClaude, Claude.app, a WindowsApps Claude package) or as the Claude Agent SDK, i.e. the Claude Code binary bundled inside another application's @anthropic-ai/claude-agent-sdk-* package (IDE-hosted copies are then removed by the ide_host_exclusion macro). A stand-alone Claude Code CLI install (~/.local/bin, ~/.claude/local, claude-code paths) is not matched here and is left to hdsi_ai_unsanctioned_cli_execution. Trae and Kiro only from their install folder or .app bundle; Comet, including its Comet Helper processes, only under Perplexity\Comet or Comet.app. Helper process names (<app> helper ...) map to the same tool as the main executable. Rows without a process path (inventory sources such as WinHostMon) are dropped for those names. Provider strings match ai_sanctioned_entities / ai_provider_domains so allowlist entries apply.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_desktop_app_execution_ide_host_exclusion]
definition = match(path_lc, "agent-host[\\\\/]sdk-cache[\\\\/]|[\\\\/]extensions[\\\\/]github\\.copilot|[\\\\/]copilot-language-server")
description = v1.1 Eval expression on path_lc (the lowercased process_path of one process row) that removes AI runtimes hosted by the IDE's GitHub Copilot integration: binaries under VS Code's agent-host\sdk-cache folder, under a .vscode extensions\github.copilot* folder, or the copilot-language-server binary. Command lines are deliberately not tested, so an argument or workspace path that merely contains these strings cannot suppress a Cursor, Windsurf or Claude row. VS Code's Copilot agent host caches the Claude Agent SDK binary (and an OpenAI Codex binary) under Code\agent-host\sdk-cache and runs it on behalf of Copilot; that is a Copilot session, not an unsanctioned Anthropic desktop app, and it was the only AI desktop-class process seen live (one tenant, 30 days). Set to false() to report these rows (they score as agentic, provider Anthropic).
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_desktop_app_execution_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation per user and src (fields: user, user_display, bunit, src, tools, tool, provider, app_class, process_names, process_path, process, parent_process_name, count, risk_multiplier, risk_score). Example: search NOT tools="Msty" where a local chat client is tolerated. Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_unsanctioned_desktop_app_execution_risk_score]
definition = search *
description = v1.1 Risk score hook, last pipe. risk_score ships as 20 (chat client or AI IDE) or 25 (agentic: AI browser or embedded agent SDK) x risk_multiplier, capped at 50, and applies to both the user and the system risk object; the literal _risk scores (user 20, system 20) are only the fallback when risk_score is removed. Override here, e.g. eval risk_score=if(app_class="agentic",40,risk_score) where agentic browsers are prohibited. Ships as search *.
disabled = False
iseval = 0

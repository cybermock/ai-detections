[Endpoint - HDSI AI Unsanctioned Desktop App Execution - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Unsanctioned Desktop App Execution
action.correlationsearch.annotations = {"mitre_attack": ["T1588.007"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$risk_object$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI desktop app process activity on $src$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count min(_time) as firstTime max(_time) as lastTime values(Processes.process_path) as process_path values(Processes.process) as process values(Processes.parent_process_name) as parent_process_name from datamodel=Endpoint.Processes where Processes.dest=\"$src$\" Processes.process_name IN (\"chatgpt\",\"chatgpt.exe\",\"chatgpt helper*\",\"chatgpt atlas*\",\"claude\",\"claude.exe\",\"claude helper*\",\"cursor\",\"cursor.exe\",\"cursor helper*\",\"windsurf\",\"windsurf.exe\",\"windsurf helper*\",\"trae\",\"trae.exe\",\"trae cn\",\"trae cn.exe\",\"trae helper*\",\"kiro\",\"kiro.exe\",\"kiro helper*\",\"perplexity\",\"perplexity.exe\",\"perplexity helper*\",\"comet\",\"comet.exe\",\"comet helper*\",\"pieces os\",\"pieces os.exe\",\"piecesos\",\"pieces_os*\",\"msty\",\"msty.exe\",\"msty helper*\",\"msty studio*\",\"anythingllm\",\"anythingllm.exe\",\"anythingllm helper*\") by Processes.dest Processes.user Processes.process_name | rename Processes.* as * | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, dest, user, process_name, process_path, process, parent_process_name, count | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = Unsanctioned AI desktop app $tools$ ($app_class$) ran on $src$ as $user_display$.
action.notable.param.rule_title = HDSI AI Unsanctioned Desktop App Execution ($src$)
action.notable.param.security_domain = endpoint
action.notable.param.severity = low
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":20},{"risk_object_field":"src","risk_object_type":"system","risk_score":20}]
action.risk.param._risk_message = Unsanctioned AI desktop app $tools$ ($app_class$, provider $providers$) ran on $src$ as $user_display$: $count$ process events from $process_names$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user,src
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 23 * * * *
description = v1.1.0 Detects unsanctioned AI desktop clients, AI-native IDEs and agentic AI browsers (ChatGPT, Claude, Perplexity, Pieces OS, Msty, AnythingLLM, Cursor, Windsurf, Trae, Kiro, ChatGPT Atlas, Perplexity Comet, and the Claude Agent SDK bundled inside third-party applications) from Endpoint.Processes. Electron helper processes count as the app; short or generic executable names need process-path corroboration; IDE-hosted GitHub Copilot runtimes are excluded by path. Risk on the user (when attributable) and the system, no notable.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) as firstTime max(_time) as lastTime values(Processes.process) as process values(Processes.parent_process_name) as parent_process_name from datamodel=Endpoint.Processes where Processes.process_name IN (`hdsi_ai_unsanctioned_desktop_app_execution_process_names`) `hdsi_ai_unsanctioned_desktop_app_execution_filter` by Processes.user Processes.dest Processes.process_name Processes.process_path \
	| rename Processes.* as * \
	| eval src=if(lower(dest) IN ("unknown","-",""), null(), dest), process=mvfilter(lower(process)!="unknown"), parent_process_name=mvfilter(lower(parent_process_name)!="unknown"), process_path=if(lower(process_path) IN ("unknown","-",""), null(), process_path), path_lc=lower(coalesce(process_path,"")), process_name_lc=lower(process_name) \
	| `hdsi_ai_unsanctioned_desktop_app_execution_signature` \
	| where isnotnull(tool) AND isnotnull(src) AND NOT (`hdsi_ai_unsanctioned_desktop_app_execution_ide_host_exclusion`) \
	| eval user=if(match(lower(user),"^(unknown|-|n/a|null|system|root|daemon|nobody|local service|network service|nt authority\\\\.*|_[a-z0-9_]+)?$") OR match(user,"\\$$"), "unknown", user) \
	| lookup identity_lookup_expanded identity as user OUTPUT bunit \
	| eval bunit=mvindex(bunit,0) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| stats sum(count) as count min(firstTime) as firstTime max(lastTime) as lastTime values(tool) as tool values(provider) as provider values(app_class) as app_class values(process_name) as process_name values(process_path) as process_path values(process) as process values(parent_process_name) as parent_process_name values(bunit) as bunit by user src \
	| eval user=if(user="unknown", null(), user), app_class=case(isnotnull(mvfind(app_class,"^agentic$")),"agentic", isnotnull(mvfind(app_class,"^ai_ide$")),"ai_ide", true(),"chat_client"), tools=mvjoin(tool,", "), providers=mvjoin(provider,", "), process_names=mvjoin(process_name,", "), process_path=mvindex(process_path,0,4), process=mvindex(process,0,4), user_display=coalesce(user,"an unattributed account") \
	| `ai_risk_multiplier` \
	| eval risk_multiplier=coalesce(risk_multiplier,1.0), risk_score=min(50, round(if(app_class="agentic",25,20)*risk_multiplier)) \
	| eval ai_activity="desktop_app_execution", detection_id="hdsi_ai_unsanctioned_desktop_app_execution", mitre_attack="T1588.007", ai_kill_chain_phase="execution" \
	| convert ctime(firstTime) ctime(lastTime) \
	| table firstTime, lastTime, user, user_display, bunit, src, tools, tool, providers, provider, app_class, process_names, process_name, process_path, process, parent_process_name, count, sensitivity_level, risk_multiplier, risk_score, ai_activity, detection_id, mitre_attack, ai_kill_chain_phase \
	| `hdsi_ai_unsanctioned_desktop_app_execution_customizations` \
	| `hdsi_ai_unsanctioned_desktop_app_execution_risk_score`

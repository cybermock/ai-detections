version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Unsanctioned Desktop App Execution
description: "Detects unsanctioned AI desktop clients (ChatGPT, Claude, Perplexity, Pieces OS, Msty, AnythingLLM), AI-native IDEs (Cursor, Windsurf, Trae, Kiro) and agentic AI browsers/agents (ChatGPT Atlas, Perplexity Comet, the Claude Agent SDK bundled inside third-party applications) from Endpoint.Processes. Electron helper processes (e.g. Comet Helper) count as the app. Short or generic executable names need process-path corroboration; generic editors, terminals, IDE plug-ins and IDE-hosted GitHub Copilot runtimes (VS Code agent host, matched by path) are not reported. Group allowlisting uses the ES identity bunit. Risk on the user (when attributable) and the system, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - process
  - endpoint
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Endpoint.Processes"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

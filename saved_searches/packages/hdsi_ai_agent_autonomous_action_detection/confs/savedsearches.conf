[Endpoint - HDSI AI Agent Autonomous Action Detection - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Agent Autonomous Action Detection
action.correlationsearch.annotations = {"mitre_attack": ["T1059", "T1105", "T1552", "T1053"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search (risk_object=\"$dest_dd$\" OR risk_object=\"$user_dd$\") source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI agent child processes for the user or host (24h)","search":"| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where (Processes.dest=\"$dest_dd$\" OR Processes.user=\"$user_dd$\") `hdsi_ai_agent_autonomous_action_detection_agent_scope` by Processes.user Processes.dest Processes.parent_process_name Processes.process_name Processes.process | rename Processes.* as * | convert ctime(firstTime) ctime(lastTime) | sort - lastTime","earliest_offset":"-24h@h","latest_offset":"now"}]
action.notable.param.rule_description = $agent_tool$ ($provider$) on $dest_display$ as $user_display$: $risk_category$ risk event ($risk_tier$). $action_count$ distinct commands in the hour; categories: $action_category_list$. Example: $command_sample$
action.notable.param.rule_title = HDSI AI Agent Autonomous Action Detection ($risk_category$, $user_display$ on $dest_display$)
action.notable.param.security_domain = endpoint
action.notable.param.severity = medium
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":10},{"risk_object_field":"dest","risk_object_type":"system","risk_score":10}]
action.risk.param._risk_message = $agent_tool$ ($provider$) on $dest_display$ as $user_display$ raised a $risk_category$ event ($action_count$ distinct commands in the hour, categories: $action_category_list$), e.g. $command_sample$
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user,dest,risk_category
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 7 * * * *
description = v1.1.0 Detects AI coding agents and agent frameworks (Claude Code, OpenAI Codex, GitHub Copilot agent, Gemini CLI, Aider, CrewAI, ...) executing commands on an endpoint. Emits one low-score agent_activity risk event per user and host per day (routine commands, package installs, git push, downloads, recursive deletes) and one separate event per high-signal category (credential_access, persistence, system_change). Risk on user and host, no notable.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where `hdsi_ai_agent_autonomous_action_detection_agent_scope` `hdsi_ai_agent_autonomous_action_detection_filter` by Processes.user Processes.dest Processes.parent_process_name Processes.parent_process Processes.process_name Processes.process \
	| rename Processes.* as * \
	| eval parent_lc=lower(parent_process_name), process_name_lc=lower(process_name), cmd_n=replace(lower(process),"\x5c","/"), parent_key=replace(lower(parent_process_name." ".parent_process." ".user),"\x5c","/") \
	| eval agent_tool=case(match(parent_key,"anthropicclaude|/claude[.]app/"),"Claude desktop", match(parent_key,"@anthropic-ai|claude-code|claude-agent-sdk|(^|[\s/])claude([.]exe)?(\s|\z)") OR match(cmd_n,"[.]claude/shell-snapshots/"),"Claude Code", match(parent_key,"codex"),"OpenAI Codex", match(parent_key,"copilot"),"GitHub Copilot agent", match(parent_key,"gemini"),"Gemini CLI", match(parent_key,"cursor-agent"),"Cursor Agent", match(parent_key,"(^|[\s/])aider"),"Aider", match(parent_key,"(^|[\s/])goose"),"Goose", match(parent_key,"opencode"),"OpenCode", match(parent_key,"qchat"),"Amazon Q", match(parent_key,"kiro-cli"),"Kiro", match(parent_key,"(^|[\s/])cline"),"Cline", match(parent_key,"openhands|opendevin"),"OpenHands", match(parent_key,"crewai"),"CrewAI", match(parent_key,"autogen(_agentchat|-agentchat|_core|_ext|studio)|pyautogen"),"AutoGen", match(parent_key,"langgraph|langchain"),"LangChain", match(parent_key,"swe-agent"),"SWE-agent", match(parent_key,"smolagents"),"smolagents", match(parent_key,"metagpt"),"MetaGPT", match(parent_key,"autogpt"),"AutoGPT", match(parent_key,"interpreter"),"Open Interpreter", true(),"AI agent") \
	| eval provider=case(match(agent_tool,"^Claude"),"Anthropic", agent_tool="OpenAI Codex","OpenAI", agent_tool="GitHub Copilot agent","GitHub Copilot", agent_tool="Gemini CLI","Google Gemini", agent_tool="Cursor Agent","Cursor", true(),agent_tool) \
	| where NOT ((process_name_lc=parent_lc AND NOT match(parent_lc,"^(powershell|pwsh|cmd|bash|sh|zsh|dash|fish|node|python[0-9.]*|pythonw|py)([.]exe)?\z")) OR `hdsi_ai_agent_autonomous_action_detection_housekeeping(cmd_n,process_name_lc)` OR (agent_tool="Claude desktop" AND match(process_name_lc." ".cmd_n,"mcp|modelcontextprotocol") AND (match(process_name_lc,"^(npx|uvx|uv|node|docker|python3?|bunx?|deno)([.](exe|cmd))?\z") OR match(cmd_n,"^\S*cmd([.]exe)?\x22?\s+(/[a-z]\s+)+\x22?\S*(npx|uvx|node|docker)([.](exe|cmd))?\x22?\s[^&|;]*\z")))) \
	| eval action_category=`hdsi_ai_agent_autonomous_action_detection_categorize(cmd_n)` \
	| eval cmd_rank=case(isnull(action_category),9, isnotnull(mvfind(action_category,"^credential_access\z")),1, isnotnull(mvfind(action_category,"^persistence\z")),2, isnotnull(mvfind(action_category,"^system_change\z")),3, isnotnull(mvfind(action_category,"^destructive\z")),4, isnotnull(mvfind(action_category,"^network_transfer\z")),5, true(),6) \
	| eval is_cred=if(isnotnull(mvfind(action_category,"^credential_access\z")),1,0), is_persist=if(isnotnull(mvfind(action_category,"^persistence\z")),1,0), is_sys=if(isnotnull(mvfind(action_category,"^system_change\z")),1,0), t1053=if(is_persist=1 AND match(cmd_n,"schtasks|scheduledtask|crontab\s"),1,0), t1105=if(isnotnull(mvfind(action_category,"^network_transfer\z")) AND match(cmd_n,"(^|[\s/\x22'(;&|])(curl|wget|bitsadmin)([.]exe)?[\x22']?(\s|\z)|invoke-webrequest|invoke-restmethod|(^|[\s;|(])(iwr|irm)\s|downloadstring|downloadfile|start-bitstransfer|certutil.*-urlcache|net[.]webclient") AND NOT match(process,"\s(-d|-F|-T|--data(-[a-z]+)?|--form|--upload-file|--post-data|--post-file|--body-data|--body-file|--request\s+(POST|PUT|PATCH))(\s|=|@)|\s-X\s*(POST|PUT|PATCH)\b|(?i:\s-method\s+(post|put|patch)\b|\s-infile\s|uploadstring|uploadfile|bitsadmin.*\s/upload)"),1,0) \
	| eval cmd_short=cmd_rank."#".substr(trim(replace(replace(replace(replace(process,"(?i)^\x22?[^\x22]*(pwsh|powershell)([.]exe)?\x22?\s+(-[a-z]+\s+)*-command\s+","pwsh -c "),"(?i)try\s*\{\s*\[console\]::outputencoding[^}]*\}\s*catch\s*\{\s*\};?\s*|try\s*\{\s*if\s*\(get-variable\s+-name\s+psstyle[^}]*\}\s*\}\s*catch\s*\{\s*\};?\s*|\x24global:lastexitcode\s*=\s*0;\s*|\x24__copilot\w+\s*=\s*\x24(true|false);\s*",""),"(?i)(authorization:\s*(bearer|basic|token)\s+|x-api-key:\s*|(password|passwd|pwd|secret|token|api[_-]?key|apikey|access[_-]?key|client[_-]?secret)[\x22']?\s*[=:]\s*[\x22']?|--(password|token|api-key|secret)(=|\s+)[\x22']?)[^\s\x22']+","\1[redacted]"),"(?i)(sk-[a-z0-9_-]{16,}|gh[pousr]_[a-z0-9]{20,}|github_pat_[a-z0-9_]{20,}|xox[abprs]-[a-z0-9-]{10,}|akia[a-z0-9]{16}|eyj[a-z0-9_-]{10,}[.][a-z0-9_-]{10,}[.][a-z0-9_-]+)","[redacted]")),1,200) \
	| eval sandbox_user=if(match(lower(user),"(^|\x5c)codexsandbox"),user,null()) \
	| eval user=if(isnull(user) OR user="" OR match(lower(user),"^(unknown|-|n/a|null|system|local service|network service|nt authority.*)\z") OR match(lower(user),"(^|\x5c)codexsandbox") OR match(user,"\x24\z"), null(), user), dest=if(isnull(dest) OR dest="" OR lower(dest)="unknown", null(), dest) \
	| where isnotnull(dest) OR isnotnull(user) \
	| fillnull value="__none__" user dest \
	| stats sum(count) as event_count min(firstTime) as firstTime max(lastTime) as lastTime dc(cmd_n) as action_count values(process_name) as child_processes values(parent_process_name) as agent_process values(action_category) as action_categories values(eval(if(cmd_rank>=4,cmd_short,null()))) as cmds_activity values(eval(if(is_cred=1,cmd_short,null()))) as cmds_credential_access values(eval(if(is_persist=1,cmd_short,null()))) as cmds_persistence values(eval(if(is_sys=1,cmd_short,null()))) as cmds_system_change max(t1053) as has_t1053 max(t1105) as has_t1105 values(sandbox_user) as sandbox_user by user dest agent_tool provider \
	| eval user=if(user="__none__", null(), user), dest=if(dest="__none__", null(), dest), high_categories=mvfilter(match(action_categories,"^(credential_access|persistence|system_change)\z")), dev_categories=mvfilter(match(action_categories,"^(network_transfer|destructive|package_install)\z")), action_category_list=if(isnotnull(action_categories), mvjoin(action_categories,", "), "none, routine commands") \
	| eval risk_category=mvappend(if(action_count>=`hdsi_ai_agent_autonomous_action_detection_min_actions` OR isnotnull(dev_categories),"agent_activity",null()), high_categories) \
	| where isnotnull(risk_category) \
	| mvexpand risk_category \
	| eval allow_user=if(risk_category="agent_activity",user,"__high_signal__"), allow_dest=if(risk_category="agent_activity",dest,"__high_signal__"), allow_provider=if(risk_category="agent_activity",provider,"__high_signal__") \
	| `ai_unsanctioned_filter(allow_user,allow_dest,allow_provider)` \
	| fields - allow_user allow_dest allow_provider \
	| `ai_risk_multiplier` \
	| eval dev_count=coalesce(mvcount(dev_categories),0), risk_tier=case(risk_category!="agent_activity","sensitive", dev_count>0,"development", true(),"routine"), base_score=case(risk_category="persistence",30, risk_category="credential_access",25, risk_category="system_change",25, true(),10+5*dev_count), risk_multiplier=coalesce(risk_multiplier,1), risk_score=if(risk_category="agent_activity", base_score, min(60, round(base_score*risk_multiplier,0))) \
	| eval mitre_attack=case(risk_category="credential_access",mvappend("T1059","T1552"), risk_category="persistence",mvappend("T1059",if(has_t1053=1,"T1053",null())), risk_category="system_change","T1059", true(),mvappend("T1059",if(has_t1105=1,"T1105",null()))), command_sample=mvindex(case(risk_category="credential_access",cmds_credential_access, risk_category="persistence",cmds_persistence, risk_category="system_change",cmds_system_change, true(),coalesce(cmds_activity,cmds_credential_access,cmds_persistence,cmds_system_change)),0,2), user_display=coalesce(user, sandbox_user, "n/a (service or sandbox account)"), dest_display=coalesce(dest, "n/a (no host)"), user_dd=replace(user_display,"[\x5c\x22]","*"), dest_dd=replace(dest_display,"[\x5c\x22]","*"), child_processes=mvjoin(mvindex(child_processes,0,9),", "), agent_process=mvjoin(agent_process,", ") \
	| eval command_sample=substr(mvjoin(mvmap(command_sample,replace(command_sample,"^\d#",""))," | "),1,400) \
	| fields - cmds_activity cmds_credential_access cmds_persistence cmds_system_change has_t1053 has_t1105 dev_count \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="agent_autonomous_action", detection_id="hdsi_ai_agent_autonomous_action_detection", ai_kill_chain_phase="execution" \
	| `hdsi_ai_agent_autonomous_action_detection_customizations` \
	| `hdsi_ai_agent_autonomous_action_detection_risk_score`

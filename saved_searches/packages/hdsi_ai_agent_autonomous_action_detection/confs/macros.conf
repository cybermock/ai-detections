[hdsi_ai_agent_autonomous_action_detection_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the Endpoint.Processes tstats where clause before aggregation. Use datamodel field names, e.g. NOT Processes.dest IN ("build-agent-*"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_agent_autonomous_action_detection_agent_scope]
definition = (Processes.parent_process_name IN ("claude","claude.exe","codex","codex.exe","codex-command-runner*","copilot-runtime*","gemini","gemini.exe","aider","aider.exe","goose","goose.exe","opencode","opencode.exe","cursor-agent","cursor-agent.exe","qchat","qchat.exe","kiro-cli","kiro-cli.exe","cline","cline.exe","openhands","openhands.exe","crewai","crewai.exe","autogpt","autogpt.exe","interpreter","interpreter.exe") OR (Processes.parent_process_name IN ("copilot","copilot.exe") NOT Processes.parent_process IN ("*windowsapps*","*microsoft.copilot*","*microsoft copilot*")) OR Processes.parent_process IN ("*@anthropic-ai*claude*","*@openai*codex*","*@github*copilot*","*@google*gemini-cli*","*crewai*","*autogen_agentchat*","*autogen-agentchat*","*autogen_core*","*autogen_ext*","*autogenstudio*","*pyautogen*","*langgraph*","*langchain*","*openhands*","*swe-agent*","*smolagents*","*metagpt*") OR Processes.process="*.claude*shell-snapshots*" OR Processes.user="*CodexSandbox*")
description = v1.1 tstats pre-filter that identifies processes launched by an AI coding agent or agent framework: the agent binary as parent (Claude Code, Codex and its Windows command runner, the VS Code Copilot agent runtime, the GitHub Copilot CLI (copilot/copilot.exe, excluding the Microsoft Copilot consumer app under WindowsApps), Gemini CLI, Aider, Goose, OpenCode, Cursor Agent, Amazon Q/Kiro, Cline, OpenHands, CrewAI, AutoGPT, Open Interpreter), the agent package path in the parent process (works where parent_process carries a path or command line, e.g. VS Code agent-host SDK binaries, Sysmon or EDR parent command lines for python/node-hosted frameworks; AutoGen is matched only by its package names, so GNU autotools autogen.sh builds do not match), Claude Code shell snapshots in the child command line, and the Codex Windows sandbox accounts. Add in-house agent binaries here.
disabled = False
iseval = 0

[hdsi_ai_agent_autonomous_action_detection_housekeeping(2)]
args = cmd, name
definition = (in($name$,"conhost.exe","conhost","where.exe","werfault.exe","wermgr.exe","msedgewebview2.exe","crashpad_handler","crashpad_handler.exe") OR match($cmd$,"^(\x22[^\x22]+\x22|\S+)\s+(--version|-v|-version|version)[\x22'\s]*\z") OR match($cmd$,"^(\x22[^\x22]+\x22|\S+)(\s+-[a-z]+)*\s+-command\s+\x22write-output\s+\('version='\s*\+\s*\x24psversiontable[.]psversion[.]tostring\(\)\);\s*write-output\s+\('pshome='\s*\+\s*\x24pshome\)\x22\s*\z") OR match($cmd$,"^(\x22[^\x22]+\x22|\S+)(\s+-[a-z]+)*\s+-command\s+\x22\(get-ciminstance\s+win32_process\s+-filter\s+/?\x22processid=\d+/?\x22\)[.]creationdate[.]ticks\x22\s*\z") OR match($cmd$,"^(\S*cmd([.]exe)?\s+(/[a-z]\s+)+\x22)?\S*reg([.]exe)?\s+query\s+hk(cu|lm|ey_current_user|ey_local_machine)/software/(policies/claudecode(\s+/v\s+[a-z]+)?|microsoft/cryptography\s+/v\s+machineguid)\x22?\s*\z") OR match($cmd$,"^\S*cmd([.]exe)?\s+(/[a-z]\s+)+\x22tasklist\s*\|\s*findstr\s+/i\s+\x22[a-z0-9_. -]+\x22\x22\s*\z") OR (match($name$,"^git([.]exe)?\z") AND match($cmd$,"^(\x22[^\x22]+\x22|\S+)(\s+(--no-optional-locks|-c\s+(core[.]hookspath=\S*|core[.]fsmonitor=(false)?|[a-z]:/\S*|/\S*|\x22([a-z]:)?/[^\x22]*\x22)))*\s+(remote|remote\s+-v|remote\s+get-url\s+[a-z0-9_.-]+|rev-parse(\s+[^\s;&|]+)*|ls-files\s+--error-unmatch(\s+[^\s;&|]+)*|config\s+--get\s+[a-z0-9_.-]+|symbolic-ref(\s+[^\s;&|]+)*|branch\s+--show-current|status\s+--porcelain(\s+[^\s;&|]+)*)[\x22'\s]*\z")))
description = v1.1 Eval condition (true = ignore) for agent start-up probes that are not actions: console hosts, where.exe, bare version checks, the Claude Code PowerShell-version, policy-registry and MachineGuid reads, IDE detection via tasklist | findstr, process-age lookups and read-only git context calls (remote, rev-parse, ls-files, config --get). Every pattern is anchored to the full command shape observed in live validation (executable plus the probe and nothing else), so a command that merely contains a probe fragment (e.g. $PSVersionTable inside a compound command, or a trailing -v on curl) is still categorised. Git probes allow only -C <path>, --no-optional-locks and the agents' own hooksPath/fsmonitor overrides. Input: lower-cased command line with backslashes folded to "/", lower-cased process name. Add new probe shapes, anchored, rather than raising the threshold.
disabled = False
iseval = 0

[hdsi_ai_agent_autonomous_action_detection_categorize(1)]
args = cmd
definition = mvappend(if(match($cmd$,"[.]aws/credentials|[.]ssh/id_|[.]azure/(accesstokens|msal_token)|[.]kube/config|[.]docker/config[.]json|[.]netrc|[.]git-credentials|[.]npmrc|[.]pypirc|cmdkey|vaultcmd|get-storedcredential|convertfrom-securestring|sekurlsa|lsass|security\s+(find|dump)-[a-z-]*password|login\s+data|cookies[.]sqlite|gh\s+auth\s+token|az\s+account\s+get-access-token|gcloud\s+auth\s+print-[a-z]+-token|aws\s+configure\s+export-credentials|reg([.]exe)?\x22?\s+save\s+hk") OR match(replace($cmd$,"(cp|copy|copy-item|mv|move)(\s+-[a-z-]+)*\s+[\x22']?[^\s\x22']*[.]env[.](example|sample|template|dist|defaults?|tmpl|tpl)[\x22']?\s+[\x22']?[^\s\x22']*[.]env[\x22']?(?=[\s;&|)]|\z)",""),"(^|[\s/\x22'=<>])[.]env(?![.](example|sample|template|dist|defaults?|tmpl|tpl)([\s\x22';|&)]|\z))([.][a-z0-9_-]+)?([\s\x22';|&)]|\z)"),"credential_access",null()), if(match($cmd$,"schtasks([.]exe)?\x22?\s.*/create|register-scheduledtask|new-scheduledtask|crontab(\s+-u\s+\S+)?\s+(-[er]([\s\x22';|&)]|\z)|-([\s\x22';|&)]|\z)|[^-\s])|launchctl\s+(load|bootstrap|submit)|systemctl\s+(--user\s+)?enable|/currentversion/run(once)?([\s\x22]|\z)|new-service|(^|[\s/\x22])sc([.]exe)?\x22?\s+(create|config)\s"),"persistence",null()), if(match($cmd$,"(^|[\s;&|(\x22])sudo\s|(^|[\s/\x22])runas([.]exe)?\x22?\s|-verb\s+runas|set-executionpolicy\s+(bypass|unrestricted)|(set|add)-mppreference|netsh([.]exe)?\x22?\s+(advfirewall|firewall)|net1?([.]exe)?\x22?\s+(user|localgroup)\s.*(/add|administrators)|reg([.]exe)?\x22?\s+(add|delete)\s+hk|(new|set)-itemproperty\s.*hk(lm|cu):|bcdedit|vssadmin|wevtutil([.]exe)?\x22?\s+cl|chmod\s+(\+s|[0-7]?777)\s"),"system_change",null()), if(match($cmd$,"(^|[\s/\x22'(;&|])(curl|wget|scp|sftp|rsync|ncat|socat|rclone|bitsadmin)([.]exe)?[\x22']?(\s|\z)|invoke-webrequest|invoke-restmethod|(^|[\s;|(])(iwr|irm)\s|downloadstring|downloadfile|start-bitstransfer|certutil.*-urlcache|net[.]webclient|git([.]exe)?\x22?\s(.*\s)?push(\s|\z)"),"network_transfer",null()), if(match($cmd$,"rm\s+-[a-z]*r[a-z]*f|rm\s+-[a-z]*f[a-z]*r|remove-item\s.*-recurse|(^|[\s/\x22])(rd|rmdir)\s+/s|(^|[\s/\x22])del\s+/[sfq]|format-volume|clear-disk|git([.]exe)?\x22?\s(.*\s)?reset\s+--hard|git([.]exe)?\x22?\s(.*\s)?clean\s+-[a-z]*f|git([.]exe)?\x22?\s(.*\s)?push\s.*(--force|\s-f(\s|\z))|drop\s+(table|database)|truncate\s+table|(^|\s)mkfs|(^|\s)dd\s+if="),"destructive",null()), if(match($cmd$,"(pip3?|pipx)([.]exe)?\x22?\s+install|uv([.]exe)?\x22?\s+(pip\s+install|add|tool\s+install)|(^|[\s/\x22])uvx\s|npm([.]cmd)?\x22?\s+(i|install|add)\s+[^-\s]|(^|[\s/\x22])(npx|bunx)([.]cmd)?\x22?\s+(-[^\s;&|]+\s+)*(-y|--yes|-p|--package)(\s|=|\z)|(^|[\s/\x22])(npx|bunx)([.]cmd)?\x22?\s+(-[^\s;&|]+\s+)*(@[a-z0-9_.-]+/)?[a-z0-9_.-]+@[a-z0-9^~._-]+|(^|[\s/\x22])(npx|bunx)([.]cmd)?\x22?\s+(-[^\s;&|]+\s+)*create-[a-z0-9_.-]+|(pnpm|yarn)\s+dlx\s|npm\s+exec\s+(-y|--yes)|yarn\s+add|pnpm\s+(add|i|install)\s|bun\s+(add|install)\s|winget\s+install|choco\s+install|brew\s+install|apt(-get)?\s+install|cargo\s+install|go\s+install|install-module|install-package"),"package_install",null()))
description = v1.1 Classifies one agent-executed command line into action categories (multivalue, null when routine). High-signal: credential_access (secret files such as .env/.env.local but not .env.example/.sample/.template copies, credential stores, token printing), persistence (scheduled tasks, crontab edits/installs including crontab -u <user> -e and crontab -, launchd, Run keys, services), system_change (sudo/runas, Defender, firewall, local admin, registry writes, execution policy). Development (low weight): network_transfer (curl/wget/scp/rclone, PowerShell web cmdlets, git push), destructive (recursive deletes, forced git rewrites, DROP/TRUNCATE), package_install (pip/uv/uvx/npm install/yarn/pnpm/winget/choco/brew/apt, and npx/bunx only when they fetch a package: -y/--yes/-p, name@version, create-*, dlx; npx jest/tsc/prettier is routine). Input: lower-cased command line with backslashes folded to "/". Weights, the command_sample order and the ATT&CK mapping live in the search.
disabled = False
iseval = 0

[hdsi_ai_agent_autonomous_action_detection_min_actions]
definition = 3
description = v1.1 Minimum distinct non-probe command lines one agent must run for one user on one host in the hourly window before a routine agent_activity row is emitted. Development categories emit agent_activity regardless, and high-signal categories always emit their own rows. Distinct is counted on the full command line, so where the process field is truncated (e.g. long PowerShell wrappers) many executions can collapse into one; event_count carries the raw execution count. Derive per tenant from the README Threshold search.
disabled = False
iseval = 0

[hdsi_ai_agent_autonomous_action_detection_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation and scoring (one row per user, dest, agent and risk_category; fields: user, dest, user_display, dest_display, agent_tool, provider, agent_process, risk_category, risk_tier, action_count, event_count, action_categories, high_categories, dev_categories, action_category_list, mitre_attack, command_sample, child_processes, sandbox_user, risk_multiplier, risk_score). Example: drop agent_activity rows for build hosts with search NOT (risk_category="agent_activity" dest="ci-*"). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_agent_autonomous_action_detection_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. The search sets risk_score per row: agent_activity 10 plus 5 per development category (max 25, no multiplier); credential_access 25, persistence 30, system_change 25, each times risk_multiplier and capped at 60. The score applies to both the user and the system object. Override or rescale risk_score here. Ships as search *.
disabled = False
iseval = 0

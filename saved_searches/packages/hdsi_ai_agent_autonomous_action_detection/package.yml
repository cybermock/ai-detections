version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Agent Autonomous Action Detection
description: "Detects AI coding agents and agent frameworks (Claude Code, OpenAI Codex, GitHub Copilot agent, Gemini CLI, Aider, CrewAI and others) executing commands on an endpoint, identified by the agent binary or package path as parent process. Start-up probes are ignored. Ordinary agent work (routine commands, package installs, git push, downloads, recursive deletes) adds one low-score agent_activity risk event per user and host per day; credential access, persistence and system changes each add their own risk event and are never allow-listed. Risk on the user and host, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - process
  - endpoint
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Endpoint.Processes"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Sanctioned DLP Violation
description: "Raises risk when a DLP control finds sensitive content (credentials, payment cards, regulated identifiers, classified files) going to an AI service the organisation has approved. Two data paths: Microsoft Purview DLP matches on Microsoft 365 Copilot prompts and items (o365:management:activity DLPRuleMatch; set the O365 index, no other tuning), and CIM DLP incidents (DLP.DLP_Incidents) whose destination resolves to an AI provider allow-listed in ai_sanctioned_entities (the complement of the incubating, unreleased hdsi_ai_dlp_violation_on_service_upload; unsanctioned providers are not covered by a released rule). Risk on the user and source host only, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_risk_multiplier
  - macros:ai_unsanctioned_filter(3)
tags:
  - rba_only
  - data_exfiltration
  - o365
data_prereqs:
  searches:
    op: OR
    items:
    - '| tstats count where index=* sourcetype="o365:management:activity" TERM(DLPRuleMatch) (TERM(Copilot-Sydney) OR TERM(Copilot.M365) OR TERM(FIRST_PARTY_GENERATIVE_AI)) earliest=-7d@d | where count > 0'
    - '| tstats summariesonly=false allow_old_summaries=true count from datamodel=DLP.DLP_Incidents where (DLP_Incidents.app IN ("*chatgpt*","*openai*","*claude*","*anthropic*","*gemini*","*bard*","*copilot*","*deepseek*","*perplexity*","*mistral*","*grok*","*character.ai*","*huggingface*") OR DLP_Incidents.dest IN ("*chatgpt.com*","*openai.com*","*oaiusercontent.com*","*claude.ai*","*anthropic.com*","*gemini.google.com*","*generativelanguage.googleapis.com*","*copilot.microsoft.com*","*deepseek.com*","*perplexity.ai*","*mistral.ai*","*grok.com*","*huggingface.co*")) earliest=-1d@d | where count > 0'
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

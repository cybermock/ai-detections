[hdsi_ai_sanctioned_dlp_violation_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the CIM DLP path, applied inside the DLP.DLP_Incidents tstats where clause before aggregation. Use datamodel field names, e.g. NOT DLP_Incidents.signature IN ("Monitor only*") or NOT DLP_Incidents.vendor_product="Varonis*" for data-at-rest scanners that can never name an AI destination. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_sanctioned_dlp_violation_content_evidence]
definition = (isnotnull(dlp_type) OR match(lower(mvjoin(signature," ")),"\\b(dlp|data loss|pii|pci|phi|hipaa|ssn|social security|credit card|card number|cardholder|iban|bank account|routing number|passport|tax id|confidential|classified|sensitive (data|info|information|content|files?|documents?)|secrets?|passwords?|api keys?|private keys?|access keys?|source code|gdpr|personal data|customer data|financial data|health data|exact data match|edm|fingerprint)\\b"))
description = v1.1 Eval condition for the CIM DLP path (per tstats row: user/src/dest/app/signature/dlp_type, so each policy hit is gated before aggregation) that keeps only incidents with content-inspection evidence: a CIM dlp_type, or a policy/signature name that names a data class. A file name (object) or a rated severity alone is NOT evidence: CASB/SSE add-ons tag access-control, threat and malicious-site alerts dlp+incident, and those alerts carry file names and severities too. Copied verbatim from hdsi_ai_dlp_violation_on_service_upload_content_evidence (same tstats grouping); keep the two identical so each AI-bound incident is scored by exactly one of the two rules. Use true() only if the feed holds nothing but content DLP incidents.
disabled = False
iseval = 0

[hdsi_ai_sanctioned_dlp_violation_purview_events]
definition = index=* sourcetype="o365:management:activity" Operation="DLPRuleMatch"
description = v1.1 Base event search for the Microsoft Purview path (Office 365 Management Activity audit, Splunk Add-on for Microsoft Office 365). Set this to the O365 audit index (the only required tuning step); append NOT terms to exclude policies, e.g. NOT "PolicyDetails{}.PolicyName"="Test*". With index=* and the 72 h event-time lookback, one hourly slot took 1-7 s on the validation tenants.
disabled = False
iseval = 0

[hdsi_ai_sanctioned_dlp_violation_purview_window]
definition = earliest=-72h@h latest=now _index_earliest=-65m@m _index_latest=-5m@m
description = v1.1 Time scope of the Purview path: DLPRuleMatch events indexed in the hourly dispatch slot whose event time is within 72 h. The O365 audit API delivers late. Over 30 days, all DLPRuleMatch events on the validation tenants lagged up to 5.7 days (Tenant C p99 about 8.3 h, Tenant A p99 about 35 h); the in-scope Copilot events with a sensitive type lagged at most about 6.5 h (30 days) and under 7 min (7 days). 72 h covers Tenant A p99 and cost the same as 24 h in live tests. Keep _index_earliest/_index_latest aligned with dispatch.earliest_time/latest_time.
disabled = False
iseval = 0

[hdsi_ai_sanctioned_dlp_violation_purview_ai_scope]
definition = (match(lower(mvjoin(pv_hostcat,",")),"first_party") OR match(lower(coalesce(Location,"")),"^copilot"))
description = v1.1 Eval condition that keeps Purview DLP matches on Microsoft first-party generative AI: SessionMetadata.AppHostCategories FIRST_PARTY_GENERATIVE_AI / PURVIEW_ECOSYSTEM_FIRST_PARTY_AI, or a Location such as Copilot-Sydney (prompts) and Copilot.M365 (items Copilot processes). Exchange, SharePoint, OneDrive, Teams and Endpoint DLP matches are excluded.
disabled = False
iseval = 0

[hdsi_ai_sanctioned_dlp_violation_purview_content_evidence]
definition = (isnotnull(dlp_type) OR isnotnull(mvfind(lower(dlp_severity),"^(medium|high|critical)$")))
description = v1.1 Eval condition for the Purview path that keeps rule matches showing sensitive content: a matched sensitive information type (dlp_type, after the confidence floor) or a rule the tenant rated medium/high. Drops low-severity rules without a sensitive type, such as "do not let Copilot process external email" (about 6,000 matches a day on one validation tenant) and label-only simulation matches. Policy names are not used: the Microsoft default "Protect sensitive M365 Copilot interactions" would match any data-class keyword. Use true() to accept every Copilot DLP match.
disabled = False
iseval = 0

[hdsi_ai_sanctioned_dlp_violation_purview_min_confidence]
definition = 85
description = v1.1 Minimum Purview sensitive-information-type confidence (65 low, 75 medium, 85 high) for a type to count as content evidence. High-impact types (see ..._high_impact_types) are also accepted at 75. On one validation tenant the Microsoft default Copilot policy matched about 25 foreign national-ID and tax-number types for a handful of users every day, mostly at 65-75 confidence; the floor removed most of them (30 days: 4 users to 2), but the types reported at 85 (a foreign tax ID, a DEA number) still pass. Put such types in ..._purview_ignored_types; a confidence floor alone cannot separate them. Credential types reported at 75 are accepted through the high-impact rule.
disabled = False
iseval = 0

[hdsi_ai_sanctioned_dlp_violation_purview_ignored_types]
definition = "^(ip address)"
description = v1.1 Quoted regex of lowercased Purview sensitive information type names that never count as content evidence (matched against "<type name>#<confidence>"). Ships with IP Address types, which the Microsoft default Copilot policy reports but which are not sensitive in a prompt. Add tenant noise, e.g. "^(ip address|polish regon)".
disabled = False
iseval = 0

[hdsi_ai_sanctioned_dlp_violation_high_impact_types]
definition = "credential|password|secret|private key|access key|api key|access token|connection string|credit card|card number|bank account|u\\.s\\. social security|\\bssn\\b"
description = v1.1 Quoted regex matched against the lowercased DLP data types (dlp_type / Purview sensitive information type names). A match raises the row to the high-severity base score (30), because credentials and payment data in an AI prompt need action (rotate, notify) even on an approved service, and lets a Purview type count from confidence 75. Ships with credentials, secrets, payment cards, bank accounts and US SSN; foreign national-ID types were deliberately left out (they were the main false positives of the Microsoft default Copilot policy on one validation tenant). Add the national IDs your organisation actually holds.
disabled = False
iseval = 0

[hdsi_ai_sanctioned_dlp_violation_blocked_factor]
definition = 0.5
description = v1.1 Score factor for a user/host whose matches in the window were all blocked: every CIM action is block/deny/quarantine/prevent/restrict, or, for Purview, at least one rule in the event is itself enforced (RuleMode Enable) and has a block/RestrictAccess action (tested per rule, so a simulation rule with RestrictAccess next to an enforced notify-only rule does not count). Purview RestrictWebGrounding, simulation-mode rules and the event-level RemediationActivity (ContentBlocked also appears on simulation-only matches) count as not blocked. 1 = score blocked attempts like completed ones; 0 = drop fully blocked rows.
disabled = False
iseval = 0

[hdsi_ai_sanctioned_dlp_violation_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation (one row per user and src; fields: user, src, risk_target (user or system; a row that names both is split in two), user_display, src_display, provider, ai_domains, usage_types, data_sources, violations, dlp_policies, dlp_types, dlp_actions, policy_modes, dlp_severity_max, dlp_outcome, objects, vendor_product, severity_weight, risk_multiplier, risk_score, firstTime, lastTime). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_sanctioned_dlp_violation_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. risk_score is already set: base 30 (high/critical severity or a high-impact data type), 20 (medium or unrated) or 10 (low), x provider severity_weight (1.0 for Copilot) x identity risk_multiplier x blocked_factor, clamped 5-45. Each row carries one risk object (risk_target): a host row gets half the user score (minimum 5). Ships as search *.
disabled = False
iseval = 0

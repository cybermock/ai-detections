action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$risk_object$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View Purview DLP matches on Microsoft 365 Copilot for $user_display$","search":"search `hdsi_ai_sanctioned_dlp_violation_purview_events` (UserId=\"$user$\" OR user=\"$user$\") | rename \"SessionMetadata.AppHostCategories{}\" as pv_hostcat | where `hdsi_ai_sanctioned_dlp_violation_purview_ai_scope` | rename \"SessionMetadata.AppHost\" as app_host, \"PolicyDetails{}.PolicyName\" as policy, \"PolicyDetails{}.Rules{}.RuleName\" as rule, \"PolicyDetails{}.Rules{}.RuleMode\" as rule_mode, \"PolicyDetails{}.Rules{}.Severity\" as rule_severity, \"PolicyDetails{}.Rules{}.Actions{}\" as rule_actions, \"PolicyDetails{}.Rules{}.ConditionsMatched.SensitiveInformation{}.SensitiveInformationTypeName\" as sensitive_info_types, \"RemediationDetails.RemediationActivity\" as remediation | table _time, UserId, Location, app_host, policy, rule, rule_mode, rule_severity, rule_actions, remediation, sensitive_info_types | sort - _time","earliest_offset":"259200","latest_offset":"$info_max_time$"},{"name":"View CIM DLP incidents for $user_display$ on $src_display$","search":"| tstats summariesonly=false allow_old_summaries=true fillnull_value=\"unknown\" count min(_time) as firstTime max(_time) as lastTime values(DLP_Incidents.object) as objects values(DLP_Incidents.signature) as dlp_policies values(DLP_Incidents.dlp_type) as dlp_types values(DLP_Incidents.severity) as dlp_severity values(DLP_Incidents.action) as dlp_action values(DLP_Incidents.vendor_product) as vendor_product from datamodel=DLP.DLP_Incidents where (DLP_Incidents.user=\"$user$\" OR DLP_Incidents.src_user=\"$user$\" OR DLP_Incidents.src=\"$src$\") by DLP_Incidents.user DLP_Incidents.src DLP_Incidents.dest DLP_Incidents.app | rename DLP_Incidents.* as * | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, dest, app, dlp_policies, dlp_types, dlp_severity, dlp_action, objects, vendor_product, count | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = DLP flagged $violations$ item(s) for $user_display$ on $src_display$ sent to sanctioned AI service(s) $provider$ ($ai_domains$) via $data_sources$: policies $dlp_policies$, data types $dlp_types$, objects $objects$, highest severity $dlp_severity_max$, outcome $dlp_outcome$. Policy modes: $policy_modes$. risk_multiplier $risk_multiplier$.
action.notable.param.rule_title = HDSI AI Sanctioned DLP Violation ($user_display$ on $src_display$)
action.notable.param.security_domain = audit
action.notable.param.severity = medium
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":20},{"risk_object_field":"src","risk_object_type":"system","risk_score":10}]
action.risk.param._risk_message = DLP flagged $violations$ item(s) for $user_display$ on $src_display$ sent to sanctioned AI service(s) $provider$ ($ai_domains$) via $data_sources$: policies $dlp_policies$, data types $dlp_types$, objects $objects$, highest severity $dlp_severity_max$, outcome $dlp_outcome$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user,src
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 23 * * * *
description = v1.1.0 Correlates DLP content matches on data sent to an AI service the organisation has sanctioned: CIM DLP incidents (DLP.DLP_Incidents) whose destination resolves to an AI provider that ai_sanctioned_entities allow-lists for the user or host (the complement of hdsi_ai_dlp_violation_on_service_upload), and Microsoft Purview DLP matches on Microsoft 365 Copilot prompts and items (o365:management:activity DLPRuleMatch). Risk on the user and source host only, no notable.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=false allow_old_summaries=true fillnull_value="unknown" count min(_time) as firstTime max(_time) as lastTime values(DLP_Incidents.object) as object values(DLP_Incidents.severity) as dlp_severity values(DLP_Incidents.action) as dlp_action values(DLP_Incidents.vendor_product) as vendor_product from datamodel=DLP.DLP_Incidents where (DLP_Incidents.dest=* OR DLP_Incidents.app=*) `hdsi_ai_sanctioned_dlp_violation_filter` by DLP_Incidents.user DLP_Incidents.src_user DLP_Incidents.src DLP_Incidents.dest DLP_Incidents.app DLP_Incidents.signature DLP_Incidents.dlp_type \
	| rename DLP_Incidents.* as * \
	| eval user=coalesce(nullif(user,"unknown"),nullif(src_user,"unknown")), src=nullif(src,"unknown"), dest=nullif(dest,"unknown"), app=nullif(app,"unknown") \
	| eval user=if(isnull(user) OR match(lower(user),"^(|-|n/a|null|none|system|local service|network service)$") OR match(lower(user),"\\\\(system|local service|network service)$") OR match(user,"\$$"),null(),user), src=if(isnull(src) OR match(lower(src),"^(|-|n/a|null|none|127\.0\.0\.1|::1)$"),null(),src) \
	| eval object=mvfilter(object!="unknown" AND object!=""), signature=mvfilter(signature!="unknown" AND signature!=""), dlp_type=mvfilter(dlp_type!="unknown" AND dlp_type!=""), dlp_severity=mvfilter(dlp_severity!="unknown" AND dlp_severity!=""), dlp_action=mvfilter(dlp_action!="unknown" AND dlp_action!="") \
	| where (isnotnull(user) OR isnotnull(src)) AND (isnotnull(dest) OR isnotnull(app)) AND `hdsi_ai_sanctioned_dlp_violation_content_evidence` \
	| streamstats count as dlp_row \
	| eval ai_domain=mvappend(dest,app) \
	| mvexpand ai_domain \
	| `ai_domains_filter` \
	| dedup dlp_row \
	| appendpipe [| `ai_unsanctioned_filter(user,src,provider)` | eval unsanctioned_copy=1] \
	| eventstats max(unsanctioned_copy) as unsanctioned by dlp_row \
	| where isnull(unsanctioned) \
	| eval data_source="CIM DLP", not_blocked=if(isnull(dlp_action) OR mvcount(mvfilter(NOT match(lower(dlp_action),"^(block|blocked|deny|denied|drop|dropped|quarantine|quarantined|prevent|prevented|restrict|restricted)$")))>0,1,0), policy_mode=null() \
	| fields user src provider ai_domain usage_type severity_weight count object signature dlp_type dlp_severity dlp_action vendor_product data_source not_blocked policy_mode firstTime lastTime \
	| append [search `hdsi_ai_sanctioned_dlp_violation_purview_events` `hdsi_ai_sanctioned_dlp_violation_purview_window` | rename "SessionMetadata.AppHostCategories{}" as pv_hostcat, "SessionMetadata.AppHost" as pv_apphost, "PolicyDetails{}.PolicyName" as signature, "PolicyDetails{}.Rules{}.Severity" as dlp_severity, "PolicyDetails{}.Rules{}.RuleMode" as pv_rule_mode, "PolicyDetails{}.Rules{}.Actions{}" as dlp_action, "PolicyDetails{}.Rules{}.ConditionsMatched.SensitiveInformation{}.SensitiveInformationTypeName" as dlp_type, "PolicyDetails{}.Rules{}.ConditionsMatched.SensitiveInformation{}.Confidence" as pv_sit_conf, "ItemMetadata.Id" as pv_item, "ItemMetadata.Name" as pv_item_name | where `hdsi_ai_sanctioned_dlp_violation_purview_ai_scope` | eval user=coalesce(UserId,user), user=if(isnull(user) OR match(lower(user),"^(|-|n/a|null|none|unknown)$"),null(),user), dlp_severity=mvdedup(dlp_severity), pv_sit=if(isnull(pv_sit_conf),mvmap(dlp_type,dlp_type."#100"),mvzip(dlp_type,pv_sit_conf,"#")) | eval pv_sit=mvfilter((tonumber(replace(pv_sit,"^.*#",""))>=`hdsi_ai_sanctioned_dlp_violation_purview_min_confidence` OR (tonumber(replace(pv_sit,"^.*#",""))>=75 AND match(lower(pv_sit),`hdsi_ai_sanctioned_dlp_violation_high_impact_types`))) AND NOT match(lower(pv_sit),`hdsi_ai_sanctioned_dlp_violation_purview_ignored_types`)) | eval dlp_type=mvdedup(mvmap(pv_sit,replace(pv_sit,"#[^#]*$",""))) | where isnotnull(user) AND `hdsi_ai_sanctioned_dlp_violation_purview_content_evidence` | spath path="PolicyDetails{}.Rules{}" output=pv_rules | eval pv_prompt=if(match(lower(coalesce(Location,"")),"sydney") OR lower(coalesce(pv_item_name,""))="sydney.prompt",1,0), object=if(pv_prompt=1,"prompt in ".coalesce(pv_apphost,"Copilot"),pv_item_name), pv_item=coalesce(pv_item,Id), pv_rule_blocked=mvmap(pv_rules,if(lower(spath(pv_rules,"RuleMode"))="enable" AND match(lower(mvjoin(spath(pv_rules,"Actions{}"),",")),"block|restrictaccess"),"y","n")), not_blocked=if(isnotnull(mvfind(pv_rule_blocked,"^y$")),0,1), policy_mode=mvdedup(mvmap(pv_rule_mode,case(lower(pv_rule_mode)="enable","enforced",match(lower(pv_rule_mode),"^test"),"simulation",true(),lower(pv_rule_mode)))), ai_domain=lower(coalesce(pv_apphost,Location)) | stats dc(pv_item) as count values(ai_domain) as ai_domain values(object) as object values(signature) as signature values(dlp_type) as dlp_type values(dlp_severity) as dlp_severity values(dlp_action) as dlp_action values(policy_mode) as policy_mode max(not_blocked) as not_blocked min(_time) as firstTime max(_time) as lastTime by user | eval src=null(), provider="Microsoft 365 Copilot", usage_type="web", severity_weight=1.0, vendor_product="Microsoft Purview DLP", data_source="Purview DLP for Copilot"] \
	| eval severity_weight=coalesce(tonumber(severity_weight),1.0), sev_list=lower(mvjoin(dlp_severity,",")), sev_rank=case(match(sev_list,"critical|high"),3, match(sev_list,"medium"),2, match(sev_list,"low|info"),1, true(),0), sev_rank=if(match(lower(mvjoin(dlp_type," ")),`hdsi_ai_sanctioned_dlp_violation_high_impact_types`),3,sev_rank) \
	| fillnull value="" user src \
	| stats sum(count) as violations values(provider) as provider values(ai_domain) as ai_domains values(usage_type) as usage_types values(data_source) as data_sources values(object) as objects values(signature) as dlp_policies values(dlp_type) as dlp_types values(dlp_action) as dlp_actions values(policy_mode) as policy_modes values(vendor_product) as vendor_product max(severity_weight) as severity_weight max(sev_rank) as sev_rank max(not_blocked) as not_blocked min(firstTime) as firstTime max(lastTime) as lastTime by user src \
	| eval user=nullif(user,""), src=nullif(src,""), user_display=coalesce(user,"no attributed user"), src_display=coalesce(src,"no attributed host") \
	| eval dlp_severity_max=case(sev_rank=3,"high",sev_rank=2,"medium",sev_rank=1,"low",true(),"unrated"), dlp_outcome=if(not_blocked=1,"not blocked","blocked"), blocked_factor=if(not_blocked=1,1,`hdsi_ai_sanctioned_dlp_violation_blocked_factor`) \
	| where blocked_factor>0 \
	| eval provider=mvjoin(provider,", "), ai_domains=mvjoin(mvindex(ai_domains,0,4),", "), usage_types=mvjoin(usage_types,", "), data_sources=mvjoin(data_sources,", "), objects=coalesce(mvjoin(mvindex(objects,0,4),", "),"not recorded"), dlp_policies=coalesce(mvjoin(mvindex(dlp_policies,0,4),", "),"not recorded"), dlp_types=coalesce(mvjoin(mvindex(dlp_types,0,4),", "),"not recorded"), dlp_actions=mvjoin(dlp_actions,", "), policy_modes=mvjoin(policy_modes,", "), vendor_product=mvjoin(vendor_product,", ") \
	| `ai_risk_multiplier` \
	| eval risk_score=min(45,max(5,round(case(sev_rank=3,30,sev_rank=1,10,true(),20)*coalesce(risk_multiplier,1)*severity_weight*blocked_factor))) \
	| eval risk_target=mvappend(if(isnotnull(user),"user",null()),if(isnotnull(src),"system",null())) \
	| mvexpand risk_target \
	| eval user=if(risk_target="user",user,null()), src=if(risk_target="system",src,null()), risk_score=if(risk_target="system",max(5,round(risk_score/2)),risk_score) \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="sanctioned_ai_dlp", detection_id="hdsi_ai_sanctioned_dlp_violation", mitre_attack="T1567", ai_kill_chain_phase="exfiltration" \
	| fields - sev_rank not_blocked sev_list \
	| `hdsi_ai_sanctioned_dlp_violation_customizations` \
	| `hdsi_ai_sanctioned_dlp_violation_risk_score`

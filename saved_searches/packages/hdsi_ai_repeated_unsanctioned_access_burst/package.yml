version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Repeated Unsanctioned Access Burst
description: "Detects a user, or a host without a user, that keeps trying to reach an AI provider after the web control (proxy, NGFW URL filtering, SSE or enterprise browser) has blocked it: at least 10 blocked requests spread over at least 3 separate minutes in 15 minutes. Needs Web data model events with Web.action=blocked for AI destinations. Risk on user and src, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - web
  - proxy
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Web"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

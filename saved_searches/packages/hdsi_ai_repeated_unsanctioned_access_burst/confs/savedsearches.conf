action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Repeated Unsanctioned Access Burst
action.correlationsearch.annotations = {"mitre_attack": ["T1588.007"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$entity_dd$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI web activity (blocked and allowed) for $entity$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count min(_time) as firstTime max(_time) as lastTime values(Web.http_method) as http_method values(Web.dest) as dest from datamodel=Web where (Web.user=\"$entity_dd$\" OR Web.src=\"$entity_dd$\") by Web.user Web.src Web.url_domain Web.site Web.action sourcetype _time span=1m | rename Web.* as * | eval ai_domain=lower(coalesce(nullif(url_domain,\"unknown\"),nullif(site,\"unknown\"))), ai_input_type=if(isnull(nullif(url_domain,\"unknown\")),\"app\",\"host\") | `ai_domains_filter` | stats sum(count) as count dc(_time) as active_minutes min(firstTime) as firstTime max(lastTime) as lastTime values(dest) as dest values(http_method) as http_method by user src provider ai_domain action sourcetype | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, provider, ai_domain, action, count, active_minutes, http_method, dest, sourcetype | sort provider - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = $user_display$ on $src_display$ kept trying to reach $provider$ after the web control refused it: $blocked_attempts$ blocked requests in $blocked_minutes$ separate minutes ($ai_domain_sample$).
action.notable.param.rule_title = HDSI AI Repeated Unsanctioned Access Burst ($entity$, $provider$)
action.notable.param.security_domain = network
action.notable.param.severity = low
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":20},{"risk_object_field":"src","risk_object_type":"system","risk_score":10}]
action.risk.param._risk_message = $user_display$ on $src_display$ kept trying to reach $provider$ after the web control refused it: $blocked_attempts$ blocked requests in $blocked_minutes$ separate minutes within 15 minutes ($ai_domain_sample$).
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = entity,provider
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 3-59/15 * * * *
description = v1.1.0 Detects a user (or a host without a user) that keeps trying to reach an AI provider the web control blocks: at least 10 refused requests spread over at least 3 separate minutes in 15 minutes, from proxy, NGFW URL filtering, SSE or enterprise browser logs. Risk only, no notable.
disabled = 0
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count from datamodel=Web where `hdsi_ai_repeated_unsanctioned_access_burst_blocked_actions` `hdsi_ai_repeated_unsanctioned_access_burst_filter` by Web.user Web.src Web.url_domain Web.site Web.action sourcetype _time span=1m \
	| rename Web.* as * \
	| eval ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))), ai_input_type=if(isnull(nullif(url_domain,"unknown")),"app","host") \
	| `ai_domains_filter` \
	| eval user=if(isnull(user) OR in(lower(trim(user)),"unknown","-","","n/a","none","null"), null(), lower(trim(user))), src=if(isnull(src) OR in(lower(trim(src)),"unknown","-",""), null(), src) \
	| where isnotnull(user) OR isnotnull(src) \
	| eventstats dc(user) as _src_user_count values(user) as _src_users by src \
	| eval user=coalesce(user, if(_src_user_count=1, _src_users, null())), entity=coalesce(user, src), severity_weight=tonumber(severity_weight) \
	| stats sum(count) as blocked_attempts dc(_time) as blocked_minutes values(ai_domain) as ai_domains dc(ai_domain) as ai_domain_count values(src) as srcs dc(src) as src_count values(user) as user values(usage_type) as usage_type values(action) as action values(sourcetype) as orig_sourcetype max(severity_weight) as severity_weight min(_time) as firstTime max(_time) as lastTime by entity provider \
	| where blocked_attempts>=`hdsi_ai_repeated_unsanctioned_access_burst_min_attempts` AND blocked_minutes>=`hdsi_ai_repeated_unsanctioned_access_burst_min_minutes` \
	| eval src=if(src_count=1, srcs, null()), src_display=case(src_count=1, srcs, src_count>1, src_count." hosts", true(), "an unknown host"), user_display=coalesce(user, "an unattributed user") \
	| where isnotnull(user) OR NOT (`hdsi_ai_repeated_unsanctioned_access_burst_unreliable_src`) \
	| lookup identity_lookup_expanded identity as user OUTPUTNEW bunit \
	| eval bunit=mvindex(bunit,0) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| `ai_risk_multiplier` \
	| eval severity_weight=coalesce(severity_weight, 1.0), base_score=if(isnotnull(user), 20, 10), risk_score=max(1, min(50, round(base_score*severity_weight*coalesce(risk_multiplier,1), 0))) \
	| eval ai_domain_sample=mvjoin(mvindex(ai_domains,0,4),", "), usage_type=mvjoin(usage_type,","), action=mvjoin(action,","), orig_sourcetype=mvjoin(orig_sourcetype,",") \
	| fields - ai_domains srcs src_count _allow_* _final_multiplier \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval entity_dd=replace(entity,"[\\\\\"]","*"), ai_activity="repeated_blocked_access", detection_id="hdsi_ai_repeated_unsanctioned_access_burst", mitre_attack="T1588.007", ai_kill_chain_phase="recon" \
	| `hdsi_ai_repeated_unsanctioned_access_burst_customizations` \
	| `hdsi_ai_repeated_unsanctioned_access_burst_risk_score`

[hdsi_ai_repeated_unsanctioned_access_burst_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the Web tstats where clause before aggregation. Use datamodel field names, e.g. NOT Web.src IN ("10.20.0.0/16") for a guest network or NOT Web.user IN ("svc_*"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_repeated_unsanctioned_access_burst_blocked_actions]
definition = (Web.action IN ("blocked","block","denied","deny","dropped","drop","rejected","reset"))
description = v1.1 Web.action values that mean the web control (proxy, NGFW URL filtering, SSE, enterprise browser) refused the request. Applied inside the tstats where clause, so only refused requests are read; this also keeps the run cheap (about 8 s per 15-minute window on the largest validation tenant, versus about 200 s for all Web traffic). CIM uses "blocked"; the other values cover TAs that pass the vendor verb through. Allowed, isolated (remote browser isolation), reported or warned requests are not attempts against a block and are deliberately absent.
disabled = False
iseval = 0

[hdsi_ai_repeated_unsanctioned_access_burst_min_attempts]
definition = 10
description = v1.1 Minimum refused requests from one user (or one host without a user) to one AI provider within the 15-minute window. Used together with min_minutes. Derive a tenant value with the copy-paste SPL in the README.
disabled = False
iseval = 0

[hdsi_ai_repeated_unsanctioned_access_burst_min_minutes]
definition = 3
description = v1.1 Minimum number of distinct minutes, within the 15-minute window, that contain refused requests to the provider. One blocked page load produces many refused sub-requests in the same minute; requiring several separate minutes means the person or tool kept trying after being refused.
disabled = False
iseval = 0

[hdsi_ai_repeated_unsanctioned_access_burst_unreliable_src]
definition = (match(src,"^[0-9]{1,3}([.][0-9]{1,3}){3}$") AND NOT (cidrmatch("10.0.0.0/8",src) OR cidrmatch("172.16.0.0/12",src) OR cidrmatch("192.168.0.0/16",src) OR cidrmatch("100.64.0.0/10",src)))
description = v1.1 Eval expression marking source addresses that are not a stable internal host. Rows that match and have no user are dropped, because their only risk object would be an address that is not one of your endpoints. Ships as "public IPv4 address": inbound WAF, load-balancer and web-server logs in the Web data model carry internet clients as src, and their blocked requests (scanners sending AI-provider Host headers) are not your users trying to reach AI. Hostnames and private or CGNAT addresses are kept, so inbound web servers behind a load balancer or reverse proxy (src = the balancer's private address) are not caught here; exclude those sourcetypes or balancer addresses in the _filter macro. Extend with guest or BYOD Wi-Fi, NAT or VPN pools, e.g. append OR cidrmatch("10.200.0.0/16",src). Use false() to keep every host-only row.
disabled = False
iseval = 0

[hdsi_ai_repeated_unsanctioned_access_burst_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation and scoring (fields: entity, entity_dd, user, user_display, src, src_display, bunit, sensitivity_level, provider, usage_type, ai_domain_sample, ai_domain_count, blocked_attempts, blocked_minutes, action, orig_sourcetype, severity_weight, risk_multiplier, base_score, risk_score, firstTime, lastTime). entity_dd is entity with backslashes and double quotes replaced by * for the drilldowns; keep it if you rename entity. Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_repeated_unsanctioned_access_burst_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. The SPL sets risk_score = min(50, round(base x severity_weight x risk_multiplier)) with base 20 when a user is attributed and 10 for host-only rows; the value applies to every risk object in the row. Override risk_score (1-100) here per tenant. Ships as search *.
disabled = False
iseval = 0

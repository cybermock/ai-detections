[hdsi_ai_agent_framework_execution_cli_names]
definition = "crewai","crewai.exe","autogpt","autogpt.exe","autogenstudio","autogenstudio.exe","langgraph","langgraph.exe","langchain","langchain.exe","metagpt","metagpt.exe","openhands","openhands.exe","opendevin","opendevin.exe","sweagent","sweagent.exe","swe-agent","swe-agent.exe","gpte","gpte.exe","gpt-engineer","gpt-engineer.exe","smolagent","smolagent.exe","babyagi","babyagi.exe","superagi","superagi.exe","agentgpt","agentgpt.exe","smol-developer","smol-developer.exe"
description = v1.1 Agent framework console-script names matched exactly on Processes.process_name (Windows pip/uv launchers and EDRs that report the script name). Used inside Processes.process_name IN (...). Add new framework CLIs here.
disabled = False
iseval = 0

[hdsi_ai_agent_framework_execution_launchers]
definition = "python*","pythonw*","py.exe","pyw.exe","uv","uv.exe","uvx","uvx.exe","pipx","pipx.exe","poetry","poetry.exe","docker","docker.exe","podman","podman.exe"
description = v1.1 Interpreters and launchers whose command line is inspected for a framework module, script or container image (python -m openhands..., uvx crewai, docker run .../openhands). On Linux/macOS most EDRs report python3 as process_name for console scripts, so matching process_name alone misses them.
disabled = False
iseval = 0

[hdsi_ai_agent_framework_execution_cmdline_patterns]
definition = "*crewai*","*autogpt*","*auto-gpt*","*autogenstudio*","*autogen_studio*","*autogen-studio*","*langgraph*","*langserve*","*langchain*serve*","*metagpt*","*openhands*","*opendevin*","*all-hands*","*sweagent*","*swe-agent*","*gpt-engineer*","*gpt_engineer*","*devika.py*","*babyagi*","*superagi*","*agentgpt*","*smol_dev*","*smol-dev*","*smolagent*"
description = v1.1 Command-line wildcards (Processes.process) applied only to the launcher process names. Patterns are framework-specific on purpose: bare words such as "devika" or "autogen" also occur in user profile paths and generic scripts.
disabled = False
iseval = 0

[hdsi_ai_agent_framework_execution_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the tstats where clause before aggregation. Use Endpoint.Processes field names, e.g. NOT Processes.dest IN ("build-*") or NOT Processes.user IN ("svc_ci*"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_agent_framework_execution_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation (fields: user, src, provider, agent_class, process_name, process, parent_process_name, count). Use it to drop sanctioned developer hosts or frameworks. Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_agent_framework_execution_risk_score]
definition = search *
description = v1.1 Risk score hook, last pipe. Static scores ship in action.risk.param._risk (user 40, system 30); set a numeric risk_score field here (min(100,...)) to override both objects for a row. Ships as search *.
disabled = False
iseval = 0

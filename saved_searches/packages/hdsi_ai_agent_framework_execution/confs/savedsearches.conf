description = v1.1.0 Detects execution of autonomous AI agent and agent-orchestration frameworks (CrewAI, AutoGen Studio, LangGraph/LangServe, OpenHands, SWE-agent, MetaGPT, GPT-Engineer, AutoGPT and similar) from Endpoint.Processes, matching both the framework CLI process name and python/uv/docker command lines. Risk only on user and system, no notable.
disabled = 0
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime values(Processes.parent_process_name) as parent_process_name from datamodel=Endpoint.Processes where (Processes.process_name IN (`hdsi_ai_agent_framework_execution_cli_names`) OR (Processes.process_name IN (`hdsi_ai_agent_framework_execution_launchers`) AND Processes.process IN (`hdsi_ai_agent_framework_execution_cmdline_patterns`))) `hdsi_ai_agent_framework_execution_filter` by Processes.user Processes.dest Processes.process_name Processes.process \
	| rename Processes.* as * \
	| eval cmd_lc=lower(coalesce(process,"")), match_text=lower(process_name)." ".cmd_lc \
	| where NOT match(cmd_lc, "(^|\W)(pip3?|pipx|uv|poetry|conda|mamba|micromamba|npm|pnpm|yarn)(\.exe)?\"?(\s+(tool|pip))?\s+(install|uninstall|add|remove|download|show|list|freeze|sync|lock|inject|upgrade|update|cache)(\s|$)|\s-m\s+(pip|ensurepip|venv|virtualenv|pytest|unittest|pip_audit)(\s|$)|(^|\W)docker(\.exe)?\"?\s+(pull|rmi|images|image|inspect|logs|ps|stop|rm|kill|tag|push|save)(\s|$)") \
	| eval provider=case(match(match_text,"crewai"),"CrewAI", match(match_text,"autogenstudio|autogen[-_]studio"),"AutoGen", match(match_text,"auto-?gpt"),"AutoGPT", match(match_text,"langgraph"),"LangGraph", match(match_text,"langserve|^langchain|langchain\S*\s+serve"),"LangChain", match(match_text,"metagpt"),"MetaGPT", match(match_text,"openhands|opendevin|all-hands"),"OpenHands", match(match_text,"sweagent|swe-agent"),"SWE-agent", match(match_text,"gpt[-_]engineer|^gpte"),"GPT-Engineer", match(match_text,"devika\.py"),"Devika", match(match_text,"babyagi"),"BabyAGI", match(match_text,"superagi"),"SuperAGI", match(match_text,"agentgpt"),"AgentGPT", match(match_text,"smol[-_]dev"),"Smol Developer", match(match_text,"smolagent"),"smolagents") \
	| where isnotnull(provider) \
	| eval agent_class=if(provider IN ("CrewAI","AutoGen","LangGraph","LangChain"),"agent_orchestration","autonomous_agent") \
	| eval user_lc=lower(coalesce(user,"")), user=if(user_lc IN ("","unknown","-","n/a","null","system","root","local service","network service") OR like(user_lc,"nt authority%") OR like(user_lc,"%$"),null(),user), src=if(lower(coalesce(dest,"")) IN ("","unknown","-"),null(),dest) \
	| where isnotnull(src) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| eval user_key=coalesce(user,"__none__") \
	| stats sum(count) as count min(firstTime) as firstTime max(lastTime) as lastTime values(provider) as provider values(agent_class) as agent_class values(process_name) as process_name values(parent_process_name) as parent_process_name values(process) as process by user_key src \
	| eval user=if(user_key="__none__",null(),user_key), user_display=coalesce(user,"an unattributed or system account"), provider=mvjoin(provider,", "), agent_class=mvjoin(agent_class,", "), process_name=mvjoin(process_name,", "), process=mvindex(process,0,4) \
	| fields - user_key \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="agent_framework_execution", detection_id="hdsi_ai_agent_framework_execution", mitre_attack=split("T1059,T1059.006,T1588.007",","), ai_kill_chain_phase="execution" \
	| `hdsi_ai_agent_framework_execution_customizations` \
	| `hdsi_ai_agent_framework_execution_risk_score`

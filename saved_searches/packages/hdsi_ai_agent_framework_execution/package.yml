version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Agent Framework Execution
description: "Detects execution of autonomous AI agent and agent-orchestration frameworks (CrewAI, AutoGen Studio, LangGraph/LangServe, OpenHands, SWE-agent, MetaGPT, GPT-Engineer, AutoGPT and similar) from Endpoint.Processes by framework CLI name or python/uv/docker command line. Excludes package installs and test runs. Risk only on user and system, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_unsanctioned_filter(3)
tags:
  - rba_only
  - process
  - endpoint
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Endpoint.Processes"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

[Identity - HDSI AI User Peer Group Usage Anomaly - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI User Peer Group Usage Anomaly
action.correlationsearch.annotations = {"mitre_attack": ["T1567", "T1588.007"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search source=\"*HDSI AI*\" (risk_object=\"*$user_key$\" OR risk_object=\"$user_key$@*\") | eval user=risk_object | `hdsi_ai_user_peer_group_usage_anomaly_user_key` | search user_key=\"$user_key$\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI web activity for $user$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count sum(Web.bytes_out) as bytes_out min(_time) as firstTime max(_time) as lastTime values(Web.src) as src values(Web.action) as action from datamodel=Web where (Web.user=\"*$user_key$\" OR Web.user=\"$user_key$@*\") `hdsi_ai_user_peer_group_usage_anomaly_web_scope` by Web.user Web.url_domain Web.site | rename Web.* as * | `hdsi_ai_user_peer_group_usage_anomaly_user_key` | search user_key=\"$user_key$\" | eval ai_input_type=if(url_domain=\"unknown\",\"app\",\"host\"), url_domain=coalesce(nullif(url_domain,\"unknown\"),site), ai_domain=lower(url_domain) | `ai_domains_filter` | eval mb_out=round(tonumber(bytes_out)/1048576,2) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, provider, url_domain, site, action, count, mb_out | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI App-ID traffic for $user$","search":"| tstats summariesonly=t allow_old_summaries=t count sum(All_Traffic.bytes_out) as bytes_out min(_time) as firstTime max(_time) as lastTime values(All_Traffic.src) as src values(All_Traffic.dest) as dest values(All_Traffic.action) as action from datamodel=Network_Traffic where (All_Traffic.user=\"*$user_key$\" OR All_Traffic.user=\"$user_key$@*\") `hdsi_ai_user_peer_group_usage_anomaly_nt_scope` by All_Traffic.user All_Traffic.app | rename All_Traffic.* as * | `hdsi_ai_user_peer_group_usage_anomaly_user_key` | search user_key=\"$user_key$\" | eval ai_domain=app, ai_input_type=\"app\" | `ai_domains_filter` | eval mb_out=round(bytes_out/1048576,2) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, dest, app, provider, action, count, mb_out | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = AI usage by $user$ on $data_source$ was far above its peer group ($peer_group$, $peer_size$ users; $outlier_reason$ outlier): $requests$ requests and $mb_out$ MB sent to $providers_list$ versus a peer median of $peer_median_requests$ requests and $peer_median_mb$ MB (robust z $rz_requests$ requests, $rz_bytes$ bytes).
action.notable.param.rule_title = HDSI AI User Peer Group Usage Anomaly ($user$)
action.notable.param.security_domain = identity
action.notable.param.severity = medium
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":20}]
action.risk.param._risk_message = AI usage by $user$ on $data_source$ was far above its peer group ($peer_group$, $peer_size$ users; $outlier_reason$ outlier): $requests$ requests and $mb_out$ MB sent to $providers_list$ versus a peer median of $peer_median_requests$ requests and $peer_median_mb$ MB (robust z $rz_requests$ requests, $rz_bytes$ bytes).
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 604800s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 30 4 * * *
description = v1.1.0 Daily. Risk on a user whose AI requests or upload volume yesterday was a robust outlier against the other AI users of the same identity bunit (or a residual org-wide group when the bunit is small or unknown), from NGFW App-ID traffic and Web proxy/SSE data. Risk only, no notable.
disabled = 0
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t count sum(All_Traffic.bytes_out) as bytes_out values(All_Traffic.src) as src from datamodel=Network_Traffic where All_Traffic.user=* `hdsi_ai_user_peer_group_usage_anomaly_nt_scope` `hdsi_ai_user_peer_group_usage_anomaly_filter` by All_Traffic.user All_Traffic.app \
	| rename All_Traffic.* as * \
	| eval data_source="network_traffic", ai_domain=app, ai_input_type="app" \
	| `hdsi_ai_user_peer_group_usage_anomaly_resolve` \
	| append maxtime=900 maxout=50000 [| tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count sum(Web.bytes_out) as bytes_out values(Web.src) as src from datamodel=Web where Web.user=* `hdsi_ai_user_peer_group_usage_anomaly_web_scope` `hdsi_ai_user_peer_group_usage_anomaly_web_filter` by Web.user Web.url_domain Web.site | rename Web.* as * | eval data_source="web", ai_input_type=if(url_domain="unknown","app","host"), ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))) | `hdsi_ai_user_peer_group_usage_anomaly_resolve`] \
	| `hdsi_ai_user_peer_group_usage_anomaly_peer_stats` \
	| eval req_outlier=if(requests>=`hdsi_ai_user_peer_group_usage_anomaly_min_requests` AND requests>=`hdsi_ai_user_peer_group_usage_anomaly_ratio`*peer_median_requests AND rz_requests>=`hdsi_ai_user_peer_group_usage_anomaly_zscore`,1,0), bytes_outlier=if(isnotnull(rz_bytes) AND bytes_out>=`hdsi_ai_user_peer_group_usage_anomaly_min_mb`*1048576 AND bytes_out>=`hdsi_ai_user_peer_group_usage_anomaly_ratio`*peer_median_bytes AND rz_bytes>=`hdsi_ai_user_peer_group_usage_anomaly_zscore`,1,0) \
	| where peer_size>=`hdsi_ai_user_peer_group_usage_anomaly_min_peer_size` AND (req_outlier=1 OR bytes_outlier=1) \
	| eval outlier_reason=case(req_outlier=1 AND bytes_outlier=1,"requests and bytes_out",bytes_outlier=1,"bytes_out",true(),"requests"), outlier_rank=bytes_outlier*1000+max(coalesce(rz_bytes,0),rz_requests) \
	| eval src=mvindex(src_values,0), provider_count=mvcount(providers), allow_provider=if(provider_count=1,mvindex(providers,0),"*"), providers_list=mvjoin(mvindex(providers,0,4),", ").if(provider_count>5," (+".tostring(provider_count-5)." more)",""), user_aliases=if(mvcount(user_values)>1,mvjoin(user_values,", "),null()), mb_out=round(bytes_out/1048576,2), peer_median_mb=round(peer_median_bytes/1048576,2), peer_median_requests=round(peer_median_requests,0) \
	| `ai_unsanctioned_filter(user,src,allow_provider)` \
	| `ai_unsanctioned_filter(user_key,src,allow_provider)` \
	| sort 0 - outlier_rank \
	| dedup user_key \
	| `ai_risk_multiplier` \
	| eval risk_multiplier=coalesce(tonumber(risk_multiplier),1.0), risk_score=min(60,max(15,round(case(outlier_reason="requests and bytes_out",40,outlier_reason="bytes_out",30,true(),20)*risk_multiplier))) \
	| fillnull value="n/a" mb_out peer_median_mb rz_bytes \
	| eval ai_activity="peer_group_anomaly", detection_id="hdsi_ai_user_peer_group_usage_anomaly", mitre_attack=if(outlier_reason="requests","T1588.007","T1567"), ai_kill_chain_phase=if(outlier_reason="requests","collection","exfiltration") \
	| fields - src_values user_values allow_provider _final_multiplier sensitivity_level peer_median_bytes bytes_out req_outlier bytes_outlier outlier_rank _allow_* \
	| `hdsi_ai_user_peer_group_usage_anomaly_customizations` \
	| `hdsi_ai_user_peer_group_usage_anomaly_risk_score`

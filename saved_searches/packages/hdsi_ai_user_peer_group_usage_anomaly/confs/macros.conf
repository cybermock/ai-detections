[hdsi_ai_user_peer_group_usage_anomaly_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Network_Traffic (NGFW App-ID) leg, inline in the first tstats where clause before aggregation. Use Network_Traffic field names, e.g. NOT All_Traffic.user IN ("svc_*") or NOT All_Traffic.src IN ("10.1.2.0/24"). An excluded user is removed from the peer statistics as well. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_user_peer_group_usage_anomaly_web_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the appended Web leg, inline in the Web tstats where clause before aggregation. Use Web datamodel field names, e.g. NOT Web.user IN ("svc_*") or NOT sourcetype IN ("aws:elb:accesslogs","aws:waf"). An excluded user is removed from the peer statistics as well. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_user_peer_group_usage_anomaly_web_scope]
definition = (Web.url_domain IN (`hdsi_ai_user_peer_group_usage_anomaly_domains`) OR Web.site IN (`hdsi_ai_user_peer_group_usage_anomaly_domains`,`hdsi_ai_user_peer_group_usage_anomaly_apps`))
description = v1.1 Pre-filter inline in the Web tstats: AI hosts (with subdomains and cloud AI endpoint patterns) in Web.url_domain or Web.site, plus SSE/CASB app names in Web.site. Without it the daily tstats groups every web domain of every user. ai_domains_filter still decides provider, enabled flag and subdomain rules.
disabled = False
iseval = 0

[hdsi_ai_user_peer_group_usage_anomaly_nt_scope]
definition = All_Traffic.app IN (`hdsi_ai_user_peer_group_usage_anomaly_apps`)
description = v1.1 Pre-filter inline in the Network_Traffic tstats: NGFW App-IDs (Palo Alto) listed in ai_provider_apps. App-IDs missing from the lookup are not seen; add them to ai_provider_apps and regenerate the apps macro.
disabled = False
iseval = 0


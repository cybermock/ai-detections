[hdsi_ai_user_peer_group_usage_anomaly_resolve]
definition = eval user=trim(mvindex(user,0)), user=if(match(lower(user),"^(unknown|-|n/a|null|none|anonymous|system|)$") OR match(user,"^\\d{1,3}(\\.\\d{1,3}){3}$") OR match(user,"\\$$") OR match(lower(user),`hdsi_ai_user_peer_group_usage_anomaly_service_accounts`),null(),user) | where isnotnull(user) | `ai_domains_filter` | search NOT ai_traffic_class="background" NOT provider IN (`hdsi_ai_user_peer_group_usage_anomaly_sanctioned_providers`) | eval bytes_out=tonumber(bytes_out) | `hdsi_ai_user_peer_group_usage_anomaly_user_key` | where user_key!="" | stats sum(count) as requests sum(bytes_out) as bytes_out values(provider) as providers values(src) as src_values values(user) as user_values by user_key data_source | eval user=coalesce(mvindex(mvfilter(match(user_values,"\\\\")),0),mvindex(user_values,0))
description = v1.1 Shared per-leg normalisation: drops unattributed users (empty, unknown, -, IP addresses, machine accounts ending in $) and service accounts (service_accounts regex), resolves the AI provider with ai_domains_filter (caller sets ai_domain and ai_input_type), drops background hosts (ai_traffic_class=background: telemetry, auth, CDN and extension streams, which inflate request counts without user activity) and org-wide sanctioned providers, and sums requests and bytes_out per person (user_key) and data source, so DOMAIN\user and user@domain rows of the same person count once. user is set to the DOMAIN\user form when one was seen, else the first value. Do not edit for tuning.
disabled = False
iseval = 0

[hdsi_ai_user_peer_group_usage_anomaly_user_key]
definition = eval user_key=lower(trim(replace(replace(user,"^[^\\\\]+\\\\",""),"@.*$","")))
description = v1.1 Bare account name of user, lowercased: strips a DOMAIN\ prefix and an @suffix. Merges the user formats of one person in the statistics and keys the bare-name identity lookup and the drilldowns (whose filters avoid raw backslashes). Do not edit for tuning.
disabled = False
iseval = 0

[hdsi_ai_user_peer_group_usage_anomaly_service_accounts]
definition = "^([^\\\\]+\\\\)?(svc|srv|service|svcacct|app|bot|sys)[_.$-]"
description = v1.1 Regex (matched against the lowercased user) for service and application accounts, which are removed before the peer statistics: an automation account calling an AI API is not a person with peers. Default matches svc, srv, service, svcacct, app, bot and sys prefixes followed by _ . $ or -, with or without a DOMAIN\ prefix. Set to "^$" to keep every account; adapt it to the organisation's naming standard.
disabled = False
iseval = 0

[hdsi_ai_user_peer_group_usage_anomaly_peer_stats]
definition = lookup identity_lookup_expanded identity as user OUTPUT bunit as id_bunit | lookup identity_lookup_expanded identity as user_key OUTPUT bunit as key_bunit | eval bunit=lower(trim(coalesce(mvindex(id_bunit,0),mvindex(key_bunit,0)))), bunit=if(bunit="",null(),bunit) | eventstats dc(user_key) as bunit_users by data_source bunit | eval peer_group=if(isnotnull(bunit) AND bunit_users>=`hdsi_ai_user_peer_group_usage_anomaly_min_peer_size`,bunit,"org-wide, no qualifying bunit"), lr=log(requests+1,10), lb=if(isnotnull(bytes_out),log(bytes_out+1,10),null()) | eventstats count as peer_size median(lr) as med_lr median(lb) as med_lb median(requests) as peer_median_requests median(bytes_out) as peer_median_bytes by data_source peer_group | eval ad_r=abs(lr-med_lr), ad_b=abs(lb-med_lb) | eventstats median(ad_r) as mad_r median(ad_b) as mad_b by data_source peer_group | eval rz_requests=round(0.6745*(lr-med_lr)/max(mad_r,0.1),2), rz_bytes=if(isnotnull(lb),round(0.6745*(lb-med_lb)/max(coalesce(mad_b,0),0.1),2),null()) | fields - lr lb ad_r ad_b med_lr med_lb mad_r mad_b id_bunit key_bunit bunit_users
description = v1.1 Peer statistics per person and data source. Peer group = the identity bunit (identity_lookup_expanded, looked up by user and then by the bare user_key) when that bunit has at least min_peer_size AI users that day. Everyone else (no bunit, or a bunit below min_peer_size) forms one residual group per data source, "org-wide, no qualifying bunit": it excludes the users of qualifying bunits, so it equals all AI users only where no bunit qualifies. Computes peer_size, peer medians and a robust z-score (0.6745 x deviation / MAD, on log10(value+1), MAD floored at 0.1) for requests (rz_requests) and bytes_out (rz_bytes, null where the source logs no bytes). Do not edit for tuning.
disabled = False
iseval = 0

[hdsi_ai_user_peer_group_usage_anomaly_sanctioned_providers]
definition = "__none__"
description = v1.1 Providers sanctioned for the whole organisation, as quoted provider names exactly as in the AI lookups (case-insensitive), e.g. "Google Gemini","Microsoft Copilot". Their traffic is removed before the peer statistics, so heavy use of an approved enterprise assistant is not an anomaly. Ships with a placeholder that matches nothing. Use ai_sanctioned_entities for per-user, per-system or per-bunit approvals.
disabled = False
iseval = 0

[hdsi_ai_user_peer_group_usage_anomaly_min_peer_size]
definition = 10
description = v1.1 Minimum AI users a peer group needs on the day. A user in a bunit with fewer AI users joins the residual "org-wide, no qualifying bunit" group of the data source; if that group is also smaller, it is not scored. Below about 10 users a median and MAD are not meaningful.
disabled = False
iseval = 0

[hdsi_ai_user_peer_group_usage_anomaly_zscore]
definition = 3.5
description = v1.1 Robust z-score threshold: 0.6745 x (log10(value+1) - peer median) / peer MAD of log10(value+1). 3.5 is the usual modified z-score outlier cut-off. The log scale stops a few very heavy users from hiding everyone else, which a plain mean/stdev z-score does.
disabled = False
iseval = 0

[hdsi_ai_user_peer_group_usage_anomaly_ratio]
definition = 10
description = v1.1 The user value must also be at least this many times the peer group median (requests or bytes_out). Keeps the rule on users who are far above peers in absolute terms, not just statistically unusual in a tight group.
disabled = False
iseval = 0

[hdsi_ai_user_peer_group_usage_anomaly_min_mb]
definition = 100
description = v1.1 Absolute floor for a bytes_out outlier: MB sent to AI services in the day. Below this an upload volume is not worth risk whatever the peers do. Only applies where the source logs bytes (NGFW traffic, most SSE/proxy logs). 50 MB doubled the daily findings in the largest validation tenant without adding distinct behaviour.
disabled = False
iseval = 0

[hdsi_ai_user_peer_group_usage_anomaly_min_requests]
definition = 2500
description = v1.1 Absolute floor for a request-count outlier: AI requests/sessions in the day (NGFW sessions or proxy/SSE log rows). Used where the source has no bytes (URL-filtering logs) and as a second signal elsewhere. A heavy but normal chat user reaches 1,000-2,000 NGFW sessions a day, so lower values mostly report power users.
disabled = False
iseval = 0

[hdsi_ai_user_peer_group_usage_anomaly_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after the outlier decision and scoring (fields: user, user_key, user_aliases, data_source, peer_group, peer_size, requests, mb_out, peer_median_requests, peer_median_mb, rz_requests, rz_bytes, outlier_reason, providers_list, provider_count, src, bunit, risk_multiplier, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_user_peer_group_usage_anomaly_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust or override risk_score (computed 15-60, user risk object only). Ships as search *.
disabled = False
iseval = 0

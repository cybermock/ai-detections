version: 1.1.0
creation_date: '2026-03-04'
package_title: AI User Peer Group Usage Anomaly
description: "Daily risk on a user whose AI requests or upload volume yesterday was a robust outlier (log-scale median/MAD, at least 10x the peer median, absolute floors) against the other AI users of the same identity bunit, or a residual organisation-wide group when the bunit is small or unknown. DOMAIN\\user and user@domain forms of one person are merged. Reads NGFW App-ID traffic with User-ID and Web proxy/SSE data that carries a user. Risk only, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - web
  - proxy
  - network
  - pan
  - identity
  - data_exfiltration
data_prereqs:
  datamodels:
    op: OR
    items:
    - "Network_Traffic"
    - "Web"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

[hdsi_ai_personal_email_to_ai_service_upload_correlation_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the Web tstats where clause before aggregation. Use datamodel field names, e.g. NOT Web.user IN ("svc_*") or NOT Web.src IN ("10.1.2.0/24") for VDI or proxy egress. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_personal_email_to_ai_service_upload_correlation_personal_email_names]
definition = "mail.google.com","outlook.live.com","mail.yahoo.com","data.mail.yahoo.com","mail.proton.me","mail.aol.com","mail.gmx.com","mail.gmx.net","navigator-bs.gmx.com","mail.com","mail.yandex.com","mail.yandex.ru","app.tuta.com","mail.tutanota.com","mail.163.com","mail.qq.com","e.mail.ru","google gmail","gmail","yahoo mail","microsoft live outlook","outlook.com","protonmail","proton mail","aol mail","icloud mail","gmx mail","yandex mail","tutanota","tuta","comcastmail","tempmail","temp mail","mail.ru"
description = v1.1 Personal (consumer) webmail destinations, lowercase, as a quoted list for in(). Matched exactly against lower(url_domain) without a leading www., or against the SSE/CASB app name in site (Netskope "Google Gmail", "Yahoo Mail", "Microsoft Live Outlook"). Corporate mail hosts (outlook.office.com, outlook.office365.com, "Microsoft Office 365 Outlook.com") are deliberately absent. Remove mail.google.com / gmail when Google Workspace is the corporate mail platform; add ISP or regional webmail seen in your proxy data.
disabled = False
iseval = 0

[hdsi_ai_personal_email_to_ai_service_upload_correlation_corporate_mail_users]
definition = 25
description = v1.1 Corporate-platform guard. A personal-email destination used by at least this many distinct users in one run window is treated as the corporate mail platform (for example Gmail at a Google Workspace tenant) and ignored. Raise it for very small user populations only after removing the corporate platform from personal_email_names.
disabled = False
iseval = 0

[hdsi_ai_personal_email_to_ai_service_upload_correlation_min_email_bytes]
definition = 5242880
description = v1.1 Minimum bytes_out to personal webmail per user, source and 5-minute bucket that counts as an upload (default 5 MB, attachment scale). On the validated SSE tenant consumer webmail buckets were 0.1-0.2 MB at p50 and 2-10 MB at p90.
disabled = False
iseval = 0

[hdsi_ai_personal_email_to_ai_service_upload_correlation_min_ai_bytes]
definition = 1048576
description = v1.1 Minimum bytes_out to AI services per user, source and 5-minute bucket that counts as an upload (default 1 MB, file scale). Typed prompts are a few KB, so this keeps chat use out and file or bulk paste uploads in.
disabled = False
iseval = 0

[hdsi_ai_personal_email_to_ai_service_upload_correlation_ai_usage_types]
definition = "web"
description = v1.1 ai_provider_domains / ai_provider_apps usage_type values that count as the AI upload half, as a quoted list for in(). Ships as "web" (chat and file-upload interfaces). IDE assistants (GitHub Copilot, Cursor) upload code context continuously and API endpoints are mostly automation, so both are excluded. Add "api" to include direct API uploads from user endpoints.
disabled = False
iseval = 0

[hdsi_ai_personal_email_to_ai_service_upload_correlation_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after correlation (fields: user, src, personal_email_dest, personal_email_list, personal_mb, ai_domains, providers, provider, provider_list, ai_mb, email_upload_time, ai_upload_time, gap_minutes, email_buckets, ai_buckets). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_personal_email_to_ai_service_upload_correlation_risk_score]
definition = search *
description = v1.1 Risk score hook, last pipe. The rule emits static scores (user 35, system 15). Set a numeric risk_score field here (min(100, ...)) to override both per row. Ships as search *.
disabled = False
iseval = 0

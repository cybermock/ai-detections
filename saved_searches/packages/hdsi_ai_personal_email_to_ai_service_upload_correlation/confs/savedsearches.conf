[Network - HDSI AI Personal Email To AI Service Upload Correlation - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Personal Email To AI Service Upload Correlation
action.correlationsearch.annotations = {"mitre_attack": ["T1567"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object IN (\"$user$\",\"$src$\") source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View web uploads by $user$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count sum(Web.bytes_out) as bytes_out sum(Web.bytes_in) as bytes_in values(Web.http_method) as http_method values(Web.url) as url values(Web.http_user_agent) as http_user_agent min(_time) as firstTime max(_time) as lastTime from datamodel=Web where Web.user=\"$user$\" (Web.url_domain=* OR Web.site=*) by Web.user Web.src Web.url_domain Web.site | rename Web.* as * | eval url_domain=coalesce(nullif(url_domain,\"unknown\"),site), mb_out=round(bytes_out/1048576,2), mb_in=round(bytes_in/1048576,2) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, url_domain, count, mb_out, mb_in, http_method, http_user_agent, url | sort - mb_out","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = $user$ uploaded $personal_mb$ MB to personal webmail ($personal_email_list$) and then $ai_mb$ MB to $provider_list$ within $gap_minutes$ minutes from $src_display$.
action.notable.param.rule_title = HDSI AI Personal Email To AI Service Upload Correlation ($user$)
action.notable.param.security_domain = network
action.notable.param.severity = medium
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":35},{"risk_object_field":"src","risk_object_type":"system","risk_score":15}]
action.risk.param._risk_message = $user$ uploaded $personal_mb$ MB to personal webmail ($personal_email_list$) and then $ai_mb$ MB to $provider_list$ within $gap_minutes$ minutes from $src_display$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user,src
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 5 * * * *
description = v1.1.0 Detects a user who uploads attachment-sized data to personal (consumer) webmail and then, within the same hour, uploads file-sized data to an AI web service, indicating data staged through a personal channel into AI. Requires Web data with user and bytes_out. Risk on user and src, no notable.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count sum(Web.bytes_out) as bytes_out from datamodel=Web where Web.user=* Web.bytes_out>0 NOT Web.http_method IN ("GET","HEAD","OPTIONS") `hdsi_ai_personal_email_to_ai_service_upload_correlation_filter` by _time span=5m Web.user Web.src Web.url_domain Web.site \
	| rename Web.* as * \
	| where NOT in(lower(trim(user)),"unknown","-","","anonymous","n/a","none") \
	| eval dest_name=replace(lower(trim(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"),""))),"^www\d*\.",""), channel=if(in(dest_name,`hdsi_ai_personal_email_to_ai_service_upload_correlation_personal_email_names`),"personal_email","other") \
	| eventstats dc(eval(if(channel="personal_email",user,null()))) as dest_users by dest_name \
	| eval channel=if(channel="personal_email" AND dest_users>=`hdsi_ai_personal_email_to_ai_service_upload_correlation_corporate_mail_users`,"corporate_mail",channel) \
	| eventstats max(eval(if(channel="personal_email",1,0))) as has_personal_email by user \
	| where has_personal_email=1 AND channel IN ("personal_email","other") \
	| appendpipe [| where channel="other" | eval ai_domain=dest_name, ai_input_type=if(url_domain="unknown","app","host") | `ai_domains_filter` | where in(usage_type,`hdsi_ai_personal_email_to_ai_service_upload_correlation_ai_usage_types`) | `ai_unsanctioned_filter(user,src,provider)` | eval channel="ai"] \
	| where channel IN ("personal_email","ai") \
	| stats sum(bytes_out) as bytes_out values(dest_name) as dest values(provider) as provider by user src _time channel \
	| where (channel="personal_email" AND bytes_out>=`hdsi_ai_personal_email_to_ai_service_upload_correlation_min_email_bytes`) OR (channel="ai" AND bytes_out>=`hdsi_ai_personal_email_to_ai_service_upload_correlation_min_ai_bytes`) \
	| eventstats min(eval(if(channel="personal_email",_time,null()))) as email_first by user src \
	| where isnotnull(email_first) AND (channel="personal_email" OR _time>=email_first) \
	| eval email_dest=if(channel="personal_email",dest,null()), ai_dest=if(channel="ai",dest,null()), ai_time=if(channel="ai",_time,null()) \
	| stats min(email_first) as email_first min(ai_time) as ai_first sum(eval(if(channel="personal_email",bytes_out,0))) as personal_bytes sum(eval(if(channel="ai",bytes_out,0))) as ai_bytes sum(eval(if(channel="personal_email",1,0))) as email_buckets sum(eval(if(channel="ai",1,0))) as ai_buckets values(email_dest) as personal_email_dest values(ai_dest) as ai_domains values(provider) as providers by user src \
	| where email_buckets>0 AND ai_buckets>0 \
	| eval personal_mb=round(personal_bytes/1048576,1), ai_mb=round(ai_bytes/1048576,1), gap_minutes=round((ai_first-email_first)/60), email_upload_time=strftime(email_first,"%Y-%m-%d %H:%M:%S %z"), ai_upload_time=strftime(ai_first,"%Y-%m-%d %H:%M:%S %z"), provider=mvindex(providers,0), provider_list=mvjoin(providers,", "), personal_email_list=mvjoin(personal_email_dest,", "), src=if(in(lower(trim(src)),"unknown","-",""),null(),src), src_display=coalesce(src,"an unidentified host"), firstTime=email_first, lastTime=ai_first \
	| eval ai_activity="personal_email_ai_correlation", detection_id="hdsi_ai_personal_email_to_ai_service_upload_correlation", mitre_attack="T1567", ai_kill_chain_phase="exfiltration" \
	| fields - personal_bytes ai_bytes email_first ai_first \
	| `hdsi_ai_personal_email_to_ai_service_upload_correlation_customizations` \
	| `hdsi_ai_personal_email_to_ai_service_upload_correlation_risk_score`

version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Personal Email To AI Service Upload Correlation
description: "Detects a user who uploads attachment-sized data (default 5 MB per 5 minutes) to personal webmail and then, within the same hourly window, uploads file-sized data (default 1 MB) to an AI web service. Needs proxy or SSE Web data with user and bytes_out. Risk on user and src, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
tags:
  - rba_only
  - web
  - proxy
  - email
  - data_exfiltration
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Web"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

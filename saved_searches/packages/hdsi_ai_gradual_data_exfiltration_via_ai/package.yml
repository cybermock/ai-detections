version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Gradual Data Exfiltration Via AI
description: "Weekly (Saturday, over the 7 complete days Saturday to Friday). Detects a user, or an asset-inventoried host without a user, that uploads a large cumulative volume to AI services spread across several days (default 250 MB on at least 3 days, no single day over half), measured from firewall App-ID sessions (Network_Traffic) or proxy/SSE logs with byte counts (Web). Catches slow-drip exfiltration that stays under hourly upload thresholds. Pool, NAT and shared addresses are not scored as hosts. IDE coding assistants and Microsoft 365 Copilot are excluded by default. Risk on the user or host, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - data_exfiltration
  - network
  - pan
  - web
  - proxy
data_prereqs:
  datamodels:
    op: OR
    items:
    - "Network_Traffic"
    - "Web"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

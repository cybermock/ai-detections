action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$entity_search$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"now"},{"name":"View daily AI App-ID upload volume for $entity$","search":"| tstats summariesonly=t allow_old_summaries=t count sum(All_Traffic.bytes_out) as bytes_out sum(All_Traffic.bytes_in) as bytes_in values(All_Traffic.dest) as dest values(All_Traffic.action) as action from datamodel=Network_Traffic where (All_Traffic.user=\"$entity_search$\" OR All_Traffic.src=\"$entity_search$\") `hdsi_ai_gradual_data_exfiltration_via_ai_app_ids` by All_Traffic.user All_Traffic.src All_Traffic.app _time span=1d | rename All_Traffic.* as * | eval day=strftime(_time,\"%Y-%m-%d\"), mb_out=round(bytes_out/1024/1024,2), mb_in=round(bytes_in/1024/1024,2) | sort 0 day - mb_out | table day, user, src, app, action, count, mb_out, mb_in, dest","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View daily AI web upload volume for $entity$","search":"| tstats summariesonly=t allow_old_summaries=t count sum(Web.bytes_out) as bytes_out sum(Web.bytes_in) as bytes_in values(Web.http_method) as http_method values(Web.dest) as dest from datamodel=Web where (Web.user=\"$entity_search$\" OR Web.src=\"$entity_search$\") `hdsi_ai_gradual_data_exfiltration_via_ai_web_ai_terms` by Web.user Web.src Web.url_domain Web.site _time span=1d | rename Web.* as * | eval url_domain=coalesce(url_domain,site), day=strftime(_time,\"%Y-%m-%d\"), mb_out=round(bytes_out/1024/1024,2), mb_in=round(bytes_in/1024/1024,2) | sort 0 day - mb_out | table day, user, src, url_domain, count, mb_out, mb_in, http_method, dest","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]

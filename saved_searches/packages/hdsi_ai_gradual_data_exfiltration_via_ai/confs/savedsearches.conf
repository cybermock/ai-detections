description = v1.1.0 Weekly (Saturday, over the 7 complete days Saturday to Friday). Detects a user, or an inventoried host without a user, that uploads a large cumulative volume to AI services spread over several days (default 250 MB on at least 3 days, no single day over half), measured from firewall App-ID sessions (Network_Traffic) or proxy/SSE logs (Web). Catches slow-drip exfiltration that stays under hourly upload thresholds. Pool, NAT and shared addresses are not scored as hosts. Risk on the user or host, no notable.
disabled = 0
dispatch.earliest_time = -7d@d
dispatch.latest_time = @d

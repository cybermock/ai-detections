schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" sum(All_Traffic.bytes_out) as bytes_out count from datamodel=Network_Traffic where All_Traffic.bytes_out>0 NOT All_Traffic.action="blocked" `hdsi_ai_gradual_data_exfiltration_via_ai_app_ids` `hdsi_ai_gradual_data_exfiltration_via_ai_filter` by All_Traffic.user All_Traffic.src All_Traffic.app _time span=1d \
	| rename All_Traffic.* as * \
	| lookup ai_provider_apps app_name as app OUTPUT enabled as app_row \
	| eval ai_domain=if(isnull(app_row),coalesce(`hdsi_ai_gradual_data_exfiltration_via_ai_app_id_aliases`,app),app), ai_input_type=if(ai_domain=app,"app","host"), evidence="firewall App-ID" \
	| `ai_domains_filter` \
	| append maxtime=1200 maxout=50000 [| tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" sum(Web.bytes_out) as bytes_out count from datamodel=Web where Web.bytes_out>0 NOT Web.action="blocked" `hdsi_ai_gradual_data_exfiltration_via_ai_web_ai_terms` `hdsi_ai_gradual_data_exfiltration_via_ai_web_filter` by Web.user Web.src Web.url_domain Web.site _time span=1d | rename Web.* as * | eval ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))), ai_input_type=if(isnull(nullif(url_domain,"unknown")),"app","host"), evidence="web proxy" | `ai_domains_filter` | search usage_type IN (`hdsi_ai_gradual_data_exfiltration_via_ai_usage_types`) NOT provider IN (`hdsi_ai_gradual_data_exfiltration_via_ai_excluded_providers`) NOT ai_traffic_class IN ("background","site") | stats sum(bytes_out) as bytes_out sum(count) as count max(severity_weight) as severity_weight by user src provider usage_type evidence _time] \
	| search usage_type IN (`hdsi_ai_gradual_data_exfiltration_via_ai_usage_types`) NOT provider IN (`hdsi_ai_gradual_data_exfiltration_via_ai_excluded_providers`) NOT ai_traffic_class IN ("background","site") \
	| eval user=if(isnull(user) OR match(lower(user),"^(unknown|-|n/a|null|none|)$"),null(),lower(user)), src=if(isnull(src) OR match(lower(src),"^(unknown|-|n/a|null|none|0\.0\.0\.0|::|)$"),null(),src), severity_weight=coalesce(tonumber(severity_weight),1.0) \
	| where isnotnull(user) OR isnotnull(src) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| eval entity_type=if(isnotnull(user),"user","system"), entity=coalesce(user,src) \
	| stats sum(bytes_out) as bytes_out sum(count) as requests values(provider) as providers values(src) as srcs max(severity_weight) as severity_weight by entity entity_type evidence _time \
	| eventstats max(bytes_out) as day_bytes by entity entity_type _time \
	| eval requests_at_max=if(bytes_out=day_bytes,requests,null()) \
	| stats max(day_bytes) as day_bytes max(requests_at_max) as day_requests values(providers) as providers values(srcs) as srcs values(evidence) as evidence max(severity_weight) as severity_weight by entity entity_type _time \
	| addinfo \
	| eval day_mb=day_bytes/1048576, last_day=relative_time(info_max_time-1,"@d"), day_label=strftime(_time,"%Y-%m-%d")."=".round(day_mb,1) \
	| stats sum(day_bytes) as window_bytes sum(day_requests) as window_requests max(day_mb) as max_day_mb sum(eval(if(_time>=last_day,day_mb,0))) as last_day_mb count(eval(day_mb>=`hdsi_ai_gradual_data_exfiltration_via_ai_active_day_mb`)) as active_days values(day_label) as daily_mb values(providers) as providers values(srcs) as srcs values(evidence) as evidence max(severity_weight) as severity_weight min(_time) as firstTime max(_time) as lastTime min(info_min_time) as info_min_time max(info_max_time) as info_max_time by entity entity_type \
	| eval window_mb=window_bytes/1048576, max_day_share=max_day_mb/window_mb, lookback_days=round((info_max_time-info_min_time)/86400,0), src_count=mvcount(srcs) \
	| where window_mb>=`hdsi_ai_gradual_data_exfiltration_via_ai_cumulative_mb` AND active_days>=`hdsi_ai_gradual_data_exfiltration_via_ai_min_active_days` AND max_day_share<=`hdsi_ai_gradual_data_exfiltration_via_ai_max_day_share` AND (entity_type="system" OR src_count<=`hdsi_ai_gradual_data_exfiltration_via_ai_max_user_srcs`) \
	| lookup asset_lookup_by_str ip as entity OUTPUT nt_host as asset_nt_host dns as asset_dns asset as asset_id category as asset_category \
	| eval src_asset=if(entity_type="system",mvindex(coalesce(asset_nt_host,asset_dns,asset_id),0),null()), src_category=if(entity_type="system",mvjoin(asset_category,", "),null()) \
	| where entity_type="user" OR ((`hdsi_ai_gradual_data_exfiltration_via_ai_host_requires_asset`=0 OR isnotnull(src_asset)) AND (`hdsi_ai_gradual_data_exfiltration_via_ai_host_max_day_mb`=0 OR max_day_mb<=`hdsi_ai_gradual_data_exfiltration_via_ai_host_max_day_mb`)) \
	| eval user=if(entity_type="user",entity,null()), src=if(entity_type="system",entity,null()), src_sample=mvjoin(mvindex(srcs,0,4),", "), entity_search=replace(replace(entity,"\\\\","\\\\\\\\"),"\"","\\\"") \
	| eval exfil_tier=case(window_mb>=4*`hdsi_ai_gradual_data_exfiltration_via_ai_cumulative_mb`,"high", window_mb>=2*`hdsi_ai_gradual_data_exfiltration_via_ai_cumulative_mb`,"medium", true(),"low"), base_score=case(exfil_tier="high",45, exfil_tier="medium",35, true(),25) \
	| `ai_risk_multiplier` \
	| eval risk_score=min(60,round(base_score*coalesce(risk_multiplier,1)*severity_weight,0)) \
	| eval window_mb=round(window_mb,1), max_day_share=round(max_day_share,2), max_day_mb=round(max_day_mb,1), last_day_mb=round(last_day_mb,1), provider=mvjoin(providers,", "), evidence=mvjoin(evidence," + "), daily_mb=mvjoin(daily_mb,", "), firstTime=strftime(firstTime,"%Y-%m-%d"), lastTime=strftime(lastTime,"%Y-%m-%d") \
	| fields - providers srcs window_bytes asset_nt_host asset_dns asset_id asset_category info_min_time info_max_time info_sid info_search_time _final_multiplier \
	| eval ai_activity="low_slow_exfiltration", detection_id="hdsi_ai_gradual_data_exfiltration_via_ai", mitre_attack="T1567,T1030", ai_kill_chain_phase="exfiltration" \
	| `hdsi_ai_gradual_data_exfiltration_via_ai_customizations` \
	| `hdsi_ai_gradual_data_exfiltration_via_ai_risk_score`

[hdsi_ai_gradual_data_exfiltration_via_ai_usage_types]
definition = "web","api","cli","model_registry"
description = v1.1 ai_domains_filter usage_type values whose upload volume is counted. IDE coding assistants (usage_type ide, e.g. GitHub Copilot, Cursor) are left out because they upload source context all day by design and would dominate every developer's weekly total; hdsi_ai_code_assistant_network_connection covers them. Add "ide" to measure them too.
disabled = False
iseval = 0

[hdsi_ai_gradual_data_exfiltration_via_ai_excluded_providers]
definition = "Microsoft 365 Copilot"
description = v1.1 ai_domains_filter provider values whose upload volume is not counted. Ships as Microsoft 365 Copilot (incl. Copilot Studio), which stays inside the organisation's own Microsoft 365 boundary and in validation carried about 1.4 GB a day through an SSE app name for ordinary users. Use "__none__" to count every provider.
disabled = False
iseval = 0

[hdsi_ai_gradual_data_exfiltration_via_ai_cumulative_mb]
definition = 250
description = v1.1 Minimum MB uploaded (bytes_out) to AI services by one user (or one host without a user) over the 7 complete days of the dispatch window (Saturday to Friday on the weekly schedule). Default set on the largest validation tenant; the README Threshold section has the measured distribution and the SPL to derive a tenant value. Also sets the medium (2x) and high (4x) score tiers.
disabled = False
iseval = 0

[hdsi_ai_gradual_data_exfiltration_via_ai_min_active_days]
definition = 3
description = v1.1 Minimum number of days in the window on which the entity uploaded at least the active-day MB. Separates sustained drip uploads from one-off bursts, which hdsi_ai_high_volume_upload_to_ai_service scores hourly.
disabled = False
iseval = 0

[hdsi_ai_gradual_data_exfiltration_via_ai_active_day_mb]
definition = 1
description = v1.1 MB uploaded to AI services on one day for that day to count as an active day (see _min_active_days). Ordinary chat use is well below this (median about 0.2 MB a day per user in validation). The last day of the window is not required to be active: on the weekly schedule that would permanently skip any drip that pauses on Fridays.
disabled = False
iseval = 0

[hdsi_ai_gradual_data_exfiltration_via_ai_max_day_share]
definition = 0.5
description = v1.1 Largest share (0-1) of the window total that a single day may carry. 0.5 means no one day uploaded more than half of the weekly total, i.e. the volume is spread out rather than one burst. Raise to 1 to also score burst-dominated weeks.
disabled = False
iseval = 0

[hdsi_ai_gradual_data_exfiltration_via_ai_max_user_srcs]
definition = 20
description = v1.1 Largest number of distinct source addresses a user may upload from in the window and still be scored. A user name seen on more hosts than this is a shared, generic or placeholder identity (validation found one on 731 hosts in a single day); its combined volume is not one person's and would make a false RBA hotspot. Host-only rows have their own guards (_host_requires_asset, _host_max_day_mb).
disabled = False
iseval = 0

[hdsi_ai_gradual_data_exfiltration_via_ai_host_requires_asset]
definition = 1
description = v1.1 1 = a host-only entity (src with no user) is scored only when src resolves in the ES asset inventory by exact IP (asset_lookup_by_str), i.e. a known, stably addressed host. DHCP, VPN and CGNAT pool addresses and NAT egress are not in the inventory and are handed to different people across the week, so their weekly total is not one entity's behaviour; on the largest validation tenant 73 of 76 host-only addresses above the daily pace were such pool or egress addresses. 0 = score every host-only src (only for tenants whose firewall has no User-ID and stable workstation addressing).
disabled = False
iseval = 0

[hdsi_ai_gradual_data_exfiltration_via_ai_host_max_day_mb]
definition = 1024
description = v1.1 Largest single-day upload (MB) a host-only entity may have and still be scored. A host without a user that uploads more than this to AI services in one day is a shared address (NAT or VPN egress, terminal server or RDS session host, VDI) or an automated integration, not one person; in validation every host-only address above 1 GB a day was one of these (up to 17 GB a day), while named users stayed well below it. Sanction approved integrations in ai_sanctioned_entities. Bursts by one host are still scored hourly by hdsi_ai_high_volume_upload_to_ai_service. 0 = no ceiling. User entities are not affected.
disabled = False
iseval = 0

[hdsi_ai_gradual_data_exfiltration_via_ai_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation and scoring (fields: entity, entity_type, entity_search, user, src, src_asset, src_category, src_count, src_sample, provider, evidence, window_mb, window_requests, active_days, daily_mb, lookback_days, max_day_mb, max_day_share, last_day_mb, firstTime, lastTime, exfil_tier, base_score, severity_weight, risk_multiplier, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_gradual_data_exfiltration_via_ai_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. The SPL sets risk_score = tier base (25/35/45 at 1x/2x/4x the cumulative threshold) x risk_multiplier (identity bunit sensitivity, privileged x1.25) x highest provider severity_weight, capped at 60. Each row carries one risk object (user, or src when no user is known). Override risk_score here (keep it 1-100). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_gradual_data_exfiltration_via_ai_app_id_aliases]
definition = case(app="kimi","kimi.com")
description = v1.1 Eval expression (field app) that maps a firewall App-ID with no ai_provider_apps row to the provider's canonical domain, which ai_domains_filter then resolves through ai_provider_domains. Used only when the App-ID has no ai_provider_apps row at all, so a row added or disabled in the common lookup always wins. Ships with kimi (Moonshot Kimi chatbot, kimi.com): on the largest validation tenant it carried about 3.1 GB of upload over 5 days but has no ai_provider_apps row. The earlier variants (claude-base, anthropic-api-base, openai-base, ...) now have common rows and need no alias. Add case pairs for other row-less App-IDs you see; replace with null() to rely on the common lookup only.
disabled = False
iseval = 0


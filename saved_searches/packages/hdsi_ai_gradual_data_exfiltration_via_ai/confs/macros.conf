[hdsi_ai_gradual_data_exfiltration_via_ai_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Network_Traffic (firewall App-ID) branch, applied inside its tstats where clause before aggregation. Use datamodel field names, e.g. NOT All_Traffic.src IN ("10.20.0.0/24") for a NAT pool, guest Wi-Fi egress, VDI subnet or approved AI integration server whose steady upload volume is expected. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_gradual_data_exfiltration_via_ai_web_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Web (proxy/SSE) branch, applied inside its tstats where clause before aggregation. Use datamodel field names, e.g. NOT Web.src IN ("10.20.0.0/24") or NOT Web.user="svc_ai_gateway". Ships empty.
disabled = False
iseval = 0


[hdsi_ai_access_via_vpn_proxy_evasion_sanctioned_providers]
definition = "__none__"
description = v1.1 AI providers (ai_domains_filter provider names, e.g. "Google Gemini","Microsoft Copilot") licensed for everyone. Their AI activity does not count as the AI half of the correlation, so a host with a consumer VPN that only used the corporate AI service is not reported. Ships as "__none__" (count every provider). Use ai_sanctioned_entities for per-user, per-host or per-group approvals.
disabled = False
iseval = 0

[hdsi_ai_access_via_vpn_proxy_evasion_max_users_per_src]
definition = 3
description = v1.1 A source seen with more distinct firewall/proxy users than this in one run is treated as shared egress (explicit proxy, NAT, VDI or terminal server) and dropped, because the activity cannot be attributed to one host or person. Derive it from the copy-paste SPL in the README.
disabled = False
iseval = 0

[hdsi_ai_access_via_vpn_proxy_evasion_unreliable_src]
definition = match(src,"^\d{1,3}(\.\d{1,3}){3}$") AND NOT (cidrmatch("10.0.0.0/8",src) OR cidrmatch("172.16.0.0/12",src) OR cidrmatch("192.168.0.0/16",src) OR cidrmatch("100.64.0.0/10",src))
description = v1.1 Eval expression for source addresses that are not one host: by default a public IPv4 address (NAT egress, a branch firewall or a DNS forwarder's public side). Rows that match and have no firewall/proxy user are dropped after aggregation, because their only risk object would be an address shared by many people. RFC 1918 and 100.64.0.0/10 (remote-access VPN pools, CGNAT) are kept. Set to false() to keep everything, or add ranges, e.g. cidrmatch("192.168.0.0/16",src) for roaming DNS clients on home networks.
disabled = False
iseval = 0

[hdsi_ai_access_via_vpn_proxy_evasion_dynamic_src]
definition = cidrmatch("100.64.0.0/10",src)
description = v1.1 Eval expression for source addresses that are reassigned between people within hours (remote-access VPN pools, CGNAT). Rows that match it, have no firewall/proxy user and score below 40 are dropped, so co-occurrence (25) and attempt (20) risk does not build up on an address the next user inherits. The 40 tier (AI blocked, then an evasion tool passed) is still emitted. Ships as 100.64.0.0/10. Add your remote-access pool ranges, e.g. OR cidrmatch("10.250.0.0/16",src), or set to false() to keep every pool row.
disabled = False
iseval = 0

[hdsi_ai_access_via_vpn_proxy_evasion_min_base_score]
definition = 20
description = v1.1 Lowest base score (before the identity multiplier) that is emitted as risk. Tiers: 40 AI blocked and an evasion tool then passed, 25 an evasion tool passed alongside allowed AI use, 20 AI blocked and the evasion attempt was blocked or DNS-only, 10 allowed AI use and a blocked, DNS-only or site-visit/download evasion attempt (+10 when Tor traffic got through, by App-ID or a Tor Browser host on the web). Ships as 20: an evasion tool got through the firewall/proxy, or AI was blocked. Blocked Tor, Tor seen only in DNS and Tor project web pages do not add the Tor bonus, so attempt-only evidence alongside allowed AI stays at 10. The 10 tier was 125 of 180 sources over 8 hours on the tenant whose web gateway blocks the anonymizer category (about one risk event per host with a VPN client installed per day) and is the only tier DNS-only tenants can reach; lower to 10 there, or to report installed-but-blocked VPN clients. See the README for measured volumes.
disabled = False
iseval = 0

[hdsi_ai_access_via_vpn_proxy_evasion_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after per-source aggregation and scoring (fields: src, user, users, user_display, evasion_methods, evasion_list, evasion_allowed, tor_seen, providers, provider, provider_list, ai_evidence, ai_blocked, ai_outcome, bypass_after_block, evasion_count, ai_count, base_score, risk_multiplier, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_access_via_vpn_proxy_evasion_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. The SPL sets risk_score = base x risk_multiplier (identity bunit sensitivity, privileged x1.25), capped at 60, for both src and user. Base: 40 when AI was blocked and an evasion tool then passed the firewall/proxy, 25 when an evasion tool passed alongside allowed AI use, 20 when AI was blocked and the evasion attempt was blocked or DNS-only, otherwise 10; +10 when Tor traffic got through (an allowed tor App-ID session or an allowed Tor Browser host such as check.torproject.org; not DNS alone, not blocked Tor, not Tor project web pages). Override risk_score (<=100) here. Ships as search *.
disabled = False
iseval = 0

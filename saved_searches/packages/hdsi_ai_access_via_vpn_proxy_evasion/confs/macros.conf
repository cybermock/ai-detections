[hdsi_ai_access_via_vpn_proxy_evasion_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Network_Traffic branches (evasion App-IDs and AI App-IDs), applied inside their tstats where clauses before aggregation. Use datamodel field names, e.g. NOT All_Traffic.src IN ("10.9.9.0/24") for an approved lab, or NOT All_Traffic.app IN ("cloudflare-warp"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_access_via_vpn_proxy_evasion_web_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Web branches (anonymizer category and AI web activity), applied inside their tstats where clauses. Use Web.* field names, e.g. NOT Web.src IN ("192.0.2.10") for an explicit proxy that appears as the client. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_access_via_vpn_proxy_evasion_dns_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Network_Resolution branches (VPN/anonymizer names and AI names), applied inside their tstats where clauses. Add internal resolvers or forwarders that appear as the DNS client, e.g. NOT DNS.src IN ("10.0.0.53"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_access_via_vpn_proxy_evasion_evasion_app_ids]
definition = (All_Traffic.app IN ("tor","tor-*","tor2web*","psiphon*","ultrasurf*","freegate*","your-freedom*","lantern*","hotspot-shield*","nordvpn*","expressvpn*","cyberghost*","tunnelbear*","hola-*","betternet*","windscribe*","protonvpn*","proton-vpn*","surfshark*","private-internet-access*","ipvanish*","purevpn*","vyprvpn*","zenmate*","browsec*","urban-vpn*","touchvpn*","hide-me*","hideman*","hidemyass*","mullvad*","opera-vpn*","turbo-vpn*","thunder-vpn*","x-vpn*","supervpn*","vpn-anonymous*","kproxy*","glype*","phproxy*","cgiproxy*"))
description = v1.1 Firewall application-identification values (PAN-OS App-ID style, matched case-insensitively) for Tor, censorship-circumvention tools, consumer anonymising VPNs and web proxies. Validated values: tor, hotspot-shield, nordvpn, expressvpn, cyberghost-vpn, tunnelbear, hola-unblocker, ipvanish, betternetvpn, VPN-Anonymous.VPN. Enterprise remote-access and mesh VPNs (ike, ipsec-*, open-vpn, wireguard, tailscale-*, zerotier, checkpoint-vpn, cloudflare-warp, ms-dev-tunnels) and http-proxy are deliberately absent: they were the bulk of VPN App-ID traffic in validation and are normally corporate. Add your NGFW's names for the same consumer tools here.
disabled = False
iseval = 0

[hdsi_ai_access_via_vpn_proxy_evasion_anonymizer_categories]
definition = (Web.category IN ("proxy-avoidance-and-anonymizers","Proxy Avoidance*","*Anonymizer*","Proxies*Anonymizers","Proxy/Anonymizer","Anonymizing Utilities","Anonymizers"))
description = v1.1 Web proxy / secure web gateway URL categories that mean an anonymizer, consumer VPN service or proxy-avoidance site (PAN-OS proxy-avoidance-and-anonymizers, Zscaler/Cloudflare Anonymizer, Fortinet/Symantec/Forcepoint Proxy Avoidance, Umbrella Proxy/Anonymizer). Matched case-insensitively; the host comes from url_domain, or from site on SSE/CASB data without a domain. An allowed event whose host matches the web_attempt_hosts macro (apex/www vendor sites, wildcard SNI, no host, installer/CDN hosts) is treated as an attempt, not as the evasion tool getting through. Other hosts (API, relay, node hosts) and SSE app names count as the tool passing. Add your gateway's category names here.
disabled = False
iseval = 0

[hdsi_ai_access_via_vpn_proxy_evasion_web_exclusions]
definition = (Web.url_domain IN ("mask.icloud.com","mask-api.icloud.com","mask-h2.icloud.com","mask-canary.icloud.com","mask.apple-dns.net","*.fastly-masque.net"))
description = v1.1 Hosts inside the anonymizer category that are not evasion tools, used as NOT (...). Ships with Apple iCloud Private Relay (mask*.icloud.com, mask.apple-dns.net and the Fastly MASQUE relay): every iPhone and Mac with Private Relay contacts them, and in validation they were 86% of the anonymizer-category events and 34,000 sources a day on one tenant. Add other built-in OS or browser privacy relays here.
disabled = False
iseval = 0

[hdsi_ai_access_via_vpn_proxy_evasion_web_attempt_hosts]
definition = "^web:(\*|\(no host\)|(www\d*\.)?[^.]+\.[^.]+$)|^web:([^.]+\.)*(downloads?|dl|static|assets?|updates?|install(er)?s?)\d*\.|^web:\S*cdn"
description = v1.1 Regex (quoted) over the web evidence string web:<host>. An allowed anonymizer-category web event whose host matches is scored as an attempt (vendor site visit or installer download), not as the evasion tool getting through. Ships matching: apex and www hosts (expressvpn.com, www.nordvpn.com), wildcard SNI values (*.nordvpn.com), events with no host, installer/update hosts (downloads.*, dl.*, static.*, assets.*, updates.*, install*.*) and any host containing cdn (downloads.nordcdn.com). Everything else (API, relay and node hosts, SSE app names such as NordVPN) counts as the tool passing. Only matters where the gateway allows the anonymizer category.
disabled = False
iseval = 0

[hdsi_ai_access_via_vpn_proxy_evasion_evasion_dns]
definition = (DNS.query IN ("*.nordvpn.com","*.nordvpn.com.","*.napps-1.com","*.napps-1.com.","napps-1.com","napps-1.com.","*.expressvpn.com","*.expressvpn.com.","*.expressapisv2.net","*.expressapisv2.net.","*.surfshark.com","*.surfshark.com.","*.protonvpn.com","*.protonvpn.com.","vpn-api.proton.me","vpn-api.proton.me.","*.hotspotshield.com","*.hotspotshield.com.","*.hsselite.com","*.hsselite.com.","*.tunnelbear.com","*.tunnelbear.com.","*.cyberghostvpn.com","*.cyberghostvpn.com.","*.privateinternetaccess.com","*.privateinternetaccess.com.","*.piaservers.net","*.piaservers.net.","*.ipvanish.com","*.ipvanish.com.","*.wlvpn.com","*.wlvpn.com.","*.windscribe.com","*.windscribe.com.","*.mullvad.net","*.mullvad.net.","*.purevpn.com","*.purevpn.com.","*.vyprvpn.com","*.vyprvpn.com.","*.hidemyass.com","*.hidemyass.com.","*.zenmate.com","*.zenmate.com.","*.hola.org","*.hola.org.","*.holavpn.net","*.holavpn.net.","*.browsec.com","*.browsec.com.","*.urban-vpn.com","*.urban-vpn.com.","*.touchvpn.net","*.touchvpn.net.","*.betternet.co","*.betternet.co.","*.psiphon.ca","*.psiphon.ca.","*.getlantern.org","*.getlantern.org.","*.ultrasurf.us","*.ultrasurf.us.","aus1.torproject.org","aus1.torproject.org.","aus2.torproject.org","aus2.torproject.org.","check.torproject.org","check.torproject.org.","bridges.torproject.org","bridges.torproject.org.","dist.torproject.org","dist.torproject.org.","snowflake-broker.torproject.net","snowflake-broker.torproject.net.") NOT DNS.query IN ("www.*"))
description = v1.1 DNS names resolved by consumer VPN, anonymizer and Tor clients (vendor API, server-list and telemetry hosts), each listed with and without the trailing root dot some resolvers log. www.* marketing pages are excluded: reading a vendor site is not running the client. Tor is limited to the hosts Tor Browser itself contacts (update, check, bridge and Snowflake broker hosts, plus the dist download host), not blog, forum, support or GitLab pages. Tor names seen only in DNS do not add the Tor bonus. Matched case-insensitively. A DNS-only match proves the client is installed or being set up, not that traffic left through it, so it scores lowest.
disabled = False
iseval = 0

[hdsi_ai_access_via_vpn_proxy_evasion_ai_app_ids]
definition = (All_Traffic.app IN ("openai*","chatgpt*","claude*","anthropic*","google-gemini*","google-bard*","gemini*","perplexity*","deepseek*","mistral*","grok*","xai-*","poe","poe-*","character-ai*","huggingface*","openrouter*","groq*","venice-ai*","z-ai*","baidu-yiyan*","meta-ai*","midjourney*","elevenlabs*","github-copilot*","cursor","windsurf*"))
description = v1.1 Firewall App-ID prefilter for AI services (PAN-OS style, case-insensitive). Each value is resolved to a provider through ai_domains_filter (ai_provider_apps): first as-is, then with a PAN sub-function suffix removed (-base, -post, -upload, -downloading, -models, -platform, -api, -chat...), then by its first token (claude-base -> claude). Values that still do not resolve in ai_provider_apps are dropped, never mis-labelled.
disabled = False
iseval = 0



description = v1.1.0 Detects a host (and its firewall/proxy user) that uses Tor, a consumer anonymising VPN or a proxy-avoidance service in the same hour as AI service activity, scoring highest when AI was blocked and the evasion tool then got through. Evidence from NGFW App-ID (Network_Traffic), web gateway URL category (Web) and DNS. Risk only, no notable.

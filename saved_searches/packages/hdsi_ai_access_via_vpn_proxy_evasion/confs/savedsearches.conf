search = | tstats prestats=t summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) max(_time) from datamodel=Network_Traffic where `hdsi_ai_access_via_vpn_proxy_evasion_evasion_app_ids` `hdsi_ai_access_via_vpn_proxy_evasion_filter` by All_Traffic.src All_Traffic.user All_Traffic.app All_Traffic.action \
	| tstats prestats=t append=t summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) max(_time) from datamodel=Web where `hdsi_ai_access_via_vpn_proxy_evasion_anonymizer_categories` NOT `hdsi_ai_access_via_vpn_proxy_evasion_web_exclusions` `hdsi_ai_access_via_vpn_proxy_evasion_web_filter` by Web.src Web.user Web.url_domain Web.site Web.action \
	| tstats prestats=t append=t summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) max(_time) from datamodel=Network_Resolution where `hdsi_ai_access_via_vpn_proxy_evasion_evasion_dns` `hdsi_ai_access_via_vpn_proxy_evasion_dns_filter` by DNS.src DNS.query \
	| eval side="evasion" \
	| tstats prestats=t append=t summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) max(_time) from datamodel=Network_Traffic where `hdsi_ai_access_via_vpn_proxy_evasion_ai_app_ids` `hdsi_ai_access_via_vpn_proxy_evasion_filter` by All_Traffic.src All_Traffic.user All_Traffic.app All_Traffic.action \
	| tstats prestats=t append=t summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) max(_time) from datamodel=Network_Resolution where `hdsi_ai_access_via_vpn_proxy_evasion_ai_dns_names` `hdsi_ai_access_via_vpn_proxy_evasion_dns_filter` by DNS.src DNS.query \
	| tstats prestats=t append=t summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) max(_time) from datamodel=Web where `hdsi_ai_access_via_vpn_proxy_evasion_ai_web_names` `hdsi_ai_access_via_vpn_proxy_evasion_web_filter` by Web.src Web.user Web.url_domain Web.site Web.action \
	| eval side=coalesce(side,"ai"), evidence_source=case(isnotnull('All_Traffic.src'),"firewall", isnotnull('DNS.src'),"dns", true(),"web"), src=coalesce('All_Traffic.src','Web.src','DNS.src'), user=coalesce('All_Traffic.user','Web.user',"unknown"), app=coalesce('All_Traffic.app',"unknown"), action=coalesce('All_Traffic.action','Web.action',"resolved"), query=coalesce('DNS.query',"unknown"), url_domain=coalesce('Web.url_domain',"unknown"), site=coalesce('Web.site',"unknown") \
	| stats count min(_time) as firstTime max(_time) as lastTime by side evidence_source src user app action query url_domain site \
	| eval app=if(evidence_source="firewall", lower(app), null()), host=lower(case(evidence_source="dns", replace(query,"\.+$",""), evidence_source="web", coalesce(nullif(url_domain,"unknown"), nullif(site,"unknown")))), evidence=if(side="evasion", case(evidence_source="firewall", "app:".app, evidence_source="dns", "dns:".host, true(), "web:".coalesce(host,"(no host)")), null()), ai_input_type=if(side="ai", case(evidence_source="firewall", "app", evidence_source="dns", "dns", url_domain="unknown", "app", true(), "host"), null()), ai_domain=if(side="ai", if(evidence_source="firewall", mvdedup(mvappend(app, replace(app,"-(base|post|posting|upload|uploading|download|downloading|models|platform|api|chat|business|enterprise)$",""), replace(app,"-.*$",""))), host), null()) \
	| fields - query url_domain site host \
	| eval user=if(isnull(user) OR trim(user)="" OR in(lower(user),"unknown","-","n/a","none","null"), null(), lower(user)) \
	| where isnotnull(src) AND src!="" AND lower(src)!="unknown" \
	| eventstats max(eval(if(side="evasion",1,0))) as has_evasion max(eval(if(side="ai",1,0))) as has_ai by src \
	| where has_evasion=1 AND has_ai=1 \
	| appendpipe [| where side="ai" | streamstats count as ai_row | mvexpand ai_domain | streamstats count as ai_rank by ai_row | `ai_domains_filter` | sort 0 ai_row ai_rank | dedup ai_row | eval ai_resolved=1, evidence=provider." (".coalesce("app:".lower(app),ai_domain).")" | fields - ai_row ai_rank] \
	| where side="evasion" OR (ai_resolved=1 AND ai_traffic_class!="background") \
	| search side="evasion" OR NOT provider IN (`hdsi_ai_access_via_vpn_proxy_evasion_sanctioned_providers`) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| eventstats max(eval(if(side="evasion",1,0))) as has_evasion max(eval(if(side="ai",1,0))) as has_ai by src \
	| where has_evasion=1 AND has_ai=1 \
	| eval is_blocked=if(match(lower(coalesce(action,"")),"^(block|blocked|deny|denied|drop|dropped|reset|reject|rejected)"),1,0), web_attempt=if(side="evasion" AND evidence_source="web" AND match(evidence,`hdsi_ai_access_via_vpn_proxy_evasion_web_attempt_hosts`),1,0), evasion_pass=if(side="evasion" AND evidence_source!="dns" AND is_blocked=0 AND web_attempt=0,1,0), ai_block=if(side="ai" AND is_blocked=1,1,0), is_tor=if(evasion_pass=1 AND match(evidence,"^app:tor($|-)|^app:tor2web|^web:((aus[12]|check|bridges)\.torproject\.org|snowflake-broker\.torproject\.net|tor( browser| project)?)$"),1,0), ai_block_time=if(ai_block=1,firstTime,null()), evasion_pass_time=if(evasion_pass=1,lastTime,null()) \
	| stats sum(eval(if(side="evasion",count,0))) as evasion_count sum(eval(if(side="ai",count,0))) as ai_count values(eval(if(side="evasion",evidence,null()))) as evasion_methods values(eval(if(side="ai",evidence,null()))) as ai_evidence values(eval(if(side="ai",provider,null()))) as providers values(user) as users dc(user) as user_count max(evasion_pass) as evasion_allowed max(ai_block) as ai_blocked max(is_tor) as tor_seen min(ai_block_time) as first_ai_block max(evasion_pass_time) as last_evasion_pass min(firstTime) as firstTime max(lastTime) as lastTime by src \
	| where user_count<=`hdsi_ai_access_via_vpn_proxy_evasion_max_users_per_src` \
	| eval user=if(user_count=1, users, null()), user_display=case(user_count=1, users, user_count>1, user_count." users: ".mvjoin(users,", "), true(), "no user attribution") \
	| where NOT ((`hdsi_ai_access_via_vpn_proxy_evasion_unreliable_src`) AND isnull(user)) \
	| eval bypass_after_block=if(ai_blocked=1 AND evasion_allowed=1 AND last_evasion_pass>=first_ai_block, 1, 0) \
	| `ai_risk_multiplier` \
	| eval base_score=case(ai_blocked=1 AND evasion_allowed=1, 40, evasion_allowed=1, 25, ai_blocked=1, 20, true(), 10)+if(tor_seen=1, 10, 0), risk_score=min(60, round(base_score*coalesce(risk_multiplier,1), 0)) \
	| where base_score>=`hdsi_ai_access_via_vpn_proxy_evasion_min_base_score` AND NOT ((`hdsi_ai_access_via_vpn_proxy_evasion_dynamic_src`) AND isnull(user) AND base_score<40) \
	| eval provider=mvindex(providers,0), provider_list=mvjoin(providers,", "), evasion_list=mvjoin(mvindex(evasion_methods,0,4),", "), ai_outcome=case(bypass_after_block=1, "AI blocked, then evasion tool allowed", ai_blocked=1 AND evasion_allowed=1, "AI blocked, evasion tool allowed", ai_blocked=1, "AI blocked, evasion attempt blocked or DNS only", evasion_allowed=1, "AI allowed, evasion tool allowed (co-occurrence)", true(), "AI allowed, evasion attempt blocked or DNS only"), ai_evidence=mvindex(ai_evidence,0,9) \
	| fields - first_ai_block last_evasion_pass \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="vpn_proxy_evasion", detection_id="hdsi_ai_access_via_vpn_proxy_evasion", mitre_attack="T1090,T1090.003,T1588.007", ai_kill_chain_phase="initial_access" \
	| `hdsi_ai_access_via_vpn_proxy_evasion_customizations` \
	| `hdsi_ai_access_via_vpn_proxy_evasion_risk_score`

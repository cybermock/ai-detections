fset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View VPN and AI DNS queries from $src$","search":"| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Resolution where DNS.src=\"$src$\" (`hdsi_ai_access_via_vpn_proxy_evasion_evasion_dns` OR `hdsi_ai_access_via_vpn_proxy_evasion_ai_dns_names`) by DNS.src DNS.query | rename DNS.* as * | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, src, query, count | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]

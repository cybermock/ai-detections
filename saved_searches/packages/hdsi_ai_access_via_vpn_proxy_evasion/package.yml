version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Access Via VPN/Proxy Evasion
description: "Detects a host, and its firewall or proxy user where known, that uses Tor, a consumer anonymising VPN or a proxy-avoidance service in the same hour as AI service activity. Scores highest when AI was blocked and the evasion tool then got through. Evidence comes from NGFW App-ID (Network_Traffic), web gateway URL categories (Web) and DNS (Network_Resolution). Risk only, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - network
  - web
  - proxy
  - dns
  - tunneling
data_prereqs:
  datamodels:
    op: OR
    items:
    - "Network_Traffic"
    - "Web"
    - "Network_Resolution"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

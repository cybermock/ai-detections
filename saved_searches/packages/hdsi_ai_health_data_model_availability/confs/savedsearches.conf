[Audit - HDSI AI Health Data Model Availability - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Health Data Model Availability
action.correlationsearch.annotations = {"mitre_attack": ["T1562.006"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 1
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View hourly event counts for the $data_model$ data model (7d)","search":"| tstats summariesonly=t allow_old_summaries=t count from datamodel=Web by _time span=1h | eval data_model=\"Web\" | append [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Network_Resolution by _time span=1h | eval data_model=\"Network_Resolution\"] | append [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Network_Traffic by _time span=1h | eval data_model=\"Network_Traffic\"] | append [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Endpoint.Processes by _time span=1h | eval data_model=\"Endpoint.Processes\"] | append [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Endpoint.Filesystem by _time span=1h | eval data_model=\"Endpoint.Filesystem\"] | append [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Endpoint.Ports by _time span=1h | eval data_model=\"Endpoint.Ports\"] | append [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Email by _time span=1h | eval data_model=\"Email\"] | append [| tstats summariesonly=t allow_old_summaries=t count from datamodel=DLP.DLP_Incidents by _time span=1h | eval data_model=\"DLP\"] | append [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Authentication by _time span=1h | eval data_model=\"Authentication\"] | search data_model=\"$data_model$\" | timechart span=1h limit=0 useother=f sum(count) as events by data_model","earliest_offset":"-7d@h","latest_offset":"now"},{"name":"View acceleration status of the $dm_root$ data model","search":"| rest /services/admin/summarization by_tstats=t splunk_server=local count=0 | where match('summary.id', \"_$dm_root$(\\.|$)\") | eval complete_pct=round(tonumber('summary.complete')*100,1) | table summary.id complete_pct summary.is_inprogress summary.earliest_time summary.latest_time summary.time_range summary.size summary.mod_time summary.last_error","earliest_offset":"-24h@h","latest_offset":"now"},{"name":"View enabled AI-RBA rules that read the $data_model$ data model","search":"| rest /servicesNS/-/-/saved/searches splunk_server=local count=0 search=\"HDSI\" | fields title search disabled is_scheduled cron_schedule dispatch.earliest_time eai:acl.app | search disabled=0 is_scheduled=1 title=\"*HDSI*AI*\" | where match(title, \" - HDSI (RBA )?AI \") AND NOT match(title, \" - HDSI AI Health \") | rex field=search max_match=0 \"datamodel[=:]\\s*\\\"?(?<dep_dm>[A-Za-z_]+(?:\\.[A-Za-z_]+)?)\" | mvexpand dep_dm | eval dep_dm=replace(dep_dm, \"^Data_Loss_Prevention\", \"DLP\"), data_model=if(match(dep_dm,\"^Endpoint\\.\"), dep_dm, mvindex(split(dep_dm,\".\"),0)) | search data_model=\"$data_model$\" | dedup title | table title eai:acl.app cron_schedule dispatch.earliest_time","earliest_offset":"-24h@h","latest_offset":"now"}]
action.notable.param.rule_description = The $data_model$ data model is $status$: $reason$ $impact$
action.notable.param.rule_title = HDSI AI Health Data Model Availability ($data_model$ $status$)
action.notable.param.security_domain = audit
action.notable.param.severity = medium
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = data_model
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 20 * * * *
description = v1.1.0 Audit health check for the CIM data models that HDSI AI-RBA detections read with summariesonly=t (Web, Network_Resolution, Network_Traffic, Endpoint.Processes, Endpoint.Filesystem, Endpoint.Ports, Email, DLP, Authentication). Compares the last 2 complete hours of accelerated events with the median of the same hours of day over the prior 6 days, and flags a model that has been silent for 24 hours or more against its own earlier rate, reporting each model as OK, DEGRADED, STOPPED, ABSENT or NOT_ACCELERATED. Creates an audit notable only for a model that an enabled AI-RBA detection (or the required_models macro) depends on. No risk, no email.
disabled = 0
dispatch.earliest_time = -7d@h
dispatch.latest_time = -1h@h
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t count from datamodel=Web by _time span=1h \
	| eval data_model="Web" \
	| append maxtime=300 [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Network_Resolution by _time span=1h | eval data_model="Network_Resolution"] \
	| append maxtime=300 [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Network_Traffic by _time span=1h | eval data_model="Network_Traffic"] \
	| append maxtime=300 [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Endpoint.Processes by _time span=1h | eval data_model="Endpoint.Processes"] \
	| append maxtime=300 [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Endpoint.Filesystem by _time span=1h | eval data_model="Endpoint.Filesystem"] \
	| append maxtime=300 [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Endpoint.Ports by _time span=1h | eval data_model="Endpoint.Ports"] \
	| append maxtime=300 [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Email by _time span=1h | eval data_model="Email"] \
	| append maxtime=300 [| tstats summariesonly=t allow_old_summaries=t count from datamodel=DLP.DLP_Incidents by _time span=1h | eval data_model="DLP"] \
	| append maxtime=300 [| tstats summariesonly=t allow_old_summaries=t count from datamodel=Authentication by _time span=1h | eval data_model="Authentication"] \
	| timechart span=1h limit=0 useother=f sum(count) by data_model \
	| fillnull value=0 \
	| untable _time data_model count \
	| addinfo \
	| eval recent=if(_time>=info_max_time-7200,1,0), hod=strftime(_time,"%H"), baseline_count=if(recent=0,count,null()) \
	| eventstats median(baseline_count) as hod_median by data_model hod \
	| stats sum(eval(if(recent=1,count,0))) as recent_events, sum(eval(if(recent=1,hod_median,0))) as expected_recent, sum(baseline_count) as baseline_events, count(eval(baseline_count>0)) as baseline_active_hours, count(baseline_count) as baseline_hours, max(eval(if(count>0,_time,null()))) as last_data_hour, min(eval(if(count>0,_time,null()))) as first_data_hour by data_model \
	| append maxtime=300 [| makeresults | eval data_model=split("Web,Network_Resolution,Network_Traffic,Endpoint.Processes,Endpoint.Filesystem,Endpoint.Ports,Email,DLP,Authentication",","), in_catalog=1 | mvexpand data_model | fields data_model in_catalog] \
	| append maxtime=300 [| rest /servicesNS/-/-/datamodel/model splunk_server=local count=0 | search title IN ("Web","Network_Resolution","Network_Traffic","Endpoint","Email","DLP","Authentication") | eval data_model=if(title="Endpoint", split("Endpoint.Processes,Endpoint.Filesystem,Endpoint.Ports",","), title), accelerated=if(spath(acceleration,"enabled")="true" OR spath(acceleration,"enabled")="1", 1, 0) | mvexpand data_model | fields data_model accelerated] \
	| append maxtime=300 [| rest /services/admin/summarization by_tstats=t splunk_server=local count=0 | rex field=summary.id "_(?<dm_name>Web|Network_Resolution|Network_Traffic|Endpoint\.Processes|Endpoint\.Filesystem|Endpoint\.Ports|Endpoint|Email|DLP|Authentication)$" | where isnotnull(dm_name) | eval data_model=if(dm_name="Endpoint", split("Endpoint.Processes,Endpoint.Filesystem,Endpoint.Ports",","), dm_name), summary_complete_pct=round(tonumber('summary.complete')*100,1) | mvexpand data_model | fields data_model summary_complete_pct] \
	| append maxtime=300 [| rest /servicesNS/-/-/saved/searches splunk_server=local count=0 search="HDSI" | fields title search disabled is_scheduled | search disabled=0 is_scheduled=1 title="*HDSI*AI*" | where match(title, " - HDSI (RBA )?AI ") AND NOT match(title, " - HDSI AI Health ") | rex field=search max_match=0 "datamodel[=:]\s*\"?(?<dep_dm>[A-Za-z_]+(?:\.[A-Za-z_]+)?)" | mvexpand dep_dm | eval dep_dm=replace(dep_dm, "^Data_Loss_Prevention", "DLP"), data_model=if(match(dep_dm,"^Endpoint\."), dep_dm, mvindex(split(dep_dm,"."),0)) | stats dc(title) as dependent_rule_count, values(title) as dependent_rules by data_model] \
	| stats max(in_catalog) as in_catalog, max(recent_events) as recent_events, max(expected_recent) as expected_recent, max(baseline_events) as baseline_events, max(baseline_active_hours) as baseline_active_hours, max(baseline_hours) as baseline_hours, max(last_data_hour) as last_data_hour, min(first_data_hour) as first_data_hour, max(accelerated) as accelerated, min(summary_complete_pct) as summary_complete_pct, max(dependent_rule_count) as dependent_rule_count, values(dependent_rules) as dependent_rules by data_model \
	| where in_catalog=1 \
	| fillnull value=0 recent_events expected_recent baseline_events baseline_active_hours baseline_hours dependent_rule_count \
	| addinfo \
	| eval silence_hours=if(isnull(last_data_hour), null(), round((info_max_time-last_data_hour)/3600,0)-1), span_hours=if(isnull(first_data_hour), 0, round((last_data_hour-first_data_hour)/3600,0)+1), prior_expected=if(span_hours>0, round(2*(baseline_events+recent_events)/span_hours,0), 0), continuous=if(span_hours>0 AND baseline_active_hours*2>=span_hours AND (first_data_hour-info_min_time<3600 OR baseline_active_hours>=`hdsi_ai_health_data_model_availability_max_silence_hours`), 1, 0) \
	| eval expected_recent=round(expected_recent,0), baseline_coverage_pct=if(baseline_hours>0, round(100*baseline_active_hours/baseline_hours,1), 0), last_data=if(isnull(last_data_hour), "none in 7d", strftime(last_data_hour,"%Y-%m-%d %H:00 %Z")), dm_root=mvindex(split(data_model,"."),0), dependent_rules=mvindex(dependent_rules,0,4) \
	| eval required=if(in(data_model, `hdsi_ai_health_data_model_availability_required_models`) OR dependent_rule_count>0, 1, 0) \
	| eval min_expected=`hdsi_ai_health_data_model_availability_min_expected`, degraded_pct=`hdsi_ai_health_data_model_availability_degraded_pct`, max_silence_hours=`hdsi_ai_health_data_model_availability_max_silence_hours` \
	| eval status=case(accelerated=0, "NOT_ACCELERATED", baseline_events=0 AND recent_events=0, "ABSENT", recent_events=0 AND expected_recent>=min_expected, "STOPPED", recent_events=0 AND silence_hours>=max_silence_hours AND continuous=1 AND prior_expected>=min_expected, "STOPPED", expected_recent>=min_expected AND recent_events*100<expected_recent*degraded_pct, "DEGRADED", true(), "OK") \
	| eval reason=case(status="NOT_ACCELERATED", "acceleration is disabled for this data model, so every summariesonly=t search against it returns nothing.", status="ABSENT", "the acceleration summary holds no events in the last 7 days.", status="STOPPED" AND expected_recent>=min_expected, "no events in the last 2 complete hours, where the same hours of day over the prior 6 days had a median of ".expected_recent." events (last data ".last_data.").", status="STOPPED", "no events for ".silence_hours." hours (last data ".last_data."). Before that it sent events in most hours, averaging ".prior_expected." events per 2 hours; the same-hour median no longer shows that because the outage now covers most of the 7-day window.", status="DEGRADED", recent_events." events in the last 2 complete hours, below " . degraded_pct . "% of the ".expected_recent." expected from the same hours of day over the prior 6 days.", recent_events=0, "no events in the last 2 complete hours, which is not treated as an outage: the same hours of day expected only ".expected_recent." events (below min_expected ".min_expected.") and the model has not been silent for ".max_silence_hours." hours after sending steadily at or above that rate.", true(), recent_events." events in the last 2 complete hours against ".expected_recent." expected from the same hours of day over the prior 6 days; within tolerance.") \
	| eval impact=if(dependent_rule_count>0, dependent_rule_count." enabled AI-RBA detection(s) read this data model with summariesonly=t and are blind or partially blind until it recovers.", "No enabled AI-RBA detection reads this data model; it alerts because it is listed in the required_models macro."), alert=if(required=1 AND status!="OK", 1, 0), mitre_attack="T1562.006" \
	| search data_model=* `hdsi_ai_health_data_model_availability_filter` \
	| `hdsi_ai_health_data_model_availability_customizations` \
	| where alert=1 \
	| table data_model, status, reason, impact, recent_events, expected_recent, prior_expected, silence_hours, baseline_events, baseline_coverage_pct, last_data, accelerated, summary_complete_pct, dependent_rule_count, dependent_rules, required, dm_root, mitre_attack

[hdsi_ai_health_data_model_availability_filter]
definition = ()
description = v1.1 Tenant exclusion hook: search terms placed inline in `search data_model=* <filter>` after each data model's status is computed (fields: data_model, status, required, dependent_rule_count, silence_hours, ...). Example: NOT (data_model="Endpoint.Ports" status="DEGRADED"). Ships as () (no exclusion).
disabled = False
iseval = 0

[hdsi_ai_health_data_model_availability_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped before the final alert=1 filter, so it can override status, required or alert (for example eval alert=0 for a model under planned maintenance). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_health_data_model_availability_required_models]
definition = "__none__"
description = v1.1 Quoted, comma-separated data model labels that must always alert when not OK, even when no enabled AI-RBA detection reads them (labels: "Web","Network_Resolution","Network_Traffic","Endpoint.Processes","Endpoint.Filesystem","Endpoint.Ports","Email","DLP","Authentication"). Ships as "__none__" so only models with enabled dependent detections alert.
disabled = False
iseval = 0

[hdsi_ai_health_data_model_availability_min_expected]
definition = 100
description = v1.1 Minimum events expected in the 2-hour recent window (sum of the same-hour medians over the prior 6 days), and the minimum earlier 2-hour rate for the long-silence STOPPED test, before STOPPED or DEGRADED is evaluated. Stops sparse feeds (a few events per hour) from flapping. Raise for noisy low-volume models.
disabled = False
iseval = 0

[hdsi_ai_health_data_model_availability_degraded_pct]
definition = 10
description = v1.1 A model is DEGRADED when the last 2 complete hours hold fewer than this percentage of the events expected from the same hours of day over the prior 6 days. Lower it if a feed is legitimately bursty.
disabled = False
iseval = 0

[hdsi_ai_health_data_model_availability_max_silence_hours]
definition = 24
description = v1.1 A model with no events for at least this many hours is STOPPED when its earlier rate (events per 2 hours while it was sending) reached min_expected, even after the same-hour median has decayed to 0 because the outage covers most of the 7-day window. Raise it only for a business-hours-only feed that is legitimately silent for longer (for example 66 over a weekend).
disabled = False
iseval = 0

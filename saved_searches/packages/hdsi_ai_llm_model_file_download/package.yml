version: 1.1.0
creation_date: '2026-03-04'
package_title: AI LLM Model File Download
description: "Detects a user or host downloading LLM model weights from Hugging Face, ModelScope or the Ollama registry. Evidence comes from Web (proxy or firewall URL logs) and DNS (Network_Resolution): requests to hosts only model hub clients use (Hugging Face Xet, Ollama registry; pull or push), weight-file download URLs (.gguf, .safetensors, Ollama blobs), bulk model-CDN fetches, or large downloads from a model hub. Browsing the hub sites does not count. Runs daily. Risk on the user and/or host, no notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - web
  - proxy
  - dns
data_prereqs:
  datamodels:
    op: OR
    items:
    - "Web"
    - "Network_Resolution"
deployment_type: global
prereq_packages:
  - hdsi_ai_rba_common

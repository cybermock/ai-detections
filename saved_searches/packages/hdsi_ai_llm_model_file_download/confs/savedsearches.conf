	| append maxtime=600 [| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Resolution where `hdsi_ai_llm_model_file_download_dns_scope` NOT DNS.src IN ("unknown","-","0.0.0.0","127.0.0.1","::1") `hdsi_ai_llm_model_file_download_dns_filter` by sourcetype DNS.src DNS.query DNS.message_type | rename DNS.* as * | stats max(count) as count min(firstTime) as firstTime max(lastTime) as lastTime by sourcetype src query | eval evidence_source="dns", ai_domain=query, ai_input_type="dns", bytes_in=0, weight_events=0] \
	| eval src=if(isnull(src) OR match(lower(src),"^(unknown|-|n/a|null|none|0\.0\.0\.0|)$"),null(),lower(src)) \
	| eventstats max(shared_src) as shared_src by src \
	| where isnull(shared_src) AND isnotnull(evidence_source) \
	| eval ai_domain=if(match(lower(ai_domain),"^dd20bb891979d25aebc8bec07b2b3bbc\.r2\.cloudflarestorage\.com\.?(:\d+)?$"),"registry.ollama.ai",ai_domain) \
	| `ai_domains_filter` \
	| where in(usage_type,"model_registry","local_llm") \
	| eval user=if(isnull(user) OR match(lower(user),"^(unknown|-|n/a|null|none|anonymous|)$") OR match(user,"^\d{1,3}(\.\d{1,3}){3}$"),null(),user), src_untrusted=if(isnotnull(src) AND ((`hdsi_ai_llm_model_file_download_untrusted_src`) OR (`hdsi_ai_llm_model_file_download_unstable_src`)),1,0) \
	| where isnotnull(user) OR (isnotnull(src) AND src_untrusted=0) \
	| eval src=if(src_untrusted=1,null(),src), bytes_in=coalesce(tonumber(bytes_in),0), weight_events=coalesce(tonumber(weight_events),0), tool_events=if(match(ai_domain,`hdsi_ai_llm_model_file_download_tool_hosts`),count,0), cdn_events=if(match(ai_domain,`hdsi_ai_llm_model_file_download_cdn_hosts`),count,0), model_file=if(weight_events>0,model_file,null()), model_source=case(match(ai_domain,"ollama"),"Ollama", match(ai_domain,"modelscope"),"ModelScope", match(ai_domain,"hugging ?face|(^|\.)hf\.co$"),"Hugging Face", true(),provider), user_first=if(isnotnull(user),firstTime,null()), user_last=if(isnotnull(user),lastTime,null()) \
	| eventstats values(user) as src_users min(user_first) as src_user_first max(user_last) as src_user_last by src \
	| eval user=coalesce(user,if(mvcount(src_users)=1 AND firstTime>=src_user_first-3600 AND lastTime<=src_user_last+3600,src_users,null())), risk_entity=coalesce(user,src) \
	| stats sum(count) as event_count sum(tool_events) as tool_events sum(cdn_events) as cdn_events sum(weight_events) as weight_events sum(bytes_in) as bytes_in values(ai_domain) as ai_domains values(model_file) as model_files values(model_source) as model_sources values(evidence_source) as evidence_sources values(sourcetype) as sourcetypes values(user) as user values(src) as src_list min(firstTime) as firstTime max(lastTime) as lastTime by risk_entity provider \
	| where tool_events>0 OR weight_events>0 OR bytes_in>=`hdsi_ai_llm_model_file_download_min_mb`*1048576 OR cdn_events>=`hdsi_ai_llm_model_file_download_min_cdn_events` \
	| eval user=mvindex(user,0), src=if(mvcount(src_list)=1,src_list,null()) \
	| lookup identity_lookup_expanded identity as user OUTPUT bunit as _user_bunit \
	| lookup asset_lookup_by_str ip as src OUTPUT bunit as _src_bunit \
	| lookup asset_lookup_by_str dns as src OUTPUTNEW bunit as _src_bunit \
	| eval bunit=lower(coalesce(nullif(mvindex(_user_bunit,0),""),nullif(mvindex(_src_bunit,0),""))), bunit=if(bunit="unknown",null(),bunit) \
	| fields - _user_bunit _src_bunit \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| stats sum(event_count) as event_count sum(tool_events) as tool_events sum(cdn_events) as cdn_events sum(weight_events) as weight_events sum(bytes_in) as bytes_in values(provider) as providers values(model_sources) as model_sources values(ai_domains) as ai_domains values(model_files) as model_files values(evidence_sources) as evidence_sources values(sourcetypes) as sourcetypes values(src_list) as src_list values(user) as user values(src) as src values(bunit) as bunit min(firstTime) as firstTime max(lastTime) as lastTime by risk_entity \
	| eval user=mvindex(user,0), src=if(mvcount(src)=1,src,null()), host_row_rank=if(isnull(user),0,1) \
	| sort 0 src host_row_rank risk_entity \
	| streamstats count as src_emit_seq by src \
	| eval src=if(isnotnull(src) AND src_emit_seq>1,null(),src) \
	| `ai_risk_multiplier` \
	| eval mb_in=round(bytes_in/1048576,1), evidence=mvappend(if(tool_events>0,"model hub client",null()), if(weight_events>0,"weight-file URL",null()), if(bytes_in>=`hdsi_ai_llm_model_file_download_min_mb`*1048576,"large download",null()), if(cdn_events>=`hdsi_ai_llm_model_file_download_min_cdn_events`,"bulk model-CDN fetch",null())) \
	| eval base_score=case(bytes_in>=`hdsi_ai_llm_model_file_download_min_mb`*1048576,40, tool_events>0 OR weight_events>0,30, true(),20)+if(mvcount(evidence)>1,10,0), risk_score=min(60,max(10,round(base_score*coalesce(risk_multiplier,1)))) \
	| eval user_display=coalesce(user,"not attributed"), src_display=coalesce(src,mvjoin(mvindex(src_list,0,2),", "),"n/a"), evidence_list=mvjoin(evidence,", "), model_source_list=mvjoin(model_sources,", "), ai_domain_list=mvjoin(mvindex(ai_domains,0,4),", "), model_file_list=coalesce(mvjoin(mvindex(model_files,0,2),", "),"none"), provider=providers \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="model_download", detection_id="hdsi_ai_llm_model_file_download", mitre_attack=mvappend("T1588.007","T1105"), ai_kill_chain_phase="staging" \
	| fields - _allow_* _final_multiplier src_users src_user_first src_user_last host_row_rank src_emit_seq \
	| `hdsi_ai_llm_model_file_download_customizations` \
	| `hdsi_ai_llm_model_file_download_risk_score`

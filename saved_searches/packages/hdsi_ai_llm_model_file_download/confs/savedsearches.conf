search = | tstats summariesonly=t allow_old_summaries=t dc(DNS.query) as src_name_count from datamodel=Network_Resolution where NOT DNS.src IN ("unknown","-","0.0.0.0","127.0.0.1","::1") `hdsi_ai_llm_model_file_download_dns_filter` by DNS.src \

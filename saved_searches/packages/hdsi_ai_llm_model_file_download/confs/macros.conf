[hdsi_ai_llm_model_file_download_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Web branch, inline in its tstats where clause before aggregation. Use Web datamodel field names, e.g. NOT Web.user IN ("svc_*") or NOT sourcetype IN ("aws:elb:accesslogs","aws:waf") to keep inbound load-balancer and WAF logs out. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_llm_model_file_download_dns_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the DNS branch, inline in its tstats where clauses before aggregation. Use DNS datamodel field names, e.g. NOT DNS.src IN ("10.1.1.10","10.1.1.11") for a sanctioned GPU subnet, or a resolver that stays below the shared-source guard. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_llm_model_file_download_web_scope]
definition = (Web.url_domain IN ("huggingface.co*","*.huggingface.co*","hf.co*","*.hf.co*","modelscope.cn*","*.modelscope.cn*","ollama.com*","*.ollama.com*","registry.ollama.ai*","dd20bb891979d25aebc8bec07b2b3bbc.r2.cloudflarestorage.com*") OR Web.site IN ("huggingface.co*","*.huggingface.co*","hf.co*","*.hf.co*","modelscope.cn*","*.modelscope.cn*","ollama.com*","*.ollama.com*","registry.ollama.ai*","dd20bb891979d25aebc8bec07b2b3bbc.r2.cloudflarestorage.com*","hugging face","huggingface*","modelscope*","ollama*"))
description = v1.1 Inline pre-filter for the Web tstats: model hub hosts (Hugging Face, ModelScope, Ollama and the Ollama blob bucket) in Web.url_domain or Web.site, plus SSE/CASB app names in Web.site. The trailing wildcard tolerates a logged :port. Provider resolution and enabled flags still come from ai_domains_filter, so a host listed here but disabled in the common lookups is dropped later.
disabled = False
iseval = 0

[hdsi_ai_llm_model_file_download_dns_scope]
definition = (DNS.query IN ("cdn-lfs*.huggingface.co","cdn-lfs*.huggingface.co.","cdn-lfs*.hf.co","cdn-lfs*.hf.co.","*xethub*.hf.co","*xethub*.hf.co.","*.cdn.hf.co","*.cdn.hf.co.","cdn-lfs*.modelscope.cn","cdn-lfs*.modelscope.cn.","registry.ollama.ai","registry.ollama.ai.","dd20bb891979d25aebc8bec07b2b3bbc.r2.cloudflarestorage.com","dd20bb891979d25aebc8bec07b2b3bbc.r2.cloudflarestorage.com."))
description = v1.1 Inline pre-filter for the DNS tstats: only the names that serve model weights, never the hub web sites. Hugging Face LFS and Xet storage (cdn-lfs*, cas-bridge/cas-server/transfer.xethub*, *.cdn.hf.co), ModelScope LFS, the Ollama registry and the Ollama blob bucket on Cloudflare R2. Plain and trailing-dot forms are both listed. A lookup of huggingface.co or ollama.com alone is browsing and is deliberately not scanned.
disabled = False
iseval = 0

[hdsi_ai_llm_model_file_download_tool_hosts]
definition = "^((cas-server|transfer)\.xethub(-[a-z0-9]+)?\.hf\.co|registry\.ollama\.ai)$"
description = v1.1 Quoted regex on the normalised ai_domain for hosts that only a model hub client talks to: the Hugging Face Xet client (huggingface_hub, transformers, LM Studio and similar call cas-server and transfer.xethub*.hf.co) and the Ollama registry (the Ollama blob bucket is mapped to registry.ollama.ai before resolution). One request is enough evidence. Browsers do not use these hosts. The same hosts carry uploads (huggingface_hub upload/push_to_hub and Xet uploads use cas-server; ollama push uses registry.ollama.ai), and DNS cannot tell the direction, so the evidence is labelled "model hub client" and the Web drilldown shows bytes_out.
disabled = False
iseval = 0

[hdsi_ai_llm_model_file_download_cdn_hosts]
definition = "^(cdn-lfs[a-z0-9-]*\.(huggingface\.co|hf\.co|modelscope\.cn)|cas-bridge\.xethub(-[a-z0-9]+)?\.hf\.co|([a-z0-9-]+\.)+cdn\.hf\.co)$"
description = v1.1 Quoted regex on the normalised ai_domain for model-hub storage CDNs (Hugging Face LFS and Xet bridge, ModelScope LFS). They serve model weights and dataset files, but a browser also fetches them for images embedded in a model card, so they count only in bulk (see the min_cdn_events macro).
disabled = False
iseval = 0

[hdsi_ai_llm_model_file_download_weight_file_pattern]
definition = "(?i)^(?![^?#]*/datasets/).*?(/resolve/[^?#]*/(?!(training_args|optimizer|scheduler|scaler|rng_state)[^/?#]*\.)[^/?#]+\.(gguf|ggml|safetensors|bin|pt|pth|ckpt|onnx|h5|tflite|llamafile|mlmodel|msgpack)([?#]|$)|[?&]FilePath=([^&#]*(/|%2F))?(?!(training_args|optimizer|scheduler|scaler|rng_state)[^&#/%]*\.)[^&#/%]+\.(gguf|ggml|safetensors|bin|pt|pth|ckpt|onnx|h5|tflite|llamafile|mlmodel|msgpack)([&#]|$)|/v2/([^?#]+/)?blobs/sha256[:/-])"
description = v1.1 Quoted regex on the URL path of Web rows (model hub hosts only) for a model weight file fetched through a download endpoint: a Hugging Face or ModelScope /resolve/<revision>/<file> URL, a ModelScope API FilePath= parameter, or an Ollama blob pull (/v2/<name>/blobs/sha256:<digest> on the registry, and the /v2/blobs/sha256/<xx>/<digest>/data path on its R2 bucket). Extensions: GGUF/GGML, SafeTensors, PyTorch .bin/.pt/.pth, checkpoints, ONNX (including the small ONNX models that transformers.js web apps fetch), Keras/TF, llamafile, Core ML, Flax msgpack. Not counted: the Hugging Face file viewer (/blob/, /tree/, /raw/), config, tokenizer and README files, dataset repositories (any path with /datasets/), and training-state files (training_args, optimizer, scheduler, scaler, rng_state*). Needs a proxy or decrypting firewall that logs the path.
disabled = False
iseval = 0

[hdsi_ai_llm_model_file_download_min_mb]
definition = 500
description = v1.1 MB received (Web bytes_in) from model hub hosts per user or host per day that counts as a model download on its own, whatever the URL. Only proxies that log response size use it; firewall URL logs have no bytes. 500 MB is above any browsing session seen in validation and below a small quantised model. Replaces the model_download_mb row of ai_detection_config, which is no longer read.
disabled = False
iseval = 0

[hdsi_ai_llm_model_file_download_min_cdn_events]
definition = 25
description = v1.1 Requests (Web) or DNS lookups to the model storage CDNs per user or host per day that count as a bulk download when no tool host or weight-file URL is seen. In 7 days of validation, 46 browsing host-days (CDN requests or lookups with no download client) had at most 19, and 43 of them had 10 or fewer; the two bulk downloads had about 280 and 296.
disabled = False
iseval = 0

[hdsi_ai_llm_model_file_download_shared_src_names]
definition = 10000
description = v1.1 Shared-source guard: a client that resolved at least this many distinct DNS names in the daily window is a resolver, forwarder, proxy or NAT egress, and all its rows (DNS and Web) are dropped, because risk on it would describe many people. In validation every DNS hit on the largest tenant came from resolvers with 100,000+ names a day, while workstations that pulled models stayed below 5,000. Same value and derivation as hdsi_ai_dns_queries_to_ai_domains_shared_src_names. The guard is the outer tstats of the search, so it is never cut short by a subsearch limit; the Web and DNS evidence branches are the appended subsearches (maxtime=600), and if one of those is cut short the rule misses evidence rather than marking the wrong host.
disabled = False
iseval = 0

[hdsi_ai_llm_model_file_download_untrusted_src]
definition = match(src,"^\d{1,3}(\.\d{1,3}){3}$") AND NOT (cidrmatch("10.0.0.0/8",src) OR cidrmatch("172.16.0.0/12",src) OR cidrmatch("192.168.0.0/16",src) OR cidrmatch("100.64.0.0/10",src))
description = v1.1 Eval condition on src for addresses that are not one of your endpoints. Rows that match and have no user are dropped, and a matching src is never a risk object. Ships as "public IPv4": inbound WAF and load-balancer logs in the Web data model carry internet clients that send model-hub Host headers, and DNS security services can log a NAT egress address. Use false() if your clients have public addresses. 100.64.0.0/10 (CGNAT, often a VPN pool) is treated as internal, so a VPN lease address can become a system risk object; if that address cannot be tied to one person, remove the 100.64.0.0/10 term from the internal list, or wrap the definition as (<shipped>) OR cidrmatch("<pool>",src) for your VPN and guest Wi-Fi pools, to drop host-only rows from them.
disabled = False
iseval = 0

[hdsi_ai_llm_model_file_download_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation and scoring (fields: risk_entity, user, src, src_list, providers, model_sources, ai_domains, evidence, tool_events, cdn_events, weight_events, model_files, mb_in, event_count, evidence_sources, sourcetypes, bunit, risk_multiplier, base_score, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_llm_model_file_download_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust or override risk_score (max 100); ES applies it to every risk object in the row (user and system). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_llm_model_file_download_unstable_src]
definition = (match(src,":") AND NOT match(src,"^([0-9a-f]{2}[:-]){5}[0-9a-f]{2}$")) OR (match(lower(sourcetype),"^cisco:(umbrella|cloud_security)|opendns") AND cidrmatch("192.168.0.0/16",src))
description = v1.1 Eval condition on src (lowercased) and sourcetype for addresses that do not identify one host from day to day. Treated like untrusted_src: rows that match and have no user are dropped, and a matching src is never a system risk object; rows with a user keep the user. Ships as IPv6 (temporary privacy addresses rotate daily) plus 192.168.0.0/16 from roaming DNS-security agents (Cisco Umbrella / Cisco Secure Access sourcetypes cisco:umbrella:* and cisco:cloud_security:*, or opendns), which log the laptop's home-network address. Add your own roaming or guest sources, e.g. OR (sourcetype="<agent sourcetype>" AND cidrmatch("<range>",src)). Use false() to keep every such address.
disabled = False
iseval = 0

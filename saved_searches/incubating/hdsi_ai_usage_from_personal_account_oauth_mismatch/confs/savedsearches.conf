action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":20}]
action.risk.param._risk_message = $user$ used $provider_list$ ($evidence_list$ in $active_hours$ active hours, e.g. $ai_domain_sample$) without a corporate SSO sign-in to $corporate_sso_app_list$ since $sso_since$, which suggests a personal account.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 25 1 * * *
description = v1.1.0 Detects users who use an AI provider's web or IDE service repeatedly in a day (Web proxy/SSE requests or firewall App-ID sessions) while never signing in through the organisation's corporate SSO app for that provider in the lookback, which indicates a personal account outside corporate data controls. Web or Network_Traffic plus Authentication data models. Risk on the user only, no notable.
disabled = 0
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="unknown" count min(_time) as firstTime max(_time) as lastTime from datamodel=Web where `hdsi_ai_usage_from_personal_account_oauth_mismatch_web_scope` NOT Web.user IN ("unknown","-","") `hdsi_ai_usage_from_personal_account_oauth_mismatch_filter` by _time span=1h Web.user Web.src Web.url_domain Web.site \
	| rename Web.* as * \
	| eval ai_domain=lower(coalesce(nullif(url_domain,"unknown"),nullif(site,"unknown"))), ai_input_type=if(isnull(nullif(url_domain,"unknown")),"app","host"), evidence="web" \
	| append maxtime=900 maxout=50000 [| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Traffic where `hdsi_ai_usage_from_personal_account_oauth_mismatch_traffic_scope` NOT All_Traffic.user IN ("unknown","-","") `hdsi_ai_usage_from_personal_account_oauth_mismatch_traffic_filter` by _time span=1h All_Traffic.user All_Traffic.src All_Traffic.app | rename All_Traffic.* as * | eval app=lower(app), ai_domain=`hdsi_ai_usage_from_personal_account_oauth_mismatch_app_id_map`, ai_input_type="app", evidence="network"] \
	| eval src=if(src="unknown" OR src="-" OR src="",null(),src) \
	| `ai_domains_filter` \
	| where usage_type!="api" \
	| eval is_ai=1, ai_domain=if(evidence="network",app,ai_domain) \
	| append maxtime=900 maxout=50000 [| tstats summariesonly=t allow_old_summaries=t count as sso_count max(_time) as last_sso from datamodel=Authentication where Authentication.action="success" `hdsi_ai_usage_from_personal_account_oauth_mismatch_sso_apps` earliest=`hdsi_ai_usage_from_personal_account_oauth_mismatch_sso_lookback` latest=now by Authentication.user Authentication.app | rename Authentication.* as * | where NOT user IN ("unknown","-","") | eval provider=`hdsi_ai_usage_from_personal_account_oauth_mismatch_sso_provider`, is_sso=1 | where isnotnull(provider) | rename app as sso_app | fields user provider sso_app sso_count last_sso is_sso] \
	| lookup identity_lookup_expanded identity as user OUTPUT email as _id_email \
	| eval user_key=lower(trim(coalesce(mvindex(_id_email,0), user))), user_key=replace(replace(user_key,"^.*\\\\",""),"@.*$","") \
	| where user_key!="" \
	| eventstats dc(eval(if(is_sso=1,user_key,null()))) as provider_sso_users values(sso_app) as corporate_sso_apps by provider \
	| eventstats max(is_sso) as has_sso by user_key provider \
	| where is_ai=1 \
	| stats sum(eval(if(evidence="web",count,0))) as web_requests sum(eval(if(evidence="network",count,0))) as network_sessions dc(_time) as active_hours values(src) as src values(ai_domain) as ai_domains values(usage_type) as usage_types max(eval(tonumber(severity_weight))) as severity_weight max(has_sso) as has_sso values(user_key) as user_key values(corporate_sso_apps) as corporate_sso_apps max(provider_sso_users) as provider_sso_users min(firstTime) as firstTime max(lastTime) as lastTime by user provider \
	| eval activity_count=max(web_requests,network_sessions) \
	| eventstats dc(eval(if(has_sso=1,user_key,null()))) as provider_matched_users by provider \
	| where isnull(has_sso) AND provider_sso_users>=`hdsi_ai_usage_from_personal_account_oauth_mismatch_min_sso_users` AND provider_matched_users>=`hdsi_ai_usage_from_personal_account_oauth_mismatch_min_matched_users` AND activity_count>=`hdsi_ai_usage_from_personal_account_oauth_mismatch_min_activity` AND active_hours>=`hdsi_ai_usage_from_personal_account_oauth_mismatch_min_active_hours` \
	| lookup identity_lookup_expanded identity as user OUTPUT bunit as _id_bunit \
	| eval bunit=lower(trim(mvindex(_id_bunit,0))), bunit=if(bunit="unknown" OR bunit="",null(),bunit), src_all=src, src=mvindex(src,0) \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| stats sum(web_requests) as web_requests sum(network_sessions) as network_sessions sum(activity_count) as activity_count max(active_hours) as active_hours values(provider) as provider values(ai_domains) as ai_domains values(usage_types) as usage_types values(src_all) as src values(corporate_sso_apps) as corporate_sso_apps max(provider_sso_users) as provider_sso_users max(provider_matched_users) as provider_matched_users max(severity_weight) as severity_weight values(bunit) as bunit values(user_key) as user_key min(firstTime) as firstTime max(lastTime) as lastTime by user \
	| eval sso_since=strftime(relative_time(now(),"`hdsi_ai_usage_from_personal_account_oauth_mismatch_sso_lookback`"),"%Y-%m-%d"), provider_list=mvjoin(provider,", "), corporate_sso_app_list=mvjoin(corporate_sso_apps,", "), ai_domain_sample=mvjoin(mvindex(ai_domains,0,4),", "), src_list=mvjoin(mvindex(src,0,4),", "), evidence_list=mvjoin(mvappend(if(web_requests>0,web_requests." web requests",null()),if(network_sessions>0,network_sessions." network sessions",null()))," and "), ai_domains=mvindex(ai_domains,0,19) \
	| `ai_risk_multiplier` \
	| eval base_score=20, risk_score=max(5, min(50, round(base_score*coalesce(severity_weight,1)*coalesce(risk_multiplier,1),0))) \
	| eval ai_activity="personal_account_ai_use", detection_id="hdsi_ai_usage_from_personal_account_oauth_mismatch", mitre_attack=mvappend("T1588.007","T1567"), ai_kill_chain_phase="exfiltration" \
	| `hdsi_ai_usage_from_personal_account_oauth_mismatch_customizations` \
	| `hdsi_ai_usage_from_personal_account_oauth_mismatch_risk_score`

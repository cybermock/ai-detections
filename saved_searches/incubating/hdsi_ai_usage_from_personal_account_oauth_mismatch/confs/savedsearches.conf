action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Usage From Personal Account / OAuth Mismatch
action.correlationsearch.annotations = {"mitre_attack": ["T1588.007", "T1567"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events for $user$","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$user$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI web activity of $user$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"unknown\" count sum(Web.bytes_out) as bytes_out min(_time) as firstTime max(_time) as lastTime values(Web.http_user_agent) as http_user_agent from datamodel=Web where Web.user=\"$user$\" `hdsi_ai_usage_from_personal_account_oauth_mismatch_web_scope` by Web.user Web.src Web.url_domain Web.site | rename Web.* as * | eval url_domain=if(url_domain=\"unknown\",site,url_domain) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, url_domain, count, bytes_out, http_user_agent | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI App-ID network sessions of $user$","search":"| tstats summariesonly=t allow_old_summaries=t count sum(All_Traffic.bytes_out) as bytes_out min(_time) as firstTime max(_time) as lastTime values(All_Traffic.dest) as dest from datamodel=Network_Traffic where All_Traffic.user=\"$user$\" `hdsi_ai_usage_from_personal_account_oauth_mismatch_traffic_scope` by All_Traffic.user All_Traffic.src All_Traffic.app All_Traffic.action | rename All_Traffic.* as * | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, app, action, count, bytes_out, dest | sort - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View corporate AI SSO sign-ins resembling $user_key$ since $sso_since$","search":"| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Authentication where `hdsi_ai_usage_from_personal_account_oauth_mismatch_sso_apps` Authentication.user=\"*$user_key$*\" earliest=`hdsi_ai_usage_from_personal_account_oauth_mismatch_sso_lookback` latest=now by Authentication.user Authentication.app Authentication.action | rename Authentication.* as * | convert ctime(firstTime) ctime(lastTime) | table user, app, action, count, firstTime, lastTime | sort - lastTime","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = $user$ used $provider_list$ ($evidence_list$ in $active_hours$ active hours, e.g. $ai_domain_sample$) without a corporate SSO sign-in to $corporate_sso_app_list$ since $sso_since$, which suggests a personal account.

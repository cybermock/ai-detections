[hdsi_ai_usage_from_personal_account_oauth_mismatch_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the Web tstats where clause before aggregation. Use Web.* field names, e.g. NOT Web.user IN ("svc_*") or NOT Web.src IN ("10.1.2.3") for shared kiosks and jump hosts. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_usage_from_personal_account_oauth_mismatch_web_scope]
definition = (Web.url_domain IN ("chatgpt.com","*.chatgpt.com","chat.openai.com","openai.com","*.openai.com","oaiusercontent.com","*.oaiusercontent.com","claude.ai","*.claude.ai","claude.com","*.claude.com","anthropic.com","*.anthropic.com","perplexity.ai","*.perplexity.ai","cursor.com","*.cursor.com","cursor.sh","*.cursor.sh","mistral.ai","*.mistral.ai") OR Web.site IN ("chatgpt.com","*.chatgpt.com","openai.com","*.openai.com","claude.ai","*.claude.ai","claude.com","*.claude.com","perplexity.ai","*.perplexity.ai","cursor.com","*.cursor.com","mistral.ai","*.mistral.ai","chatgpt","openai","openai-chatgpt","claude","anthropic","perplexity","perplexity ai","cursor","mistral ai"))
description = v1.1 Web tstats prefilter: hostnames (url_domain or site) and SSE/CASB app names (site) of the providers that sell an SSO-backed business tier and are mapped in the sso_provider macro (OpenAI, Anthropic, Perplexity, Cursor, Mistral). It only keeps the Web scan cheap; ai_domains_filter decides the provider. Keep it in step with sso_apps and sso_provider when you add a provider.
disabled = False
iseval = 0

[hdsi_ai_usage_from_personal_account_oauth_mismatch_traffic_filter]
definition = ()
description = v1.1 Tenant exclusion hook for the Network_Traffic (App-ID) branch, applied inside its tstats where clause. Use All_Traffic.* field names, e.g. NOT All_Traffic.user IN ("svc_*"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_usage_from_personal_account_oauth_mismatch_traffic_scope]
definition = (All_Traffic.app IN ("openai-chatgpt*","chatgpt*","claude*","anthropic-claude","anthropic","perplexity*","cursor","mistral*"))
description = v1.1 Network_Traffic tstats prefilter: firewall App-ID names (Palo Alto, Fortinet) of the providers mapped in sso_provider, e.g. openai-chatgpt, openai-chatgpt-uploading, claude-base, claude-post, claude-upload, perplexity-ai-base, cursor, and the FortiGate name Anthropic-Claude. The app_id_map macro folds each App-ID onto the name the common ai_provider_apps lookup knows before ai_domains_filter resolves the provider. Generic and API App-IDs (openai-base, openai-api, anthropic-api-base) are left out on purpose: they carry background and API-key traffic that is not SSO-backed.
disabled = False
iseval = 0

[hdsi_ai_usage_from_personal_account_oauth_mismatch_app_id_map]
definition = case(match(app,"^(anthropic-)?claude(-(base|post|upload|delete|download))?$"),"claude", match(app,"^(openai-)?chatgpt(-.*)?$"),"openai-chatgpt", match(app,"^perplexity"),"perplexity-ai-base", match(app,"^mistral"),"mistral-ai", true(),app)
description = v1.1 Eval expression that folds firewall App-ID variants (field app, lower case) onto the App-ID name in the common ai_provider_apps lookup: claude-base, claude-post, claude-upload, claude-delete and the FortiGate name anthropic-claude become claude; openai-chatgpt-uploading and openai-chatgpt-download become openai-chatgpt. Without it those App-IDs are dropped by ai_domains_filter. The raw App-ID is kept for the evidence sample.
disabled = False
iseval = 0

[hdsi_ai_usage_from_personal_account_oauth_mismatch_sso_apps]
definition = (Authentication.app="*openai*" OR Authentication.app="*chatgpt*" OR Authentication.app="*anthropic*" OR Authentication.app="*claude*" OR Authentication.app="*perplexity*" OR Authentication.app="*cursor*" OR Authentication.app="*mistral*") NOT Authentication.app IN ("*api*","*azure*","*mcp*","*connector*","*plugin*","*add-in*","* for google*","* for gmail*","* for slack*","* for outlook*") NOT sourcetype IN ("gws:reports:token")
description = v1.1 Authentication tstats prefilter for the corporate IdP applications (Okta, Entra ID, Google Workspace SAML) that front an AI provider's business tier, e.g. an Okta or Entra ID SAML/OIDC app for the provider's enterprise plan. The wildcards are a starting point only: pin your exact app names here and map them in sso_provider, because a non-tenant app that matches can lift a provider over min_sso_users and make every other user of it reportable. Excluded by default because they are not the chat tenant: API-platform and Azure OpenAI apps (*api*, *azure*), Microsoft 365 MCP connector apps and other integrations (*mcp*, *connector*, *plugin*, *add-in*, "Claude for Google Drive" style apps), and Google Workspace OAuth grants (gws:reports:token, which record "Sign in with Google" for personal and corporate accounts alike). Google Gemini is deliberately absent: Gemini is reached through the Google Workspace login, so no Gemini-specific app sign-in exists and every Gemini user would look personal.
disabled = False
iseval = 0

[hdsi_ai_usage_from_personal_account_oauth_mismatch_sso_provider]
definition = case(match(lower(app),"openai|chatgpt"),"OpenAI", match(lower(app),"anthropic|claude"),"Anthropic", match(lower(app),"perplexity"),"Perplexity", match(lower(app),"cursor"),"Cursor", match(lower(app),"mistral"),"Mistral", true(),null())
description = v1.1 Eval expression that maps an IdP application name (field app) to the provider string that ai_domains_filter returns for the same service (OpenAI, Anthropic, Perplexity, Cursor, Mistral). An SSO app that maps to null is ignored. Provider strings must match ai_provider_domains exactly.
disabled = False
iseval = 0

[hdsi_ai_usage_from_personal_account_oauth_mismatch_sso_lookback]
definition = -30d@d
description = v1.1 How far back a corporate SSO sign-in to the provider's IdP app counts for a user (relative time, applied to the Authentication tstats). Set it to at least the provider's longest web session lifetime; shorter values flag enterprise users whose session simply has not expired.
disabled = False
iseval = 0

[hdsi_ai_usage_from_personal_account_oauth_mismatch_min_sso_users]
definition = 3
description = v1.1 Minimum distinct users with a successful corporate SSO sign-in to the provider within the lookback before the provider counts as having a corporate tenant. Below it, a single pilot user or a test sign-in would make every other user of the provider look personal.
disabled = False
iseval = 0

[hdsi_ai_usage_from_personal_account_oauth_mismatch_min_matched_users]
definition = 3
description = v1.1 Minimum users of the provider in the Web window whose identity also has a corporate SSO sign-in. This is the identity-join health check: if the Web user format (e.g. DOMAIN\sam) never lines up with the IdP format (e.g. UPN), nobody matches and every user would look personal, so the provider is skipped. Lower it only for very small populations.
disabled = False
iseval = 0

[hdsi_ai_usage_from_personal_account_oauth_mismatch_min_activity]
definition = 20
description = v1.1 Minimum activity from the user to the provider in the daily window, counted as the larger of Web requests and App-ID network sessions (not their sum, because a firewall that logs both URL and traffic records reports the same use twice). On a per-request proxy 20 requests is roughly one chat page load, so this gate alone does not separate one-off visits; min_active_hours does that. Derive per tenant with the README Threshold search.
disabled = False
iseval = 0

[hdsi_ai_usage_from_personal_account_oauth_mismatch_min_active_hours]
definition = 2
description = v1.1 Minimum distinct clock hours in the daily window in which the user reached the provider (Web or App-ID). Repeated use across the day is the personal-account signal; a single burst (one shared link, one docs page) stays in one hour. Works the same for per-request proxies and per-session firewalls.
disabled = False
iseval = 0

[hdsi_ai_usage_from_personal_account_oauth_mismatch_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after per-user aggregation and scoring (fields: user, user_key, bunit, provider, provider_list, ai_domains, ai_domain_sample, usage_types, web_requests, network_sessions, activity_count, active_hours, evidence_list, src, src_list, corporate_sso_apps, corporate_sso_app_list, sso_since, provider_sso_users, provider_matched_users, severity_weight, risk_multiplier, base_score, risk_score, firstTime, lastTime). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_usage_from_personal_account_oauth_mismatch_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. The search sets risk_score = 20 x the highest provider severity_weight x the identity risk_multiplier, minimum 5 and capped at 50, on the user object only. Override risk_score (<=100) here. Ships as search *.
disabled = False
iseval = 0

version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Browser Extension High-Volume Data Transmission
description: "Detects a host sending a high volume of data (default 10 MB in one hour, summed over all requests) to the backends of extension-first AI assistants such as Monica, Sider, MaxAI, Merlin, HARPA, Tactiq and Wordtune, which read pages, documents or meetings and post the content to their own LLM. Ad hoc: needs a forward proxy or SWG in the CIM Web model that logs the destination host and request bytes (Web.bytes_out). Risk on src and, when the proxy attributes one user, on user. No notable."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_unsanctioned_filter(3)
  - macros:ai_risk_multiplier
tags:
  - rba_only
  - web
  - proxy
  - data_exfiltration
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Web"
deployment_type: adhoc
prereq_packages:
  - hdsi_ai_rba_common

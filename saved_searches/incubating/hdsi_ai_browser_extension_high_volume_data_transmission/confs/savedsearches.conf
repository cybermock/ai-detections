[Network - HDSI AI Browser Extension High-Volume Data Transmission - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Browser Extension High-Volume Data Transmission
action.correlationsearch.annotations = {"mitre_attack": ["T1567", "T1176.001"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$risk_object$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View AI extension backend traffic from $src$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"-\" count sum(Web.bytes_out) as bytes_out sum(Web.bytes_in) as bytes_in values(Web.http_method) as http_method values(Web.url) as url values(Web.http_user_agent) as http_user_agent min(_time) as firstTime max(_time) as lastTime from datamodel=Web where Web.src=\"$src$\" (`hdsi_ai_browser_extension_high_volume_data_transmission_domains(Web.url_domain)` OR `hdsi_ai_browser_extension_high_volume_data_transmission_domains(Web.site)`) by Web.user Web.src Web.url_domain Web.site | rename Web.* as * | eval url_domain=if(url_domain=\"-\",site,url_domain), mb_out=round(bytes_out/1048576,2), mb_in=round(bytes_in/1048576,2) | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, url_domain, count, mb_out, mb_in, http_method, http_user_agent, url | sort - mb_out","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View top upload destinations from $src$","search":"| tstats summariesonly=t allow_old_summaries=t fillnull_value=\"-\" count sum(Web.bytes_out) as bytes_out from datamodel=Web where Web.src=\"$src$\" Web.bytes_out>0 by Web.url_domain Web.site | rename Web.* as * | eval url_domain=if(url_domain=\"-\",site,url_domain), mb_out=round(bytes_out/1048576,2) | stats sum(count) as count sum(mb_out) as mb_out by url_domain | sort - mb_out | head 25","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = $src$ (user: $user_display$) sent $total_mb$ MB in $request_count$ requests to the backend of AI browser-extension product $ext_product_list$ ($ext_domain_list$) in one hour, above the $threshold_mb$ MB threshold.
action.notable.param.rule_title = HDSI AI Browser Extension High-Volume Data Transmission ($src$)
action.notable.param.security_domain = network
action.notable.param.severity = medium
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"src","risk_object_type":"system","risk_score":30},{"risk_object_field":"user","risk_object_type":"user","risk_score":30}]
action.risk.param._risk_message = $src$ (user: $user_display$) sent $total_mb$ MB in $request_count$ requests to the backend of AI browser-extension product $ext_product_list$ ($ext_domain_list$) in one hour, above the $threshold_mb$ MB threshold.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = src,user
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 17 * * * *
description = v1.1.0 Detects one host sending more than a threshold volume (default 10 MB per hour, summed over all requests) to the backends of extension-first AI assistants such as Monica, Sider, MaxAI, Merlin, HARPA, Tactiq and Wordtune. Needs a forward proxy that logs the destination host and request bytes. Risk on src and, when attributed, user. No notable.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t fillnull_value="-" count sum(Web.bytes_out) as bytes_out sum(Web.bytes_in) as bytes_in min(_time) as firstTime max(_time) as lastTime from datamodel=Web where Web.bytes_out>0 (`hdsi_ai_browser_extension_high_volume_data_transmission_domains(Web.url_domain)` OR `hdsi_ai_browser_extension_high_volume_data_transmission_domains(Web.site)`) `hdsi_ai_browser_extension_high_volume_data_transmission_filter` by Web.user Web.src Web.url_domain Web.site \
	| rename Web.* as * \
	| eval ext_domain=if(url_domain="-",site,url_domain) \
	| `hdsi_ai_browser_extension_high_volume_data_transmission_catalog` \
	| where isnotnull(ext_product) \
	| eval user=if(isnull(user) OR match(lower(user),"^(unknown|-|n/a|null|none|)$") OR match(user,"^\\d{1,3}(\\.\\d{1,3}){3}$"),null(),user), src=if(isnull(src) OR match(lower(src),"^(unknown|-|n/a|null|none|0\\.0\\.0\\.0|)$"),null(),src), provider=ext_product \
	| where isnotnull(src) \
	| lookup identity_lookup_expanded identity as user OUTPUT bunit as _user_bunit \
	| lookup asset_lookup_by_str ip as src OUTPUT bunit as _src_bunit \
	| lookup asset_lookup_by_str dns as src OUTPUTNEW bunit as _src_bunit \
	| lookup asset_lookup_by_cidr ip as src OUTPUTNEW bunit as _src_bunit \
	| eval bunit=lower(coalesce(nullif(mvindex(_user_bunit,0),""),nullif(mvindex(_src_bunit,0),""))) \
	| fields - _user_bunit _src_bunit \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| stats sum(count) as request_count sum(bytes_out) as bytes_out sum(bytes_in) as bytes_in values(ext_product) as ext_products values(ext_domain) as ext_domains values(user) as users values(bunit) as bunit min(firstTime) as firstTime max(lastTime) as lastTime by src \
	| eval total_mb=round(bytes_out/1048576,2), mb_in=round(bytes_in/1048576,2), threshold_mb=`hdsi_ai_browser_extension_high_volume_data_transmission_threshold_mb` \
	| where total_mb>=threshold_mb \
	| eval user=if(mvcount(users)=1,users,null()), user_display=coalesce(user,if(mvcount(users)>1,mvjoin(mvindex(users,0,4),", "),"not attributed")), ext_product_list=mvjoin(ext_products,", "), ext_domain_list=mvjoin(mvindex(ext_domains,0,9),", "), provider=ext_product_list \
	| eval volume_ratio=total_mb/threshold_mb, base_score=case(volume_ratio>=20,50, volume_ratio>=5,40, true(),30) \
	| `ai_risk_multiplier` \
	| eval risk_score=min(60,round(base_score*coalesce(risk_multiplier,1),0)) \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="extension_high_volume", detection_id="hdsi_ai_browser_extension_high_volume_data_transmission", mitre_attack=split("T1567,T1176.001",","), ai_kill_chain_phase="exfiltration" \
	| fields - users ext_domains bytes_out bytes_in volume_ratio \
	| `hdsi_ai_browser_extension_high_volume_data_transmission_customizations` \
	| `hdsi_ai_browser_extension_high_volume_data_transmission_risk_score`

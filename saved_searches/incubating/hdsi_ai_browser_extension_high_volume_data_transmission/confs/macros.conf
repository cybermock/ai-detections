[hdsi_ai_browser_extension_high_volume_data_transmission_filter]
definition = ()
description = v1.1 Tenant exclusion hook, inline in the Web tstats where clause before aggregation. Use Web datamodel field names, e.g. NOT Web.src IN ("192.0.2.10") for a shared proxy egress address or NOT Web.user IN ("svc_*"). Ships empty.
disabled = False
iseval = 0

[hdsi_ai_browser_extension_high_volume_data_transmission_domains(1)]
args = field
definition = $field$ IN ("monica.im","*.monica.im","sider.ai","*.sider.ai","maxai.me","*.maxai.me","maxai.co","*.maxai.co","getmerlin.in","*.getmerlin.in","harpa.ai","*.harpa.ai","tactiq.io","*.tactiq.io","bardeen.ai","*.bardeen.ai","getvoila.ai","*.getvoila.ai","teamsmart.ai","*.teamsmart.ai","wiseone.io","*.wiseone.io","chathub.gg","*.chathub.gg","getliner.com","*.getliner.com","glasp.co","*.glasp.co","eightify.app","*.eightify.app","aiprm.com","*.aiprm.com","briskteaching.com","*.briskteaching.com","chatgptwriter.ai","*.chatgptwriter.ai","compose.ai","*.compose.ai","wordtune.com","*.wordtune.com","getmagical.com","*.getmagical.com","Monica AI","Sider AI","MaxAI","Merlin AI","HARPA AI","Tactiq","Bardeen AI","Wordtune")
description = v1.1 Backend hosts of extension-first AI assistants (the product is sold mainly as a browser extension that reads the page, a document or a meeting and posts it to the vendor's own LLM backend), plus exact SSE/CASB app names for the same products. Applied to Web.url_domain and Web.site inside tstats. Grammarly, QuillBot and the mainstream providers (ChatGPT, Claude, Copilot, Gemini) are deliberately absent: their extensions share hosts with the web app and are covered by the AI upload-volume rules. Keep in step with hdsi_ai_browser_extension_high_volume_data_transmission_catalog.
disabled = False
iseval = 0

[hdsi_ai_browser_extension_high_volume_data_transmission_catalog]
definition = eval ext_domain=lower(trim(replace(replace(ext_domain,":\\d+$",""),"\\.+$",""))), ext_product=case(match(ext_domain,"(^|\\.)monica\\.im$") OR ext_domain="monica ai","Monica", match(ext_domain,"(^|\\.)sider\\.ai$") OR ext_domain="sider ai","Sider", match(ext_domain,"(^|\\.)maxai\\.(me|co)$") OR ext_domain="maxai","MaxAI", match(ext_domain,"(^|\\.)getmerlin\\.in$") OR ext_domain="merlin ai","Merlin", match(ext_domain,"(^|\\.)harpa\\.ai$") OR ext_domain="harpa ai","HARPA AI", match(ext_domain,"(^|\\.)tactiq\\.io$") OR ext_domain="tactiq","Tactiq", match(ext_domain,"(^|\\.)bardeen\\.ai$") OR ext_domain="bardeen ai","Bardeen", match(ext_domain,"(^|\\.)getvoila\\.ai$"),"Voila", match(ext_domain,"(^|\\.)teamsmart\\.ai$"),"TeamSmart AI", match(ext_domain,"(^|\\.)wiseone\\.io$"),"Wiseone", match(ext_domain,"(^|\\.)chathub\\.gg$"),"ChatHub", match(ext_domain,"(^|\\.)getliner\\.com$"),"Liner", match(ext_domain,"(^|\\.)glasp\\.co$"),"Glasp", match(ext_domain,"(^|\\.)eightify\\.app$"),"Eightify", match(ext_domain,"(^|\\.)aiprm\\.com$"),"AIPRM", match(ext_domain,"(^|\\.)briskteaching\\.com$"),"Brisk", match(ext_domain,"(^|\\.)chatgptwriter\\.ai$"),"ChatGPT Writer", match(ext_domain,"(^|\\.)compose\\.ai$"),"Compose AI", match(ext_domain,"(^|\\.)wordtune\\.com$") OR ext_domain="wordtune","Wordtune", match(ext_domain,"(^|\\.)getmagical\\.com$"),"Magical")
description = v1.1 Maps ext_domain (lowercased host or SSE app name) to ext_product. Rows with no product are dropped by the search. Keep in step with hdsi_ai_browser_extension_high_volume_data_transmission_domains.
disabled = False
iseval = 0

[hdsi_ai_browser_extension_high_volume_data_transmission_threshold_mb]
definition = 10
description = v1.1 Minimum total MB sent (sum of Web.bytes_out) from one src to all catalogued extension backends in the one-hour dispatch window. Page and meeting text is small, so 10 MB/h means documents or bulk page content. Derive a tenant value with the profile search in the README before enabling.
disabled = False
iseval = 0

[hdsi_ai_browser_extension_high_volume_data_transmission_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation and threshold (fields: src, user, user_display, bunit, ext_products, ext_product_list, ext_domain_list, request_count, total_mb, mb_in, threshold_mb, base_score, risk_multiplier, risk_score). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_browser_extension_high_volume_data_transmission_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. Adjust risk_score (max 100) per tenant; it applies to every risk object in the row (src and user). Ships as search *.
disabled = False
iseval = 0

[Network - HDSI AI Access From Unmanaged Device - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI Access From Unmanaged Device
action.correlationsearch.annotations = {"mitre_attack": ["T1200", "T1588.007"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events for $src$","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$src$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View all DNS activity from $src$ (device fingerprint)","search":"| tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime values(DNS.record_type) as record_type from datamodel=Network_Resolution where DNS.src=\"$src$\" by DNS.src DNS.query | rename DNS.* as * | sort - count | head 500 | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, src, query, record_type, count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = Unmanaged device $src$ ($unmanaged_reason$) resolved AI services $provider_list$ $dns_query_count$ times, e.g. $ai_domain_sample$.
action.notable.param.rule_title = HDSI AI Access From Unmanaged Device ($src$)
action.notable.param.security_domain = network
action.notable.param.severity = low
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"src","risk_object_type":"system","risk_score":20}]
action.risk.param._risk_message = Unmanaged device $src$ ($unmanaged_reason$) resolved AI services $provider_list$ $dns_query_count$ times, e.g. $ai_domain_sample$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = src
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 11 * * * *
description = v1.1.0 Detects an on-network device resolving AI service domains (DNS from on-network resolvers, Network_Resolution) while it is registered as BYOD/guest (asset or address-block category) or is missing from the ES asset inventory in a /24 where the inventory covers the other AI-active hosts. Cloud DNS roaming-agent feeds are out of scope by default. Risk on the device address (system), no notable.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=t allow_old_summaries=t count min(_time) as firstTime max(_time) as lastTime from datamodel=Network_Resolution where `hdsi_ai_access_from_unmanaged_device_dns_scope` `hdsi_ai_access_from_unmanaged_device_dns_sources` `hdsi_ai_access_from_unmanaged_device_filter` by DNS.src DNS.query \
	| rename DNS.* as * \
	| where isnotnull(src) AND `hdsi_ai_access_from_unmanaged_device_client_ranges` AND NOT `hdsi_ai_access_from_unmanaged_device_home_network_ranges` \
	| eval ai_domain=query, ai_input_type="dns" \
	| `ai_domains_filter` \
	| eval weight=tonumber(severity_weight) \
	| stats sum(count) as count values(ai_domain) as ai_domains values(usage_type) as usage_types max(weight) as max_weight min(firstTime) as firstTime max(lastTime) as lastTime by src provider \
	| lookup asset_lookup_by_str asset as src OUTPUT asset as _src_asset nt_host as src_nt_host category as src_category \
	| lookup asset_lookup_by_cidr asset as src OUTPUT category as src_block_category \
	| eval src_inventoried=if(isnotnull(_src_asset),1,0), src_subnet=if(match(src,"^\d{1,3}(\.\d{1,3}){3}$"), replace(src,"\.\d+$",".0/24"), null()) \
	| eventstats dc(src) as subnet_ai_hosts dc(eval(if(src_inventoried=1,src,null()))) as subnet_inventoried_hosts by src_subnet \
	| eval device_name=mvindex(src_nt_host,0), category=mvindex(mvappend(src_category,src_block_category),0) \
	| `ai_unsanctioned_filter(device_name,src,provider)` \
	| stats sum(count) as dns_query_count values(ai_domains) as ai_domains values(provider) as providers values(usage_types) as usage_types max(max_weight) as max_weight min(firstTime) as firstTime max(lastTime) as lastTime max(src_inventoried) as src_inventoried values(src_nt_host) as src_nt_host values(src_category) as src_category values(src_block_category) as src_block_category max(subnet_ai_hosts) as subnet_ai_hosts max(subnet_inventoried_hosts) as subnet_inventoried_hosts values(src_subnet) as src_subnet by src \
	| eval subnet_other_hosts=subnet_ai_hosts-1, subnet_coverage=if(subnet_other_hosts>0, round(subnet_inventoried_hosts/subnet_other_hosts,2), null()), asset_category_match=if(src_inventoried=1 AND match(lower(mvjoin(src_category,";")), `hdsi_ai_access_from_unmanaged_device_unmanaged_categories`),1,0), block_category_match=if(src_inventoried=0 AND match(lower(mvjoin(src_block_category,";")), `hdsi_ai_access_from_unmanaged_device_unmanaged_categories`),1,0), registered_unmanaged=if(asset_category_match=1 OR block_category_match=1,1,0), inventory_gap=if(registered_unmanaged=0 AND src_inventoried=0 AND isnotnull(src_subnet) AND subnet_other_hosts>=`hdsi_ai_access_from_unmanaged_device_min_subnet_hosts` AND subnet_coverage>=`hdsi_ai_access_from_unmanaged_device_min_subnet_coverage`,1,0) \
	| where (registered_unmanaged=1 OR inventory_gap=1) AND dns_query_count>=`hdsi_ai_access_from_unmanaged_device_min_queries` \
	| eval unmanaged_basis=case(asset_category_match=1,"registered_asset", block_category_match=1,"registered_address_block", true(),"inventory_gap"), unmanaged_reason=case(asset_category_match=1, "asset category ".mvjoin(src_category,"/"), block_category_match=1, "address block category ".mvjoin(src_block_category,"/"), true(), "not in the asset inventory, while ".subnet_inventoried_hosts." of the ".subnet_other_hosts." other AI-active hosts in ".src_subnet." are"), base_score=if(registered_unmanaged=1,30,20), risk_score=min(60, max(5, round(base_score*coalesce(max_weight,1),0))) \
	| eval provider=mvindex(providers,0), provider_list=mvjoin(providers,", "), ai_domain_sample=mvjoin(mvindex(ai_domains,0,4),", "), ai_domains=mvindex(ai_domains,0,19) \
	| eval ai_activity="unmanaged_device_ai_access", detection_id="hdsi_ai_access_from_unmanaged_device", mitre_attack=mvappend("T1200","T1588.007"), ai_kill_chain_phase="initial_access" \
	| fields - registered_unmanaged inventory_gap src_inventoried asset_category_match block_category_match \
	| `hdsi_ai_access_from_unmanaged_device_customizations` \
	| `hdsi_ai_access_from_unmanaged_device_risk_score`

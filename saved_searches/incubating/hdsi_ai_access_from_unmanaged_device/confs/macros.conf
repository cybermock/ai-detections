[hdsi_ai_access_from_unmanaged_device_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the Network_Resolution tstats where clause before aggregation. Use DNS.* field names; CIDR values work. Exclude DNS forwarders, NAT gateways, scanners and approved BYOD pools, e.g. NOT DNS.src IN ("10.0.0.53","10.20.0.0/16"). Ships empty.
disabled = False
iseval = 0


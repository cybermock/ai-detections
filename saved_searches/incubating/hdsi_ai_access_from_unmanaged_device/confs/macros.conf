description = v1.1 tstats prefilter generated from every row of the common ai_provider_domains lookup (enabled and opt-in rows, so a tenant that enables an opt-in row needs no edit here): each registrable base as name* and *.name*, so subdomains and the trailing root dot some resolvers log (chatgpt.com.) match, plus the cloud AI endpoint patterns that ai_domains_filter recognises (Bedrock, Vertex AI, Azure OpenAI, Azure AI Foundry, Azure AI Services, SageMaker). It keeps the DNS scan cheap (validation: 1 h of DNS on the busiest tenant took 35 s instead of 147 s). It is only a prefilter; ai_domains_filter decides what is AI. Regenerate it when domains are added to ai_provider_domains (README).
disabled = False
iseval = 0

[hdsi_ai_access_from_unmanaged_device_dns_sources]
definition = (NOT sourcetype IN ("cisco:umbrella:dns","cisco:cloud_security:dns","opendns:dnslogs"))
description = v1.1 DNS source scope inside the tstats where clause. The rule needs DNS logged by on-network resolvers or sensors (Windows DNS, Infoblox, BIND, Stream/Zeek), where an unmanaged device appears under its own LAN address. Cloud DNS-security feeds are excluded by default: their events with internal client addresses come from the vendor roaming agent, which is installed only on managed laptops (validation: 100% of internal-address events on one tenant, and on another 99.9% were roaming-client or AD-user identities, 58% of them from home-router ranges). Every inventory-gap result on those feeds came from an agent-reported address. Remove a sourcetype only if its internal-address events come from on-network virtual appliances (README check search). Add other roaming-agent DNS sourcetypes here.
disabled = False
iseval = 0

[hdsi_ai_access_from_unmanaged_device_client_ranges]
definition = (cidrmatch("10.0.0.0/8",src) OR cidrmatch("172.16.0.0/12",src) OR cidrmatch("192.168.0.0/16",src) OR cidrmatch("100.64.0.0/10",src))
description = v1.1 Eval condition for DNS client addresses that are on-network devices. Ships as RFC 1918 plus 100.64.0.0/10 (VPN pools, CGNAT). Public addresses are NAT egress and cannot be checked against the asset inventory. Narrow it to your corporate LAN, Wi-Fi and VPN pools for best precision. Consumer home-router ranges are removed separately by the home_network_ranges macro.
disabled = False
iseval = 0

[hdsi_ai_access_from_unmanaged_device_home_network_ranges]
definition = (cidrmatch("192.168.0.0/23",src) OR cidrmatch("192.168.2.0/24",src) OR cidrmatch("192.168.4.0/22",src) OR cidrmatch("192.168.8.0/24",src) OR cidrmatch("192.168.10.0/24",src) OR cidrmatch("192.168.50.0/24",src) OR cidrmatch("192.168.68.0/22",src) OR cidrmatch("192.168.86.0/24",src) OR cidrmatch("192.168.100.0/24",src) OR cidrmatch("192.168.178.0/24",src) OR cidrmatch("10.0.0.0/23",src) OR cidrmatch("10.1.10.0/24",src))
description = v1.1 Eval condition for consumer router default LANs (ISP gateways, eero, TP-Link Deco, Google/Nest Wifi, Asus, Fritz!Box, Apple). Secondary safeguard: any DNS agent or VPN split-DNS path that logs a laptop at home reports its home address, and the same /24 then mixes many unrelated homes, so subnet inventory coverage there is meaningless. The primary fix is the dns_sources macro (roaming-agent feeds); in validation 44-54% of the AI-active internal addresses on those feeds were in these ranges. Addresses here are ignored. Remove a range only if it is a real corporate LAN in your network; set to false() to disable.
disabled = False
iseval = 0

[hdsi_ai_access_from_unmanaged_device_unmanaged_categories]
definition = "(^|[^a-z])(byod|unmanaged|guest[ _-]?(device|network|wifi|wi-fi)|personal[ _-]?device|non[ _-]?corporate)([^a-z]|$)"
description = v1.1 Regular expression (lower case) matched against ES asset categories. It is checked twice: against asset_lookup_by_str categories of an inventoried address, and against asset_lookup_by_cidr categories of an address block when the address itself is not inventoried (the usual way to register guest and BYOD Wi-Fi pools). A match reports the device without the subnet coverage test. Deliberately narrow: plain personal, visitor, patient or kiosk categories, and generic block tags such as rfc1918, were seen on managed devices and corporate ranges during validation. Replace with your own category names.
disabled = False
iseval = 0

[hdsi_ai_access_from_unmanaged_device_min_subnet_hosts]
definition = 10
description = v1.1 Minimum number of OTHER AI-active hosts (the device itself excluded) in its /24 during the hourly window before an address missing from the asset inventory counts as unmanaged. Smaller samples make the coverage figure meaningless. Derive per tenant with the README Threshold search.
disabled = False
iseval = 0

[hdsi_ai_access_from_unmanaged_device_min_subnet_coverage]
definition = 0.9
description = v1.1 Minimum share (0-1) of the OTHER AI-active hosts in the /24 that must resolve in asset_lookup_by_str before an address missing from the inventory counts as unmanaged. This keeps DHCP pools that the inventory does not track from turning every client into a finding: in validation, on-network inventory IP coverage ranged from 0.90 on one tenant to 0.28-0.45 on the others. Set to 2 to disable the inventory-gap path and keep only registered BYOD/guest categories.
disabled = False
iseval = 0

[hdsi_ai_access_from_unmanaged_device_min_queries]
definition = 5
description = v1.1 Minimum AI DNS queries from one unmanaged address in the hourly window. A lower value adds single background lookups (OS assistants, telemetry). Derive per tenant with the README Threshold search.
disabled = False
iseval = 0

[hdsi_ai_access_from_unmanaged_device_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after per-address aggregation and scoring (fields: src, src_subnet, src_nt_host, src_category, src_block_category, unmanaged_reason, unmanaged_basis, subnet_ai_hosts, subnet_other_hosts, subnet_inventoried_hosts, subnet_coverage, provider, providers, provider_list, ai_domains, ai_domain_sample, usage_types, dns_query_count, max_weight, base_score, risk_score). Example: search NOT src_block_category="approved-byod-ai". Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_access_from_unmanaged_device_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. The search sets risk_score = base x the highest provider severity_weight (0.4-1.2), minimum 5 and capped at 60, on the system (src) object. Base is 30 for an address registered as BYOD/guest (asset or address-block category) and 20 for an address missing from a well-inventoried subnet. Override risk_score (<=100) here. Ships as search *.
disabled = False
iseval = 0

version: 1.1.0
creation_date: '2026-03-04'
package_title: AI Access From Unmanaged Device
description: "Detects an on-network device that resolves AI service domains while it is either registered in ES assets as BYOD/guest/unmanaged (asset_lookup_by_str category, or asset_lookup_by_cidr category of its address block), or missing from the inventory in a /24 where at least 90% of at least 10 other AI-active hosts are inventoried. Needs DNS logged by on-network resolvers or sensors (Network_Resolution); cloud DNS-security roaming-agent feeds are excluded because they only see managed laptops. Risk on the device address (system) only, no notable. Ad hoc: needs on-network DNS plus an IP-current asset inventory or registered BYOD/guest address blocks."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_unsanctioned_filter(3)
tags:
  - rba_only
  - dns
  - network
data_prereqs:
  datamodels:
    op: AND
    items:
    - "Network_Resolution"
deployment_type: adhoc
prereq_packages:
  - hdsi_ai_rba_common

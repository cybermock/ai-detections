[hdsi_ai_dlp_violation_on_service_upload_filter]
definition = ()
description = v1.1 Tenant exclusion hook, applied inside the DLP.DLP_Incidents tstats where clause before aggregation. Use datamodel field names, e.g. NOT DLP_Incidents.signature IN ("<access-control policy name>") for CASB policy alerts whose names contain a data-class word, or NOT DLP_Incidents.vendor_product="<data-at-rest scanner>*" for file-share auditing that can never name an AI destination. Ships empty.
disabled = False
iseval = 0

[hdsi_ai_dlp_violation_on_service_upload_content_evidence]
definition = (isnotnull(dlp_type) OR match(lower(mvjoin(signature," ")),"\\b(dlp|data loss|pii|pci|phi|hipaa|ssn|social security|credit card|card number|cardholder|iban|bank account|routing number|passport|tax id|confidential|classified|sensitive (data|info|information|content|files?|documents?)|secrets?|passwords?|api keys?|private keys?|access keys?|source code|gdpr|personal data|customer data|financial data|health data|exact data match|edm|fingerprint)\\b"))
description = v1.1 Eval condition (per tstats row: user/src/dest/app/signature/dlp_type, so it gates each policy hit before severity, action and counts are aggregated) that keeps only incidents with content-inspection evidence: a CIM dlp_type, or a policy/signature name that names a data class (PII, PCI, PHI, secrets, source code, confidential, DLP...). A file name (object) or a rated severity alone is NOT evidence: CASB/SSE add-ons tag access-control, threat and malicious-site alerts dlp+incident, and those alerts carry file names and severities too. Add your DLP policy naming convention here if it names no data class; use true() only if the feed holds nothing but content DLP incidents.
disabled = False
iseval = 0

[hdsi_ai_dlp_violation_on_service_upload_blocked_factor]
definition = 0.5
description = v1.1 Score factor for a user/host whose AI-bound DLP incidents in the window were all blocked (action block/deny/quarantine/prevent/restrict): the control worked, so the attempt carries less risk than a completed upload. 1 = score blocked attempts like completed ones; 0 = drop fully blocked rows.
disabled = False
iseval = 0

[hdsi_ai_dlp_violation_on_service_upload_customizations]
definition = search *
description = v1.1 Tenant customization hook, piped after aggregation (one row per user and src; fields: user, src, user_display, src_display, provider, ai_domains, usage_types, bunit, violations, dlp_policies, dlp_types, dlp_actions, dlp_severity_max, dlp_outcome, objects, vendor_product, severity_weight, risk_multiplier, firstTime, lastTime). Ships as search *.
disabled = False
iseval = 0

[hdsi_ai_dlp_violation_on_service_upload_risk_score]
definition = search *
description = v1.1 Risk score customization hook, last pipe. risk_score is already set: base 60 (high/critical DLP severity), 50 (medium or unrated) or 35 (low or informational), from content-evidence incidents only, x provider severity_weight x identity risk_multiplier x blocked_factor, clamped 10-80; it applies to both the user and the host risk object. Ships as search *.
disabled = False
iseval = 0

[Audit - HDSI AI DLP Violation On Service Upload - Rule]
action.correlationsearch.enabled = 1
action.correlationsearch.label = HDSI AI DLP Violation On Service Upload
action.correlationsearch.annotations = {"mitre_attack": ["T1567"]}
action.customsearchbuilder.enabled = 0
action.customsearchbuilder.spec = {}
action.email = 0
action.notable = 0
action.notable.param.drilldown_dashboards = []
action.notable.param.drilldown_searches = [{"name":"View associated risk events","search":"| from datamodel:\"Risk.All_Risk\" | search risk_object=\"$risk_object$\" source=\"*HDSI AI*\" | table _time, source, risk_score, risk_object, risk_object_type, risk_message | sort - _time","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"},{"name":"View DLP incidents for $user_display$ on $src_display$","search":"| tstats summariesonly=false allow_old_summaries=true fillnull_value=\"unknown\" count min(_time) as firstTime max(_time) as lastTime values(DLP_Incidents.object) as objects values(DLP_Incidents.severity) as dlp_severity values(DLP_Incidents.action) as dlp_action values(DLP_Incidents.vendor_product) as vendor_product from datamodel=DLP.DLP_Incidents where (DLP_Incidents.user=\"$user$\" OR DLP_Incidents.src_user=\"$user$\" OR DLP_Incidents.src=\"$src$\") by DLP_Incidents.user DLP_Incidents.src DLP_Incidents.dest DLP_Incidents.app DLP_Incidents.signature DLP_Incidents.dlp_type | rename DLP_Incidents.* as * | eval signature=nullif(signature,\"unknown\"), dlp_type=nullif(dlp_type,\"unknown\") | eval content_evidence=if(`hdsi_ai_dlp_violation_on_service_upload_content_evidence`,\"yes\",\"no\") | convert ctime(firstTime) ctime(lastTime) | table firstTime, lastTime, user, src, dest, app, signature, dlp_type, content_evidence, dlp_severity, dlp_action, objects, vendor_product, count | sort - content_evidence - count","earliest_offset":"$info_min_time$","latest_offset":"$info_max_time$"}]
action.notable.param.rule_description = DLP flagged $violations$ sensitive-content incident(s) for $user_display$ on $src_display$ involving unsanctioned AI service(s) $provider$ ($ai_domains$). Policies: $dlp_policies$. Objects: $objects$. Highest DLP severity $dlp_severity_max$, outcome $dlp_outcome$, risk_multiplier $risk_multiplier$.
action.notable.param.rule_title = HDSI AI DLP Violation On Service Upload ($user_display$ on $src_display$)
action.notable.param.security_domain = audit
action.notable.param.severity = high
action.notable.param.verbose = 0
alert.digest_mode = 1
action.risk = 1
action.risk.param._risk = [{"risk_object_field":"user","risk_object_type":"user","risk_score":60},{"risk_object_field":"src","risk_object_type":"system","risk_score":30}]
action.risk.param._risk_message = DLP flagged $violations$ sensitive-content incident(s) for $user_display$ on $src_display$ involving unsanctioned AI service(s) $provider$ ($ai_domains$): policies $dlp_policies$, objects $objects$, highest DLP severity $dlp_severity_max$, outcome $dlp_outcome$.
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
alert.managedBy =
alert.suppress = 1
alert.suppress.fields = user,src
alert.suppress.period = 86400s
alert.track = 1
allow_skew = 5m
counttype = number of events
cron_schedule = 11 * * * *
description = v1.1.0 Correlates CIM DLP incidents (DLP.DLP_Incidents) whose destination host or application resolves to an unsanctioned AI provider and that carry content evidence (a DLP data type or a data-class policy name): a DLP control matched sensitive content moving to or from an AI service. Risk on the user and source host only, no notable. Ad hoc: needs an egress DLP or CASB feed (web, endpoint or inline) mapped to the DLP model with dest or app populated.
disabled = 0
dispatch.earliest_time = -65m@m
dispatch.latest_time = -5m@m
dispatch.rt_backfill = 1
dispatch.ttl = 2p
enableSched = 1
realtime_schedule = 0
relation = greater than
quantity = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
schedule_window = auto
search = | tstats summariesonly=false allow_old_summaries=true fillnull_value="unknown" count min(_time) as firstTime max(_time) as lastTime values(DLP_Incidents.object) as object values(DLP_Incidents.severity) as dlp_severity values(DLP_Incidents.action) as dlp_action values(DLP_Incidents.vendor_product) as vendor_product from datamodel=DLP.DLP_Incidents where (DLP_Incidents.dest=* OR DLP_Incidents.app=*) `hdsi_ai_dlp_violation_on_service_upload_filter` by DLP_Incidents.user DLP_Incidents.src_user DLP_Incidents.src DLP_Incidents.dest DLP_Incidents.app DLP_Incidents.signature DLP_Incidents.dlp_type \
	| rename DLP_Incidents.* as * \
	| eval user=coalesce(nullif(user,"unknown"),nullif(src_user,"unknown")), src=nullif(src,"unknown"), dest=nullif(dest,"unknown"), app=nullif(app,"unknown") \
	| eval user=if(isnull(user) OR match(lower(user),"^(|-|n/a|null|none|system|local service|network service)$") OR match(lower(user),"\\\\(system|local service|network service)$") OR match(user,"\$$"),null(),user), src=if(isnull(src) OR match(lower(src),"^(|-|n/a|null|none|127\.0\.0\.1|::1)$"),null(),src) \
	| eval object=mvfilter(object!="unknown" AND object!=""), signature=mvfilter(signature!="unknown" AND signature!=""), dlp_type=mvfilter(dlp_type!="unknown" AND dlp_type!=""), dlp_severity=mvfilter(dlp_severity!="unknown" AND dlp_severity!=""), dlp_action=mvfilter(dlp_action!="unknown" AND dlp_action!="") \
	| where (isnotnull(user) OR isnotnull(src)) AND (isnotnull(dest) OR isnotnull(app)) AND `hdsi_ai_dlp_violation_on_service_upload_content_evidence` \
	| streamstats count as dlp_row \
	| eval ai_domain=mvappend(dest,app) \
	| mvexpand ai_domain \
	| `ai_domains_filter` \
	| dedup dlp_row \
	| `ai_unsanctioned_filter(user,src,provider)` \
	| lookup identity_lookup_expanded identity as user OUTPUTNEW bunit \
	| eval bunit=mvindex(bunit,0) \
	| eval severity_weight=coalesce(tonumber(severity_weight),1.0), sev_list=lower(mvjoin(dlp_severity,",")), sev_rank=case(match(sev_list,"critical"),5, match(sev_list,"high"),4, match(sev_list,"medium"),3, match(sev_list,"low"),2, match(sev_list,"info"),1, true(),0), not_blocked=if(isnull(dlp_action) OR mvcount(mvfilter(NOT match(lower(dlp_action),"^(block|blocked|deny|denied|drop|dropped|quarantine|quarantined|prevent|prevented|restrict|restricted)$")))>0,1,0) \
	| fillnull value="" user src \
	| stats sum(count) as violations values(provider) as provider values(ai_domain) as ai_domains values(usage_type) as usage_types values(object) as objects values(signature) as dlp_policies values(dlp_type) as dlp_types values(dlp_action) as dlp_actions values(vendor_product) as vendor_product values(bunit) as bunit max(severity_weight) as severity_weight max(sev_rank) as sev_rank max(not_blocked) as not_blocked min(firstTime) as firstTime max(lastTime) as lastTime by user src \
	| eval user=nullif(user,""), src=nullif(src,""), user_display=coalesce(user,"no attributed user"), src_display=coalesce(src,"no attributed host") \
	| eval dlp_severity_max=case(sev_rank=5,"critical",sev_rank=4,"high",sev_rank=3,"medium",sev_rank=2,"low",sev_rank=1,"informational",true(),"unrated"), dlp_outcome=if(not_blocked=1,"not blocked","blocked"), blocked_factor=if(not_blocked=1,1,`hdsi_ai_dlp_violation_on_service_upload_blocked_factor`) \
	| where blocked_factor>0 \
	| eval provider=mvjoin(provider,", "), ai_domains=mvjoin(mvindex(ai_domains,0,4),", "), usage_types=mvjoin(usage_types,", "), objects=coalesce(mvjoin(mvindex(objects,0,4),", "),"not recorded"), dlp_policies=coalesce(mvjoin(mvindex(dlp_policies,0,4),", "),"not recorded"), dlp_types=mvjoin(dlp_types,", "), dlp_actions=mvjoin(dlp_actions,", "), vendor_product=mvjoin(vendor_product,", "), bunit=mvjoin(bunit,", ") \
	| `ai_risk_multiplier` \
	| eval risk_score=min(80,max(10,round(case(sev_rank>=4,60,sev_rank=2 OR sev_rank=1,35,true(),50)*coalesce(risk_multiplier,1)*severity_weight*blocked_factor))) \
	| convert ctime(firstTime) ctime(lastTime) \
	| eval ai_activity="dlp_ai_upload", detection_id="hdsi_ai_dlp_violation_on_service_upload", mitre_attack="T1567", ai_kill_chain_phase="exfiltration" \
	| fields - sev_rank not_blocked \
	| `hdsi_ai_dlp_violation_on_service_upload_customizations` \
	| `hdsi_ai_dlp_violation_on_service_upload_risk_score`

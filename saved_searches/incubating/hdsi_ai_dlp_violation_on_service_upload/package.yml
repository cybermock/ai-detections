version: 1.1.0
creation_date: '2026-03-04'
package_title: AI DLP Violation On Service Upload
description: "Correlates CIM DLP incidents (DLP.DLP_Incidents) whose destination host or application resolves to an unsanctioned AI provider: a DLP control matched sensitive content (file, paste or post) moving to or from an AI service. Alerts without content evidence (a DLP data type or a data-class policy name) are ignored, including CASB access-control and threat alerts that add-ons also tag as DLP. Risk on the user and source host only, no notable. Ad hoc: needs an egress DLP or CASB incident feed mapped to the DLP model with dest or app populated; none of the four validation tenants had one."
author: Hurricane Labs
app_compatibility:
  - app_name: SplunkEnterpriseSecuritySuite
    operator: '*'
    required_version: '*'
app_context: HurricaneLabsContentUpdates
enable_alerting: false
common_dependencies:
  - macros:ai_domains_filter
  - macros:ai_risk_multiplier
  - macros:ai_unsanctioned_filter(3)
tags:
  - rba_only
  - data_exfiltration
data_prereqs:
  datamodels:
    op: AND
    items:
    - DLP.DLP_Incidents
  searches:
    op: AND
    items:
    - '| tstats summariesonly=false allow_old_summaries=true count from datamodel=DLP.DLP_Incidents where (DLP_Incidents.app IN ("*chatgpt*","*openai*","*claude*","*anthropic*","*gemini*","google bard","google-bard*","microsoft copilot","bing-ai*","github copilot","github-copilot*","*deepseek*","*perplexity*","*mistral*","*grok*","*character.ai*","*huggingface*") OR DLP_Incidents.dest IN ("*chatgpt.com*","*openai.com*","*oaiusercontent.com*","*claude.ai*","*anthropic.com*","*gemini.google.com*","*generativelanguage.googleapis.com*","*aiplatform.googleapis.com*","*openai.azure.com*","*bedrock*.amazonaws.com*","copilot.microsoft.com*","*.copilot.microsoft.com*","*githubcopilot.com*","*deepseek.com*","*perplexity.ai*","*mistral.ai*","*grok.com*","*huggingface.co*")) earliest=-7d@d | where count > 0'
deployment_type: adhoc
prereq_packages:
  - hdsi_ai_rba_common

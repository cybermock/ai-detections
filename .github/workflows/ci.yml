name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r saved_searches/requirements.txt

      - name: Validate packages
        working-directory: saved_searches
        run: python validate.py

      - name: Run tests
        run: pytest tests/ -v

      - name: Lint tests
        run: ruff check tests/
